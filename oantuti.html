<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oản Tù Tì Thử Thách - Kim Bling Coffee & Tea</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: transparent; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 5px; }
.game-card { background: #fff; width: 100%; max-width: 390px; border-radius: 20px; padding: 14px 12px; text-align: center; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }

h2 { color: #d32f2f; font-size: 18px; margin-bottom: 2px; margin-top: 2px; font-weight: 800; }
p.subtitle { font-size: 11px; color: #666; margin-bottom: 8px; }

.user-diamond-bar {
  background: linear-gradient(135deg, #2c1810, #1e293b);
  border: 1.5px solid #ff9800;
  border-radius: 12px;
  padding: 8px 10px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 4px 10px rgba(255, 152, 0, 0.2);
}

.section-box { background: #fff8e1; border: 1.5px solid #ffe0b2; border-radius: 12px; padding: 10px; margin-bottom: 8px; text-align: left; }
.section-title { font-size: 11px; font-weight: bold; color: #e65100; margin-bottom: 6px; text-align: center; }

.choice-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 4px; }
.choice-btn {
  background: #fff; border: 2px solid #ddd; border-radius: 10px; padding: 8px 0; text-align: center; cursor: pointer; transition: all 0.2s;
}
.choice-btn div.icon { font-size: 24px; }
.choice-btn div.label { font-size: 10px; font-weight: bold; color: #555; margin-top: 2px; }
.choice-btn.selected { border-color: #d32f2f; background: #ffebee; transform: scale(1.03); box-shadow: 0 3px 8px rgba(211,47,47,0.3); }
.choice-btn.selected div.label { color: #d32f2f; }

/* ĐẤU TRƯỜNG SO KÈ NGANG (CHỦ QUÁN GÓC TRÁI - KHÁCH HÀNG SIÊU TO Ở PHẢI) */
.battle-arena { display: none; background: #1e293b; border-radius: 14px; padding: 12px; color: #fff; margin-bottom: 8px; text-align: center; }

.battle-horizontal-flex {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  margin: 10px 0;
}

/* Ô CHỦ QUÁN (GÓC TRÁI) */
.fighter-box-owner { 
  background: #0f172a; 
  border: 2px solid #334155; 
  border-radius: 12px; 
  width: 95px; 
  height: 100px; 
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  justify-content: center; 
  flex-shrink: 0;
}
.fighter-box-owner .fighter-icon { font-size: 42px; }
.fighter-box-owner .fighter-name { font-size: 10px; color: #94a3b8; margin-top: 4px; font-weight: bold; }

.vs-badge { 
  font-size: 13px; 
  font-weight: 900; 
  color: #fff; 
  background: #d32f2f; 
  padding: 4px 8px; 
  border-radius: 8px; 
  font-style: italic; 
  box-shadow: 0 2px 5px rgba(0,0,0,0.3);
  flex-shrink: 0;
}

/* Ô KHÁCH HÀNG (PHÓNG TO CỰC ĐẠI, HOÀNH TRÁNG Ở PHẢI) */
.fighter-box-customer { 
  background: linear-gradient(135deg, #0f172a, #1e1b4b); 
  border: 3px solid #ff9800; 
  border-radius: 16px; 
  flex: 1;
  height: 125px; 
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  justify-content: center;
  box-shadow: 0 0 15px rgba(255, 152, 0, 0.4);
  transform: translateZ(0);
  will-change: transform;
}
.fighter-box-customer .fighter-icon { 
  font-size: 68px; 
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.fighter-box-customer .fighter-name { 
  font-size: 11px; 
  font-weight: bold; 
  color: #ff9800; 
  margin-top: 2px; 
  max-width: 120px; 
  overflow: hidden; 
  text-overflow: ellipsis; 
  white-space: nowrap; 
}

.action-main-btn {
  background: linear-gradient(135deg, #d32f2f, #b71c1c); color: #fff; border: none; width: 100%; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(211,47,47,0.4); text-transform: uppercase;
}
.action-main-btn:active { transform: scale(0.97); }

.result-notify { font-size: 13px; font-weight: 900; margin-top: 6px; padding: 8px; border-radius: 8px; display: none; }
</style>
</head>
<body>
<div class="game-card">
<h2>✊ OẢN TÙ TÌ THỬ THÁCH</h2>
<p class="subtitle">Vé tham gia: 1 💎 | Thắng nhận ngay 3 💎 !</p>

<div class="user-diamond-bar">
    <div style="display: flex; align-items: center; gap: 6px; flex: 1; padding-right: 6px;">
        <span style="font-size: 12px; font-weight: bold; color: #ff9800; white-space: nowrap;">💎 Túi 💎:</span>
        <input type="tel" id="gameCustomerPhone" placeholder="Nhập SĐT..." maxlength="11" onchange="fetchGameCustomerInfo(this.value)" onkeyup="if(event.key==='Enter') fetchGameCustomerInfo(this.value)" style="background: #0f172a; border: 1px solid #334155; color: #fff; padding: 5px 6px; border-radius: 6px; font-size: 13px !important; width: 100%; outline: none;">
    </div>
    <div id="headerTotalDiamonds" onclick="reloadGameDiamonds()" style="font-size: 15px; font-weight: bold; color: #ff4d4f; background: #0f172a; padding: 4px 8px; border-radius: 8px; border: 1px solid #ff9800; flex-shrink: 0; min-width: 60px; text-align: center; cursor: pointer;" title="Bấm làm mới số dư">
        0 💎
    </div>
</div>

<!-- KHUNG CHỌN QUÂN CHO CHỦ QUÁN -->
<div id="setupSection">
  <div class="section-box">
    <div class="section-title">CHỌN QUÂN CHỦ QUÁN RA (Phí: 1 💎)</div>
    <div class="choice-grid">
      <div class="choice-btn" id="choiceBua" onclick="selectOwnerChoice('bua')">
        <div class="icon">✊</div>
        <div class="label">BÚA</div>
      </div>
      <div class="choice-btn" id="choiceKeo" onclick="selectOwnerChoice('keo')">
        <div class="icon">✌️</div>
        <div class="label">KÉO</div>
      </div>
      <div class="choice-btn" id="choiceBao" onclick="selectOwnerChoice('bao')">
        <div class="icon">🖐️</div>
        <div class="label">BAO</div>
      </div>
    </div>
  </div>

  <button class="action-main-btn" onclick="startBattle()">⚔️ BẮT ĐẦU THỬ THÁCH (-1 💎)</button>
</div>

<!-- KHUNG ĐẤU TRƯỜNG -->
<div class="battle-arena" id="battleArena">
  <div style="font-size: 12px; color: #cbd5e1; font-weight: bold;" id="battleStatusText">HỆ THỐNG ĐANG QUAY SỐ... BẤM DỪNG KỊP THỜI!</div>
  
  <div class="battle-horizontal-flex">
    <!-- CHỦ QUÁN Ở GÓC TRÁI -->
    <div class="fighter-box-owner">
      <div class="fighter-icon" id="ownerFighterDisplay">✊</div>
      <div class="fighter-name">👨‍🍳 CHỦ QUÁN</div>
    </div>
    
    <div class="vs-badge">VS</div>
    
    <!-- KHÁCH HÀNG Ở PHẢI -->
    <div class="fighter-box-customer">
      <div class="fighter-icon" id="customerFighterDisplay">🖐️</div>
      <div class="fighter-name" id="customerDisplayName">👤 KHÁCH HÀNG</div>
    </div>
  </div>

  <div class="result-notify" id="resultNotifyBox"></div>
  <button class="action-main-btn" id="battleActionBtn" onclick="stopOrResetBattle()" style="margin-top: 6px;">🛑 DỪNG LẠI (SO KẾT QUẢ)</button>
</div>

</div>

<script>
const KIMBLING_API_URL = "https://script.google.com/macros/s/AKfycbxPxsg3oxHjUsx8KHyOSIYmjXZw9rY9GFQYf0cHNK3JmBsfdYMJ21PQdhg43HP787GIDQ/exec";

let selectedOwnerChoice = 'bua'; 
let sessionAddedDiamonds = 0; 
let rollingInterval = null;
let isRolling = false;
const symbols = ['bua', 'keo', 'bao'];
const symbolIcons = { 'bua': '✊', 'keo': '✌️', 'bao': '🖐️' };
let currentCustomerIdentifier = "Khách Hàng";
let currentShuffledSequence = []; 
let sequenceIndex = 0;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') { audioCtx.resume(); }
  let osc = audioCtx.createOscillator();
  let gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  let now = audioCtx.currentTime;
  if (type === 'tick') {
    osc.frequency.setValueAtTime(400, now);
    gain.gain.setValueAtTime(0.05, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
    osc.start(now);
    osc.stop(now + 0.08);
  } else if (type === 'win') {
    osc.frequency.setValueAtTime(523.25, now);
    osc.frequency.setValueAtTime(659.25, now + 0.1);
    osc.frequency.setValueAtTime(783.99, now + 0.2);
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    osc.start(now);
    osc.stop(now + 0.4);
  } else if (type === 'lose') {
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.setValueAtTime(200, now + 0.15);
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc.start(now);
    osc.stop(now + 0.3);
  } else if (type === 'draw') {
    osc.frequency.setValueAtTime(440, now);
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
    osc.start(now);
    osc.stop(now + 0.2);
  }
}

function getUserRealDiamonds() {
  return parseInt(localStorage.getItem('kim_bling_user_diamonds') || '0');
}

function updateHeaderDiamondDisplay() {
  let currentAccountDiamonds = getUserRealDiamonds();
  document.getElementById('headerTotalDiamonds').innerText = `${currentAccountDiamonds.toLocaleString('vi-VN')} 💎`;
}

function initGame() {
  const phoneInput = document.getElementById('gameCustomerPhone');
  let savedPhone = localStorage.getItem('kimbling_cust_phone') || localStorage.getItem('kb_customer_phone') || '';
  if (phoneInput && savedPhone) {
    phoneInput.value = savedPhone;
    fetchGameCustomerInfo(savedPhone);
  } else {
    updateHeaderDiamondDisplay();
  }
  selectOwnerChoice('bua');
}

async function fetchGameCustomerInfo(phone) {
    const cleanPhone = String(phone || '').trim();
    const displayEl = document.getElementById('headerTotalDiamonds');
    const custNameEl = document.getElementById('customerDisplayName');
    
    if (!cleanPhone || cleanPhone.length < 9) {
        if (displayEl) displayEl.innerText = "0 💎";
        currentCustomerIdentifier = "Khách Hàng";
        if (custNameEl) custNameEl.innerText = "👤 Khách Hàng";
        return;
    }
    
    localStorage.setItem('kb_customer_phone', cleanPhone);
    localStorage.setItem('kimbling_cust_phone', cleanPhone);
    currentCustomerIdentifier = cleanPhone;
    if (custNameEl) custNameEl.innerText = `👤 ${cleanPhone}`;
    if (displayEl) displayEl.innerText = "⏳...";

    try {
        let res = await fetch(`${KIMBLING_API_URL}?type=adminGetCustomerInfo&phone=${encodeURIComponent(cleanPhone)}`);
        let data = await res.json();
        let balance = (data && data.hatKim) ? parseInt(data.hatKim, 10) : 0;
        
        if (data && data.customerName) {
            currentCustomerIdentifier = data.customerName;
            if (custNameEl) custNameEl.innerText = `👤 ${data.customerName}`;
        }

        localStorage.setItem('kim_bling_user_diamonds', balance);
        if (displayEl) displayEl.innerText = balance.toLocaleString('vi-VN') + " 💎";
        if (window.parent) {
            window.parent.postMessage({ type: 'ADD_USER_DIAMONDS_SUCCESS', totalDiamonds: balance, added: 0 }, '*');
        }
    } catch (e) {
        updateHeaderDiamondDisplay();
    }
}

function reloadGameDiamonds() {
    const phoneInput = document.getElementById('gameCustomerPhone');
    if (phoneInput && phoneInput.value.trim()) {
        fetchGameCustomerInfo(phoneInput.value.trim());
    } else {
        alert("Vui lòng nhập số điện thoại trước khi làm mới!");
        if (phoneInput) phoneInput.focus();
    }
}

function selectOwnerChoice(choice) {
  selectedOwnerChoice = choice;
  document.querySelectorAll('.choice-btn').forEach(btn => btn.classList.remove('selected'));
  if (choice === 'bua') document.getElementById('choiceBua').classList.add('selected');
  if (choice === 'keo') document.getElementById('choiceKeo').classList.add('selected');
  if (choice === 'bao') document.getElementById('choiceBao').classList.add('selected');
}

function shuffleArray(array) {
  let arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startBattle() {
  const phoneInput = document.getElementById('gameCustomerPhone');
  if (!phoneInput || !phoneInput.value.trim()) {
    alert("⚠️ Vui lòng nhập số điện thoại để tham gia thử thách!");
    phoneInput.focus();
    return;
  }

  let currentDiamonds = getUserRealDiamonds();
  const ticketCost = 1;

  if (currentDiamonds < ticketCost) {
    alert(`⚠️ Bạn cần ít nhất ${ticketCost} 💎 trong túi để mua vé tham gia thử thách!`);
    return;
  }

  currentDiamonds -= ticketCost;
  sessionAddedDiamonds -= ticketCost;
  localStorage.setItem('kim_bling_user_diamonds', currentDiamonds);
  updateHeaderDiamondDisplay();

  document.getElementById('setupSection').style.display = 'none';
  document.getElementById('battleArena').style.display = 'block';
  document.getElementById('resultNotifyBox').style.display = 'none';
  document.getElementById('battleActionBtn').innerText = "🛑 DỪNG LẠI (SO KẾT QUẢ)";
  document.getElementById('battleActionBtn').style.background = "linear-gradient(135deg, #d32f2f, #b71c1c)";
  
  document.getElementById('customerDisplayName').innerText = `👤 ${currentCustomerIdentifier}`;
  document.getElementById('ownerFighterDisplay').innerText = symbolIcons[selectedOwnerChoice];

  // CHỈ XÁO TRỘN 1 LẦN DUY NHẤT KHI BẤM BẮT ĐẦU VÁN MỚI (KHÔNG XÁO TRỘN GIỮA CHỪNG NỮA ĐỂ TUYỆT ĐỐI KHÔNG BỊ ĐƠ)
  currentShuffledSequence = shuffleArray(symbols);
  sequenceIndex = 0;

  isRolling = true;
  
  rollingInterval = setInterval(() => {
    let currentSymbol = currentShuffledSequence[sequenceIndex];
    document.getElementById('customerFighterDisplay').innerText = symbolIcons[currentSymbol];
    playSound('tick');
    
    // Xoay vòng qua 3 phần tử đã xáo trộn của ván này
    sequenceIndex = (sequenceIndex + 1) % currentShuffledSequence.length;
  }, 400);
}

let finalCustomerChoice = '';

function determineCustomerChoice(ownerChoice) {
  const rand = Math.random() * 100;
  if (rand < 30) {
    if (ownerChoice === 'bua') return 'keo';
    if (ownerChoice === 'keo') return 'bao';
    if (ownerChoice === 'bao') return 'bua';
  } else if (rand < 55) {
    return ownerChoice;
  } else {
    if (ownerChoice === 'bua') return 'bao';
    if (ownerChoice === 'keo') return 'bua';
    if (ownerChoice === 'bao') return 'keo';
  }
}

function stopOrResetBattle() {
  if (isRolling) {
    clearInterval(rollingInterval);
    isRolling = false;

    finalCustomerChoice = determineCustomerChoice(selectedOwnerChoice);
    document.getElementById('customerFighterDisplay').innerText = symbolIcons[finalCustomerChoice];

    let currentDiamonds = getUserRealDiamonds();
    let delta = 0;
    let resultMsg = "";
    let resultColor = "";

    if (selectedOwnerChoice === finalCustomerChoice) {
      delta = 1;
      sessionAddedDiamonds += delta;
      resultMsg = `🤝 HÒA CƯỢC! Bạn được hoàn lại 1 💎 tiền vé.`;
      resultColor = "#ff9800";
      playSound('draw');
    } else if (
      (selectedOwnerChoice === 'keo' && finalCustomerChoice === 'bua') ||
      (selectedOwnerChoice === 'bao' && finalCustomerChoice === 'keo') ||
      (selectedOwnerChoice === 'bua' && finalCustomerChoice === 'bao')
    ) {
      delta = 3;
      sessionAddedDiamonds += delta;
      resultMsg = `🎉 CHÚC MỪNG BẠN ĐÃ THẮNG CHỦ QUÁN! Nhận ngay +3 💎`;
      resultColor = "#28a745";
      playSound('win');
    } else {
      resultMsg = `😢 BẠN ĐÃ THUA CHỦ QUÁN! Đã mất 1 💎 vé tham gia. Thử lại nhé!`;
      resultColor = "#ef4444";
      playSound('lose');
    }

    let newTotal = currentDiamonds + delta;
    if (newTotal < 0) newTotal = 0;
    localStorage.setItem('kim_bling_user_diamonds', newTotal);
    updateHeaderDiamondDisplay();

    if (window.parent) {
      window.parent.postMessage({ type: 'ADD_USER_DIAMONDS_SUCCESS', totalDiamonds: newTotal, added: delta - 1 }, '*');
    }

    let notifyBox = document.getElementById('resultNotifyBox');
    notifyBox.innerHTML = resultMsg;
    notifyBox.style.color = "#fff";
    notifyBox.style.background = resultColor;
    notifyBox.style.display = "block";

    let actionBtn = document.getElementById('battleActionBtn');
    actionBtn.innerText = "🎮 CHƠI VÁN KHÁC (-1 💎)";
    actionBtn.style.background = "linear-gradient(135deg, #2563eb, #1d4ed8)";

  } else {
    document.getElementById('battleArena').style.display = 'none';
    document.getElementById('setupSection').style.display = 'block';
  }
}

async function syncAndClose() {
  if (sessionAddedDiamonds !== 0) {
    let customerPhone = document.getElementById('gameCustomerPhone').value.trim();
    if (customerPhone) {
      try {
        await fetch(KIMBLING_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
          body: JSON.stringify({
            action: 'add_hatkim',
            type: 'add_hatkim',
            phone: customerPhone,
            amount: sessionAddedDiamonds
          })
        });
      } catch(e) {}
    }
    sessionAddedDiamonds = 0;
  }
}

window.addEventListener('message', function(event) {
    if (event.data && event.data.type === 'SYNC_CUSTOMER_PHONE' && event.data.phone) {
        const phoneInput = document.getElementById('gameCustomerPhone');
        if (phoneInput) {
            phoneInput.value = event.data.phone;
            fetchGameCustomerInfo(event.data.phone);
        }
    }
});

initGame();
</script>
</body>
</html>
