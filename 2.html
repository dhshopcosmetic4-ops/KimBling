<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trợ Lý Kim Bling (Chốt Đơn Thông Minh)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0;
            background: #f0f2f5;
            display: flex; flex-direction: column;
            height: 100vh; height: 100dvh;
        }
        header {
            background: #d32f2f;
            color: white;
            padding: 1rem;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
        }
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #fafafa;
        }
        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 16px;
            word-wrap: break-word;
        }
        .user { background: #d32f2f; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .assistant { background: #e3f2fd; color: #0d47a1; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #bbdefb; }
        
        #control-area {
            background: #ffffff;
            border-top: 1px solid #eee;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .top-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        #status-text {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .test-btn {
            height: 44px;
            padding: 0 14px;
            border-radius: 22px;
            background: #1976d2;
            color: white;
            border: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(25, 118, 210, 0.3);
        }
        .test-btn:active { transform: scale(0.95); }
        .mic-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #d32f2f;
            color: white;
            border: none;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(211, 47, 47, 0.4);
            transition: all 0.2s;
        }
        .mic-btn:active { transform: scale(0.95); }
        .mic-btn.recording {
            background: #2e7d32;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(46, 125, 50, 0.6); }
            70% { box-shadow: 0 0 0 12px rgba(46, 125, 50, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 125, 50, 0); }
        }

        .input-row {
            display: flex;
            gap: 8px;
        }
        .input-row input {
            flex: 1;
            padding: 10px 14px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
        }
        .input-row input:focus { border-color: #d32f2f; }
        .input-row button {
            padding: 0 18px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    🤖 Tổng Đài Kim Bling (Chốt Đơn Nhanh)
</header>

<div id="chat-box">
    <div class="msg assistant">Dạ em chào anh/chị! Em là trợ lý Kim Bling Coffee & Tea (Cư xá Phú Lâm A). Anh/chị muốn uống gì hay ăn vặt gì cứ nói em chốt đơn liền nhé! ❤️</div>
</div>

<div id="control-area">
    <div class="top-control">
        <span id="status-text">Sẵn sàng (Nói hoặc Gõ)...</span>
        <div class="btn-group">
            <button class="test-btn" onclick="testSpeaker()">🔊 Nghe Thử</button>
            <button id="micBtn" class="mic-btn" onclick="toggleListening()">🎤</button>
        </div>
    </div>
    <div class="input-row">
        <input type="text" id="userInput" placeholder="Nhập món cần đặt..." onkeyup="if(event.key==='Enter') sendText()">
        <button onclick="sendText()">Gửi</button>
    </div>
</div>

<audio id="ttsAudio" playsinline style="display:none;"></audio>

<script>
const API_KEY = "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";
const TTS_BASE_URL = "https://script.google.com/macros/s/AKfycbzYGIdfZo3muTn5xddMWgGMVZUlwjDr8fPyPCnvPYSjaEGlnaMHJo5it5z4bj4Rdvc6_Q/exec";

let activeModel = null;
let isRecording = false;
let recognition = null;

// Prompt hệ thống chi tiết giúp AI hiểu menu quán và biết cách chốt đơn
let chatHistory = [
    { 
        role: "system", 
        content: "Bạn là nhân viên tổng đài chốt đơn hàng đầu của quán 'Kim Bling Coffee & Tea' tại M9 Cư xá Phú Lâm A, Phường Phú Lâm, TP.HCM. " +
                 "Menu quán gồm: Cà phê đá/sữa (20k-25k), Trà sữa taro, Trà trái cây nhiệt đới (25k-35k), các món ăn vặt như Tokbokki, Cánh gà chiên, Cá viên chiên. " +
                 "Nhiệm vụ của bạn: Xưng 'em', gọi khách là 'anh/chị', trả lời cực kỳ ngắn gọn 1-2 câu, thân thiện, dùng văn nói miền Nam. " +
                 "Khi khách hỏi mua món gì, hãy tư vấn cụ thể giá tiền, hỏi size hoặc topping, và tiến hành chốt đơn ngay lập tức chứ không được trả lời chung chung như 'em nghe rõ ạ'." 
    }
];

function testSpeaker() {
    speakText("Dạ em chào anh/chị, em là tổng đài viên của quán Kim Bling đây ạ. Anh/chị muốn dùng món gì nè?");
}

// Tự động quét model đang hoạt động trên Groq
async function getAvailableModel() {
    if (activeModel) return activeModel;
    try {
        const res = await fetch("https://api.groq.com/openai/v1/models", {
            headers: { "Authorization": `Bearer ${API_KEY}` }
        });
        const data = await res.json();
        if (data && data.data) {
            const chatModels = data.data.map(m => m.id).filter(id => !id.includes("whisper") && !id.includes("guard"));
            activeModel = chatModels.find(id => id.includes("llama-3.1-8b-instant")) || chatModels[0];
        }
        if (!activeModel) activeModel = "llama-3.1-8b-instant";
        return activeModel;
    } catch (e) {
        return "llama-3.1-8b-instant";
    }
}

// Nhận diện giọng nói
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'vi-VN';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
        isRecording = true;
        document.getElementById('micBtn').classList.add('recording');
        document.getElementById('status-text').innerText = "Đang lắng nghe giọng nói...";
    };

    recognition.onresult = async (event) => {
        const speechText = event.results[0][0].transcript;
        stopListening();
        await processMessage(speechText, true);
    };

    recognition.onerror = () => {
        stopListening();
        document.getElementById('status-text').innerText = "Không nghe rõ, thử lại hoặc gõ chữ nhé!";
    };

    recognition.onend = () => {
        stopListening();
    };
}

function toggleListening() {
    if (!recognition) {
        alert("Trình duyệt không hỗ trợ nhận diện giọng nói!");
        return;
    }
    if (isRecording) {
        recognition.stop();
    } else {
        stopAllAudio();
        recognition.start();
    }
}

function stopListening() {
    isRecording = false;
    document.getElementById('micBtn').classList.remove('recording');
    document.getElementById('status-text').innerText = "Sẵn sàng (Nói hoặc Gõ)...";
}

function stopAllAudio() {
    const audio = document.getElementById('ttsAudio');
    if (audio) {
        audio.pause();
        audio.currentTime = 0;
    }
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
    }
}

async function sendText() {
    const inputField = document.getElementById('userInput');
    const text = inputField.value.trim();
    if (!text) return;
    inputField.value = '';
    await processMessage(text, true);
}

async function processMessage(text, shouldSpeak) {
    addMessage(text, 'user');
    document.getElementById('status-text').innerText = "AI đang chốt đơn...";

    try {
        const modelToUse = await getAvailableModel();
        chatHistory.push({ role: "user", content: text });

        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${API_KEY}`
            },
            body: JSON.stringify({
                model: modelToUse,
                messages: chatHistory,
                max_tokens: 300,
                temperature: 0.7
            })
        });

        const data = await response.json();
        const reply = data.choices?.[0]?.message?.content?.trim() ?? "Dạ anh/chị lấy món gì để em lên đơn ạ?";
        
        chatHistory.push({ role: "assistant", content: reply });
        addMessage(reply, 'assistant');
        
        if (shouldSpeak) {
            speakText(reply);
        } else {
            document.getElementById('status-text').innerText = "Sẵn sàng (Nói hoặc Gõ)...";
        }

    } catch (e) {
        addMessage("❌ Lỗi kết nối: " + e.message, 'assistant');
        document.getElementById('status-text').innerText = "Đã xảy ra lỗi!";
    }
}

function speakText(text) {
    stopAllAudio();
    const audio = document.getElementById('ttsAudio');
    const cleanText = text.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '');
    audio.src = `${TTS_BASE_URL}?q=${encodeURIComponent(cleanText)}`;
    document.getElementById('status-text').innerText = "Đang đọc phản hồi...";

    audio.onended = () => {
        document.getElementById('status-text').innerText = "Sẵn sàng (Nói hoặc Gõ)...";
    };

    audio.onerror = () => {
        fallbackSpeak(cleanText);
    };

    audio.play().catch(() => {
        fallbackSpeak(cleanText);
    });
}

function fallbackSpeak(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'vi-VN';
        utterance.rate = 1.0;
        utterance.onend = () => {
            document.getElementById('status-text').innerText = "Sẵn sàng (Nói hoặc Gõ)...";
        };
        window.speechSynthesis.speak(utterance);
    } else {
        document.getElementById('status-text').innerText = "Sẵn sàng (Nói hoặc Gõ)...";
    }
}

function addMessage(text, type) {
    const chatBox = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
