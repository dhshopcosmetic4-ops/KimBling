<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tổng Đài Kim Bling - Test Giọng Nam & Nữ</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0;
            background: #f0f2f5;
            display: flex; flex-direction: column;
            height: 100vh; height: 100dvh;
        }
        header {
            background: #d32f2f;
            color: white;
            padding: 1rem;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
        }
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #fafafa;
        }
        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 16px;
            word-wrap: break-word;
        }
        .user { background: #d32f2f; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .assistant { background: #e3f2fd; color: #0d47a1; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #bbdefb; }
        
        /* Bảng chọn Nam / Nữ trực quan */
        #tuning-panel {
            background: #fff3e0;
            border-bottom: 1px solid #ffe0b2;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .gender-selector {
            display: flex;
            gap: 8px;
        }
        .gender-btn {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #ffa726;
            background: white;
            color: #e65100;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
        }
        .gender-btn.active {
            background: #e65100;
            color: white;
            border-color: #e65100;
        }
        .tuning-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 13px;
            color: #e65100;
        }
        .tuning-row input[type="range"] { flex: 1; }

        #control-area {
            background: #ffffff;
            border-top: 1px solid #eee;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .top-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        #status-text {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .test-btn {
            height: 44px;
            padding: 0 14px;
            border-radius: 22px;
            background: #1976d2;
            color: white;
            border: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .mic-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #d32f2f;
            color: white;
            border: none;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .mic-dictate {
            background: #2e7d32;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(46, 125, 50, 0.6); }
            70% { box-shadow: 0 0 0 12px rgba(46, 125, 50, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 125, 50, 0); }
        }
        .input-row {
            display: flex;
            gap: 8px;
        }
        .input-row input {
            flex: 1;
            padding: 10px 14px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
        }
        .input-row button {
            padding: 0 18px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    🤖 Tổng Đài Kim Bling (Test Giọng Nam & Nữ)
</header>

<!-- Bảng chọn nhanh Giới Tính để test thử -->
<div id="tuning-panel">
    <div class="gender-selector">
        <button id="btnMale" class="gender-btn active" onclick="setGender('male')">👨 Giọng Nam Trầm</button>
        <button id="btnFemale" class="gender-btn" onclick="setGender('female')">👩 Giọng Nữ Ngọt Ngào</button>
    </div>
    <div class="tuning-row">
        <span>⚡ Tốc độ: <strong id="rateVal">0.95</strong>x</span>
        <input type="range" id="rateRange" min="0.7" max="1.3" step="0.05" value="0.95" oninput="updateTuning()">
    </div>
    <div class="tuning-row">
        <span>🎙️ Cao độ (Pitch): <strong id="pitchVal">0.70</strong></span>
        <input type="range" id="pitchRange" min="0.4" max="1.5" step="0.05" value="0.70" oninput="updateTuning()">
    </div>
</div>

<div id="chat-box">
    <div class="msg assistant">Dạ... chào anh chị! Em là trợ lý Kim Bling Coffee & Tea ở Cư xá Phú Lâm A. Anh chị muốn dùng món gì để em chốt đơn nào? ❤️</div>
</div>

<div id="control-area">
    <div class="top-control">
        <span id="status-text">Sẵn sàng...</span>
        <div class="btn-group">
            <button class="test-btn" onclick="testSpeaker()">🔊 Nghe Thử</button>
            <button id="micBtn" class="mic-btn" onclick="toggleListening()">🎤</button>
        </div>
    </div>
    <div class="input-row">
        <input type="text" id="userInput" placeholder="Nhập món cần đặt..." onkeyup="if(event.key==='Enter') sendText()">
        <button onclick="sendText()">Gửi</button>
    </div>
</div>

<script>
const API_KEY = "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";
let activeModel = null;
let isRecording = false;
let recognition = null;
let availableVoices = [];
let speakQueueTimer = null;
let currentGender = 'male'; // Mặc định là Nam

function loadVoices() {
    if (!('speechSynthesis' in window)) return;
    const voices = window.speechSynthesis.getVoices();
    availableVoices = voices.filter(v => v.lang.toLowerCase().includes('vi'));
    if (availableVoices.length === 0) availableVoices = voices;
}

if ('speechSynthesis' in window) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
}

// Chuyển đổi qua lại giữa Giọng Nam và Giọng Nữ tức thì
function setGender(gender) {
    currentGender = gender;
    const btnMale = document.getElementById('btnMale');
    const btnFemale = document.getElementById('btnFemale');
    const pitchRange = document.getElementById('pitchRange');
    const rateRange = document.getElementById('rateRange');

    if (gender === 'male') {
        btnMale.classList.add('active');
        btnFemale.classList.remove('active');
        pitchRange.value = "0.70"; // Ép độ trầm xuống sâu
        rateRange.value = "0.95";
    } else {
        btnFemale.classList.add('active');
        btnMale.classList.remove('active');
        pitchRange.value = "1.10"; // Đẩy cao độ lên trong trẻo
        rateRange.value = "1.05";
    }
    updateTuning();
}

function updateTuning() {
    document.getElementById('rateVal').innerText = document.getElementById('rateRange').value;
    document.getElementById('pitchVal').innerText = document.getElementById('pitchRange').value;
}

let chatHistory = [
    { 
        role: "system", 
        content: "Bạn là nhân viên tổng đài lanh lẹ của quán 'Kim Bling Coffee & Tea' tại M9 Cư xá Phú Lâm A, TP.HCM. " +
                 "Menu: Cà phê đá (20k), Cà phê sữa đá (25k), Trà sữa taro (30k), Cacao bạc hà (32k), Tokbokki (35k). " +
                 "QUY TẮC BẮT BUỘC:\n" +
                 "1. Xưng 'em', gọi khách là 'anh chị' (tuyệt đối không dùng dấu gạch chéo anh/chị).\n" +
                 "2. VĂN PHONG NHẢ CHỮ: Luôn chèn dấu ba chấm (...) ở các quãng nghỉ để tạo độ thong thả, ngọt ngào.\n" +
                 "3. Ví dụ mẫu: 'Dạ... cà phê sữa đá 25k nha anh chị... đậm đà béo ngậy lắm á... anh chị lấy mấy ly để em chốt đơn liền nghen!'" 
    }
];

function testSpeaker() {
    const text = currentGender === 'male' 
        ? "Dạ... chào anh chị nghen... Quán Kim Bling của em có cà phê sữa đá đậm đà lắm nha... anh chị lấy mấy ly để em lên đơn nào?"
        : "Dạ... chào anh chị nha! Trà sữa taro béo ngậy thơm lừng luôn nè... anh chị iu quý chốt đơn mấy ly với em nè?";
    speakText(text);
}

async function getAvailableModel() {
    if (activeModel) return activeModel;
    try {
        const res = await fetch("https://api.groq.com/openai/v1/models", {
            headers: { "Authorization": `Bearer ${API_KEY}` }
        });
        const data = await res.json();
        if (data && data.data) {
            const chatModels = data.data.map(m => m.id).filter(id => !id.includes("whisper") && !id.includes("guard"));
            activeModel = chatModels.find(id => id.includes("llama-3.1-8b-instant")) || chatModels[0];
        }
        if (!activeModel) activeModel = "llama-3.1-8b-instant";
        return activeModel;
    } catch (e) {
        return "llama-3.1-8b-instant";
    }
}

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'vi-VN';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
        isRecording = true;
        document.getElementById('micBtn').classList.add('mic-dictate');
        document.getElementById('status-text').innerText = "Đang nghe...";
    };

    recognition.onresult = async (event) => {
        const speechText = event.results[0][0].transcript;
        stopListening();
        await processMessage(speechText, true);
    };

    recognition.onerror = () => {
        stopListening();
        document.getElementById('status-text').innerText = "Thử lại hoặc gõ chữ!";
    };

    recognition.onend = () => {
        stopListening();
    };
}

function toggleListening() {
    if (!recognition) {
        alert("Trình duyệt không hỗ trợ micro!");
        return;
    }
    if (isRecording) {
        recognition.stop();
    } else {
        stopSpeaking();
        recognition.start();
    }
}

function stopListening() {
    isRecording = false;
    document.getElementById('micBtn').classList.remove('mic-dictate');
    document.getElementById('status-text').innerText = "Sẵn sàng...";
}

function stopSpeaking() {
    if (speakQueueTimer) clearTimeout(speakQueueTimer);
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
}

async function sendText() {
    const inputField = document.getElementById('userInput');
    const text = inputField.value.trim();
    if (!text) return;
    inputField.value = '';
    await processMessage(text, true);
}

async function processMessage(text, shouldSpeak) {
    addMessage(text, 'user');
    document.getElementById('status-text').innerText = "AI đang xử lý...";

    try {
        const modelToUse = await getAvailableModel();
        chatHistory.push({ role: "user", content: text });

        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${API_KEY}`
            },
            body: JSON.stringify({
                model: modelToUse,
                messages: chatHistory,
                max_tokens: 150,
                temperature: 0.7
            })
        });

        const data = await response.json();
        let reply = "Dạ... anh chị chọn món gì để em chốt đơn nè?";
        if (data.choices && data.choices[0] && data.choices[0].message) {
            reply = data.choices[0].message.content.trim();
        }
        
        chatHistory.push({ role: "assistant", content: reply });
        addMessage(reply, 'assistant');
        
        if (shouldSpeak) {
            speakText(reply);
        } else {
            document.getElementById('status-text').innerText = "Sẵn sàng...";
        }

    } catch (e) {
        const errReply = "Dạ... quán có cà phê sữa đá 25k ngon lắm anh chị ơi... em chốt luôn nhé!";
        chatHistory.push({ role: "assistant", content: errReply });
        addMessage(errReply, 'assistant');
        speakText(errReply);
    }
}

function speakText(text) {
    if (!('speechSynthesis' in window)) return;
    stopSpeaking();

    const cleanText = text.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '');
    const chunks = cleanText.split(/\.{2,}/).map(s => s.trim()).filter(s => s.length > 0);
    if (chunks.length === 0) return;

    const rate = parseFloat(document.getElementById('rateRange').value);
    const pitch = parseFloat(document.getElementById('pitchRange').value);
    let currentIndex = 0;

    document.getElementById('status-text').innerText = "Đang đọc...";

    function speakNextChunk() {
        if (currentIndex >= chunks.length) {
            document.getElementById('status-text').innerText = "Sẵn sàng...";
            return;
        }

        const utterance = new SpeechSynthesisUtterance(chunks[currentIndex]);
        utterance.lang = 'vi-VN';
        utterance.rate = rate;
        utterance.pitch = pitch;

        if (availableVoices.length === 0) loadVoices();
        if (availableVoices.length > 0) {
            // Nếu chọn Nam, cố gắng chọn giọng thứ 2 hoặc giọng trầm; nếu chọn Nữ chọn giọng đầu (Linh)
            let vIdx = currentGender === 'male' ? (availableVoices.length > 1 ? 1 : 0) : 0;
            utterance.voice = availableVoices[vIdx];
        }

        utterance.onend = () => {
            currentIndex++;
            speakQueueTimer = setTimeout(speakNextChunk, 400);
        };

        utterance.onerror = () => {
            document.getElementById('status-text').innerText = "Sẵn sàng...";
        };

        window.speechSynthesis.speak(utterance);
    }

    speakNextChunk();
}

function addMessage(text, type) {
    const chatBox = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
