<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trợ Lý Kim Bling (Gõ & Nói)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0;
            background: #f0f2f5;
            display: flex; flex-direction: column;
            height: 100vh; height: 100dvh;
        }
        header {
            background: #d32f2f;
            color: white;
            padding: 1rem;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
        }
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #fafafa;
        }
        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 16px;
            word-wrap: break-word;
        }
        .user { background: #d32f2f; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .assistant { background: #e3f2fd; color: #0d47a1; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #bbdefb; }
        
        #control-area {
            background: #ffffff;
            border-top: 1px solid #eee;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .top-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        #status-text {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }
        .mic-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #d32f2f;
            color: white;
            border: none;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(211, 47, 47, 0.4);
            transition: all 0.2s;
        }
        .mic-btn:active { transform: scale(0.95); }
        .mic-btn.recording {
            background: #2e7d32;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(46, 125, 50, 0.6); }
            70% { box-shadow: 0 0 0 12px rgba(46, 125, 50, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 125, 50, 0); }
        }

        .input-row {
            display: flex;
            gap: 8px;
        }
        .input-row input {
            flex: 1;
            padding: 10px 14px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
        }
        .input-row input:focus { border-color: #d32f2f; }
        .input-row button {
            padding: 0 18px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    🤖 Tổng Đài Kim Bling (Gõ chữ & Nói giọng nói)
</header>

<div id="chat-box">
    <div class="msg assistant">Dạ em chào anh/chị! Anh/chị có thể bấm micro để nói, hoặc gõ chữ trực tiếp bên dưới, em đều hiện chữ và đọc lên cho anh/chị nghe nhé! ❤️</div>
</div>

<div id="control-area">
    <div class="top-control">
        <span id="status-text">Sẵn sàng (Nói hoặc Gõ)...</span>
        <button id="micBtn" class="mic-btn" onclick="toggleListening()">🎤</button>
    </div>
    <div class="input-row">
        <input type="text" id="userInput" placeholder="Nhập tin nhắn..." onkeyup="if(event.key==='Enter') sendText()">
        <button onclick="sendText()">Gửi</button>
    </div>
</div>

<script>
const API_KEY = "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";
let activeModel = null;
let isRecording = false;
let recognition = null;

let chatHistory = [
    { 
        role: "system", 
        content: "Bạn là nhân viên tư vấn bán hàng của quán Kim Bling Coffee & Tea tại Cư xá Phú Lâm A, TP.HCM. Hãy xưng 'em', gọi khách là 'anh/chị', trả lời ngắn gọn 1-2 câu, thân thiện, văn nói miền Nam." 
    }
];

// Tự động quét model Groq đang hoạt động
async function getAvailableModel() {
    if (activeModel) return activeModel;
    try {
        const res = await fetch("https://api.groq.com/openai/v1/models", {
            headers: { "Authorization": `Bearer ${API_KEY}` }
        });
        const data = await res.json();
        if (data && data.data) {
            const chatModels = data.data.map(m => m.id).filter(id => !id.includes("whisper") && !id.includes("guard"));
            activeModel = chatModels.find(id => id.includes("llama-3.1-8b-instant")) || chatModels[0];
        }
        if (!activeModel) activeModel = "llama-3.1-8b-instant";
        return activeModel;
    } catch (e) {
        return "llama-3.1-8b-instant";
    }
}

// Khởi tạo nhận diện giọng nói
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'vi-VN';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
        isRecording = true;
        document.getElementById('micBtn').classList.add('recording');
        document.getElementById('status-text').innerText = "Đang lắng nghe giọng nói...";
    };

    recognition.onresult = async (event) => {
        const speechText = event.results[0][0].transcript;
        stopListening();
        await processMessage(speechText, true); // Khách nói bằng mic -> Vừa hiện chữ vừa đọc to
    };

    recognition.onerror = () => {
        stopListening();
        document.getElementById('status-text').innerText = "Không nghe rõ, thử lại hoặc gõ chữ nhé!";
    };

    recognition.onend = () => {
        stopListening();
    };
}

function toggleListening() {
    if (!recognition) {
        alert("Trình duyệt không hỗ trợ nhận diện giọng nói!");
        return;
    }
    if (isRecording) {
        recognition.stop();
    } else {
        window.speechSynthesis.cancel();
        recognition.start();
    }
}

function stopListening() {
    isRecording = false;
    document.getElementById('micBtn').classList.remove('recording');
    document.getElementById('status-text').innerText = "Sẵn sàng (Nói hoặc Gõ)...";
}

// Xử lý khi khách gõ chữ bấm Gửi
async function sendText() {
    const inputField = document.getElementById('userInput');
    const text = inputField.value.trim();
    if (!text) return;
    inputField.value = '';
    await processMessage(text, true); // Khách gõ chữ -> Vừa hiện chữ trong khung chat vừa đọc to thành tiếng luôn
}

// Hàm chung xử lý tin nhắn (cho cả Gõ chữ và Nói giọng nói)
async function processMessage(text, shouldSpeak) {
    addMessage(text, 'user');
    document.getElementById('status-text').innerText = "AI đang xử lý...";

    try {
        const modelToUse = await getAvailableModel();
        chatHistory.push({ role: "user", content: text });

        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${API_KEY}`
            },
            body: JSON.stringify({
                model: modelToUse,
                messages: chatHistory,
                max_tokens: 300,
                temperature: 0.7
            })
        });

        const data = await response.json();
        const reply = data.choices?.[0]?.message?.content?.trim() ?? "Dạ em nghe rõ ạ.";
        
        chatHistory.push({ role: "assistant", content: reply });
        addMessage(reply, 'assistant'); // Hiện chữ câu trả lời của AI lên khung chat
        
        if (shouldSpeak) {
            speakText(reply); // Đọc to câu trả lời ra loa
        } else {
            document.getElementById('status-text').innerText = "Sẵn sàng (Nói hoặc Gõ)...";
        }

    } catch (e) {
        addMessage("❌ Lỗi kết nối: " + e.message, 'assistant');
        document.getElementById('status-text').innerText = "Đã xảy ra lỗi!";
    }
}

function speakText(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'vi-VN';
        utterance.rate = 1.0;
        
        document.getElementById('status-text').innerText = "Đang đọc phản hồi...";
        utterance.onend = () => {
            document.getElementById('status-text').innerText = "Sẵn sàng (Nói hoặc Gõ)...";
        };
        window.speechSynthesis.speak(utterance);
    }
}

function addMessage(text, type) {
    const chatBox = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
