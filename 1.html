<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trợ Lý Giọng Nói - Kim Bling</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0;
            background: #f0f2f5;
            display: flex; flex-direction: column;
            height: 100vh; height: 100dvh;
        }
        header {
            background: #d32f2f;
            color: white;
            padding: 1rem;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
        }
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #fafafa;
        }
        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 16px;
            word-wrap: break-word;
        }
        .user { background: #d32f2f; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .assistant { background: #e3f2fd; color: #0d47a1; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #bbdefb; }
        
        #voice-control-area {
            background: #ffffff;
            border-top: 1px solid #eee;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        #status-text {
            font-size: 14px;
            color: #666;
            font-weight: 500;
            text-align: center;
            min-height: 20px;
        }
        .mic-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #d32f2f;
            color: white;
            border: none;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.4);
            transition: all 0.2s;
        }
        .mic-btn:active { transform: scale(0.95); }
        .mic-btn.recording {
            background: #2e7d32;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(46, 125, 50, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(46, 125, 50, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 125, 50, 0); }
        }
    </style>
</head>
<body>

<header>
    🎙️ Tổng Đài Giọng Nói - Kim Bling
</header>

<div id="chat-box">
    <div class="msg assistant">Dạ em là trợ lý giọng nói của Kim Bling Coffee & Tea. Anh/chị hãy chạm vào nút Micro bên dưới và nói món mình muốn đặt nhé! ❤️</div>
</div>

<div id="voice-control-area">
    <div id="status-text">Đang kết nối hệ thống AI...</div>
    <button id="micBtn" class="mic-btn" onclick="toggleListening()" disabled>🎤</button>
</div>

<script>
const API_KEY = "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";
let activeModel = null;
let isRecording = false;
let recognition = null;

let chatHistory = [
    { 
        role: "system", 
        content: "Bạn là nhân viên tổng đài voice của quán Kim Bling Coffee & Tea tại Cư xá Phú Lâm A, TP.HCM. Hãy xưng 'em', gọi khách là 'anh/chị', trả lời cực kỳ ngắn gọn 1-2 câu, thân thiện, văn nói miền Nam để đọc thành tiếng cho khách nghe." 
    }
];

// Hàm tự động quét lấy model đang hoạt động chuẩn xác nhất trên tài khoản Groq của anh
async function getAvailableModel() {
    if (activeModel) return activeModel;
    try {
        const res = await fetch("https://api.groq.com/openai/v1/models", {
            headers: { "Authorization": `Bearer ${API_KEY}` }
        });
        const data = await res.json();
        if (data && data.data) {
            const chatModels = data.data
                .map(m => m.id)
                .filter(id => !id.includes("whisper") && !id.includes("guard") && !id.includes("embedding"));
            
            // Ưu tiên chọn các dòng llama mới nhất
            activeModel = chatModels.find(id => id.includes("llama-3.1-8b-instant")) 
                       || chatModels.find(id => id.includes("llama-3")) 
                       || chatModels[0];
        }
        if (!activeModel) activeModel = "llama-3.1-8b-instant";
        return activeModel;
    } catch (e) {
        return "llama-3.1-8b-instant";
    }
}

// Kích hoạt hệ thống khi tải xong trang
window.addEventListener('DOMContentLoaded', async () => {
    document.getElementById('status-text').innerText = "Đang kiểm tra kết nối AI...";
    await getAvailableModel();
    document.getElementById('status-text').innerText = "Chạm vào nút để bắt đầu nói...";
    document.getElementById('micBtn').removeAttribute('disabled');
});

// Nhận diện giọng nói
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'vi-VN';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
        isRecording = true;
        document.getElementById('micBtn').classList.add('recording');
        document.getElementById('status-text').innerText = "Đang lắng nghe... Anh/chị cứ nói nhé!";
    };

    recognition.onresult = async (event) => {
        const speechText = event.results[0][0].transcript;
        addMessage(speechText, 'user');
        
        stopListening();
        document.getElementById('status-text').innerText = "AI đang xử lý...";
        
        try {
            const aiReply = await askAI(speechText);
            addMessage(aiReply, 'assistant');
            speakText(aiReply);
        } catch (e) {
            addMessage("❌ Lỗi: " + e.message, 'assistant');
            document.getElementById('status-text').innerText = "Đã xảy ra lỗi!";
        }
    };

    recognition.onerror = () => {
        stopListening();
        document.getElementById('status-text').innerText = "Không nghe rõ, anh/chị bấm lại giúp em nhé!";
    };

    recognition.onend = () => {
        stopListening();
    };
} else {
    alert("Trình duyệt không hỗ trợ nhận diện giọng nói. Hãy mở bằng Safari trên iPhone!");
}

function toggleListening() {
    if (!recognition) return;
    if (isRecording) {
        recognition.stop();
    } else {
        window.speechSynthesis.cancel();
        recognition.start();
    }
}

function stopListening() {
    isRecording = false;
    document.getElementById('micBtn').classList.remove('recording');
}

async function askAI(userMessage) {
    const modelToUse = await getAvailableModel();
    chatHistory.push({ role: "user", content: userMessage });

    const payload = {
        model: modelToUse,
        messages: chatHistory,
        max_tokens: 300,
        temperature: 0.7
    };

    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${API_KEY}`
        },
        body: JSON.stringify(payload)
    });

    if (!response.ok) {
        const errData = await response.text();
        throw new Error(`Lỗi API (${response.status}): ${errData}`);
    }

    const data = await response.json();
    const reply = data.choices?.[0]?.message?.content?.trim() ?? "Dạ em nghe chưa rõ ạ.";
    
    chatHistory.push({ role: "assistant", content: reply });
    return reply;
}

function speakText(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'vi-VN';
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        
        document.getElementById('status-text').innerText = "Đang đọc phản hồi...";
        utterance.onend = () => {
            document.getElementById('status-text').innerText = "Chạm vào nút để tiếp tục nói...";
        };

        window.speechSynthesis.speak(utterance);
    }
}

function addMessage(text, type) {
    const chatBox = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
