<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Test Trợ Lý AI (Groq Llama 3) - Kim Bling</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 12px; display: flex; justify-content: center; align-items: center; height: 100dvh; }
        .chat-container { width: 100%; max-width: 420px; background: #ffffff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; height: 100%; max-height: 650px; }
        .chat-header { background: #d32f2f; color: white; padding: 14px 16px; font-weight: bold; font-size: 16px; display: flex; align-items: center; gap: 8px; }
        .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #fafafa; }
        .message { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 15px; line-height: 1.45; word-wrap: break-word; }
        .message.model { background: #e3f2fd; color: #0d47a1; align-self: flex-start; border-bottom-left-radius: 4px; }
        .message.user { background: #d32f2f; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .chat-input-area { padding: 10px 12px; background: #ffffff; border-top: 1px solid #eee; display: flex; gap: 8px; }
        .chat-input-area input { flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 20px; font-size: 16px; outline: none; }
        .chat-input-area input:focus { border-color: #d32f2f; }
        .chat-input-area button { background: #d32f2f; color: white; border: none; padding: 0 18px; border-radius: 20px; font-size: 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        🤖 Trợ lý Kim Bling (Groq Llama 3)
    </div>
    <div class="chat-messages" id="chatMessages">
        <div class="message model">Dạ em là trợ lý AI của Kim Bling Coffee & Tea. Anh/chị muốn uống gì hay ăn vặt gì cứ hỏi em nhé! ❤️</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Nhắn tin với AI..." onkeyup="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Gửi</button>
    </div>
</div>

<script>
    // 🔑 Groq API Key của anh đã được điền sẵn
    const GROQ_API_KEY = "Gsk_xDJ4a0drwZrtxgUczSsDWGdyb3FY3Im7vJdhm9MRyl7IBa9rPLsy";
    
    let chatHistory = [
        { 
            role: "system", 
            content: "Bạn là nhân viên tư vấn bán hàng của quán Kim Bling Coffee & Tea tại Cư xá Phú Lâm A, TP.HCM. Hãy xưng 'em', gọi khách là 'anh/chị', trả lời ngắn gọn 1-3 câu, thân thiện, văn nói miền Nam." 
        }
    ];

    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const text = inputField.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        inputField.value = '';

        chatHistory.push({ role: "user", content: text });
        const loadingId = appendMessage("Đang trả lời...", 'model');

        try {
            const url = "https://api.groq.com/openai/v1/chat/completions";
            
            const payload = {
                model: "llama-3.1-8b-instant",
                messages: chatHistory,
                temperature: 0.7,
                max_tokens: 500
            };

            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${GROQ_API_KEY}`
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            document.getElementById(loadingId).remove();

            if (data.choices && data.choices[0]?.message?.content) {
                const aiReply = data.choices[0].message.content;
                appendMessage(aiReply, 'model');
                chatHistory.push({ role: "assistant", content: aiReply });
            } else {
                const errText = data.error ? data.error.message : "Lỗi phản hồi từ Groq";
                appendMessage("⚠️ " + errText, 'model');
                chatHistory.pop();
            }

        } catch (error) {
            document.getElementById(loadingId).remove();
            appendMessage("⚠️ Lỗi kết nối mạng tới Groq.", 'model');
            chatHistory.pop();
        }
    }

    function appendMessage(text, sender) {
        const messagesDiv = document.getElementById('chatMessages');
        const msgDiv = document.createElement('div');
        const msgId = 'msg_' + Date.now() + Math.random();
        msgDiv.id = msgId;
        msgDiv.className = `message ${sender}`;
        msgDiv.innerText = text;
        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        return msgId;
    }
</script>

</body>
</html>
