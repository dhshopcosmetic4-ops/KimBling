<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trợ Lý Kim Bling (Chuẩn Giọng Nam)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0;
            background: #f0f2f5;
            display: flex; flex-direction: column;
            height: 100vh; height: 100dvh;
        }
        header {
            background: #d32f2f;
            color: white;
            padding: 1rem;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
        }
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #fafafa;
        }
        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 16px;
            word-wrap: break-word;
        }
        .user { background: #d32f2f; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .assistant { background: #e3f2fd; color: #0d47a1; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #bbdefb; }
        
        #control-area {
            background: #ffffff;
            border-top: 1px solid #eee;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .top-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        #status-text {
            font-size: 13px;
            color: #666;
            font-weight: 500;
        }
        .btn-group {
            display: flex;
            gap: 8px;
        }
        .action-btn {
            height: 48px;
            padding: 0 16px;
            border-radius: 24px;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }
        .mic-btn { background: #d32f2f; width: 50px; height: 50px; border-radius: 50%; padding: 0; font-size: 22px; }
        .speaker-test-btn { background: #1976d2; }
        .mic-btn.recording { background: #2e7d32; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(46, 125, 50, 0.6); }
            70% { box-shadow: 0 0 0 12px rgba(46, 125, 50, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 125, 50, 0); }
        }

        .input-row {
            display: flex;
            gap: 8px;
        }
        .input-row input {
            flex: 1;
            padding: 10px 14px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
        }
        .input-row input:focus { border-color: #d32f2f; }
        .input-row button {
            padding: 0 18px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    🤖 Tổng Đài Kim Bling (Chuẩn Giọng Nam)
</header>

<div id="chat-box">
    <div class="msg assistant">Dạ em chào anh/chị! Em đã chỉnh để khi anh/chị nói, chữ sẽ hiện ngay lên màn hình và đọc bằng giọng tiếng Việt chuẩn miền Nam. Anh/chị bấm nút nghe thử nhé! ❤️</div>
</div>

<div id="control-area">
    <div class="top-control">
        <span id="status-text">Sẵn sàng...</span>
        <div class="btn-group">
            <button class="action-btn speaker-test-btn" onclick="testSpeaker()">🔊 Nghe Thử Giọng</button>
            <button id="micBtn" class="action-btn mic-btn" onclick="toggleListening()">🎤</button>
        </div>
    </div>
    <div class="input-row">
        <input type="text" id="userInput" placeholder="Nhập tin nhắn..." onkeyup="if(event.key==='Enter') sendText()">
        <button onclick="sendText()">Gửi</button>
    </div>
</div>

<script>
const API_KEY = "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";
let activeModel = null;
let isRecording = false;
let recognition = null;
let vietnameseVoice = null;

// Lấy đúng giọng đọc tiếng Việt của thiết bị
function loadVoice() {
    if (!('speechSynthesis' in window)) return;
    const voices = window.speechSynthesis.getVoices();
    // Lọc tìm giọng tiếng Việt (vi-VN hoặc vi)
    vietnameseVoice = voices.find(v => v.lang === 'vi-VN' || v.lang === 'vi');
    if (!vietnameseVoice && voices.length > 0) {
        vietnameseVoice = voices[0];
    }
}

if ('speechSynthesis' in window) {
    loadVoice();
    window.speechSynthesis.onvoiceschanged = loadVoice;
}

let chatHistory = [
    { 
        role: "system", 
        content: "Bạn là nhân viên tư vấn bán hàng của quán 'Kim Bling Coffee & Tea' tại M9 Cư xá Phú Lâm A, TP.HCM. " +
                 "Menu gồm Cà phê đá/sữa (20k-25k), Trà sữa taro, Trà trái cây (25k-35k), Tokbokki, Cánh gà chiên. " +
                 "Xưng 'em', gọi khách là 'anh/chị', trả lời ngắn gọn 1-2 câu, văn nói miền Nam ngọt ngào, chốt đơn nhanh." 
    }
];

function testSpeaker() {
    speakText("Dạ em chào anh/chị, em là tổng đài viên của quán Kim Bling đây ạ. Anh/chị muốn dùng món gì nè?");
}

async function getAvailableModel() {
    if (activeModel) return activeModel;
    try {
        const res = await fetch("https://api.groq.com/openai/v1/models", {
            headers: { "Authorization": `Bearer ${API_KEY}` }
        });
        const data = await res.json();
        if (data && data.data) {
            const chatModels = data.data.map(m => m.id).filter(id => !id.includes("whisper") && !id.includes("guard"));
            activeModel = chatModels.find(id => id.includes("llama-3.1-8b-instant")) || chatModels[0];
        }
        if (!activeModel) activeModel = "llama-3.1-8b-instant";
        return activeModel;
    } catch (e) {
        return "llama-3.1-8b-instant";
    }
}

// Cấu hình nhận diện giọng nói
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'vi-VN';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
        isRecording = true;
        document.getElementById('micBtn').classList.add('recording');
        document.getElementById('status-text').innerText = "Đang nghe anh/chị nói...";
    };

    // Bắt sự kiện khi nhận diện xong giọng nói -> Hiện chữ ngay lập tức lên khung chat
    recognition.onresult = async (event) => {
        const speechText = event.results[0][0].transcript;
        stopListening();
        
        // Hiện ngay câu nói của khách lên màn hình
        addMessage(speechText, 'user');
        
        // Gửi cho AI xử lý
        await processMessageWithText(speechText);
    };

    recognition.onerror = () => {
        stopListening();
        document.getElementById('status-text').innerText = "Không nghe rõ, thử lại hoặc gõ chữ nhé!";
    };

    recognition.onend = () => {
        stopListening();
    };
}

function toggleListening() {
    if (!recognition) {
        alert("Trình duyệt không hỗ trợ nhận diện giọng nói!");
        return;
    }
    if (isRecording) {
        recognition.stop();
    } else {
        window.speechSynthesis.cancel();
        recognition.start();
    }
}

function stopListening() {
    isRecording = false;
    document.getElementById('micBtn').classList.remove('recording');
    document.getElementById('status-text').innerText = "Sẵn sàng...";
}

async function sendText() {
    const inputField = document.getElementById('userInput');
    const text = inputField.value.trim();
    if (!text) return;
    inputField.value = '';
    
    addMessage(text, 'user');
    await processMessageWithText(text);
}

// Hàm gửi nội dung (từ gõ chữ hoặc từ micro) cho AI
async function processMessageWithText(text) {
    document.getElementById('status-text').innerText = "AI đang xử lý...";

    try {
        const modelToUse = await getAvailableModel();
        chatHistory.push({ role: "user", content: text });

        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${API_KEY}`
            },
            body: JSON.stringify({
                model: modelToUse,
                messages: chatHistory,
                max_tokens: 300,
                temperature: 0.7
            })
        });

        const data = await response.json();
        const reply = data.choices?.[0]?.message?.content?.trim() ?? "Dạ em nghe rõ ạ.";
        
        chatHistory.push({ role: "assistant", content: reply });
        
        // Hiện chữ câu trả lời của AI lên màn hình
        addMessage(reply, 'assistant');
        
        // Đọc to câu trả lời ra loa
        speakText(reply);

    } catch (e) {
        addMessage("❌ Lỗi kết nối: " + e.message, 'assistant');
        document.getElementById('status-text').innerText = "Đã xảy ra lỗi!";
    }
}

function speakText(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'vi-VN';
        utterance.rate = 1.0; // Tốc độ chuẩn, tự nhiên
        utterance.pitch = 1.0; // Cao độ chuẩn

        if (!vietnameseVoice) loadVoice();
        if (vietnameseVoice) {
            utterance.voice = vietnameseVoice;
        }
        
        document.getElementById('status-text').innerText = "Đang phát giọng đọc...";
        utterance.onend = () => {
            document.getElementById('status-text').innerText = "Sẵn sàng...";
        };
        utterance.onerror = () => {
            document.getElementById('status-text').innerText = "Sẵn sàng...";
        };

        window.speechSynthesis.speak(utterance);
    }
}

function addMessage(text, type) {
    const chatBox = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
