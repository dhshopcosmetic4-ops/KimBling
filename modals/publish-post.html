<style>
  .pub-wrap { display: flex; flex-direction: column; gap: 12px; }
  .pub-topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .pub-clear-btn {
    background: #222533; color: #ff7b93; border: 1px solid #3c2330;
    padding: 7px 11px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .pub-media-box { background: #10121a; border: 1px dashed #35394d; border-radius: 12px; padding: 12px; text-align: center; }
  .pub-media-box video, .pub-media-box img { max-height: 160px; max-width: 100%; border-radius: 8px; margin-bottom: 6px; }
  .pub-pick-row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  .pub-pick-btn { padding: 8px 10px; border-radius: 8px; border: none; font-size: 12px; font-weight: 600; cursor: pointer; display: inline-block; }
  .pub-input, .pub-textarea, .pub-select { width: 100%; padding: 11px; border-radius: 10px; border: 1px solid #2e3244; background: #10121a; color: #fff; font-size: 14px; }
  .pub-textarea { min-height: 75px; resize: vertical; }
  .pub-btn { width: 100%; padding: 13px; border: none; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer; }
  .pub-btn:disabled { opacity: 0.6; }
  .pub-btn.ai { background: linear-gradient(90deg, #25f4ee, #4f8cff); color: #000; }
  .pub-btn.post { background: #fe2c55; color: #fff; }
  .pub-card { background: #10121a; border: 1px solid #2a2e40; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .pub-card h4 { font-size: 14px; color: #25f4ee; display: flex; justify-content: space-between; align-items: center; }
  .pub-status { font-size: 13px; color: #ccc; text-align: center; line-height: 1.5; background: #10121a; padding: 10px; border-radius: 8px; display: none; }
  .pub-yt-opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #10121a; border: 1px solid #2a2e40; padding: 10px 12px; border-radius: 10px; font-size: 13px; }
</style>

<div class="pub-wrap">
  <div class="pub-topbar">
    <span style="font-size:12px; color:#8a8b91;" id="pub-autosave-hint">💾 Tự động lưu nháp trên máy</span>
    <button type="button" class="pub-clear-btn" id="pub-clear-all">🧹 Quét dọn / Làm mới</button>
  </div>

  <div class="pub-media-box" id="pub-media-box">
    <div id="pub-media-preview">
      <p style="font-size:13px; color:#8a8b91;">Chưa có Video/Ảnh nào được chọn.</p>
    </div>
    <div class="pub-pick-row">
      <button type="button" class="pub-pick-btn" id="pub-pick-vid" style="background:#fe2c55; color:#fff;">🎬 Nén Video</button>
      <button type="button" class="pub-pick-btn" id="pub-pick-img" style="background:#25f4ee; color:#000;">🖼️ Nén Ảnh</button>
      <label for="pub-direct-file" class="pub-pick-btn" style="background:#2a2e40; color:#fff;">📁 Chọn sẵn từ máy</label>
      <input type="file" id="pub-direct-file" accept="video/*,image/*" style="display:none;" />
    </div>
  </div>

  <input class="pub-input pub-save-field" id="pub-product" type="text" placeholder="Nhập tên sản phẩm (VD: Mì tương đen cá viên)" />
  <textarea class="pub-textarea pub-save-field" id="pub-notes" style="min-height:56px;" placeholder="Ghi chú thêm: Giá bán, địa chỉ, ưu đãi..."></textarea>

  <button class="pub-btn ai" id="pub-gen-ai">✨ Gemini AI viết Tiêu đề + 5 Hashtag (3 kênh)</button>
  <div class="pub-status" id="pub-ai-status"></div>

  <div id="pub-results" style="display:flex; flex-direction:column; gap:10px;">
    <div class="pub-card">
      <h4><span>▶️ YouTube Shorts</span><label style="font-size:12px;color:#fff;"><input type="checkbox" id="pub-yt-enable" checked /> Đăng kênh này</label></h4>
      <input class="pub-input pub-save-field" id="pub-yt-title" placeholder="Tiêu đề YouTube (có #shorts)" />
      <textarea class="pub-textarea pub-save-field" id="pub-yt-body" placeholder="Mô tả chi tiết YouTube"></textarea>
      <input class="pub-input pub-save-field" id="pub-yt-tags" placeholder="5 Hashtag YouTube" />
    </div>

    <div class="pub-card">
      <h4><span>📘 Facebook Fanpage</span><span style="font-size:11px;color:#8a8b91;">(Nối ở bước sau)</span></h4>
      <input class="pub-input pub-save-field" id="pub-fb-title" placeholder="Tiêu đề mở đầu nổi bật" />
      <textarea class="pub-textarea pub-save-field" id="pub-fb-body" placeholder="Nội dung bài Facebook"></textarea>
      <input class="pub-input pub-save-field" id="pub-fb-tags" placeholder="5 Hashtag Facebook" />
    </div>

    <div class="pub-card">
      <h4><span>🎵 TikTok</span><span style="font-size:11px;color:#8a8b91;">(Nối ở bước sau)</span></h4>
      <input class="pub-input pub-save-field" id="pub-tt-title" placeholder="Tiêu đề / Caption TikTok" />
      <input class="pub-input pub-save-field" id="pub-tt-tags" placeholder="5 Hashtag TikTok" />
    </div>
  </div>

  <div class="pub-yt-opt">
    <span>🔒 Chế độ YouTube:</span>
    <select class="pub-select" id="pub-yt-privacy" style="width:auto; padding:7px 10px;">
      <option value="private">Riêng tư (Test thử)</option>
      <option value="unlisted">Không công khai</option>
      <option value="public">Công khai (Public)</option>
    </select>
  </div>

  <button class="pub-btn post" id="pub-send-all">🚀 Đăng Video lên YouTube Shorts ngay</button>
  <div class="pub-status" id="pub-send-status"></div>
</div>

<script type="module">
  const previewBox = document.getElementById('pub-media-preview');
  const directFileEl = document.getElementById('pub-direct-file');
  const productEl = document.getElementById('pub-product');
  const notesEl = document.getElementById('pub-notes');
  const genBtn = document.getElementById('pub-gen-ai');
  const aiStatusEl = document.getElementById('pub-ai-status');
  const sendBtn = document.getElementById('pub-send-all');
  const sendStatusEl = document.getElementById('pub-send-status');
  const clearBtn = document.getElementById('pub-clear-all');
  const hintEl = document.getElementById('pub-autosave-hint');
  const ytEnableEl = document.getElementById('pub-yt-enable');
  const ytPrivacyEl = document.getElementById('pub-yt-privacy');

  const fieldIds = [
    'pub-product', 'pub-notes',
    'pub-tt-title', 'pub-tt-tags',
    'pub-fb-title', 'pub-fb-body', 'pub-fb-tags',
    'pub-yt-title', 'pub-yt-body', 'pub-yt-tags'
  ];

  let previewUrl = null;

  function saveAllDraftFields() {
    const data = {};
    fieldIds.forEach(id => { data[id] = document.getElementById(id).value; });
    AppBus.saveDraftText(data);
  }

  function restoreDraftFields() {
    const saved = AppBus.getDraftText();
    if (!saved) return;
    fieldIds.forEach(id => {
      if (saved[id] !== undefined) document.getElementById(id).value = saved[id];
    });
  }

  function resetEmptyPreview() {
    if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
    previewBox.innerHTML = '<p style="font-size:13px; color:#8a8b91;">Chưa có Video/Ảnh nào được chọn.</p>';
    directFileEl.value = '';
  }

  function renderMedia(media) {
    if (!media) { resetEmptyPreview(); return; }
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = URL.createObjectURL(media.blob);
    const mb = (media.size / 1048576).toFixed(2);
    const tag = media.type === 'video'
      ? `<video src="${previewUrl}" controls playsinline></video>`
      : `<img src="${previewUrl}" alt="preview" />`;
    previewBox.innerHTML = `${tag}<div style="font-size:12px; color:#25f4ee;">📦 Đã lưu tạm: <b>${media.name}</b> (${mb} MB)</div>`;
  }

  document.querySelectorAll('.pub-save-field').forEach(el => {
    el.addEventListener('input', saveAllDraftFields);
  });

  document.getElementById('pub-pick-vid').onclick = () => AppBus.openModal('compress-vid', 'Nén Video iPhone');
  document.getElementById('pub-pick-img').onclick = () => AppBus.openModal('compress-img', 'Nén Ảnh Squoosh');

  directFileEl.onchange = () => {
    const f = directFileEl.files[0];
    if (!f) return;
    const type = f.type.startsWith('image') ? 'image' : 'video';
    AppBus.setMedia({ blob: f, name: f.name, type, size: f.size });
  };

  clearBtn.onclick = async () => {
    await AppBus.clearTempAll();
    fieldIds.forEach(id => { document.getElementById(id).value = ''; });
    resetEmptyPreview();
    aiStatusEl.style.display = 'none';
    sendStatusEl.style.display = 'none';
    hintEl.textContent = '🧹 Đã quét dọn sạch lưu tạm!';
    setTimeout(() => { hintEl.textContent = '💾 Tự động lưu nháp trên máy'; }, 3000);
  };

  AppBus.on('media:changed', renderMedia);
  AppBus.on('media:cleared', resetEmptyPreview);
  AppBus.on('draft:cleared', () => {
    fieldIds.forEach(id => { document.getElementById(id).value = ''; });
  });

  restoreDraftFields();
  if (AppBus.state.media) renderMedia(AppBus.state.media);

  function showStatus(el, html) {
    el.style.display = 'block';
    el.innerHTML = html;
  }

  genBtn.onclick = async () => {
    const gasUrl = AppBus.state.gasUrl;
    const geminiKey = AppBus.state.geminiKey;

    if (!gasUrl || !geminiKey) {
      showStatus(aiStatusEl, '⚠️ Vào Tab <b>Cài đặt ⚙️</b> nhập đủ Link GAS và Gemini API Key trước nhé!');
      return;
    }
    const product = productEl.value.trim();
    if (!product) {
      showStatus(aiStatusEl, '⚠️ Vui lòng nhập tên sản phẩm trước!');
      return;
    }

    genBtn.disabled = true;
    genBtn.textContent = '⏳ Gemini AI đang viết bài...';
    showStatus(aiStatusEl, '✨ Đang phối Tiêu đề + 5 Hashtag cho 3 kênh...');

    try {
      const res = await fetch(gasUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'generate_copy',
          geminiKey,
          productName: product,
          notes: notesEl.value.trim(),
          mediaType: AppBus.state.media?.type || 'video'
        })
      });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'Lỗi từ GAS');

      const d = json.data;
      document.getElementById('pub-tt-title').value = d.tiktok.caption;
      document.getElementById('pub-tt-tags').value = d.tiktok.hashtags.join(' ');
      document.getElementById('pub-fb-title').value = d.facebook.title;
      document.getElementById('pub-fb-body').value = d.facebook.body;
      document.getElementById('pub-fb-tags').value = d.facebook.hashtags.join(' ');
      document.getElementById('pub-yt-title').value = d.youtube.title;
      document.getElementById('pub-yt-body').value = d.youtube.description;
      document.getElementById('pub-yt-tags').value = d.youtube.hashtags.join(' ');

      saveAllDraftFields();

      const used = d._usedModel ? ` (${d._usedModel})` : '';
      showStatus(aiStatusEl, `✅ AI đã phối & lưu nháp xong${used}! Chọn chế độ rồi bấm nút Đỏ.`);
    } catch (err) {
      showStatus(aiStatusEl, '❌ Lỗi AI: ' + err.message);
    } finally {
      genBtn.disabled = false;
      genBtn.textContent = '✨ Gemini AI viết Tiêu đề + 5 Hashtag (3 kênh)';
    }
  };

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  sendBtn.onclick = async () => {
    const gasUrl = AppBus.state.gasUrl;
    const media = AppBus.state.media;

    if (!gasUrl) {
      showStatus(sendStatusEl, '⚠️ Chưa có Link Google Apps Script ở Tab Cài đặt ⚙️!');
      return;
    }
    if (!media) {
      showStatus(sendStatusEl, '⚠️ <b>Chưa có Video/Ảnh!</b> Hãy kéo lên trên bấm "🎬 Nén Video" trước.');
      return;
    }
    if (media.size > 35 * 1048576) {
      showStatus(sendStatusEl, '❌ File nặng hơn 35 MB! Hãy nén lại Bitrate thấp hơn.');
      return;
    }

    const ytTagsRaw = document.getElementById('pub-yt-tags').value.trim();
    const ytTagsArr = ytTagsRaw ? ytTagsRaw.split(/\s+/) : [];

    const postsPayload = {
      tiktok: { caption: document.getElementById('pub-tt-title').value + ' ' + document.getElementById('pub-tt-tags').value },
      facebook: { message: document.getElementById('pub-fb-title').value + '\n\n' + document.getElementById('pub-fb-body').value + '\n\n' + document.getElementById('pub-fb-tags').value },
      youtube: {
        title: document.getElementById('pub-yt-title').value,
        description: document.getElementById('pub-yt-body').value + '\n\n' + ytTagsRaw,
        tags: ytTagsArr
      }
    };

    sendBtn.disabled = true;
    let currentPart = 0;
    let totalChunks = 1;

    try {
      const CHUNK_SIZE = 1536 * 1024;
      totalChunks = Math.max(1, Math.ceil(media.blob.size / CHUNK_SIZE));
      const uploadId = 'up_' + Date.now();

      for (let i = 0; i < totalChunks; i++) {
        currentPart = i + 1;
        const start = i * CHUNK_SIZE;
        const end = Math.min(start + CHUNK_SIZE, media.blob.size);
        const chunkBlob = media.blob.slice(start, end);
        const chunkBase64 = await blobToBase64(chunkBlob);
        const isLast = (i === totalChunks - 1);

        const pct = Math.round((currentPart / totalChunks) * 100);
        sendBtn.textContent = isLast
          ? '🚀 Đang tải lên YouTube (chờ 5–15 giây)...'
          : `⏳ Đang đẩy lên Google (${currentPart}/${totalChunks} - ${pct}%)...`;
        showStatus(sendStatusEl, isLast
          ? '🎬 Đang ghép file & đẩy thẳng lên kênh YouTube của bạn...'
          : `🚀 Đang truyền phần <b>${currentPart}/${totalChunks}</b> (${(end / 1048576).toFixed(1)} / ${(media.size / 1048576).toFixed(1)} MB)...`);

        const res = await fetch(gasUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'publish_chunk',
            uploadId,
            chunkIndex: i,
            totalChunks,
            isLast,
            chunkBase64,
            fileName: media.name,
            mimeType: media.blob.type || 'video/mp4',
            targets: isLast ? { youtube: ytEnableEl.checked } : null,
            ytPrivacy: ytPrivacyEl.value,
            posts: isLast ? postsPayload : null
          })
        });

        const json = await res.json();
        if (!json.ok) throw new Error(json.error || `GAS từ chối phần ${currentPart}`);

        if (isLast) {
          let linkHtml = '';
          if (json.youtube && json.youtube.url) {
            linkHtml = `<br><br><a href="${json.youtube.url}" target="_blank" style="display:inline-block;padding:8px 14px;background:#25f4ee;color:#000;border-radius:8px;text-decoration:none;font-weight:700;">▶️ Bấm xem trên YouTube Shorts</a>`;
          }
          showStatus(sendStatusEl, `🎉 ${json.message}${linkHtml}`);
        }
      }
    } catch (err) {
      showStatus(sendStatusEl, `❌ Lỗi tại phần <b>${currentPart}/${totalChunks}</b>: ${err.message}`);
    } finally {
      sendBtn.disabled = false;
      sendBtn.textContent = '🚀 Đăng Video lên YouTube Shorts ngay';
    }
  };
</script>
