<style>
  .cimg-wrap { display: flex; flex-direction: column; gap: 12px; }
  .cimg-label { font-size: 13px; color: #ccc; margin-bottom: 4px; }
  .cimg-input, .cimg-select {
    width: 100%; padding: 10px; border-radius: 10px;
    background: #10121a; color: #fff; border: 1px solid #2d3142; font-size: 14px;
  }
  .cimg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cimg-btn {
    width: 100%; padding: 13px; border: none; border-radius: 10px;
    font-weight: 600; font-size: 15px; cursor: pointer;
    background: #fe2c55; color: #fff;
  }
  .cimg-btn:disabled { opacity: 0.5; }
  .cimg-btn.go { background: #25f4ee; color: #000; display: none; }
  .cimg-status { font-size: 13px; color: #ccc; background: #10121a; padding: 10px; border-radius: 8px; line-height: 1.5; }
  .cimg-list { display: flex; flex-direction: column; gap: 8px; }
  .cimg-item {
    display: flex; align-items: center; gap: 10px; background: #10121a;
    border: 1px solid #262938; padding: 8px; border-radius: 10px;
  }
  .cimg-thumb { width: 54px; height: 54px; object-fit: cover; border-radius: 6px; background: #000; flex-shrink: 0; }
  .cimg-meta { flex: 1; font-size: 12px; color: #ccc; overflow: hidden; }
  .cimg-meta b { color: #25f4ee; }
  .cimg-dl {
    padding: 7px 10px; background: #222533; color: #25f4ee;
    border-radius: 8px; text-decoration: none; font-size: 12px; font-weight: 600; flex-shrink: 0;
  }
</style>

<div class="cimg-wrap">
  <div>
    <div class="cimg-label">Chọn 1 hoặc nhiều ảnh trên iPhone:</div>
    <input class="cimg-input" type="file" id="cimg-files" accept="image/*" multiple />
  </div>

  <div class="cimg-row">
    <div>
      <div class="cimg-label">Định dạng nén:</div>
      <select class="cimg-select" id="cimg-format">
        <option value="jpeg" selected>JPEG (MozJPEG - Khuyên dùng)</option>
        <option value="webp">WebP (Siêu nhẹ)</option>
      </select>
    </div>
    <div>
      <div class="cimg-label">Kích thước tối đa:</div>
      <select class="cimg-select" id="cimg-max">
        <option value="1920" selected>1920px (Nét chuẩn MXH)</option>
        <option value="1280">1280px (Nhẹ nhanh)</option>
        <option value="0">Giữ nguyên gốc</option>
      </select>
    </div>
  </div>

  <div>
    <div class="cimg-label">Chất lượng ảnh: <b id="cimg-q-val" style="color:#25f4ee;">80</b>/100</div>
    <input type="range" id="cimg-q" min="20" max="95" value="80" style="width:100%;" />
  </div>

  <button class="cimg-btn" id="cimg-start" disabled>⚡ Bắt đầu nén ảnh (Squoosh)</button>
  <div class="cimg-status" id="cimg-status">Hãy chọn ảnh sản phẩm (có thể chọn nhiều tấm 1 lúc)...</div>
  <div class="cimg-list" id="cimg-list"></div>
  <button class="cimg-btn go" id="cimg-send">Quăng qua Đăng bài & Nhờ AI viết Content ➔</button>
</div>

<script type="module">
  const filesEl = document.getElementById('cimg-files');
  const formatEl = document.getElementById('cimg-format');
  const maxEl = document.getElementById('cimg-max');
  const qEl = document.getElementById('cimg-q');
  const qValEl = document.getElementById('cimg-q-val');
  const startBtn = document.getElementById('cimg-start');
  const statusEl = document.getElementById('cimg-status');
  const listEl = document.getElementById('cimg-list');
  const sendBtn = document.getElementById('cimg-send');

  const codecCache = {};
  let compressedFiles = [];
  let objectUrls = [];

  qEl.oninput = () => { qValEl.textContent = qEl.value; };

  filesEl.onchange = () => {
    const count = filesEl.files.length;
    if (!count) return;
    startBtn.disabled = false;
    let totalBytes = 0;
    for (const f of filesEl.files) totalBytes += f.size;
    statusEl.innerHTML = `Đã chọn <b>${count} ảnh</b> (Tổng gốc: <b>${(totalBytes / 1048576).toFixed(2)} MB</b>). Bấm nút đỏ để nén!`;
    listEl.innerHTML = '';
    sendBtn.style.display = 'none';
  };

  async function getEncoder(fmt) {
    if (codecCache[fmt]) return codecCache[fmt];
    const url = fmt === 'webp'
      ? 'https://esm.sh/@jsquash/webp'
      : 'https://esm.sh/@jsquash/jpeg';
    const mod = await import(url);
    codecCache[fmt] = mod.encode;
    return codecCache[fmt];
  }

  function canvasFallbackBlob(canvas, mime, quality) {
    return new Promise(resolve => canvas.toBlob(resolve, mime, quality / 100));
  }

  startBtn.onclick = async () => {
    const files = Array.from(filesEl.files);
    if (!files.length) return;

    startBtn.disabled = true;
    sendBtn.style.display = 'none';
    listEl.innerHTML = '';
    objectUrls.forEach(u => URL.revokeObjectURL(u));
    objectUrls = [];
    compressedFiles = [];

    const fmt = formatEl.value;
    const maxSide = Number(maxEl.value);
    const quality = Number(qEl.value);
    const mime = fmt === 'webp' ? 'image/webp' : 'image/jpeg';
    const ext = fmt === 'webp' ? '.webp' : '.jpg';

    let squooshEncode = null;
    try {
      statusEl.textContent = `⏳ Đang nạp bộ nén ${fmt.toUpperCase()} chuẩn Squoosh...`;
      squooshEncode = await getEncoder(fmt);
    } catch (e) {
      statusEl.textContent = '⚠️ Không tải được WASM Squoosh, chuyển sang nén nhanh bằng Canvas...';
    }

    let totalOrig = 0;
    let totalOut = 0;
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    try {
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        totalOrig += file.size;
        statusEl.textContent = `⚡ Đang nén ảnh ${i + 1}/${files.length}: ${file.name}...`;

        const bitmap = await createImageBitmap(file);
        let w = bitmap.width;
        let h = bitmap.height;
        if (maxSide > 0 && Math.max(w, h) > maxSide) {
          const ratio = maxSide / Math.max(w, h);
          w = Math.round(w * ratio);
          h = Math.round(h * ratio);
        }

        canvas.width = w;
        canvas.height = h;
        ctx.clearRect(0, 0, w, h);
        ctx.drawImage(bitmap, 0, 0, w, h);
        bitmap.close(); // Giải phóng RAM iPhone ngay lập tức

        let outBlob;
        if (squooshEncode) {
          const imgData = ctx.getImageData(0, 0, w, h);
          const buf = await squooshEncode(imgData, { quality });
          outBlob = new Blob([buf], { type: mime });
        } else {
          outBlob = await canvasFallbackBlob(canvas, mime, quality);
        }

        totalOut += outBlob.size;
        const outName = file.name.replace(/\.\w+$/, '') + ext;
        const url = URL.createObjectURL(outBlob);
        objectUrls.push(url);

        compressedFiles.push({ blob: outBlob, name: outName, type: 'image', size: outBlob.size });

        const saved = Math.round((1 - outBlob.size / file.size) * 100);
        const item = document.createElement('div');
        item.className = 'cimg-item';
        item.innerHTML = `
          <img class="cimg-thumb" src="${url}" alt="thumb" />
          <div class="cimg-meta">
            <div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${outName} (${w}x${h})</div>
            <div>${(file.size / 1024).toFixed(0)} KB ➔ <b>${(outBlob.size / 1024).toFixed(0)} KB</b> (Giảm ${saved}%)</div>
          </div>
          <a class="cimg-dl" href="${url}" download="${outName}">⬇️ Lưu</a>
        `;
        listEl.appendChild(item);
      }

      const totalSaved = Math.round((1 - totalOut / totalOrig) * 100);
      statusEl.innerHTML = `✅ Đã nén xong <b>${files.length} ảnh</b>!<br>Tổng gốc: ${(totalOrig / 1048576).toFixed(2)} MB ➔ Sau nén: <b style="color:#25f4ee;">${(totalOut / 1048576).toFixed(2)} MB</b> (Giảm ${totalSaved}%)`;
      sendBtn.style.display = 'block';
    } catch (err) {
      statusEl.textContent = '❌ Lỗi khi nén ảnh: ' + err.message;
    } finally {
      startBtn.disabled = false;
    }
  };

  sendBtn.onclick = () => {
    if (!compressedFiles.length) return;
    const totalSize = compressedFiles.reduce((sum, f) => sum + f.size, 0);
    const labelName = compressedFiles.length > 1
      ? `${compressedFiles.length} ảnh đã nén`
      : compressedFiles[0].name;

    // Giữ tương thích với publish-post.html (blob đầu) + đính kèm mảng files để đăng album nhiều ảnh
    AppBus.setMedia({
      blob: compressedFiles[0].blob,
      name: labelName,
      type: 'image',
      size: totalSize,
      files: compressedFiles
    });
    AppBus.openModal('publish-post', 'Đăng bài đa kênh');
  };
</script>
