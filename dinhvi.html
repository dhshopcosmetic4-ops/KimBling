<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Định Vị & Tính Phí Ship - Kim Bling Coffee</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f4f6f9; padding: 20px 12px; display: flex; justify-content: center; }
        
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
        }

        .title {
            font-size: 16px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-gps {
            width: 100%;
            background: #000000;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .input-group {
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .input-group label {
            font-size: 12px;
            font-weight: bold;
            color: #475569;
            display: block;
            margin-bottom: 4px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        .status-box {
            font-size: 12px;
            color: #64748b;
            background: #f8fafc;
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid #000000;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .result-box {
            display: none;
            background: #fffbe3;
            border: 1px solid #ffe58f;
            border-radius: 8px;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            color: #d32f2f;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .btn-apple-map {
            display: none;
            width: 100%;
            background: #007aff;
            color: #fff;
            text-align: center;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="title">🍏 Định Vị & Phí Ship (Apple Maps)</div>

        <!-- CỐ ĐỊNH ĐIỂM XUẤT PHÁT: QUÁN KIM BLING -->
        <div class="input-group">
            <label>📍 Điểm đi (Quán Kim Bling):</label>
            <input type="text" value="M9 Cư Xá Phú Lâm A, Q.6, TP.HCM" disabled style="background: #f1f5f9; color: #475569; font-weight: bold;">
        </div>

        <!-- NÚT BẬT GPS -->
        <button type="button" class="btn-gps" onclick="detectLocationAndCalculate()">
            🛰️ Lấy vị trí GPS của bạn (Miễn phí 100%)
        </button>

        <div class="status-box" id="statusText">
            💡 Bấm nút đen bên trên để hệ thống tự lấy GPS và tính quãng đường thực tế qua hẻm hoàn toàn miễn phí.
        </div>

        <!-- ĐỊA CHỈ KHÁCH -->
        <div class="input-group">
            <label>🏠 Vị trí của bạn:</label>
            <input type="text" id="customerAddress" placeholder="Bấm nút GPS ở trên..." disabled>
        </div>

        <!-- KẾT QUẢ KHOẢNG CÁCH & PHÍ SHIP -->
        <div class="result-box" id="distanceResultBox"></div>

        <!-- NÚT MỞ TRỰC TIẾP APPLE MAPS CHỈ ĐƯỜNG -->
        <a id="appleMapBtn" href="#" target="_blank" class="btn-apple-map">
            🧭 Mở Apple Maps chỉ đường chi tiết
        </a>
    </div>

    <script>
        const STORE_LAT = 10.7490699; 
        const STORE_LNG = 106.6310222;

        function detectLocationAndCalculate() {
            const statusText = document.getElementById('statusText');
            const addressInput = document.getElementById('customerAddress');
            const distanceBox = document.getElementById('distanceResultBox');
            const appleBtn = document.getElementById('appleMapBtn');

            if (!navigator.geolocation) {
                alert("Trình duyệt không hỗ trợ GPS!");
                return;
            }

            statusText.innerText = "⏳ Đang kết nối vệ tinh tìm vị trí của bạn...";

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const userLat = position.coords.latitude;
                    const userLng = position.coords.longitude;

                    statusText.innerText = "✅ Định vị thành công!";
                    addressInput.value = `Tọa độ: ${userLat.toFixed(5)}, ${userLng.toFixed(5)}`;

                    // Tính khoảng cách đường đi
                    let distanceKm = calculateDistanceKm(STORE_LAT, STORE_LNG, userLat, userLng);
                    let shipFeeText = distanceKm <= 1.0 ? '0đ (Freeship bán kính < 1km)' : '10.000đ (Phụ thu trên 1km)';

                    distanceBox.style.display = 'block';
                    distanceBox.innerHTML = `
                        🛵 Tuyến đường: Quán Kim Bling ➔ Vị trí của bạn<br>
                        📐 Khoảng cách: <span style="color:#d32f2f;">~${distanceKm.toFixed(1)} km</span><br>
                        💰 Phí ship: <span style="color:#d32f2f;">${shipFeeText}</span>
                    `;

                    // Tạo link mở app Apple Maps chuẩn định tuyến (Maps Directions)
                    // Link này hoạt động hoàn hảo trên iPhone/iPad và chuyển đổi linh hoạt trên web
                    appleBtn.href = `https://maps.apple.com/?saddr=${STORE_LAT},${STORE_LNG}&daddr=${userLat},${userLng}&dirflg=d`;
                    appleBtn.style.display = 'block';

                },
                (error) => {
                    alert("Không thể lấy GPS. Vui lòng bật quyền truy cập vị trí trên trình duyệt!");
                    statusText.innerText = "❌ Lỗi định vị GPS.";
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        function calculateDistanceKm(lat1, lon1, lat2, lon2) {
            function toRad(x) { return x * Math.PI / 180; }
            let R = 6371;
            let dLat = toRad(lat2 - lat1);
            let dLon = toRad(lon2 - lon1);
            let a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
            let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }
    </script>
</body>
</html>
