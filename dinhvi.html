<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính Phí Ship - Kim Bling Coffee</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f4f6f9; padding: 20px 12px; display: flex; justify-content: center; }
        
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
        }

        .title {
            font-size: 16px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-gps {
            width: 100%;
            background: #2196F3;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .input-group {
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .input-group label {
            font-size: 12px;
            font-weight: bold;
            color: #475569;
            display: block;
            margin-bottom: 4px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        .btn-manual {
            width: 100%;
            background: #28a745;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .status-box {
            font-size: 12px;
            color: #64748b;
            background: #f8fafc;
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid #2196F3;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .result-box {
            display: none;
            background: #fffbe3;
            border: 1px solid #ffe58f;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            font-weight: bold;
            color: #d32f2f;
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .map-buttons {
            display: none;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-map-app {
            flex: 1;
            display: inline-block;
            text-align: center;
            text-decoration: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            color: #fff;
        }

        .btn-apple { background: #000000; }
        .btn-google { background: #4285F4; }
    </style>
</head>
<body>

    <div class="card">
        <div class="title">🛵 Tính Phí Ship - Kim Bling Coffee</div>

        <!-- TỌA ĐỘ CỐ ĐỊNH CHUẨN CỦA QUÁN KIM BLING -->
        <div class="input-group">
            <label>📍 Điểm đi (Quán Kim Bling):</label>
            <input type="text" value="M9 Cư Xá Phú Lâm A, Phường Phú Lâm, Q.6" disabled style="background: #f1f5f9; color: #475569; font-weight: bold;">
        </div>

        <!-- BẬT GPS -->
        <button type="button" class="btn-gps" onclick="detectGPSAndCalculate()">
            🛰️ Lấy vị trí GPS của bạn (Tính tự động)
        </button>

        <div class="status-box" id="statusText">
            💡 Bấm nút GPS ở trên HOẶC nhập địa chỉ nhận hàng vào ô bên dưới.
        </div>

        <!-- NHẬP ĐỊA CHỈ HÀNG -->
        <div class="input-group">
            <label>🏠 Nhập địa chỉ nhận hàng:</label>
            <input type="text" id="customerAddress" placeholder="Ví dụ: 628/62 Hậu Giang, Phường Phú Lâm...">
        </div>

        <button type="button" class="btn-manual" onclick="calculateManualAddress()">
            🔍 Xác Nhận Địa Chỉ Nhận Hàng
        </button>

        <!-- KẾT QUẢ PHÍ SHIP -->
        <div class="result-box" id="distanceResultBox"></div>

        <!-- NÚT MỞ BẢN ĐỒ DẪN ĐƯỜNG ĐI BỘ -->
        <div class="map-buttons" id="mapButtonsGroup">
            <a id="btnAppleMap" href="#" target="_blank" class="btn-map-app btn-apple">🍏 Xem Apple Maps</a>
            <a id="btnGoogleMap" href="#" target="_blank" class="btn-map-app btn-google">🗺️ Xem Google Maps</a>
        </div>
    </div>

    <script>
        // TỌA ĐỘ CHUẨN XÁC QUÁN KIM BLING
        const STORE_LAT = 10.7490699; 
        const STORE_LNG = 106.6310222;
        const STORE_ADDR = "M9 Cư Xá Phú Lâm A, Phường Phú Lâm, Quận 6, Hồ Chí Minh";

        // 1. Trường hợp BẬT GPS TỰ ĐỘNG
        function detectGPSAndCalculate() {
            const statusText = document.getElementById('statusText');
            const addressInput = document.getElementById('customerAddress');

            if (!navigator.geolocation) {
                alert("Trình duyệt không hỗ trợ GPS!");
                return;
            }

            statusText.innerText = "⏳ Đang kết nối vệ tinh GPS...";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const userLat = position.coords.latitude;
                    const userLng = position.coords.longitude;

                    statusText.innerText = "✅ Định vị GPS thành công!";
                    addressInput.value = `Tọa độ GPS: ${userLat.toFixed(5)}, ${userLng.toFixed(5)}`;

                    calculateOSRMAndShow(userLat, userLng);
                },
                (error) => {
                    alert("Không thể lấy GPS. Vui lòng tự nhập địa chỉ vào ô bên dưới!");
                    statusText.innerText = "❌ Lỗi GPS. Hãy gõ địa chỉ thủ công vào ô bên dưới.";
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        // 2. Trường hợp NHẬP ĐỊA CHỈ BẰNG TAY (Không gọi API trung gian tránh lỗi mạng)
        function calculateManualAddress() {
            const addressInput = document.getElementById('customerAddress');
            const query = addressInput.value.trim();
            const statusText = document.getElementById('statusText');
            const resultBox = document.getElementById('distanceResultBox');
            const mapGroup = document.getElementById('mapButtonsGroup');
            const appleBtn = document.getElementById('btnAppleMap');
            const googleBtn = document.getElementById('btnGoogleMap');

            if (!query || query.length < 3) {
                alert("Vui lòng nhập địa chỉ nhận hàng cụ thể!");
                addressInput.focus();
                return;
            }

            statusText.innerText = "✅ Đã ghi nhận địa chỉ nhận hàng!";

            let fullAddress = query;
            if (!query.toLowerCase().includes("hồ chí minh") && !query.toLowerCase().includes("tp.hcm")) {
                fullAddress += ", Hồ Chí Minh";
            }

            resultBox.style.display = 'block';
            resultBox.innerHTML = `
                📌 Địa chỉ giao: <span style="color:#1e293b;">${query}</span><br>
                💡 Khách bấm nút bên dưới để mở bản đồ (chế độ đi bộ qua hẻm) kiểm tra tuyến đường chính xác nhất!
            `;

            // Mở ứng dụng bản đồ ở chế độ đi bộ (dirflg=w đối với Apple Maps, travelmode=walking đối với Google Maps)
            appleBtn.href = `https://maps.apple.com/?saddr=${encodeURIComponent(STORE_ADDR)}&daddr=${encodeURIComponent(fullAddress)}&dirflg=w`;
            googleBtn.href = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(STORE_ADDR)}&destination=${encodeURIComponent(fullAddress)}&travelmode=walking`;
            mapGroup.style.display = 'flex';
        }

        // 3. Tính khoảng cách đi bộ OSRM (chế độ 'foot' đi tắt qua hẻm) khi bật GPS
        async function calculateOSRMAndShow(lat, lng) {
            const resultBox = document.getElementById('distanceResultBox');
            const mapGroup = document.getElementById('mapButtonsGroup');
            const appleBtn = document.getElementById('btnAppleMap');
            const googleBtn = document.getElementById('btnGoogleMap');

            try {
                // Đổi thành chế độ đi bộ /foot/ để đi qua các hẻm nhỏ
                let res = await fetch(`https://router.project-osrm.org/route/v1/foot/${STORE_LNG},${STORE_LAT};${lng},${lat}?overview=false`);
                let data = await res.json();

                let distanceKm = 0;
                if (data.code === "Ok" && data.routes && data.routes[0]) {
                    distanceKm = data.routes[0].distance / 1000;
                } else {
                    distanceKm = calculateHaversineKm(STORE_LAT, STORE_LNG, lat, lng);
                }

                let shipFeeText = distanceKm <= 1.0 ? '0đ (Freeship bán kính < 1km)' : '10.000đ (Phụ thu trên 1km)';

                resultBox.style.display = 'block';
                resultBox.innerHTML = `
                    🛵 Lộ trình đi bộ/hẻm: <span style="color:#1e293b;">Quán Kim Bling ➔ Vị trí của bạn</span><br>
                    📐 Khoảng cách đi bộ hẻm: <span style="color:#d32f2f;">~${distanceKm.toFixed(2)} km</span><br>
                    💰 Phí giao hàng (Ship): <span style="color:#d32f2f;">${shipFeeText}</span>
                `;

                // Cài đặt link chỉ đường chế độ đi bộ (dirflg=w & travelmode=walking)
                appleBtn.href = `https://maps.apple.com/?saddr=${STORE_LAT},${STORE_LNG}&daddr=${lat},${lng}&dirflg=w`;
                googleBtn.href = `https://www.google.com/maps/dir/?api=1&origin=${STORE_LAT},${STORE_LNG}&destination=${lat},${lng}&travelmode=walking`;
                mapGroup.style.display = 'flex';

            } catch(e) {
                let fallbackKm = calculateHaversineKm(STORE_LAT, STORE_LNG, lat, lng);
                let shipFeeText = fallbackKm <= 1.0 ? '0đ (Freeship < 1km)' : '10.000đ';

                resultBox.style.display = 'block';
                resultBox.innerHTML = `
                    📐 Khoảng cách ước tính: ~${fallbackKm.toFixed(1)} km<br>
                    💰 Phí ship: ${shipFeeText}
                `;
                appleBtn.href = `https://maps.apple.com/?saddr=${STORE_LAT},${STORE_LNG}&daddr=${lat},${lng}&dirflg=w`;
                googleBtn.href = `https://www.google.com/maps/dir/?api=1&origin=${STORE_LAT},${STORE_LNG}&destination=${lat},${lng}&travelmode=walking`;
                mapGroup.style.display = 'flex';
            }
        }

        function calculateHaversineKm(lat1, lon1, lat2, lon2) {
            function toRad(x) { return x * Math.PI / 180; }
            let R = 6371;
            let dLat = toRad(lat2 - lat1);
            let dLon = toRad(lon2 - lon1);
            let a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
            let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }
    </script>
</body>
</html>
