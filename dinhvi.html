<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Định Vị & Tính Phí Ship - Kim Bling Coffee</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f4f6f9; padding: 20px 12px; display: flex; justify-content: center; }
        
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
        }

        .title {
            font-size: 16px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-gps {
            width: 100%;
            background: #2196F3;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-reset {
            background: #ff9800;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            display: none;
            width: 100%;
            margin-bottom: 8px;
        }

        .input-group {
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .input-group label {
            font-size: 12px;
            font-weight: bold;
            color: #475569;
            display: block;
            margin-bottom: 4px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }
        .input-group input:focus {
            border-color: #2196F3;
        }

        .btn-manual {
            width: 100%;
            background: #28a745;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .status-box {
            font-size: 12px;
            color: #64748b;
            background: #f8fafc;
            padding: 8px 10px;
            border-radius: 6px;
            border-left: 3px solid #2196F3;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .result-box {
            display: none;
            background: #fffbe3;
            border: 1px solid #ffe58f;
            border-radius: 8px;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            color: #d32f2f;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .map-box {
            display: none;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .map-caption {
            font-size: 11px;
            color: #64748b;
            text-align: center;
            padding: 6px;
            background: #f8fafc;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="title">🚚 Định Vị & Tính Phí Ship Giao Hàng</div>

        <!-- CỐ ĐỊNH ĐIỂM XUẤT PHÁT: QUÁN KIM BLING -->
        <div class="input-group">
            <label>📍 Địa chỉ giao đi (Quán Kim Bling - Cố định):</label>
            <input type="text" value="M9 Cư Xá Phú Lâm A, Phường Phú Lâm, Q.6, TP.HCM" disabled style="background: #f1f5f9; color: #475569; font-weight: bold;">
        </div>

        <!-- NÚT BẬT ĐỊNH VỊ GPS VỊ TRÍ KHÁCH -->
        <button type="button" class="btn-gps" id="btnGetLocation" onclick="autoDetectLocationAndCalculate()">
            🛰️ Bật định vị GPS vị trí của bạn
        </button>
        <button type="button" class="btn-reset" id="btnResetLocation" onclick="resetLocationCheck()">
            🔄 Làm lại / Định vị lại
        </button>

        <div class="status-box" id="gpsStatusText">
            💡 Bạn có thể bấm bật GPS hoặc tự gõ địa chỉ nhận hàng bên dưới rồi bấm nút xanh lá để tính phí ship.
        </div>

        <!-- ĐIỂM ĐẾN: NHÀ KHÁCH HÀNG -->
        <div class="input-group">
            <label>🏠 Địa chỉ nhận hàng (Giao tới nhà khách):</label>
            <input type="text" id="customerAddress" placeholder="Nhập địa chỉ nhận hàng (Ví dụ: 628/62 Hậu Giang, P.Phú Lâm)...">
        </div>

        <button type="button" class="btn-manual" onclick="calculateDistanceManual()">
            🔍 Tính phí theo địa chỉ trên
        </button>

        <!-- KẾT QUẢ KHOẢNG CÁCH VÀ PHÍ SHIP -->
        <div class="result-box" id="distanceResultBox"></div>

        <!-- BẢN ĐỒ HIỂN THỊ ĐƯỜNG ĐI -->
        <div class="map-box" id="mapContainer">
            <iframe id="googleMapIframe" width="100%" height="220" style="border:0;" loading="lazy" allowfullscreen src=""></iframe>
            <div class="map-caption">🚶 Tuyến đường đi ngắn nhất từ Quán ➔ Khách (Tối ưu ngõ hẻm)</div>
        </div>
    </div>

    <script>
        // TỌA ĐỘ CỐ ĐỊNH CHUẨN XÁC CỦA QUÁN KIM BLING (M9 CƯ XÁ PHÚ LÂM A)
        const STORE_LAT = 10.7485; 
        const STORE_LNG = 106.6182;

        // 1. Tự động lấy vị trí GPS của khách làm điểm đến
        function autoDetectLocationAndCalculate() {
            const statusText = document.getElementById('gpsStatusText');
            const addressInput = document.getElementById('customerAddress');
            const btnGet = document.getElementById('btnGetLocation');
            const btnReset = document.getElementById('btnResetLocation');

            if (!navigator.geolocation) {
                alert("Trình duyệt không hỗ trợ định vị GPS!");
                return;
            }

            btnGet.innerText = "⏳ Đang lấy vị trí...";
            statusText.innerText = "⏳ Đang xin quyền GPS và lấy vị trí của bạn...";

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const userLat = position.coords.latitude;
                    const userLng = position.coords.longitude;

                    statusText.innerText = "✅ Định vị vị trí nhận hàng thành công!";
                    btnGet.style.display = 'none';
                    btnReset.style.display = 'block';

                    try {
                        let res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${userLat}&lon=${userLng}&accept-language=vi`);
                        let data = await res.json();
                        if (data && data.display_name) {
                            addressInput.value = data.display_name;
                        } else {
                            addressInput.value = `${userLat.toFixed(5)}, ${userLng.toFixed(5)}`;
                        }
                    } catch(e) {
                        addressInput.value = `${userLat.toFixed(5)}, ${userLng.toFixed(5)}`;
                    }

                    processDistanceAndMap(userLat, userLng);
                },
                (error) => {
                    alert("Không thể bật GPS. Bạn vui lòng tự gõ địa chỉ vào ô bên dưới rồi bấm 'Tính phí theo địa chỉ trên'!");
                    statusText.innerText = "❌ Không bật được GPS. Vui lòng gõ địa chỉ thủ công bên dưới.";
                    btnGet.innerText = "🛰️ Bật định vị GPS vị trí của bạn";
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        // 2. Tra cứu thủ công theo địa chỉ khách gõ
        async function calculateDistanceManual() {
            const addressInput = document.getElementById('customerAddress');
            const query = addressInput.value.trim();
            const statusText = document.getElementById('gpsStatusText');

            if (!query || query.length < 4) {
                alert("Vui lòng nhập địa chỉ nhận hàng cụ thể!");
                addressInput.focus();
                return;
            }

            statusText.innerText = "⏳ Đang tra cứu địa chỉ trên bản đồ...";

            try {
                let res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1&accept-language=vi`);
                let data = await res.json();

                if (data && data.length > 0) {
                    const userLat = parseFloat(data[0].lat);
                    const userLng = parseFloat(data[0].lon);

                    statusText.innerText = "✅ Đã tìm thấy vị trí giao hàng!";
                    processDistanceAndMap(userLat, userLng, query);
                } else {
                    alert("Không tìm thấy địa chỉ này trên bản đồ. Vui lòng ghi rõ Số nhà, Đường, Phường/Quận!");
                    statusText.innerText = "❌ Không tìm thấy địa chỉ.";
                }
            } catch(e) {
                alert("Lỗi kết nối khi tìm kiếm địa chỉ.");
            }
        }

        // 3. Tính khoảng cách, quy đổi tiền ship & vẽ bản đồ từ Quán đến Khách (Chế độ đi bộ ngắn nhất)
        function processDistanceAndMap(userLat, userLng, customAddressText = null) {
            const distanceBox = document.getElementById('distanceResultBox');
            const mapContainer = document.getElementById('mapContainer');
            const iframeMap = document.getElementById('googleMapIframe');

            let distanceKm = calculateDistanceKm(STORE_LAT, STORE_LNG, userLat, userLng);
            let shipFeeText = distanceKm <= 1.0 ? '0đ (Freeship bán kính < 1km)' : '10.000đ (Phụ thu trên 1km)';

            distanceBox.style.display = 'block';
            distanceBox.innerHTML = `
                🛵 Lộ trình giao: <span style="color:#1e293b;">Từ Quán Kim Bling ➔ Nhà Khách</span><br>
                📐 Khoảng cách ước tính: <span style="color:#d32f2f;">~${distanceKm.toFixed(1)} km</span><br>
                💰 Phí ship áp dụng: <span style="color:#d32f2f;">${shipFeeText}</span>
            `;

            mapContainer.style.display = 'block';

            // saddr: Cố định tọa độ Quán Kim Bling | daddr: Vị trí của Khách | dirflg=w: Đi bộ (ngắn nhất)
            let destParam = customAddressText ? encodeURIComponent(customAddressText) : `${userLat},${userLng}`;
            iframeMap.src = `https://www.google.com/maps?saddr=${STORE_LAT},${STORE_LNG}&daddr=${destParam}&dirflg=w&output=embed`;
        }

        // Reset dữ liệu
        function resetLocationCheck() {
            document.getElementById('btnGetLocation').style.display = 'block';
            document.getElementById('btnGetLocation').innerText = "🛰️ Bật định vị GPS vị trí của bạn";
            document.getElementById('btnResetLocation').style.display = 'none';
            document.getElementById('gpsStatusText').innerText = "💡 Đã reset. Bấm để bật GPS lại hoặc nhập địa chỉ mới.";
            document.getElementById('distanceResultBox').style.display = 'none';
            document.getElementById('mapContainer').style.display = 'none';
        }

        // Công thức tính khoảng cách Haversine (km)
        function calculateDistanceKm(lat1, lon1, lat2, lon2) {
            function toRad(x) { return x * Math.PI / 180; }
            let R = 6371;
            let dLat = toRad(lat2 - lat1);
            let dLon = toRad(lon2 - lon1);
            let a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
            let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }
    </script>
</body>
</html>
