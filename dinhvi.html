<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Định Vị & Tính Phí Ship - Kim Bling Coffee</title>
    <!-- NHÚNG THƯ VIỆN GOOGLE MAPS PLACES API CHÍNH CHỦ -->
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&libraries=places&language=vi"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f4f6f9; padding: 20px 12px; display: flex; justify-content: center; }
        
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
        }

        .title {
            font-size: 16px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-gps {
            width: 100%;
            background: #2196F3;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-reset {
            background: #ff9800;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            display: none;
            width: 100%;
            margin-bottom: 8px;
        }

        .input-group {
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .input-group label {
            font-size: 12px;
            font-weight: bold;
            color: #475569;
            display: block;
            margin-bottom: 4px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }
        .input-group input:focus {
            border-color: #2196F3;
        }

        .status-box {
            font-size: 12px;
            color: #64748b;
            background: #f8fafc;
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid #2196F3;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .result-box {
            display: none;
            background: #fffbe3;
            border: 1px solid #ffe58f;
            border-radius: 8px;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            color: #d32f2f;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .map-box {
            display: none;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .map-caption {
            font-size: 11px;
            color: #64748b;
            text-align: center;
            padding: 6px;
            background: #f8fafc;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="title">🚚 Định Vị & Tính Phí Ship - Kim Bling Coffee</div>

        <!-- ĐIỂM XUẤT PHÁT: QUÁN KIM BLING (CỐ ĐỊNH) -->
        <div class="input-group">
            <label>📍 Điểm đi (Quán Kim Bling):</label>
            <input type="text" value="M9 Cư Xá Phú Lâm A, Phường Phú Lâm, Q.6, TP.HCM" disabled style="background: #f1f5f9; color: #475569; font-weight: bold;">
        </div>

        <!-- NÚT BẬT GPS -->
        <button type="button" class="btn-gps" id="btnGetLocation" onclick="autoDetectLocation()">
            🛰️ Lấy vị trí GPS hiện tại của tôi
        </button>
        <button type="button" class="btn-reset" id="btnResetLocation" onclick="resetLocationCheck()">
            🔄 Chọn lại vị trí khác
        </button>

        <div class="status-box" id="gpsStatusText">
            💡 Gõ địa chỉ nhận hàng bên dưới (sẽ hiện bảng gợi ý chuẩn xác y hệt Google Maps) hoặc bấm nút GPS.
        </div>

        <!-- Ô NHẬP ĐỊA CHỈ TÍCH HỢP GỢI Ý GOOGLE -->
        <div class="input-group">
            <label>🏠 Địa chỉ nhận hàng:</label>
            <input type="text" id="customerAddress" placeholder="Nhập số nhà, tên đường (Ví dụ: 628 Hậu Giang)...">
        </div>

        <!-- KẾT QUẢ KHOẢNG CÁCH & PHÍ SHIP -->
        <div class="result-box" id="distanceResultBox"></div>

        <!-- BẢN ĐỒ HIỂN THỊ CHỈ ĐƯỜNG -->
        <div class="map-box" id="mapContainer">
            <iframe id="googleMapIframe" width="100%" height="240" style="border:0;" loading="lazy" allowfullscreen src=""></iframe>
            <div class="map-caption">🗺️ Lộ trình đường đi thực tế qua hẻm từ Quán đến bạn</div>
        </div>
    </div>

    <script>
        // TỌA ĐỘ CỐ ĐỊNH CHUẨN XÁC CỦA QUÁN KIM BLING
        const STORE_LAT = 10.7490699; 
        const STORE_LNG = 106.6310222;

        let selectedUserLat = null;
        let selectedUserLng = null;
        let autocomplete;

        // KÍCH HOẠT GỢI Ý ĐỊA CHỈ GOOGLE PLACES AUTOCOMPLETE
        window.addEventListener('load', function() {
            const input = document.getElementById('customerAddress');
            
            // Giới hạn gợi ý tập trung trong khu vực TP.HCM để kết quả chuẩn xác nhất
            const options = {
                componentRestrictions: { country: "vn" },
                bounds: new google.maps.LatLngBounds(
                    new google.maps.LatLng(10.35, 106.35), 
                    new google.maps.LatLng(11.15, 107.05)  
                ),
                strictBounds: false
            };
            
            autocomplete = new google.maps.places.Autocomplete(input, options);
            
            // Khi khách bấm chọn một địa điểm trong danh sách gợi ý của Google
            autocomplete.addListener('place_changed', function() {
                const place = autocomplete.getPlace();
                if (place.geometry && place.geometry.location) {
                    selectedUserLat = place.geometry.location.lat();
                    selectedUserLng = place.geometry.location.lng();
                    
                    document.getElementById('gpsStatusText').innerText = "✅ Đã chọn địa chỉ chuẩn xác từ Google Maps!";
                    updateMapAndDistance();
                } else {
                    alert("Vui lòng chọn địa chỉ từ danh sách gợi ý của Google!");
                }
            });
        });

        // 1. Tự động lấy GPS
        function autoDetectLocation() {
            const statusText = document.getElementById('gpsStatusText');
            const addressInput = document.getElementById('customerAddress');
            const btnGet = document.getElementById('btnGetLocation');
            const btnReset = document.getElementById('btnResetLocation');

            if (!navigator.geolocation) {
                alert("Trình duyệt không hỗ trợ định vị GPS!");
                return;
            }

            btnGet.innerText = "⏳ Đang lấy vị trí của bạn...";
            statusText.innerText = "⏳ Đang kết nối vệ tinh GPS...";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    selectedUserLat = position.coords.latitude;
                    selectedUserLng = position.coords.longitude;

                    statusText.innerText = "✅ Lấy vị trí GPS thành công!";
                    btnGet.style.display = 'none';
                    btnReset.style.display = 'block';

                    // Dùng dịch vụ Geocoder của Google để dịch tọa độ sang tên địa chỉ chi tiết
                    const geocoder = new google.maps.Geocoder();
                    geocoder.geocode({ location: { lat: selectedUserLat, lng: selectedUserLng } }, (results, status) => {
                        if (status === "OK" && results[0]) {
                            addressInput.value = results[0].formatted_address;
                        } else {
                            addressInput.value = `${selectedUserLat.toFixed(5)}, ${selectedUserLng.toFixed(5)}`;
                        }
                        updateMapAndDistance();
                    });
                },
                (error) => {
                    alert("Không thể lấy GPS. Vui lòng gõ địa chỉ vào ô bên dưới!");
                    statusText.innerText = "❌ Lỗi GPS. Hãy gõ tìm địa chỉ thủ công.";
                    btnGet.innerText = "🛰️ Lấy vị trí GPS hiện tại của tôi";
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        // 2. Tính khoảng cách, phí ship và vẽ bản đồ
        function updateMapAndDistance() {
            if (!selectedUserLat || !selectedUserLng) return;

            const distanceBox = document.getElementById('distanceResultBox');
            const mapContainer = document.getElementById('mapContainer');
            const iframeMap = document.getElementById('googleMapIframe');

            let distanceKm = calculateDistanceKm(STORE_LAT, STORE_LNG, selectedUserLat, selectedUserLng);
            let shipFeeText = distanceKm <= 1.0 ? '0đ (Freeship bán kính < 1km)' : '10.000đ (Phụ thu trên 1km)';

            distanceBox.style.display = 'block';
            distanceBox.innerHTML = `
                🛵 Tuyến đường: <span style="color:#1e293b;">Quán Kim Bling ➔ Vị trí của bạn</span><br>
                📐 Khoảng cách: <span style="color:#d32f2f;">~${distanceKm.toFixed(1)} km</span><br>
                💰 Phí ship: <span style="color:#d32f2f;">${shipFeeText}</span>
            `;

            mapContainer.style.display = 'block';
            iframeMap.src = `https://www.google.com/maps?saddr=${STORE_LAT},${STORE_LNG}&daddr=${selectedUserLat},${selectedUserLng}&dirflg=w&output=embed`;
        }

        function resetLocationCheck() {
            selectedUserLat = null;
            selectedUserLng = null;
            document.getElementById('btnGetLocation').style.display = 'block';
            document.getElementById('btnGetLocation').innerText = "🛰️ Lấy vị trí GPS hiện tại của tôi";
            document.getElementById('btnResetLocation').style.display = 'none';
            document.getElementById('gpsStatusText').innerText = "💡 Gõ địa chỉ nhận hàng bên dưới hoặc bấm nút GPS.";
            document.getElementById('distanceResultBox').style.display = 'none';
            document.getElementById('mapContainer').style.display = 'none';
            document.getElementById('customerAddress').value = '';
        }

        function calculateDistanceKm(lat1, lon1, lat2, lon2) {
            function toRad(x) { return x * Math.PI / 180; }
            let R = 6371;
            let dLat = toRad(lat2 - lat1);
            let dLon = toRad(lon2 - lon1);
            let a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
            let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }
    </script>
</body>
</html>
