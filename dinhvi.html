<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính Phí Ship - Kim Bling Coffee</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f4f6f9; padding: 20px 12px; display: flex; justify-content: center; }
        
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
        }

        .title {
            font-size: 16px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-gps {
            width: 100%;
            background: #4285F4;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .input-group {
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .input-group label {
            font-size: 12px;
            font-weight: bold;
            color: #475569;
            display: block;
            margin-bottom: 4px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }
        .input-group input:focus {
            border-color: #4285F4;
        }

        .btn-manual {
            width: 100%;
            background: #28a745;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .status-box {
            font-size: 12px;
            color: #64748b;
            background: #f8fafc;
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid #4285F4;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .result-box {
            display: none;
            background: #fffbe3;
            border: 1px solid #ffe58f;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .btn-google-map {
            display: none;
            width: 100%;
            background: #4285F4;
            color: #fff;
            text-align: center;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="title">🛵 Tính Phí Ship - Kim Bling Coffee</div>

        <!-- CỐ ĐỊNH ĐIỂM XUẤT PHÁT: QUÁN KIM BLING -->
        <div class="input-group">
            <label>📍 Điểm đi (Quán Kim Bling):</label>
            <input type="text" value="M9 Cư Xá Phú Lâm A, Phường Phú Lâm, Q.6" disabled style="background: #f1f5f9; color: #475569; font-weight: bold;">
        </div>

        <!-- CÁCH 1: LẤY GPS TỰ ĐỘNG -->
        <button type="button" class="btn-gps" onclick="detectGPSAndCalculate()">
            🛰️ Lấy vị trí GPS của bạn (Tự động)
        </button>

        <div class="status-box" id="statusText">
            💡 Bấm nút GPS hoặc nhập địa chỉ để hệ thống tự tính phí ship xuất phát từ Quán Kim Bling!
        </div>

        <!-- CÁCH 2: NHẬP ĐỊA CHỈ BẰNG TAY -->
        <div class="input-group">
            <label>🏠 Nhập địa chỉ nhận hàng:</label>
            <input type="text" id="customerAddress" placeholder="Ví dụ: 628/62 Hậu Giang, Phường Phú Lâm...">
        </div>

        <button type="button" class="btn-manual" onclick="calculateManualAddress()">
            🔍 Xác Nhận Địa Chỉ Nhận Hàng
        </button>

        <!-- KẾT QUẢ TÍNH TIỀN SHIP -->
        <div class="result-box" id="distanceResultBox"></div>

        <!-- NÚT MỞ GOOGLE MAPS ĐI BỘ / HẺM -->
        <a id="btnGoogleMap" href="#" target="_blank" class="btn-google-map">
            🗺️ Xem chỉ đường chi tiết trên Google Maps
        </a>
    </div>

    <script>
        // ==========================================
        // TỌA ĐỘ CỐ ĐỊNH CHUẨN XÁC CỦA QUÁN KIM BLING
        // ==========================================
        const STORE_LAT = 10.74955; 
        const STORE_LNG = 106.63099;

        // ==========================================
        // BẢNG GIÁ SHIP QUÁN KIM BLING
        // ==========================================
        function calculateShippingFee(distanceKm) {
            if (distanceKm <= 1.0) {
                return 0; // Freeship dưới 1km (Ví dụ: 500m -> 0đ)
            } else if (distanceKm <= 2.0) {
                return 10000; // 1km - 2km -> 10k
            } else if (distanceKm <= 3.0) {
                return 15000; // 2km - 3km -> 15k
            } else {
                let extraKm = Math.ceil(distanceKm - 3.0);
                return 15000 + (extraKm * 5000); // Trên 3km: +5k mỗi km
            }
        }

        // 1. Trường hợp BẬT GPS TỰ ĐỘNG
        function detectGPSAndCalculate() {
            const statusText = document.getElementById('statusText');
            const addressInput = document.getElementById('customerAddress');

            if (!navigator.geolocation) {
                alert("Trình duyệt không hỗ trợ GPS!");
                return;
            }

            statusText.innerText = "⏳ Đang kết nối vệ tinh GPS...";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const userLat = position.coords.latitude;
                    const userLng = position.coords.longitude;

                    statusText.innerText = "✅ Định vị GPS thành công!";
                    addressInput.value = `Tọa độ GPS: ${userLat.toFixed(5)}, ${userLng.toFixed(5)}`;

                    calculateOSRMAndShow(userLat, userLng);
                },
                (error) => {
                    alert("Không thể lấy GPS. Vui lòng tự nhập địa chỉ vào ô bên dưới!");
                    statusText.innerText = "❌ Lỗi GPS. Hãy gõ địa chỉ thủ công.";
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        // 2. Trường hợp NHẬP ĐỊA CHỈ BẰNG TAY
        function calculateManualAddress() {
            const addressInput = document.getElementById('customerAddress');
            const query = addressInput.value.trim();
            const statusText = document.getElementById('statusText');
            const resultBox = document.getElementById('distanceResultBox');
            const googleBtn = document.getElementById('btnGoogleMap');

            if (!query || query.length < 3) {
                alert("Vui lòng nhập địa chỉ nhận hàng cụ thể!");
                addressInput.focus();
                return;
            }

            statusText.innerText = "✅ Đã ghi nhận địa chỉ nhận hàng!";

            let fullAddress = query;
            if (!query.toLowerCase().includes("hồ chí minh") && !query.toLowerCase().includes("tp.hcm")) {
                fullAddress += ", Hồ Chí Minh";
            }

            resultBox.style.display = 'block';
            resultBox.innerHTML = `
                📌 Xuất phát từ: <span style="color:#1e293b;">Quán Kim Bling (M9 Cư Xá Phú Lâm A)</span><br>
                📍 Địa chỉ giao: <span style="color:#1e293b;">${query}</span><br>
                💡 Bấm nút xanh bên dưới để xem đường đi trên Google Maps!
            `;

            // Mở trực tiếp Google Maps chế độ đi bộ (travelmode=walking)
            googleBtn.href = `https://www.google.com/maps/dir/?api=1&origin=${STORE_LAT},${STORE_LNG}&destination=${encodeURIComponent(fullAddress)}&travelmode=walking`;
            googleBtn.style.display = 'block';
        }

        // 3. Tính khoảng cách OSRM đi bộ & Tính phí ship tự động
        async function calculateOSRMAndShow(lat, lng) {
            const statusText = document.getElementById('statusText');
            const resultBox = document.getElementById('distanceResultBox');
            const googleBtn = document.getElementById('btnGoogleMap');

            try {
                let res = await fetch(`https://router.project-osrm.org/route/v1/foot/${STORE_LNG},${STORE_LAT};${lng},${lat}?overview=false`);
                let data = await res.json();

                let distanceKm = 0;
                if (data.code === "Ok" && data.routes && data.routes[0]) {
                    distanceKm = data.routes[0].distance / 1000;
                } else {
                    distanceKm = calculateHaversineKm(STORE_LAT, STORE_LNG, lat, lng);
                }

                // Gọi hàm tính phí ship
                let shipFee = calculateShippingFee(distanceKm);
                let shipFeeText = shipFee === 0 
                    ? "0đ (🎉 Miễn phí ship bán kính < 1km)" 
                    : shipFee.toLocaleString('vi-VN') + "đ";

                // Đổi ra mét nếu dưới 1km (Ví dụ: 500m)
                let distanceText = distanceKm < 1.0 
                    ? `${(distanceKm * 1000).toFixed(0)} m` 
                    : `${distanceKm.toFixed(2)} km`;

                statusText.innerText = "✅ Tính phí ship thành công!";
                resultBox.style.display = 'block';
                resultBox.innerHTML = `
                    🛵 Xuất phát từ: <span style="color:#1e293b;">Quán Kim Bling</span><br>
                    📐 Khoảng cách qua hẻm: <span style="color:#d32f2f;">~${distanceText}</span><br>
                    💰 Phí giao hàng (Ship): <span style="color:#d32f2f; font-size:15px;">${shipFeeText}</span>
                `;

                googleBtn.href = `https://www.google.com/maps/dir/?api=1&origin=${STORE_LAT},${STORE_LNG}&destination=${lat},${lng}&travelmode=walking`;
                googleBtn.style.display = 'block';

            } catch(e) {
                let fallbackKm = calculateHaversineKm(STORE_LAT, STORE_LNG, lat, lng);
                let shipFee = calculateShippingFee(fallbackKm);
                let shipFeeText = shipFee === 0 ? "0đ (Freeship < 1km)" : shipFee.toLocaleString('vi-VN') + "đ";

                statusText.innerText = "✅ Đã tính khoảng cách ước tính!";
                resultBox.style.display = 'block';
                resultBox.innerHTML = `
                    📐 Khoảng cách ước tính: ~${fallbackKm.toFixed(1)} km<br>
                    💰 Phí ship: ${shipFeeText}
                `;
                googleBtn.href = `https://www.google.com/maps/dir/?api=1&origin=${STORE_LAT},${STORE_LNG}&destination=${lat},${lng}&travelmode=walking`;
                googleBtn.style.display = 'block';
            }
        }

        function calculateHaversineKm(lat1, lon1, lat2, lon2) {
            function toRad(x) { return x * Math.PI / 180; }
            let R = 6371;
            let dLat = toRad(lat2 - lat1);
            let dLon = toRad(lon2 - lon1);
            let a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
            let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }
    </script>
</body>
</html>
