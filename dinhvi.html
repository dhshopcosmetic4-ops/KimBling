<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Định Vị & Tính Phí Ship - Kim Bling Coffee</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f4f6f9; padding: 20px 12px; display: flex; justify-content: center; }
        
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
        }

        .title {
            font-size: 16px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-gps {
            width: 100%;
            background: #2196F3;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-reset {
            background: #ff9800;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            display: none;
            width: 100%;
            margin-bottom: 8px;
        }

        .input-group {
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .input-group label {
            font-size: 12px;
            font-weight: bold;
            color: #475569;
            display: block;
            margin-bottom: 4px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }
        .input-group input:focus {
            border-color: #2196F3;
        }

        .status-box {
            font-size: 12px;
            color: #64748b;
            background: #f8fafc;
            padding: 8px 10px;
            border-radius: 6px;
            border-left: 3px solid #2196F3;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .result-box {
            display: none;
            background: #fffbe3;
            border: 1px solid #ffe58f;
            border-radius: 8px;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            color: #d32f2f;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .map-box {
            display: none;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .map-caption {
            font-size: 11px;
            color: #64748b;
            text-align: center;
            padding: 6px;
            background: #f8fafc;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="title">🚚 Định Vị & Tính Phí Ship Miễn Phí</div>

        <!-- CỐ ĐỊNH ĐIỂM XUẤT PHÁT: QUÁN KIM BLING -->
        <div class="input-group">
            <label>📍 Điểm đi (Quán Kim Bling):</label>
            <input type="text" value="M9 Cư Xá Phú Lâm A, Phường Phú Lâm, Q.6, TP.HCM" disabled style="background: #f1f5f9; color: #475569; font-weight: bold;">
        </div>

        <!-- NÚT BẬT GPS -->
        <button type="button" class="btn-gps" id="btnGetLocation" onclick="autoDetectLocationAndCalculate()">
            🛰️ Bật định vị GPS vị trí của bạn
        </button>
        <button type="button" class="btn-reset" id="btnResetLocation" onclick="resetLocationCheck()">
            🔄 Làm lại / Định vị lại
        </button>

        <div class="status-box" id="gpsStatusText">
            💡 Bấm bật GPS hoặc nhập tọa độ/địa chỉ để đo khoảng cách thực tế qua hẻm miễn phí.
        </div>

        <!-- ĐIỂM ĐẾN -->
        <div class="input-group">
            <label>🏠 Địa chỉ nhận hàng hoặc Tọa độ (Lat, Lng):</label>
            <input type="text" id="customerAddress" placeholder="Ví dụ: 10.75231, 106.62145 hoặc gõ địa chỉ...">
        </div>

        <button type="button" style="width:100%; background:#28a745; color:#fff; border:none; padding:10px; border-radius:8px; font-weight:bold; font-size:13px; cursor:pointer; margin-bottom:10px;" onclick="calculateByOSRM()">
            🔍 Tính phí chính xác theo điểm đến
        </button>

        <!-- KẾT QUẢ KHOẢNG CÁCH & PHÍ SHIP -->
        <div class="result-box" id="distanceResultBox"></div>

        <!-- BẢN ĐỒ HIỂN THỊ CHỈ ĐƯỜNG -->
        <div class="map-box" id="mapContainer">
            <iframe id="googleMapIframe" width="100%" height="240" style="border:0;" loading="lazy" allowfullscreen src=""></iframe>
            <div class="map-caption">🗺️ Lộ trình chỉ đường trực tiếp từ Quán đến vị trí của bạn</div>
        </div>
    </div>

    <script>
        // TỌA ĐỘ CỐ ĐỊNH CỦA QUÁN KIM BLING
        const STORE_LAT = 10.7490699; 
        const STORE_LNG = 106.6310222;

        let targetLat = null;
        let targetLng = null;

        // 1. Lấy vị trí GPS tự động
        function autoDetectLocationAndCalculate() {
            const statusText = document.getElementById('gpsStatusText');
            const addressInput = document.getElementById('customerAddress');
            const btnGet = document.getElementById('btnGetLocation');
            const btnReset = document.getElementById('btnResetLocation');

            if (!navigator.geolocation) {
                alert("Trình duyệt không hỗ trợ định vị GPS!");
                return;
            }

            btnGet.innerText = "⏳ Đang lấy vị trí của bạn...";
            statusText.innerText = "⏳ Đang kết nối vệ tinh GPS...";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    targetLat = position.coords.latitude;
                    targetLng = position.coords.longitude;

                    statusText.innerText = "✅ Lấy vị trí GPS thành công!";
                    btnGet.style.display = 'none';
                    btnReset.style.display = 'block';
                    addressInput.value = `${targetLat.toFixed(6)}, ${targetLng.toFixed(6)}`;

                    getExactDistanceOSRM(STORE_LAT, STORE_LNG, targetLat, targetLng);
                },
                (error) => {
                    alert("Không thể lấy GPS. Vui lòng nhập tọa độ hoặc dùng cách khác!");
                    statusText.innerText = "❌ Lỗi GPS.";
                    btnGet.innerText = "🛰️ Bật định vị GPS vị trí của bạn";
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        // 2. Xử lý khi nhập tay (hỗ trợ nhập thẳng cặp tọa độ "lat, lng" cho chuẩn xác 100%)
        async function calculateByOSRM() {
            const inputVal = document.getElementById('customerAddress').value.trim();
            const statusText = document.getElementById('gpsStatusText');

            if (!inputVal) {
                alert("Vui lòng nhập tọa độ hoặc địa chỉ!");
                return;
            }

            // Kiểm tra xem khách có nhập trực tiếp dạng tọa độ "10.xxxx, 106.yyyy" không
            let parts = inputVal.split(',');
            if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
                targetLat = parseFloat(parts[0].trim());
                targetLng = parseFloat(parts[1].trim());
                getExactDistanceOSRM(STORE_LAT, STORE_LNG, targetLat, targetLng);
            } else {
                // Nếu nhập chữ, dùng Nominatim tìm tọa độ trước rồi truyền vào máy chủ đo đường OSRM miễn phí
                statusText.innerText = "⏳ Đang tra cứu địa chỉ...";
                try {
                    let res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(inputVal + ", Hồ Chí Minh")}&limit=1`);
                    let data = await res.json();
                    if (data && data.length > 0) {
                        targetLat = parseFloat(data[0].lat);
                        targetLng = parseFloat(data[0].lon);
                        getExactDistanceOSRM(STORE_LAT, STORE_LNG, targetLat, targetLng);
                    } else {
                        alert("Không tìm thấy địa chỉ. Bạn hãy copy tọa độ từ Google Maps dán vào đây để chính xác tuyệt đối nhé!");
                    }
                } catch(e) {
                    alert("Lỗi kết nối tra cứu.");
                }
            }
        }

        // 3. Sử dụng API OSRM công khai (Miễn phí 100%) để đo số km thực tế đi qua đường/hẻm y hệt Google Maps
        async function getExactDistanceOSRM(lat1, lon1, lat2, lon2) {
            const statusText = document.getElementById('gpsStatusText');
            const distanceBox = document.getElementById('distanceResultBox');
            const mapContainer = document.getElementById('mapContainer');
            const iframeMap = document.getElementById('googleMapIframe');

            statusText.innerText = "⏳ Đang tính toán quãng đường thực tế qua hẻm...";

            try {
                // OSRM API công khai miễn phí cho xe máy/đi bộ (foot hoặc driving)
                let url = `https://router.project-osrm.org/route/v1/foot/${lon1},${lat1};${lon2},${lat2}?overview=false`;
                let response = await fetch(url);
                let data = await response.json();

                if (data.code === "Ok" && data.routes && data.routes.length > 0) {
                    let distanceMeters = data.routes[0].distance; // khoảng cách tính bằng mét
                    let distanceKm = distanceMeters / 1000;

                    let shipFeeText = distanceKm <= 1.0 ? '0đ (Freeship bán kính < 1km)' : '10.000đ (Phụ thu trên 1km)';

                    distanceBox.style.display = 'block';
                    distanceBox.innerHTML = `
                        🛵 Tuyến đường chuẩn: <span style="color:#1e293b;">Quán Kim Bling ➔ Khách</span><br>
                        📐 Khoảng cách thực tế: <span style="color:#d32f2f;">~${distanceKm.toFixed(2)} km</span><br>
                        💰 Phí ship: <span style="color:#d32f2f;">${shipFeeText}</span>
                    `;

                    statusText.innerText = "✅ Tính khoảng cách thành công!";
                    mapContainer.style.display = 'block';
                    
                    // Hiển thị bản đồ Google Maps nhúng trực quan
                    iframeMap.src = `https://www.google.com/maps?saddr=${lat1},${lon1}&daddr=${lat2},${lon2}&dirflg=w&output=embed`;
                } else {
                    alert("Không thể tính được tuyến đường. Vui lòng kiểm tra lại tọa độ!");
                }
            } catch (e) {
                alert("Lỗi kết nối đến máy chủ đo khoảng cách miễn phí.");
            }
        }

        function resetLocationCheck() {
            targetLat = null;
            targetLng = null;
            document.getElementById('btnGetLocation').style.display = 'block';
            document.getElementById('btnGetLocation').innerText = "🛰️ Bật định vị GPS vị trí của bạn";
            document.getElementById('btnResetLocation').style.display = 'none';
            document.getElementById('gpsStatusText').innerText = "💡 Đã reset. Bấm bật GPS hoặc nhập tọa độ mới.";
            document.getElementById('distanceResultBox').style.display = 'none';
            document.getElementById('mapContainer').style.display = 'none';
            document.getElementById('customerAddress').value = '';
        }
    </script>
</body>
</html>
