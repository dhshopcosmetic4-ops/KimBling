<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hộp Quà May Mắn - Kim Bling Coffee & Tea</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: transparent; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 5px; }
        
        .game-card { background: #fff; width: 100%; max-width: 390px; border-radius: 20px; padding: 16px 14px; text-align: center; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .close-btn { position: absolute; top: 10px; right: 10px; background: #eee; border: none; width: 32px; height: 32px; border-radius: 50%; font-weight: bold; font-size: 16px; cursor: pointer; color: #555; z-index: 10; }
        
        h2 { color: #d32f2f; font-size: 20px; margin-bottom: 3px; margin-top: 2px; font-weight: 800; }
        p.subtitle { font-size: 12px; color: #666; margin-bottom: 8px; }
        .turn-badge { background: #fff3e0; color: #e65100; font-weight: bold; font-size: 13px; padding: 4px 12px; border-radius: 14px; display: inline-block; margin-bottom: 8px; border: 1.5px solid #ffe0b2; }

        .grid-boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
        
        .box-item { 
            background: linear-gradient(135deg, #ff9800, #f57c00); 
            color: #fff; 
            border-radius: 12px; 
            height: 88px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            font-size: 34px; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            box-shadow: 0 3px 6px rgba(0,0,0,0.18); 
            user-select: none; 
            position: relative; 
            line-height: 1.2;
        }
        .box-item:active { transform: scale(0.92); }
        
        .box-item.user-opened { 
            background: #fff8e1 !important; 
            color: #d84315 !important; 
            font-size: 13px !important; 
            font-weight: bold !important; 
            cursor: default !important; 
            border: 2.5px solid #f57c00 !important; 
        }
        .box-item.winner-box { 
            background: #e8f5e9 !important; 
            color: #2e7d32 !important; 
            border: 2.5px solid #2e7d32 !important; 
            animation: shakeWin 0.6s ease-in-out infinite alternate !important; 
            font-size: 13px !important; 
            font-weight: bold !important; 
        }
        
        .box-item.auto-revealed { 
            background: #f9f9f9 !important; 
            color: #666 !important; 
            font-size: 11px !important; 
            font-weight: 500 !important; 
            cursor: default !important; 
            border: 1px dashed #ccc !important; 
            opacity: 0.85 !important; 
        }

        .box-item span.item-title {
            font-size: 12px !important;
            font-weight: bold;
            margin-top: 3px;
        }

        @keyframes shakeWin {
            0% { transform: rotate(-3deg) scale(1.02); }
            100% { transform: rotate(3deg) scale(1.02); }
        }

        .result-box { display: none; background: #e8f5e9; border: 1.5px dashed #2e7d32; padding: 10px 12px; border-radius: 12px; margin-top: 6px; text-align: center; }
        .action-choice-row { display: flex; gap: 8px; margin-top: 8px; justify-content: center; }
        .btn-choice-next { flex: 1; background: #ff9800; color: #fff; border: none; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .btn-close-game { background: #28a745; color: #fff; border: none; width: 100%; padding: 11px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; margin-top: 6px; }
    </style>
</head>
<body>

    <div class="game-card">
        <button class="close-btn" onclick="closeGame()">✕</button>
        <h2>🎁 HỘP QUÀ MAY MẮN</h2>
        <p class="subtitle">Mở ô tìm ưu đãi - Đặt đơn nhận thêm lượt chơi!</p>
        <div class="turn-badge" id="turnBadge">Lượt chơi: Còn 5 lượt</div>
        <div id="wonPrizesDisplay" style="font-size: 12px; color: #e65100; font-weight: bold; margin-bottom: 8px;">🎁 Mở hộp quà nhận ưu đãi ngay!</div>

        <div class="grid-boxes" id="gridBoxes">
            <div class="box-item" onclick="openBox(0)">🎁</div>
            <div class="box-item" onclick="openBox(1)">🎁</div>
            <div class="box-item" onclick="openBox(2)">🎁</div>
            <div class="box-item" onclick="openBox(3)">🎁</div>
            <div class="box-item" onclick="openBox(4)">🎁</div>
            <div class="box-item" onclick="openBox(5)">🎁</div>
            <div class="box-item" onclick="openBox(6)">🎁</div>
            <div class="box-item" onclick="openBox(7)">🎁</div>
            <div class="box-item" onclick="openBox(8)">🎁</div>
        </div>

        <div class="result-box" id="resultBox">
            <div id="resultText" style="font-size: 13px; line-height: 1.4;"></div>
            <div class="action-choice-row" id="choiceRow" style="display: none;">
                <button class="btn-choice-next" onclick="startNextGame()">🎮 Mở lượt tiếp theo</button>
            </div>
            <button class="btn-close-game" id="btnCloseGameAction" onclick="finishFiveTurnsAndCheckout()" style="display: none;">🛵 ĐẶT MÓN NGAY</button>
        </div>
    </div>

    <script>
        function getTodayString() {
            const now = new Date();
            return `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`;
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // TỔNG CỘNG 9 Ô: 4 Ô MÃ 1K THẬT + 5 Ô QUÀ FAKE (ẨN NGON MIỆNG)
        function createNewBoard() {
            let board = [
                { type: 'REWARD', code: 'KB1K', value: 1, text: 'Mã Giảm 1K', icon: '🎟️' },
                { type: 'REWARD', code: 'KB1K', value: 1, text: 'Mã Giảm 1K', icon: '🎟️' },
                { type: 'REWARD', code: 'KB1K', value: 1, text: 'Mã Giảm 1K', icon: '🎟️' },
                { type: 'REWARD', code: 'KB1K', value: 1, text: 'Mã Giảm 1K', icon: '🎟️' },
                { type: 'FAKE', text: 'Mã 30K', icon: '🎟️' },
                { type: 'FAKE', text: 'Mã 20K', icon: '🎟️' },
                { type: 'FAKE', text: 'Mã 10K', icon: '🎟️' },
                { type: 'FAKE', text: 'Kính Bluetooth', icon: '🕶️' },
                { type: 'FAKE', text: 'Ly free', icon: '🥤' }
            ];
            return shuffleArray(board);
        }

        function getGameState() {
            const today = getTodayString();
            const savedState = localStorage.getItem('kimbling_game_state_v35');
            
            if (savedState) {
                try {
                    const parsed = JSON.parse(savedState);
                    if (parsed && parsed.date === today) {
                        return parsed;
                    }
                } catch(e) {}
            }

            const newState = {
                date: today,
                maxTurnsAllowed: 5,
                gamesPlayed: 0,
                wonCount1K: 0,
                isCurrentGameFinished: false,
                currentBoard: createNewBoard(),
                selectedBoxIndex: null
            };

            localStorage.setItem('kimbling_game_state_v35', JSON.stringify(newState));
            return newState;
        }

        let gameState = getGameState();

        function updateUI() {
            const turnsLeft = Math.max(0, gameState.maxTurnsAllowed - gameState.gamesPlayed);
            document.getElementById('turnBadge').innerText = `Lượt chơi còn lại: ${turnsLeft} lượt`;

            const wonDisplay = document.getElementById('wonPrizesDisplay');
            if (gameState.wonCount1K > 0) {
                wonDisplay.innerText = `🎉 ĐÃ NHẬN MÃ GIẢM 1K (Tự động trừ khi chốt đơn)`;
                wonDisplay.style.color = `#2e7d32`;
            } else {
                wonDisplay.innerText = `🎁 Mở hộp quà - Nhận ưu đãi may mắn ngay!`;
                wonDisplay.style.color = `#e65100`;
            }

            const boxElements = document.querySelectorAll('.box-item');

            if (gameState.isCurrentGameFinished && gameState.selectedBoxIndex !== null) {
                boxElements.forEach((box, idx) => {
                    const item = gameState.currentBoard[idx];
                    if (idx === gameState.selectedBoxIndex) {
                        if (item.type === 'REWARD') {
                            box.innerHTML = `<span style="font-size:28px;">🎉</span><span class="item-title">${item.text}</span>`;
                            box.className = 'box-item user-opened winner-box';
                        } else {
                            box.innerHTML = `<span style="font-size:28px;">😋</span><span class="item-title">Ngon miệng!</span>`;
                            box.className = 'box-item user-opened';
                        }
                    } else {
                        box.innerHTML = `<span style="font-size:22px;">${item.icon}</span><span style="font-size:10px; font-weight:normal;">${item.text}</span>`;
                        box.className = 'box-item auto-revealed';
                    }
                });

                showResultBox();

            } else {
                boxElements.forEach(box => {
                    box.innerHTML = '🎁';
                    box.className = 'box-item';
                });
                document.getElementById('resultBox').style.display = 'none';
            }
        }

        function openBox(index) {
            if (gameState.isCurrentGameFinished || gameState.gamesPlayed >= gameState.maxTurnsAllowed) {
                return;
            }

            gameState.gamesPlayed++;
            gameState.isCurrentGameFinished = true;
            gameState.selectedBoxIndex = index;

            let item = gameState.currentBoard[index];

            if (item.type === 'REWARD') {
                gameState.wonCount1K++;
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            } else {
                // ĐỔI Ô FAKE THÀNH NGON MIỆNG KHI KHÁCH BẤM TRÚNG
                item = { type: 'MISS', text: 'Ngon miệng!', icon: '😋' };
            }

            gameState.currentBoard[index] = item;
            localStorage.setItem('kimbling_game_state_v35', JSON.stringify(gameState));
            updateUI();
        }

        function showResultBox() {
            const resultBox = document.getElementById('resultBox');
            const resultText = document.getElementById('resultText');
            const choiceRow = document.getElementById('choiceRow');
            const btnCloseGame = document.getElementById('btnCloseGameAction');

            const selectedItem = gameState.currentBoard[gameState.selectedBoxIndex];

            let htmlMsg = "";
            if (selectedItem.type === 'REWARD') {
                htmlMsg = `🎉 <b>CHÚC MỪNG BẠN TRÚNG MÃ GIẢM 1K!</b><br>`;
            } else {
                htmlMsg = `😋 <b>Chúc bạn ngon miệng!</b> Thử vận may ở ô tiếp theo nhé!<br>`;
            }

            if (gameState.gamesPlayed < gameState.maxTurnsAllowed) {
                choiceRow.style.display = 'flex';
                btnCloseGame.style.display = 'none';
            } else {
                choiceRow.style.display = 'none';
                btnCloseGame.style.display = 'block';

                if (gameState.wonCount1K > 0) {
                    htmlMsg += `<br>🎉 <b>MÃ GIẢM 1K ĐÃ ĐƯỢC KÍCH HOẠT!</b><br>Tự động áp dụng vào đơn hàng ngay bên dưới!`;
                } else {
                    htmlMsg += `<br>🛵 <b>HOÀN THÀNH ĐƠN HÀNG NGAY</b><br>Để nhận thêm 5 lượt mở hộp quà mới nhé!`;
                }
            }

            resultText.innerHTML = htmlMsg;
            resultBox.style.display = 'block';
        }

        function startNextGame() {
            if (gameState.gamesPlayed >= gameState.maxTurnsAllowed) return;
            
            gameState.isCurrentGameFinished = false;
            gameState.selectedBoxIndex = null;
            gameState.currentBoard = createNewBoard();
            
            localStorage.setItem('kimbling_game_state_v35', JSON.stringify(gameState));
            updateUI();
        }

        function finishFiveTurnsAndCheckout() {
            if (gameState.wonCount1K > 0) {
                dispatchDiscountToMenu('KB1K', 1, 'KB1K_' + Date.now());
            }
            closeGame();
        }

        function dispatchDiscountToMenu(code, value, id) {
            localStorage.setItem('kimbling_applied_discount_code', code);
            localStorage.setItem('kimbling_applied_discount_value', value);
            localStorage.setItem('kimbling_applied_discount_id', id);

            if (window.parent) {
                window.parent.postMessage({ type: 'APPLY_DISCOUNT', code: code, value: value, id: id }, '*');
            }
        }

        function closeGame() {
            if (window.parent) {
                window.parent.postMessage('CLOSE_GAME_POPUP', '*');
            }
        }

        window.addEventListener('message', function(event) {
            if (event.data === 'ADD_BONUS_TURNS') {
                gameState.maxTurnsAllowed += 5; 
                gameState.wonCount1K = 0;
                gameState.isCurrentGameFinished = false;
                gameState.selectedBoxIndex = null;
                gameState.currentBoard = createNewBoard();
                
                localStorage.setItem('kimbling_game_state_v35', JSON.stringify(gameState));
                updateUI();
            }
            if (event.data === 'RESET_GAME_DATA') {
                localStorage.removeItem('kimbling_game_state_v35');
                location.reload();
            }
        });

        updateUI();
    </script>
</body>
</html>
