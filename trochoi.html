<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hộp Quà May Mắn - Kim Bling Coffee & Tea</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: transparent; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 5px; }
.game-card { background: #fff; width: 100%; max-width: 390px; border-radius: 20px; padding: 14px 12px; text-align: center; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
.close-btn { position: absolute; top: 8px; right: 8px; background: #eee; border: none; width: 30px; height: 30px; border-radius: 50%; font-weight: bold; font-size: 15px; cursor: pointer; color: #555; z-index: 10; }
h2 { color: #d32f2f; font-size: 18px; margin-bottom: 2px; margin-top: 2px; font-weight: 800; }
p.subtitle { font-size: 11px; color: #666; margin-bottom: 6px; }

.user-diamond-bar {
  background: linear-gradient(135deg, #2c1810, #1e293b);
  border: 1.5px solid #ff9800;
  border-radius: 12px;
  padding: 8px 10px;
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 4px 10px rgba(255, 152, 0, 0.2);
}

.turn-badge { background: #fff3e0; color: #e65100; font-weight: bold; font-size: 11px; padding: 3px 8px; border-radius: 14px; display: inline-block; margin-bottom: 6px; border: 1.5px solid #ffe0b2; }
.grid-boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
.box-item {
background: linear-gradient(135deg, #ff9800, #f57c00);
color: #fff;
border-radius: 10px;
height: 72px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
font-size: 28px;
cursor: pointer;
transition: all 0.2s ease;
box-shadow: 0 3px 6px rgba(0,0,0,0.18);
user-select: none;
position: relative;
line-height: 1.2;
}
.box-item:active { transform: scale(0.92); }
.box-item.user-opened {
background: #fff8e1 !important;
color: #d84315 !important;
font-size: 11px !important;
font-weight: bold !important;
cursor: default !important;
border: 2px solid #f57c00 !important;
}
.box-item.winner-box {
background: #e0f7fa !important;
color: #00838f !important;
border: 2px solid #00acc1 !important;
animation: shakeWin 0.6s ease-in-out infinite alternate !important;
font-size: 11px !important;
font-weight: bold !important;
}
.box-item.auto-revealed {
background: #f9f9f9 !important;
color: #666 !important;
font-size: 10px !important;
font-weight: 500 !important;
cursor: default !important;
border: 1px dashed #ccc !important;
opacity: 0.85 !important;
}
.box-item span.item-title {
font-size: 10px !important;
font-weight: bold;
margin-top: 2px;
}
@keyframes shakeWin {
0% { transform: rotate(-3deg) scale(1.02); }
100% { transform: rotate(3deg) scale(1.02); }
}
.result-box { display: none; background: #e0f7fa; border: 1.5px dashed #00acc1; padding: 8px 10px; border-radius: 10px; margin-top: 4px; text-align: center; }
.action-choice-row { display: flex; gap: 6px; margin-top: 6px; justify-content: center; }
.btn-choice-next { flex: 1; background: #ff9800; color: #fff; border: none; padding: 8px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
.btn-close-game { background: #28a745; color: #fff; border: none; width: 100%; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; margin-top: 5px; }
</style>
</head>
<body>
<div class="game-card">
<button class="close-btn" onclick="closeGame()">✕</button>
<h2>🎁 HỘP QUÀ MAY MẮN</h2>
<p class="subtitle">Săn Kim Cương 💎 - Mở hộp tích lũy ngay!</p>

<div class="user-diamond-bar">
    <div style="display: flex; align-items: center; gap: 6px; flex: 1; padding-right: 6px;">
        <span style="font-size: 12px; font-weight: bold; color: #ff9800; white-space: nowrap;">💎 Túi 💎:</span>
        <input type="tel" id="gameCustomerPhone" placeholder="Nhập SĐT xem 💎..." maxlength="11" onchange="fetchGameDiamondBalance(this.value)" onkeyup="if(event.key==='Enter') fetchGameDiamondBalance(this.value)" style="background: #0f172a; border: 1px solid #334155; color: #fff; padding: 5px 6px; border-radius: 6px; font-size: 13px !important; width: 100%; outline: none;">
    </div>
    <div id="headerTotalDiamonds" onclick="reloadGameDiamonds()" style="font-size: 15px; font-weight: bold; color: #ff4d4f; background: #0f172a; padding: 4px 8px; border-radius: 8px; border: 1px solid #ff9800; flex-shrink: 0; min-width: 60px; text-align: center; cursor: pointer;" title="Bấm để làm mới số dư">
        0 💎
    </div>
</div>

<div class="turn-badge" id="turnBadge">Lượt chơi: Còn 5 lượt</div>
<div id="wonPrizesDisplay" style="font-size: 11px; color: #00838f; font-weight: bold; margin-bottom: 6px;">👉 Hãy chọn 1 hộp quà bên dưới!</div>

<div class="grid-boxes" id="gridBoxes">
<div class="box-item" onclick="openBox(0)">🎁</div>
<div class="box-item" onclick="openBox(1)">🎁</div>
<div class="box-item" onclick="openBox(2)">🎁</div>
<div class="box-item" onclick="openBox(3)">🎁</div>
<div class="box-item" onclick="openBox(4)">🎁</div>
<div class="box-item" onclick="openBox(5)">🎁</div>
<div class="box-item" onclick="openBox(6)">🎁</div>
<div class="box-item" onclick="openBox(7)">🎁</div>
<div class="box-item" onclick="openBox(8)">🎁</div>
</div>

<div class="result-box" id="resultBox">
<div id="resultText" style="font-size: 12px; line-height: 1.3;"></div>
<div class="action-choice-row" id="choiceRow" style="display: none;">
<button class="btn-choice-next" onclick="startNextGame()">🎮 Mở lượt tiếp theo</button>
</div>
<button class="btn-close-game" id="btnCloseGameAction" onclick="finishFiveTurnsAndCheckout()" style="display: none;">🛵 ĐẶT MÓN NGAY</button>
</div>
</div>

<script>
const KIMBLING_API_URL = "https://script.google.com/macros/s/AKfycbxPxsg3oxHjUsx8KHyOSIYmjXZw9rY9GFQYf0cHNK3JmBsfdYMJ21PQdhg43HP787GIDQ/exec";

function getTodayString() {
const now = new Date();
return `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`;
}

function shuffleArray(array) {
let arr = [...array];
for (let i = arr.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[arr[i], arr[j]] = [arr[j], arr[i]];
}
return arr;
}

function createNewBoard(currentWonTotal) {
let board = [
{ type: 'DIAMOND', value: 3, text: '+3 Kim Cương', icon: '💎' },
{ type: 'DIAMOND', value: 2, text: '+2 Kim Cương', icon: '💎' },
{ type: 'DIAMOND', value: 1, text: '+1 Kim Cương', icon: '💎' },
{ type: 'FAKE', text: '300 Kim Cương', icon: '💎' },
{ type: 'FAKE', text: '200 Kim Cương', icon: '💎' },
{ type: 'FAKE', text: '100 Kim Cương', icon: '💎' },
{ type: 'FAKE', text: 'Voucher 50K', icon: '🎟️' },
{ type: 'FAKE', text: 'Kính Bluetooth', icon: '🕶️' }
];
const isTenDiamondLucky = Math.random() < 0.05;
if (isTenDiamondLucky && (currentWonTotal + 10 <= 10)) {
board.push({ type: 'DIAMOND', value: 10, text: '+10 Kim Cương', icon: '💎' });
} else {
board.push({ type: 'FAKE', text: 'Ly Free', icon: '🥤' });
}
return shuffleArray(board);
}

function getGameState() {
const today = getTodayString();
const savedState = localStorage.getItem('kimbling_game_state_v45');
if (savedState) {
try {
const parsed = JSON.parse(savedState);
if (parsed && parsed.date === today) return parsed;
} catch(e) {}
}
const newState = {
date: today, maxTurnsAllowed: 5, gamesPlayed: 0,
wonDiamondsTotal: 0, isCurrentGameFinished: false,
currentBoard: createNewBoard(0), selectedBoxIndex: null
};
localStorage.setItem('kimbling_game_state_v45', JSON.stringify(newState));
return newState;
}

let gameState = getGameState();
let sessionAddedDiamonds =[span_4](start_span)[span_4](end_span); // Biến lưu tạm điểm kiếm được trong phiên chơi hiện tại

function getUserRealDiamonds() {
  return parseInt(localStorage.getItem('kim_bling_user_diamonds') || '0');
}

function updateHeaderDiamondDisplay() {
  let currentAccountDiamonds = getUserRealDiamonds();
  document.getElementById('headerTotalDiamonds').innerText = `${currentAccountDiamonds.toLocaleString('vi-VN')} 💎`;
}

function initGamePhoneAndBalance() {
  const phoneInput = document.getElementById('gameCustomerPhone');
  let savedPhone = localStorage.getItem('kimbling_cust_phone') || localStorage.getItem('kb_customer_phone') || '';
  if (phoneInput && savedPhone) {
    phoneInput.value = savedPhone;
    fetchGameDiamondBalance(savedPhone);
  } else {
    updateHeaderDiamondDisplay();
  }
  updateUI();
}

async function fetchGameDiamondBalance(phone) {
    const cleanPhone = String(phone || '').trim();
    const displayEl = document.getElementById('headerTotalDiamonds');
    if (!cleanPhone || cleanPhone.length < 9) {
        if (displayEl) displayEl.innerText = "0 💎";
        return;
    }

    localStorage.setItem('kb_customer_phone', cleanPhone);
    localStorage.setItem('kimbling_cust_phone', cleanPhone);
    
    if (displayEl) displayEl.innerText = "⏳...";

    try {
        let res = await fetch(`${KIMBLING_API_URL}?type=adminGetCustomerInfo&phone=${encodeURIComponent(cleanPhone)}`);
        let data = await res.json();
        let balance = (data && data.hatKim) ? parseInt(data.hatKim, 10) : 0;
        localStorage.setItem('kim_bling_user_diamonds', balance);
        if (displayEl) displayEl.innerText = balance.toLocaleString('vi-VN') + " 💎";
        
        if (window.parent) {
            window.parent.postMessage({ type: 'ADD_USER_DIAMONDS_SUCCESS', totalDiamonds: balance, added: 0 }, '*');
        }
    } catch (e) {
        updateHeaderDiamondDisplay();
    }
}

function reloadGameDiamonds() {
    const phoneInput = document.getElementById('gameCustomerPhone');
    if (phoneInput && phoneInput.value.trim()) {
        fetchGameDiamondBalance(phoneInput.value.trim());
    } else {
        alert("Vui lòng nhập số điện thoại trước khi bấm làm mới số dư!");
        if (phoneInput) phoneInput.focus();
    }
}

function updateUI() {
const turnsLeft = Math.max(0, gameState.maxTurnsAllowed - gameState.gamesPlayed);
document.getElementById('turnBadge').innerText = `Lượt chơi còn lại: ${turnsLeft} lượt`;
updateHeaderDiamondDisplay();

const wonDisplay = document.getElementById('wonPrizesDisplay');
if (gameState.wonDiamondsTotal > 0) {
wonDisplay.innerText = `🎉 Vừa mở trúng: Tổng +${gameState.wonDiamondsTotal} 💎 phiên này`;
wonDisplay.style.color = `#00838f`;
} else {
wonDisplay.innerText = `👉 Hãy chọn 1 hộp quà bên dưới!`;
wonDisplay.style.color = `#e65100`;
}

const boxElements = document.querySelectorAll('.box-item');
if (gameState.isCurrentGameFinished && gameState.selectedBoxIndex !== null) {
boxElements.forEach((box, idx) => {
const item = gameState.currentBoard[idx];
if (idx === gameState.selectedBoxIndex) {
if (item.type === 'DIAMOND') {
box.innerHTML = `<span style="font-size:20px;">💎</span><span class="item-title">${item.text}</span>`;
box.className = 'box-item user-opened winner-box';
} else {
box.innerHTML = `<span style="font-size:20px;">😋</span><span class="item-title">Ngon miệng!</span>`;
box.className = 'box-item user-opened';
}
} else {
box.innerHTML = `<span style="font-size:16px;">${item.icon}</span><span style="font-size:9px; font-weight:normal;">${item.text}</span>`;
box.className = 'box-item auto-revealed';
}
});
showResultBox();
} else {
boxElements.forEach(box => {
box.innerHTML = '🎁';
box.className = 'box-item';
});
document.getElementById('resultBox').style.display = 'none';
}
}

// 🎁 MỞ HỘP QUÀ: CỘNG NHANH VÀO BỘ NHỚ MÁY TRƯỚC
function openBox(index) {
const phoneInput = document.getElementById('gameCustomerPhone');
if (!phoneInput || !phoneInput.value.trim()) {
    alert("⚠️ Vui lòng nhập số điện thoại của bạn ở ô phía trên trước khi mở hộp quà!");
    phoneInput.focus();
    return;
}

if (gameState.isCurrentGameFinished || gameState.gamesPlayed >= gameState.maxTurnsAllowed) return;
gameState.gamesPlayed++;
gameState.isCurrentGameFinished = true;
gameState.selectedBoxIndex = index;
let item = gameState.currentBoard[index];
let exactWonThisTurn = 0;

if (item.type === 'DIAMOND') {
if (gameState.wonDiamondsTotal >= 10 || (gameState.wonDiamondsTotal + item.value > 10)) {
item = { type: 'MISS', text: 'Ngon miệng!', icon: '😋' };
} else {
exactWonThisTurn = item.value;
gameState.wonDiamondsTotal += item.value;
sessionAddedDiamonds += item.value; // Tích lũy vào biến tạm trong phiên[span_5](start_span)[span_5](end_span)
if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
}
} else {
item = { type: 'MISS', text: 'Ngon miệng!', icon: '😋' };
}

gameState.currentBoard[index] = item;
localStorage.setItem('kimbling_game_state_v45', JSON.stringify(gameState));

// Cộng thẳng siêu tốc vào bộ nhớ máy để khách thấy tăng điểm ngay lập tức
let currentAccountDiamonds = getUserRealDiamonds();
let newTotalDiamonds = currentAccountDiamonds + exactWonThisTurn;
localStorage.setItem('kim_bling_user_diamonds', newTotalDiamonds);

if (window.parent) {
window.parent.postMessage({ type: 'ADD_USER_DIAMONDS_SUCCESS', totalDiamonds: newTotalDiamonds, added: exactWonThisTurn }, '*');
}

updateUI();
}

function showResultBox() {
const resultBox = document.getElementById('resultBox');
const resultText = document.getElementById('resultText');
const choiceRow = document.getElementById('choiceRow');
const btnCloseGame = document.getElementById('btnCloseGameAction');
const selectedItem = gameState.currentBoard[gameState.selectedBoxIndex];
let htmlMsg = "";

if (selectedItem.type === 'DIAMOND') {
htmlMsg = `🎉 <b>CHÚC MỪNG! BẠN NHẬN ĐƯỢC <span style="color:#d32f2f;">+${selectedItem.value} 💎</span></b><br>`;
} else {
htmlMsg = `😋 <b>Chúc bạn ngon miệng!</b> Ô này không có kim cương nhé.<br>`;
}

if (gameState.gamesPlayed < gameState.maxTurnsAllowed) {
choiceRow.style.display = 'flex';
btnCloseGame.style.display = 'none';
} else {
choiceRow.style.display = 'none';
btnCloseGame.style.display = 'block';
htmlMsg += `<br>✨ <b>Đã hoàn thành 5 lượt chơi!</b> Bấm đặt món để lưu kết quả nhé.`;
}
resultText.innerHTML = htmlMsg;
resultBox.style.display = 'block';
}

function startNextGame() {
if (gameState.gamesPlayed >= gameState.maxTurnsAllowed) return;
gameState.isCurrentGameFinished = false;
gameState.selectedBoxIndex = null;
gameState.currentBoard = createNewBoard(gameState.wonDiamondsTotal);
localStorage.setItem('kimbling_game_state_v45', JSON.stringify(gameState));
updateUI();
}

// 🚀 ĐỒNG BỘ DỮ LIỆU CUỐI CÙNG LÊN CLOUD KHI THOÁT GAME HOẶC ĐẶT MÓN
async function syncRewardsToCloudAndExit() {
if (sessionAddedDiamonds > 0) {
let customerPhone = document.getElementById('gameCustomerPhone').value.trim();
if (customerPhone) {
try {
await fetch(KIMBLING_API_URL, {
method: 'POST',
mode: 'no-cors',
headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
body: JSON.stringify({
action: 'add_hatkim',
type: 'add_hatkim',
phone: customerPhone,
amount: sessionAddedDiamonds
})
});
} catch (e) {}
}
sessionAddedDiamonds = 0; 
}
localStorage.removeItem('kimbling_game_state_v45');
closeGame();
}

function finishFiveTurnsAndCheckout() {
syncRewardsToCloudAndExit();
}

// Khi khách bấm nút X đóng game ngang ➔ Tự động bắn dữ liệu đồng bộ chốt hạ
function closeGame() {
if (sessionAddedDiamonds > 0) {
let customerPhone = document.getElementById('gameCustomerPhone').value.trim();
if (customerPhone) {
navigator.sendBeacon ? navigator.sendBeacon(KIMBLING_API_URL, JSON.stringify({ action: 'add_hatkim', type: 'add_hatkim', phone: customerPhone, amount: sessionAddedDiamonds })) : null;
}
sessionAddedDiamonds = 0;
}
localStorage.removeItem('kimbling_game_state_v45');

if (window.parent) {
window.parent.postMessage('CLOSE_GAME_POPUP', '*');
}
}

// Lắng nghe SĐT và Lệnh Reset từ trang chủ menu.html truyền sang
window.addEventListener('message', function(event) {
    if (event.data && event.data.type === 'SYNC_CUSTOMER_PHONE' && event.data.phone) {
        const phoneInput = document.getElementById('gameCustomerPhone');
        if (phoneInput) {
            phoneInput.value = event.data.phone;
            fetchGameDiamondBalance(event.data.phone);
        }
    }
    if (event.data === 'RESET_GAME_DATA') {
        localStorage.removeItem('kimbling_game_state_v45');
        sessionAddedDiamonds = 0;
        location.reload();
    }
});

initGamePhoneAndBalance();
</script>
</body>
</html>
