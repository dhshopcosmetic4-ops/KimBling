<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hộp Quà May Mắn - Kim Bling Coffee & Tea</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: transparent; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 5px; }
        
        .game-card { background: #fff; width: 100%; max-width: 390px; border-radius: 20px; padding: 16px 14px; text-align: center; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .close-btn { position: absolute; top: 10px; right: 10px; background: #eee; border: none; width: 32px; height: 32px; border-radius: 50%; font-weight: bold; font-size: 16px; cursor: pointer; color: #555; z-index: 10; }
        
        h2 { color: #d32f2f; font-size: 20px; margin-bottom: 3px; margin-top: 2px; font-weight: 800; }
        p.subtitle { font-size: 12px; color: #666; margin-bottom: 8px; }
        .turn-badge { background: #fff3e0; color: #e65100; font-weight: bold; font-size: 13px; padding: 4px 12px; border-radius: 14px; display: inline-block; margin-bottom: 8px; border: 1.5px solid #ffe0b2; }

        .grid-boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
        
        .box-item { 
            background: linear-gradient(135deg, #ff9800, #f57c00); 
            color: #fff; 
            border-radius: 12px; 
            height: 88px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            font-size: 34px; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            box-shadow: 0 3px 6px rgba(0,0,0,0.18); 
            user-select: none; 
            position: relative; 
            line-height: 1.2;
        }
        .box-item:active { transform: scale(0.92); }
        
        .box-item.user-opened { 
            background: #fff8e1 !important; 
            color: #d84315 !important; 
            font-size: 13px !important; 
            font-weight: bold !important; 
            cursor: default !important; 
            border: 2.5px solid #f57c00 !important; 
        }
        .box-item.winner-box { 
            background: #e8f5e9 !important; 
            color: #2e7d32 !important; 
            border: 2.5px solid #2e7d32 !important; 
            animation: shakeWin 0.6s ease-in-out infinite alternate !important; 
            font-size: 13px !important; 
            font-weight: bold !important; 
        }
        
        .box-item.auto-revealed { 
            background: #f9f9f9 !important; 
            color: #666 !important; 
            font-size: 11px !important; 
            font-weight: 500 !important; 
            cursor: default !important; 
            border: 1px dashed #ccc !important; 
            opacity: 0.85 !important; 
        }

        .box-item span.item-title {
            font-size: 12px !important;
            font-weight: bold;
            margin-top: 3px;
        }

        @keyframes shakeWin {
            0% { transform: rotate(-3deg) scale(1.02); }
            100% { transform: rotate(3deg) scale(1.02); }
        }

        .result-box { display: none; background: #e8f5e9; border: 1.5px dashed #2e7d32; padding: 10px 12px; border-radius: 12px; margin-top: 6px; text-align: center; }
        .action-choice-row { display: flex; gap: 8px; margin-top: 8px; justify-content: center; }
        .btn-choice-apply { flex: 1; background: #28a745; color: #fff; border: none; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-choice-next { flex: 1; background: #ff9800; color: #fff; border: none; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-close-game { background: #28a745; color: #fff; border: none; width: 100%; padding: 11px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; margin-top: 6px; display: none; }
    </style>
</head>
<body>

    <div class="game-card">
        <button class="close-btn" onclick="closeGame()">✕</button>
        <h2>🎁 HỘP QUÀ MAY MẮN</h2>
        <p class="subtitle">Mỗi ngày 5 game - Mở 1 ô nhận ưu đãi cực hot!</p>
        <div class="turn-badge" id="turnBadge">Hôm nay: Còn 5/5 game</div>
        <div id="wonPrizesDisplay" style="font-size: 12px; color: #2e7d32; font-weight: bold; margin-bottom: 8px;">Mã chưa dùng: Trống</div>

        <div class="grid-boxes" id="gridBoxes">
            <div class="box-item" onclick="openBox(0)">🎁</div>
            <div class="box-item" onclick="openBox(1)">🎁</div>
            <div class="box-item" onclick="openBox(2)">🎁</div>
            <div class="box-item" onclick="openBox(3)">🎁</div>
            <div class="box-item" onclick="openBox(4)">🎁</div>
            <div class="box-item" onclick="openBox(5)">🎁</div>
            <div class="box-item" onclick="openBox(6)">🎁</div>
            <div class="box-item" onclick="openBox(7)">🎁</div>
            <div class="box-item" onclick="openBox(8)">🎁</div>
        </div>

        <div class="result-box" id="resultBox">
            <div id="resultText" style="font-size: 13px; line-height: 1.4;"></div>
            <div class="action-choice-row" id="choiceRow" style="display: none;">
                <button class="btn-choice-apply" id="btnApplyReward" onclick="applyWonRewardNow()">✅ Áp dụng ngay</button>
                <button class="btn-choice-next" id="btnNextGameText" onclick="startNextGame()">🎮 Chơi tiếp game sau</button>
            </div>
            <button class="btn-close-game" id="btnCloseGameAction" onclick="closeGame()">🛵 ĐẶT MÓN NGAY</button>
        </div>
    </div>

    <script>
        const MAX_GAMES = 5;

        function getTodayString() {
            const now = new Date();
            return `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`;
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function createNewBoard() {
            let board = [
                { type: 'FAKE', text: 'Kính Bluetooth', icon: '🕶️' },
                { type: 'FAKE', text: 'Ly free', icon: '🥤' },
                { type: 'FAKE', text: 'Mã 10K', icon: '🎟️' },
                { type: 'FAKE', text: 'Mã 8K', icon: '🎟️' },
                { type: 'REWARD', code: 'KB3K', value: 3, text: 'Mã Giảm 3K', icon: '🎟️' },
                { type: 'REWARD', code: 'KB2K', value: 2, text: 'Mã Giảm 2K', icon: '🎟️' },
                { type: 'REWARD', code: 'KB1K', value: 1, text: 'Mã Giảm 1K', icon: '🎟️' },
                { type: 'MISS', text: 'Ngon miệng!', icon: '😋' },
                { type: 'MISS', text: 'Ngon miệng!', icon: '😋' }
            ];
            return shuffleArray(board);
        }

        function getGameState() {
            const today = getTodayString();
            const savedState = localStorage.getItem('kimbling_game_state_v22');
            
            if (savedState) {
                try {
                    const parsed = JSON.parse(savedState);
                    if (parsed && parsed.date === today) {
                        return parsed;
                    }
                } catch(e) {}
            }

            const newState = {
                date: today,
                gamesPlayed: 0,
                isCurrentGameFinished: false,
                currentBoard: createNewBoard(),
                selectedBoxIndex: null,
                unusedPrizes: [], // Kho chứa các mã trúng chưa sử dụng trong ngày
                lastWonPrize: null // Lưu vết mã trúng gần nhất
            };

            localStorage.setItem('kimbling_game_state_v22', JSON.stringify(newState));
            return newState;
        }

        let gameState = getGameState();

        function updateUI() {
            const gamesLeft = Math.max(0, MAX_GAMES - gameState.gamesPlayed);
            document.getElementById('turnBadge').innerText = `Hôm nay: Còn ${gamesLeft}/${MAX_GAMES} game`;

            let unusedText = "Trống";
            if (gameState.unusedPrizes && gameState.unusedPrizes.length > 0) {
                unusedText = gameState.unusedPrizes.map(p => `${p.text}`).join(', ');
            }
            document.getElementById('wonPrizesDisplay').innerText = `Mã chưa dùng: ${unusedText}`;

            const boxElements = document.querySelectorAll('.box-item');

            if (gameState.isCurrentGameFinished && gameState.selectedBoxIndex !== null) {
                boxElements.forEach((box, idx) => {
                    const item = gameState.currentBoard[idx];
                    if (idx === gameState.selectedBoxIndex) {
                        if (item.type === 'REWARD') {
                            box.innerHTML = `<span style="font-size:28px;">🎉</span><span class="item-title">${item.text}</span>`;
                            box.className = 'box-item user-opened winner-box';
                        } else {
                            box.innerHTML = `<span style="font-size:28px;">😋</span><span class="item-title">Ngon miệng!</span>`;
                            box.className = 'box-item user-opened';
                        }
                    } else {
                        box.innerHTML = `<span style="font-size:22px;">${item.icon}</span><span style="font-size:10px; font-weight:normal;">${item.text}</span>`;
                        box.className = 'box-item auto-revealed';
                    }
                });

                const selectedItem = gameState.currentBoard[gameState.selectedBoxIndex];
                if (selectedItem.type === 'REWARD') {
                    showResultBox(`🎉 <b>CHÚC MỪNG BẠN TRÚNG ${selectedItem.text.toUpperCase()}!</b><br>Bạn muốn áp mã vào đơn ngay hay chơi tiếp?`, true);
                } else {
                    showResultBox(`😋 <b>Chúc bạn ngon miệng!</b> Trượt mất rồi.<br>Đã hé lộ vị trí 8 ô còn lại trên bàn cờ.`, false);
                }

            } else {
                boxElements.forEach(box => {
                    box.innerHTML = '🎁';
                    box.className = 'box-item';
                });
                document.getElementById('resultBox').style.display = 'none';
            }
        }

        function openBox(index) {
            if (gameState.isCurrentGameFinished || gameState.gamesPlayed >= MAX_GAMES) {
                return;
            }

            gameState.gamesPlayed++;
            gameState.isCurrentGameFinished = true;
            gameState.selectedBoxIndex = index;

            let item = gameState.currentBoard[index];

            // 1. Swap Quà FAKE sang ô MISS
            if (item.type === 'FAKE') {
                const fakeItemCopy = { ...item };
                let missIndex = gameState.currentBoard.findIndex((b, i) => i !== index && b.type === 'MISS');
                if (missIndex !== -1) {
                    gameState.currentBoard[missIndex] = fakeItemCopy;
                }
                item = { type: 'MISS', text: 'Ngon miệng!', icon: '😋' };
            }

            // 2. Tỉ lệ 3K siêu hiếm (1%)
            if (item.code === 'KB3K') {
                const isSuperLucky = Math.random() < 0.01;
                if (!isSuperLucky) {
                    item = { type: 'REWARD', code: 'KB1K', value: 1, text: 'Mã Giảm 1K', icon: '🎟️' };
                }
            }

            // 3. Game 5 ép trúng Mã 1K nếu chưa có mã nào
            if (gameState.gamesPlayed >= MAX_GAMES && gameState.unusedPrizes.length === 0 && item.type !== 'REWARD') {
                item = { type: 'REWARD', code: 'KB1K', value: 1, text: 'Mã Giảm 1K', icon: '🎟️' };
            }

            gameState.currentBoard[index] = item;

            if (item.type === 'REWARD') {
                // Thêm vào danh sách mã chưa dùng
                gameState.unusedPrizes.push(item);
                gameState.lastWonPrize = item;
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

                showResultBox(`🎉 <b>CHÚC MỪNG BẠN TRÚNG ${item.text.toUpperCase()}!</b><br>Bạn muốn áp mã vào đơn ngay hay chơi tiếp?`, true);
            } else {
                showResultBox(`😋 <b>Chúc bạn ngon miệng!</b> Trượt mất rồi.<br>Đã hé lộ vị trí 8 ô còn lại trên bàn cờ.`, false);
            }

            // TỰ ĐỘNG BẢO TOÀN MÃ CAO NHẤT KHI HẾT 5 LƯỢT MÀ CHƯA ÁP DỤNG
            if (gameState.gamesPlayed >= MAX_GAMES && gameState.unusedPrizes.length > 0) {
                autoApplyBestAvailablePrize();
            }

            localStorage.setItem('kimbling_game_state_v22', JSON.stringify(gameState));
            updateUI();
        }

        function showResultBox(htmlText, isReward) {
            const resultBox = document.getElementById('resultBox');
            document.getElementById('resultText').innerHTML = htmlText;

            const choiceRow = document.getElementById('choiceRow');
            const btnApply = document.getElementById('btnApplyReward');
            const btnNext = document.getElementById('btnNextGameText');
            const btnCloseGame = document.getElementById('btnCloseGameAction');

            if (gameState.gamesPlayed < MAX_GAMES) {
                choiceRow.style.display = 'flex';
                btnCloseGame.style.display = 'none';

                if (isReward) {
                    btnApply.style.display = 'block';
                    btnNext.style.width = 'auto';
                } else {
                    btnApply.style.display = 'none';
                    btnNext.style.width = '100%';
                }
            } else {
                // Khi hết 5 lượt
                choiceRow.style.display = 'none';
                btnCloseGame.style.display = 'block';
            }
            resultBox.style.display = 'block';
        }

        // Tự động tìm mã cao nhất chưa dùng để add vào đơn hàng khi kết thúc game
        function autoApplyBestAvailablePrize() {
            if (gameState.unusedPrizes.length === 0) return;

            let best = gameState.unusedPrizes.reduce((prev, current) => (prev.value > current.value) ? prev : current);
            
            // Gửi mã tốt nhất về đơn hàng
            dispatchDiscountToMenu(best.code, best.value);

            // Cập nhật thông báo rõ ràng cho khách
            setTimeout(() => {
                const resultText = document.getElementById('resultText');
                if (resultText) {
                    resultText.innerHTML += `<br><div style="background:#d4edda; color:#155724; padding:8px; border-radius:8px; margin-top:6px; font-weight:bold; font-size:12px;">🌟 Đã tự động áp dụng mã tốt nhất (${best.text}) từ các lượt chơi cho đơn hàng của bạn!</div>`;
                }
            }, 100);
        }

        function applyWonRewardNow() {
            if (!gameState.lastWonPrize) return;

            const appliedItem = gameState.lastWonPrize;

            // 1. Áp dụng mã vừa trúng cho đơn hàng
            dispatchDiscountToMenu(appliedItem.code, appliedItem.value);

            // 2. XÓA MÃ NÀY KHỎI KHO CHƯA DÙNG (Mã biến mất sau khi áp dụng)
            const idx = gameState.unusedPrizes.findIndex(p => p.code === appliedItem.code);
            if (idx !== -1) {
                gameState.unusedPrizes.splice(idx, 1);
            }
            gameState.lastWonPrize = null;

            localStorage.setItem('kimbling_game_state_v22', JSON.stringify(gameState));
            
            alert(`✅ Đã áp dụng ${appliedItem.text} vào đơn hàng thành công!`);
            closeGame();
        }

        function dispatchDiscountToMenu(code, value) {
            localStorage.setItem('kimbling_applied_discount_code', code);
            localStorage.setItem('kimbling_applied_discount_value', value);

            if (window.parent) {
                window.parent.postMessage({ type: 'APPLY_DISCOUNT', code: code, value: value }, '*');
            }
        }

        function startNextGame() {
            if (gameState.gamesPlayed >= MAX_GAMES) return;
            
            gameState.isCurrentGameFinished = false;
            gameState.selectedBoxIndex = null;
            gameState.currentBoard = createNewBoard();
            
            localStorage.setItem('kimbling_game_state_v22', JSON.stringify(gameState));
            updateUI();
        }

        function closeGame() {
            if (window.parent) {
                window.parent.postMessage('CLOSE_GAME_POPUP', '*');
            }
        }

        window.addEventListener('message', function(event) {
            if (event.data === 'RESET_GAME_DATA') {
                localStorage.removeItem('kimbling_game_state_v22');
                location.reload();
            }
        });

        updateUI();
    </script>
</body>
</html>
