<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hộp Quà May Mắn - Kim Bling Coffee & Tea</title>
<!-- Thư viện Canvas Confetti để làm hiệu ứng pháo hoa / hoa giấy tung tóe -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: transparent; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 5px; }
.game-card { background: #fff; width: 100%; max-width: 390px; border-radius: 20px; padding: 14px 12px; text-align: center; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow: hidden; }
.close-btn { position: absolute; top: 8px; right: 8px; background: #eee; border: none; width: 30px; height: 30px; border-radius: 50%; font-weight: bold; font-size: 15px; cursor: pointer; color: #555; z-index: 10; }
h2 { color: #d32f2f; font-size: 18px; margin-bottom: 2px; margin-top: 2px; font-weight: 800; }
p.subtitle { font-size: 11px; color: #666; margin-bottom: 6px; }

/* KHUNG ĐĂNG NHẬP / XÁC THỰC BẮT BUỘC */
.auth-container {
  background: #f8fafc;
  border: 1.5px dashed #cbd5e1;
  border-radius: 12px;
  padding: 15px 10px;
  margin: 10px 0;
}
.auth-input-phone {
  background: #ffffff;
  border: 1.5px solid #ff9800;
  color: #0f172a;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 14px !important;
  width: 100%;
  outline: none;
  text-align: center;
  font-weight: bold;
  margin-bottom: 8px;
}
.btn-verify-phone {
  background: linear-gradient(135deg, #ff9800, #f57c00);
  color: #fff;
  border: none;
  width: 100%;
  padding: 9px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 3px 6px rgba(255, 152, 0, 0.3);
}
.btn-verify-phone:active { transform: scale(0.98); }
.auth-status-msg { font-size: 11px; color: #d32f2f; margin-top: 6px; font-weight: bold; }

/* KHUNG GAME CHÍNH (BỊ ẨN KHI CHƯA ĐĂNG NHẬP) */
#gameMainWrapper { display: none; }

.user-diamond-bar {
  background: linear-gradient(135deg, #2c1810, #1e293b);
  border: 1.5px solid #ff9800;
  border-radius: 12px;
  padding: 8px 10px;
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 4px 10px rgba(255, 152, 0, 0.2);
}

.turn-badge { background: #fff3e0; color: #e65100; font-weight: bold; font-size: 11px; padding: 3px 8px; border-radius: 14px; display: inline-block; margin-bottom: 6px; border: 1.5px solid #ffe0b2; }
.grid-boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
.box-item {
background: linear-gradient(135deg, #ff9800, #f57c00);
color: #fff;
border-radius: 10px;
height: 72px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
font-size: 28px;
cursor: pointer;
transition: all 0.2s ease;
box-shadow: 0 3px 6px rgba(0,0,0,0.18);
user-select: none;
position: relative;
line-height: 1.2;
}
.box-item:active { transform: scale(0.92); }
.box-item.user-opened {
background: #fff8e1 !important;
color: #d84315 !important;
font-size: 11px !important;
font-weight: bold !important;
cursor: default !important;
border: 2px solid #f57c00 !important;
}
.box-item.winner-box {
background: #e0f7fa !important;
color: #00838f !important;
border: 2px solid #00acc1 !important;
animation: shakeWin 0.6s ease-in-out infinite alternate !important;
font-size: 11px !important;
font-weight: bold !important;
}
.box-item.auto-revealed {
background: #f9f9f9 !important;
color: #666 !important;
font-size: 10px !important;
font-weight: 500 !important;
cursor: default !important;
border: 1px dashed #ccc !important;
opacity: 0.85 !important;
}
.box-item span.item-title {
font-size: 10px !important;
font-weight: bold;
margin-top: 2px;
}
@keyframes shakeWin {
0% { transform: rotate(-3deg) scale(1.02); }
100% { transform: rotate(3deg) scale(1.02); }
}
.result-box { display: none; background: #e0f7fa; border: 1.5px dashed #00acc1; padding: 8px 10px; border-radius: 10px; margin-top: 4px; text-align: center; }
.action-choice-row { display: flex; gap: 6px; margin-top: 6px; justify-content: center; }
.btn-choice-next { flex: 1; background: #ff9800; color: #fff; border: none; padding: 8px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
.btn-close-game { background: #28a745; color: #fff; border: none; width: 100%; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; margin-top: 5px; }
</style>
</head>
<body>
<div class="game-card">
<button class="close-btn" onclick="closeGame()">✕</button>
<h2>🎁 HỘP QUÀ MAY MẮN</h2>
<p class="subtitle">Săn Kim Cương 💎 - Mở hộp tích lũy ngay!</p>

<!-- 1. KHUNG XÁC THỰC SỐ ĐIỆN THOẠI (BẮT BUỘC MỞ ĐẦU) -->
<div class="auth-container" id="authBoxContainer">
    <p style="font-size: 12px; color: #475569; margin-bottom: 8px; font-weight: 600;">📱 Nhập SĐT để mở khóa trò chơi:</p>
    <input type="tel" id="gameCustomerPhone" class="auth-input-phone" placeholder="Nhập số điện thoại..." maxlength="11" onkeyup="if(event.key==='Enter') executePhoneAuthentication()">
    <button class="btn-verify-phone" id="btnVerifyPhoneAction" onclick="executePhoneAuthentication()">🔓 Xác thực & Mở khoá</button>
    <div class="auth-status-msg" id="authStatusMessage"></div>
</div>

<!-- 2. GIAO DIỆN CHÍNH CỦA TRÒ CHƠI (BỊ ẨN HOÀN TOÀN TỚI KHI XÁC THỰC THÀNH CÔNG) -->
<div id="gameMainWrapper">
    <div class="user-diamond-bar">
        <div style="display: flex; align-items: center; gap: 6px; flex: 1; padding-right: 6px;">
            <span style="font-size: 12px; font-weight: bold; color: #ff9800; white-space: nowrap;">💎 Túi 💎:</span>
            <span id="displayAuthenticatedPhone" style="font-size: 13px; font-weight: bold; color: #fff;">0900000000</span>
        </div>
        <div id="headerTotalDiamonds" onclick="reloadGameDiamonds()" style="font-size: 15px; font-weight: bold; color: #ff4d4f; background: #0f172a; padding: 4px 8px; border-radius: 8px; border: 1px solid #ff9800; flex-shrink: 0; min-width: 60px; text-align: center; cursor: pointer;" title="Bấm để làm mới số dư">
            0 💎
        </div>
    </div>

    <div class="turn-badge" id="turnBadge">Lượt chơi: Còn 5 lượt</div>
    <div id="wonPrizesDisplay" style="font-size: 11px; color: #00838f; font-weight: bold; margin-bottom: 6px;">👉 Hãy chọn 1 hộp quà bên dưới!</div>

    <div class="grid-boxes" id="gridBoxes">
    <div class="box-item" onclick="playSoundClick(); openBox(0)">🎁</div>
    <div class="box-item" onclick="playSoundClick(); openBox(1)">🎁</div>
    <div class="box-item" onclick="playSoundClick(); openBox(2)">🎁</div>
    <div class="box-item" onclick="playSoundClick(); openBox(3)">🎁</div>
    <div class="box-item" onclick="playSoundClick(); openBox(4)">🎁</div>
    <div class="box-item" onclick="playSoundClick(); openBox(5)">🎁</div>
    <div class="box-item" onclick="playSoundClick(); openBox(6)">🎁</div>
    <div class="box-item" onclick="playSoundClick(); openBox(7)">🎁</div>
    <div class="box-item" onclick="playSoundClick(); openBox(8)">🎁</div>
    </div>

    <div class="result-box" id="resultBox">
    <div id="resultText" style="font-size: 12px; line-height: 1.3;"></div>
    <div class="action-choice-row" id="choiceRow" style="display: none;">
    <button class="btn-choice-next" onclick="playSoundClick(); startNextGame()">🎮 Mở lượt tiếp theo</button>
    </div>
    <button class="btn-close-game" id="btnCloseGameAction" onclick="playSoundClick(); finishFiveTurnsAndCheckout()" style="display: none;">🛵 ĐẶT MÓN NGAY ĐỂ NHẬN THÊM LƯỢT</button>
    </div>
</div>
</div>

<script>
const KIMBLING_API_URL = "https://script.google.com/macros/s/AKfycbxPxsg3oxHjUsx8KHyOSIYmjXZw9rY9GFQYf0cHNK3JmBsfdYMJ21PQdhg43HP787GIDQ/exec";
const MAX_TURNS_ALLOWED = 5;

let userPhone = "";
let turnsPlayed = 0; 
let currentDiamondsBalance = 0;

// ================= HỆ THỐNG ÂM THANH BẰNG WEB AUDIO API =================
let audioCtx = null;
function getAudioContext() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    return audioCtx;
}

// 1. Âm thanh khi bấm vào chọn ô (Tiếng "Ting" ngắn thanh nhã)
function playSoundClick() {
    try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
    } catch(e) {}
}

// 2. Âm thanh chúc mừng chiến thắng (Giai điệu vui tươi nốt cao)
function playSoundVictory() {
    try {
        const ctx = getAudioContext();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // Đồ, Mi, Sol, Đồ cao
        notes.forEach((freq, index) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            const startTime = ctx.currentTime + (index * 0.12);
            gain.gain.setValueAtTime(0.2, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + 0.3);
        });
    } catch(e) {}
}

// 3. Âm thanh buồn khi trúng ô "Ngon miệng" (Giai điệu trầm đi xuống)
function playSoundSad() {
    try {
        const ctx = getAudioContext();
        const notes = [300, 250, 200]; 
        notes.forEach((freq, index) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.value = freq;
            const startTime = ctx.currentTime + (index * 0.15);
            gain.gain.setValueAtTime(0.15, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + 0.25);
        });
    } catch(e) {}
}

// ================= HIỆU ỨNG PHÁO HOA TUNG TÓE =================
function triggerFireworks() {
    try {
        // Pháo hoa bung từ hai bên và chính giữa
        confetti({
            particleCount: 80,
            spread: 70,
            origin: { y: 0.6 }
        });
        setTimeout(() => {
            confetti({
                particleCount: 50,
                angle: 60,
                spread: 55,
                origin: { x: 0 }
            });
        }, 250);
        setTimeout(() => {
            confetti({
                particleCount: 50,
                angle: 120,
                spread: 55,
                origin: { x: 1 }
            });
        }, 400);
    } catch(e) {}
}

function shuffleArray(array) {
let arr = [...array];
for (let i = arr.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[arr[i], arr[j]] = [arr[j], arr[i]];
}
return arr;
}

function createNewBoard(currentWonTotal) {
let board = [
{ type: 'DIAMOND', value: 3, text: '+3 Kim Cương', icon: '💎' },
{ type: 'DIAMOND', value: 2, text: '+2 Kim Cương', icon: '💎' },
{ type: 'DIAMOND', value: 1, text: '+1 Kim Cương', icon: '💎' },
{ type: 'FAKE', text: '300 Kim Cương', icon: '💎' },
{ type: 'FAKE', text: '200 Kim Cương', icon: '💎' },
{ type: 'FAKE', text: '100 Kim Cương', icon: '💎' },
{ type: 'FAKE', text: 'Voucher 50K', icon: '🎟️' },
{ type: 'FAKE', text: 'Kính Bluetooth', icon: '🕶️' }
];
const isTenDiamondLucky = Math.random() < 0.05;
if (isTenDiamondLucky && (currentWonTotal + 10 <= 10)) {
board.push({ type: 'DIAMOND', value: 10, text: '+10 Kim Cương', icon: '💎' });
} else {
board.push({ type: 'FAKE', text: 'Ly Free', icon: '🥤' });
}
return shuffleArray(board);
}

function getCurrentPhoneKey() {
    return `kimbling_game_state_v46_${userPhone}`;
}

function getGameState() {
    const storageKey = getCurrentPhoneKey();
    const savedState = localStorage.getItem(storageKey);
    if (savedState) {
        try {
            const parsed = JSON.parse(savedState);
            if (parsed) return parsed;
        } catch(e) {}
    }
    const newState = {
        wonDiamondsTotal: 0, 
        isCurrentGameFinished: false,
        currentBoard: createNewBoard(0), 
        selectedBoxIndex: null
    };
    localStorage.setItem(storageKey, JSON.stringify(newState));
    return newState;
}

let gameState = null;

async function executePhoneAuthentication() {
    const phoneInput = document.getElementById('gameCustomerPhone');
    const statusMsg = document.getElementById('authStatusMessage');
    const btnVerify = document.getElementById('btnVerifyPhoneAction');
    const cleanPhone = phoneInput ? phoneInput.value.trim() : '';

    if (!cleanPhone || cleanPhone.length < 9) {
        statusMsg.innerText = "⚠️ Vui lòng nhập số điện thoại hợp lệ!";
        if (phoneInput) phoneInput.focus();
        return;
    }

    statusMsg.innerText = "🔄 Đang kết nối hệ thống...";
    btnVerify.disabled = true;

    try {
        let res = await fetch(`${KIMBLING_API_URL}?type=adminGetCustomerInfo&phone=${encodeURIComponent(cleanPhone)}`);
        let data = await res.json();

        userPhone = cleanPhone;
        turnsPlayed = (data && data.turnsPlayed !== undefined) ? parseInt(data.turnsPlayed, 10) : 0;
        currentDiamondsBalance = (data && data.hatKim !== undefined) ? parseInt(data.hatKim, 10) : 0;

        localStorage.setItem('kb_customer_phone', userPhone);
        localStorage.setItem('kimbling_cust_phone', userPhone);
        localStorage.setItem('kim_bling_user_diamonds', currentDiamondsBalance);

        document.getElementById('authBoxContainer').style.display = 'none';
        document.getElementById('gameMainWrapper').style.display = 'block';
        document.getElementById('displayAuthenticatedPhone').innerText = userPhone;

        gameState = getGameState();
        updateUI();

    } catch (e) {
        console.error("Lỗi kết nối:", e);
        statusMsg.innerText = "❌ Lỗi kết nối máy chủ! Vui lòng thử lại.";
        btnVerify.disabled = false;
    }
}

function initGamePhoneAndBalance() {
    let savedPhone = localStorage.getItem('kimbling_cust_phone') || localStorage.getItem('kb_customer_phone') || '';
    const phoneInput = document.getElementById('gameCustomerPhone');
    if (phoneInput && savedPhone) {
        phoneInput.value = savedPhone;
        executePhoneAuthentication();
    }
}

function reloadGameDiamonds() {
    if (userPhone) {
        executePhoneAuthentication();
    }
}

function updateUI() {
if (!gameState) return;

const remainingTurns = Math.max(0, MAX_TURNS_ALLOWED - turnsPlayed);
document.getElementById('turnBadge').innerText = `Lượt chơi còn lại: ${remainingTurns} lượt`;
document.getElementById('headerTotalDiamonds').innerText = `${currentDiamondsBalance.toLocaleString('vi-VN')} 💎`;

const wonDisplay = document.getElementById('wonPrizesDisplay');
if (gameState.wonDiamondsTotal > 0) {
wonDisplay.innerText = `🎉 Vừa mở trúng: Tổng +${gameState.wonDiamondsTotal} 💎 phiên này`;
wonDisplay.style.color = `#00838f`;
} else {
    if (remainingTurns === 0) {
        wonDisplay.innerText = `🔒 Đã hết 5 lượt! Vui lòng đặt món để mở tiếp.`;
        wonDisplay.style.color = `#d32f2f`;
    } else {
        wonDisplay.innerText = `👉 Hãy chọn 1 hộp quà bên dưới!`;
        wonDisplay.style.color = `#e65100`;
    }
}

const boxElements = document.querySelectorAll('.box-item');
if (gameState.isCurrentGameFinished && gameState.selectedBoxIndex !== null) {
boxElements.forEach((box, idx) => {
const item = gameState.currentBoard[idx];
if (idx === gameState.selectedBoxIndex) {
if (item.type === 'DIAMOND') {
box.innerHTML = `<span style="font-size:20px;">💎</span><span class="item-title">${item.text}</span>`;
box.className = 'box-item user-opened winner-box';
} else {
box.innerHTML = `<span style="font-size:20px;">😋</span><span class="item-title">Ngon miệng!</span>`;
box.className = 'box-item user-opened';
}
} else {
box.innerHTML = `<span style="font-size:16px;">${item.icon}</span><span style="font-size:9px; font-weight:normal;">${item.text}</span>`;
box.className = 'box-item auto-revealed';
}
});
showResultBox();
} else {
boxElements.forEach(box => {
box.innerHTML = '🎁';
box.className = 'box-item';
});
document.getElementById('resultBox').style.display = 'none';
}
}

async function openBox(index) {
if (!userPhone) {
    alert("⚠️ Vui lòng nhập số điện thoại và xác thực trước!");
    return;
}

const remainingTurns = Math.max(0, MAX_TURNS_ALLOWED - turnsPlayed);
if (remainingTurns <= 0) {
    alert("🔒 Bạn đã sử dụng hết 5 lượt mở hộp quà! Vui lòng đặt món để được cấp thêm lượt mới nhé.");
    return;
}

if (gameState.isCurrentGameFinished) return;

turnsPlayed++;
gameState.isCurrentGameFinished = true;
gameState.selectedBoxIndex = index;
let item = gameState.currentBoard[index];
let exactWonThisTurn = 0;

if (item.type === 'DIAMOND') {
    if (gameState.wonDiamondsTotal >= 10 || (gameState.wonDiamondsTotal + item.value > 10)) {
        item = { type: 'MISS', text: 'Ngon miệng!', icon: '😋' };
    } else {
        exactWonThisTurn = item.value;
        gameState.wonDiamondsTotal += item.value;
        currentDiamondsBalance += exactWonThisTurn;
        
        // 🎇 PHÁT ÂM THANH & HIỆU ỨNG PHÁO HOA KHI TRÚNG QUÀ
        playSoundVictory();
        triggerFireworks();

        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    }
} else {
    item = { type: 'MISS', text: 'Ngon miệng!', icon: '😋' };
    // 🔊 PHÁT ÂM THANH BUỒN KHI TRÚNG Ô "NGON MIỆNG"
    playSoundSad();
}

try {
    fetch(KIMBLING_API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify({
            action: 'add_hatkim',
            type: 'add_hatkim',
            phone: userPhone,
            amount: exactWonThisTurn,
            turnsPlayed: turnsPlayed
        })
    });
} catch (e) {
    console.log("Lỗi đồng bộ Cloud:", e);
}

gameState.currentBoard[index] = item;
localStorage.setItem(getCurrentPhoneKey(), JSON.stringify(gameState));
localStorage.setItem('kim_bling_user_diamonds', currentDiamondsBalance);

if (window.parent) {
    window.parent.postMessage({ type: 'ADD_USER_DIAMONDS_SUCCESS', totalDiamonds: currentDiamondsBalance, added: exactWonThisTurn }, '*');
}

updateUI();
}

function showResultBox() {
const resultBox = document.getElementById('resultBox');
const resultText = document.getElementById('resultText');
const choiceRow = document.getElementById('choiceRow');
const btnCloseGame = document.getElementById('btnCloseGameAction');
const selectedItem = gameState.currentBoard[gameState.selectedBoxIndex];
let htmlMsg = "";

if (selectedItem.type === 'DIAMOND') {
htmlMsg = `🎉 <b>CHÚC MỪNG! BẠN NHẬN ĐƯỢC <span style="color:#d32f2f;">+${selectedItem.value} 💎</span></b><br>`;
} else {
htmlMsg = `😋 <b>Chúc bạn ngon miệng!</b> Ô này không có kim cương nhé.<br>`;
}

const remainingTurns = Math.max(0, MAX_TURNS_ALLOWED - turnsPlayed);
if (remainingTurns > 0) {
choiceRow.style.display = 'flex';
btnCloseGame.style.display = 'none';
} else {
choiceRow.style.display = 'none';
btnCloseGame.style.display = 'block';
htmlMsg += `<br>🔒 <b>Đã hết 5 lượt mở quà!</b> Bấm đặt món ngay để được cấp thêm 5 lượt mới.`;
}
resultText.innerHTML = htmlMsg;
resultBox.style.display = 'block';
}

function startNextGame() {
const remainingTurns = Math.max(0, MAX_TURNS_ALLOWED - turnsPlayed);
if (remainingTurns <= 0) {
    alert("🔒 Bạn đã hết 5 lượt chơi!");
    return;
}
gameState.isCurrentGameFinished = false;
gameState.selectedBoxIndex = null;
gameState.currentBoard = createNewBoard(gameState.wonDiamondsTotal);
localStorage.setItem(getCurrentPhoneKey(), JSON.stringify(gameState));
updateUI();
}

function finishFiveTurnsAndCheckout() {
    closeGame();
}

function closeGame() {
if (window.parent) {
    window.parent.postMessage('CLOSE_GAME_POPUP', '*');
}
}

window.addEventListener('message', function(event) {
    if (event.data && event.data.type === 'SYNC_CUSTOMER_PHONE' && event.data.phone) {
        const phoneInput = document.getElementById('gameCustomerPhone');
        if (phoneInput) {
            phoneInput.value = event.data.phone;
            executePhoneAuthentication();
        }
    }
    if (event.data === 'RESET_GAME_DATA') {
        turnsPlayed = 0;
        if (userPhone) {
            localStorage.removeItem(getCurrentPhoneKey());
        }
        executePhoneAuthentication();
    }
});

initGamePhoneAndBalance();
</script>
