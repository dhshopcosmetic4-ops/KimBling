<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hộp Quà May Mắn - Kim Bling</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .game-container {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #d63031; margin-bottom: 5px; }
        p { color: #636e72; font-size: 14px; }
        
        /* Khung đăng nhập / xác thực */
        #auth-box {
            margin: 20px 0;
            padding: 15px;
            background: #f1f2f6;
            border-radius: 8px;
        }
        #user-phone-input {
            width: 80%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #dfe4ea;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
        }
        .btn-verify {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-verify:hover { background: #ff6b81; }

        /* Khung thông tin ví và lượt chơi (Ẩn ban đầu) */
        #game-main-content { display: none; }
        
        .wallet-info {
            background: #2f3542;
            color: white;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-around;
            font-weight: bold;
        }
        .turns-text {
            color: #e74c3c;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* Lưới hộp quà */
        .gift-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .gift-box {
            background: #ffeaa7;
            border: 2px dashed #fdcb6e;
            border-radius: 8px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            cursor: pointer;
            transition: 0.2s;
        }
        .gift-box:hover { background: #fdcb6e; transform: scale(1.05); }
        .gift-box.opened {
            background: #dfe4ea;
            border: 2px solid #b2bec3;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h2>🎁 HỘP QUÀ MAY MẮN</h2>
    <p>Săn Kim Cương 💎 - Mở hộp tích lũy ngay!</p>

    <!-- 1. KHUNG XÁC THỰC SỐ ĐIỆN THOẠI (Bắt buộc hiện đầu tiên) -->
    <div id="auth-box">
        <p>Vui lòng nhập SĐT để mở khóa trò chơi:</p>
        <input type="tel" id="user-phone-input" placeholder="Nhập số điện thoại..." maxlength="11" />
        <br>
        <button class="btn-verify" onclick="verifyUserPhone()">Xác thực</button>
    </div>

    <!-- 2. NỘI DUNG GAME (Bị ẩn hoàn toàn cho đến khi xác thực thành công) -->
    <div id="game-main-content">
        <div class="wallet-info">
            <span>💎 Túi: <span id="wallet-diamonds">0</span></span>
            <span>📱 <span id="display-phone">---</span></span>
        </div>

        <div class="turns-text">
            Lượt chơi còn lại: <span id="turns-count">0</span> lượt
        </div>

        <div class="gift-grid" id="giftGrid">
            <!-- 9 hộp quà -->
            <div class="gift-box" onclick="openBox(this, 0)">🎁</div>
            <div class="gift-box" onclick="openBox(this, 1)">🎁</div>
            <div class="gift-box" onclick="openBox(this, 2)">🎁</div>
            <div class="gift-box" onclick="openBox(this, 3)">🎁</div>
            <div class="gift-box" onclick="openBox(this, 4)">🎁</div>
            <div class="gift-box" onclick="openBox(this, 5)">🎁</div>
            <div class="gift-box" onclick="openBox(this, 6)">🎁</div>
            <div class="gift-box" onclick="openBox(this, 7)">🎁</div>
            <div class="gift-box" onclick="openBox(this, 8)">🎁</div>
        </div>
    </div>
</div>

<script>
    // ⚠️ ANH THAY LINK WEB APP APPS SCRIPT CỦA QUÁN VÀO ĐÂY
    const APPS_SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL"; 

    let userPhone = "";
    let turnsPlayed = 0;
    let hatKim = 0;

    // Kiểm tra xem trước đó đã lưu SĐT trên máy chưa (để đỡ phải nhập lại nếu cùng 1 thiết bị tin cậy)
    window.onload = function() {
        const savedPhone = localStorage.getItem('kb_user_phone');
        if (savedPhone) {
            document.getElementById('user-phone-input').value = savedPhone;
            verifyUserPhone(); // Tự động xác thực ngầm luôn nếu đã có lịch sử
        }
    };

    // Hàm xác thực SĐT với Google Sheets
    async function verifyUserPhone() {
        const phoneInput = document.getElementById('user-phone-input').value.trim();
        if (!phoneInput || phoneInput.length < 9) {
            alert("Vui lòng nhập số điện thoại hợp lệ!");
            return;
        }

        document.getElementById('auth-box').innerHTML = "<p>🔄 Đang kết nối hệ thống quán...</p>";

        try {
            const response = await fetch(`${APPS_SCRIPT_URL}?type=adminGetCustomerInfo&phone=${phoneInput}`);
            const data = await response.json();

            if (data && data.success !== false) {
                userPhone = phoneInput;
                turnsPlayed = parseInt(data.turnsPlayed) || 0;
                hatKim = parseInt(data.hatKim) || 0;

                // Lưu lại SĐT lên localStorage
                localStorage.setItem('kb_user_phone', userPhone);

                // Ẩn khung đăng nhập, HIỆN TOÀN BỘ KHUNG GAME LÊN
                document.getElementById('auth-box').style.display = 'none';
                document.getElementById('game-main-content').style.display = 'block';

                // Cập nhật lên giao diện
                document.getElementById('display-phone').innerText = userPhone;
                document.getElementById('wallet-diamonds').innerText = hatKim;
                document.getElementById('turns-count').innerText = turnsPlayed;

                if (turnsPlayed <= 0) {
                    alert("Bạn đã hết lượt chơi! Hãy mua hàng tích đơn để nhận thêm lượt nhé.");
                }
            } else {
                alert("Không tìm thấy thông tin số điện thoại này. Vui lòng kiểm tra lại!");
                location.reload();
            }
        } catch (error) {
            console.error(error);
            alert("Lỗi kết nối máy chủ! Vui lòng thử lại.");
            location.reload();
        }
    }

    // Hàm mở hộp quà
    async function openBox(element, boxIndex) {
        if (element.classList.contains('opened')) return;

        if (turnsPlayed <= 0) {
            alert("Bạn đã hết lượt chơi! Hãy đặt đơn hàng mới để được cấp thêm lượt nhé.");
            return;
        }

        // Trừ lượt tại chỗ
        turnsPlayed--;
        document.getElementById('turns-count').innerText = turnsPlayed;

        // Đánh dấu hộp đã mở
        element.classList.add('opened');
        
        // Random phần thưởng kim cương (Ví dụ: từ 2 đến 10 kim cương)
        const reward = Math.floor(Math.random() * 9) + 2;
        hatKim += reward;
        document.getElementById('wallet-diamonds').innerText = hatKim;
        
        element.innerHTML = `💎+${reward}`;
        alert(`🎉 Chúc mừng bạn trúng ${reward} Hạt Kim Cương!`);

        // Đồng bộ ngầm dữ liệu lên Google Sheets (Cột F - TurnsPlayed và Cột C - HatKim)
        try {
            await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'add_hatkim',
                    phone: userPhone,
                    amount: reward,
                    turnsPlayed: turnsPlayed
                })
            });
        } catch (e) {
            console.error("Lỗi đồng bộ:", e);
        }
    }
</script>

</body>
</html>
