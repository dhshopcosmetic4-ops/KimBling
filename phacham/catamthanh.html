<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Cắt Nhạc & Dựng Video HD (AI 0đ + AI Gemini Bối Cảnh)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Be+Vietnam+Pro:wght@700;800;900&family=Chakra+Petch:wght@700&family=Dancing+Script:wght@700&family=Oswald:wght@700&family=Playfair+Display:wght@800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <!-- Giữ nguyên 2 file mẫu đặt cùng cấp -->
  <script src="./hook-templates.js"></script>
  <script src="./ai-presets.js"></script>
  <style>
    * { box-sizing: border-box; font-family: "Be Vietnam Pro", system-ui, sans-serif; }
    body { margin: 0; background: #070b14; color: #f8fafc; padding: 14px; }
    .wrap { max-width: 840px; margin: 0 auto; }
    h1 { font-size: 18px; text-align: center; color: #fde047; margin: 4px 0 10px; }
    .draft-bar {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 8px 12px;
      margin-bottom: 12px; font-size: 12px; color: #34d399;
    }
    .draft-bar button { width: auto; margin: 0; padding: 6px 10px; font-size: 11px; background: #dc2626; }
    .card { background: #11192b; border-radius: 14px; padding: 15px; margin-bottom: 14px; border: 1px solid #243352; }
    label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; font-weight: 700; }
    input, select, button {
      width: 100%; padding: 10px 11px; border-radius: 10px; border: 1px solid #334155;
      background: #070b14; color: #fff; font-size: 14px; margin-bottom: 10px;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .key-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; }
    button { background: linear-gradient(135deg, #0284c7, #2563eb); border: none; font-weight: 800; cursor: pointer; }
    button.tiktok { background: linear-gradient(135deg, #fe2c55, #25f4ee); color: #000; }
    button.orange { background: linear-gradient(135deg, #ea580c, #dc2626); }
    button.green { background: linear-gradient(135deg, #059669, #10b981); }
    button.purple { background: linear-gradient(135deg, #7c3aed, #db2777); }
    button.gold { background: linear-gradient(135deg, #d97706, #eab308); color: #000; }
    button.dark { background: #1e293b; border: 1px solid #475569; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .status { font-size: 13px; color: #34d399; text-align: center; min-height: 18px; margin-bottom: 6px; }
    .ai-suggest-box {
      display: none; background: rgba(56,189,248,0.08); border: 1px solid #0284c7;
      border-radius: 12px; padding: 12px; margin-bottom: 12px;
    }
    .ai-suggest-box .title { font-size: 13px; color: #7dd3fc; font-weight: 800; margin-bottom: 8px; }
    .ai-suggest-box button { font-size: 12px; padding: 9px 6px; margin-bottom: 0; }
    .stage-wrap { display: flex; justify-content: center; margin-bottom: 12px; }
    canvas#previewCanvas {
      width: 250px; height: 444px; background: #000; border-radius: 16px;
      border: 2px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    audio { width: 100%; margin-bottom: 10px; }
    .beat-card {
      background: #0b1120; border: 1px solid #263552; border-radius: 12px; padding: 12px;
      margin-bottom: 12px;
    }
    .beat-top { display: grid; grid-template-columns: 78px 1fr; gap: 12px; align-items: start; }
    .beat-thumb { width: 78px; height: 138px; background: #000; border-radius: 8px; border: 1px solid #334155; }
    .beat-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; }
    .badge { background: #1d4ed8; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 800; }
    .badge.hook { background: #dc2626; }
    .btn-group { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
    .small-btn { padding: 7px 10px; font-size: 12px; width: auto; margin-bottom: 0; border-radius: 8px; }
    .beat-save-bar { display: none; gap: 6px; flex-wrap: wrap; margin-top: 6px; padding-top: 6px; border-top: 1px dashed #334155; }
    input[type="range"] { padding: 0; margin: 4px 0; accent-color: #38bdf8; }
    /* Dải 6 ảnh chạm chọn 0đ */
    .strip-wrap {
      display: flex; gap: 6px; overflow-x: auto; padding: 6px 0 4px; margin-top: 4px;
    }
    .strip-item {
      position: relative; flex: 0 0 54px; height: 96px; border-radius: 7px; overflow: hidden;
      border: 2px solid #334155; cursor: pointer; background: #000;
    }
    .strip-item.active { border-color: #fde047; box-shadow: 0 0 8px rgba(253,224,71,0.6); }
    .strip-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .strip-time {
      position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.72);
      color: #fff; font-size: 10px; text-align: center; padding: 2px 0; font-weight: 700;
    }
    .ai-note-row { display: grid; grid-template-columns: 1fr auto; gap: 6px; margin-top: 6px; align-items: center; }
    .ai-note-row input { margin-bottom: 0; font-size: 12px; padding: 8px 10px; }
    .ai-reason { font-size: 12px; color: #7dd3fc; margin-top: 4px; line-height: 1.4; }
    .tk-fallback { display: none; margin-top: 6px; font-size: 12px; color: #cbd5e1; }
    .tk-fallback a { color: #38bdf8; font-weight: 700; margin-right: 12px; }
    .chk-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #cbd5e1; margin-bottom: 10px; }
    .chk-row input { width: auto; margin: 0; }
    /* Chỉ giữ đúng 3 thẻ video tối giản trong DOM để KHÔNG BAO GIỜ tràn RAM iPhone */
    #videoPoolDom {
      position: fixed; left: 0; top: 0; width: 4px; height: 4px;
      opacity: 0.001; pointer-events: none; overflow: hidden; z-index: -1;
    }
  </style>
</head>
<body>
<div id="videoPoolDom">
  <video id="sharedStageVideo" muted playsinline preload="auto"></video>
  <video id="scannerVideo" muted playsinline preload="auto"></video>
  <video id="exportVideo" muted playsinline preload="auto"></video>
</div>

<div class="wrap">
  <h1>🎬 Cắt Nhạc & Dựng Video HD (AI 0đ + AI Gemini Bối Cảnh)</h1>

  <div class="draft-bar">
    <span id="draftStatus">💾 Tự động lưu nháp: Sẵn sàng</span>
    <button id="clearDraftBtn">🗑️ Xóa Nháp / Bài Mới</button>
  </div>

  <!-- CÀI ĐẶT AI GEMINI & CỐT TRUYỆN -->
  <div class="card">
    <label>🔑 Gemini API Key (Tùy chọn cho AI nhìn hiểu bối cảnh — Tự lưu trên máy bạn)</label>
    <div class="row">
      <div class="key-row">
        <input type="password" id="geminiKeyInput" placeholder="Dán mã AIza... (Lấy miễn phí tại aistudio.google.com)" />
        <button class="dark small-btn" id="toggleKeyBtn" style="padding:10px 12px;">👁️</button>
      </div>
      <div>
        <select id="geminiModelSelect">
          <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite (Rẻ nhất / Free cao)</option>
          <option value="gemini-3.8-flash">Gemini 3.8 Flash (Thông minh nhất)</option>
          <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
        </select>
      </div>
    </div>
    <label>📖 Cốt truyện tổng thể của video (Để AI hiểu mạch chuyện khi bạn bấm chọn ở từng phách)</label>
    <input type="text" id="storyContextInput" placeholder="VD: Quán trà sữa mới mở: mở đầu mặt tiền quán -> pha trà -> rót topping -> đưa ly cho khách cười" value="Khởi nghiệp quán trà sữa: quay mặt tiền quán -> pha chế nguyên liệu -> rót trà vào ly -> thành phẩm hấp dẫn" />
  </div>

  <!-- 1. LẤY LINK TIKTOK -->
  <div class="card">
    <label>🔗 Dán Link TikTok (Lấy Nhạc hoặc Video làm mẫu nhịp)</label>
    <div class="row">
      <input type="text" id="tkUrlInput" placeholder="https://vt.tiktok.com/..." value="https://vt.tiktok.com/ZSsMqCVQ9/" />
      <button class="tiktok" id="fetchTkBtn">⚡ Lấy & Add Thẳng Vào App</button>
    </div>
    <div class="status" id="tkStatus"></div>
    <div class="tk-fallback" id="tkFallback">
      Nếu trình duyệt chặn tải tự động do CORS, tải nhanh tại đây rồi chọn ở mục 1 & 2:
      <a id="tkVidLink" target="_blank" download="tiktok.mp4">⬇️ Video Không Logo</a>
      <a id="tkAudLink" target="_blank" download="tiktok.mp3">🎵 Nhạc MP3</a>
    </div>
  </div>

  <!-- 2. NGUỒN FILE & CHỌN 7 KIỂU CHỮ -->
  <div class="card">
    <div class="row">
      <div>
        <label>1. File Nhạc (Tự nạp từ TikTok hoặc chọn từ máy)</label>
        <input type="file" id="audioFile" accept="video/*,audio/*" />
      </div>
      <div>
        <label>2. Video bạn tự quay (1 video dài hoặc nhiều clip)</label>
        <input type="file" id="mainVideoFiles" accept="video/*" multiple />
      </div>
    </div>

    <div class="row">
      <div>
        <label>3. Chọn Kiểu Chữ & Màu Sắc Hook (7 kiểu từ hook-templates.js)</label>
        <select id="templateSelect"></select>
      </div>
      <div>
        <label>Số phách muốn cắt</label>
        <input type="number" id="beatCount" value="10" min="5" max="30" />
      </div>
    </div>

    <button class="dark" id="aiSuggestBtn" disabled>✨ AI Đề Xuất Số Phách Tối Ưu Cho Bài Này</button>
    <div class="ai-suggest-box" id="aiSuggestBox">
      <div class="title" id="aiSuggestSummary">🤖 Đang phân tích...</div>
      <div class="row3">
        <button class="green" id="sugBalancedBtn">⚖️ Chuẩn Điệu</button>
        <button class="orange" id="sugFastBtn">🔥 Cắt Nhanh</button>
        <button id="sugChillBtn">🌿 Kể Chuyện</button>
      </div>
    </div>

    <div class="row">
      <input type="text" id="topicInput" value="bán bánh tráng nướng" placeholder="Gõ ý chính để AI tự soạn chữ..." />
      <button class="orange" id="aiFillBtn">✍️ AI Tự Soạn Chữ Hook (0đ)</button>
    </div>

    <div class="row" id="dynamicFields"></div>

    <div class="row3">
      <div>
        <label>Độ phân giải</label>
        <select id="qualitySelect">
          <option value="1080">Full HD 1080×1920</option>
          <option value="720" selected>HD 720×1280 (Nhanh)</option>
          <option value="540">Nhẹ 540×960</option>
        </select>
      </div>
      <div>
        <label>Tốc độ khung hình (FPS)</label>
        <select id="fpsSelect">
          <option value="60">60 FPS (Mượt iPhone)</option>
          <option value="30" selected>30 FPS (Nhanh)</option>
        </select>
      </div>
      <div>
        <label>Thẻ thiết bị (Metadata)</label>
        <select id="deviceMetaSelect">
          <option value="Apple|iPhone 12 Pro Max|18.5">Apple iPhone 12 Pro Max</option>
          <option value="Apple|iPhone 15 Pro Max|18.5">Apple iPhone 15 Pro Max</option>
          <option value="Apple|iPhone 16 Pro Max|18.5">Apple iPhone 16 Pro Max</option>
          <option value="none">Không gắn thẻ</option>
        </select>
      </div>
    </div>

    <button id="analyzeBtn" disabled>🤖 Bước 1: Chia Phách & Mở Bảng Cắt Từng Phách</button>
    <div class="status" id="statusText"></div>
  </div>

  <!-- 3. XEM TRƯỚC + BẢNG TỪNG PHÁCH (CHỌN 0Đ + AI GEMINI TẠI TỪNG PHÁCH) -->
  <div class="card" id="editorCard" style="display:none;">
    <div class="stage-wrap">
      <canvas id="previewCanvas" width="720" height="1280"></canvas>
    </div>
    <button id="playAllBtn">▶️ Phát Xem Trước Toàn Bộ</button>
    <audio id="audioPlayer" controls></audio>

    <div class="chk-row">
      <input type="checkbox" id="chkHookOnSingle" checked />
      <span>Gắn chữ Hook lên video phách đầu khi xuất lẻ (nếu đã nạp video thật)</span>
    </div>

    <label>✂️ Từng Phách (Chạm vào ảnh trong dải để chọn nhanh 0đ, hoặc bấm AI Gemini ngay tại phách đó):</label>
    <div id="beatsContainer"></div>
  </div>

  <!-- 4. XUẤT HÀNG LOẠT HOẶC XUẤT GỘP -->
  <div class="card" id="exportCard" style="display:none;">
    <div class="row">
      <button class="purple" id="exportAllZipBtn">📦 Xuất Từng Phách Rời (01..N + Nhạc .ZIP)</button>
      <button class="green" id="exportFinalBtn">🚀 Xuất Gộp Thành 1 Video (.MP4 Có Nhạc)</button>
    </div>
    <div class="status" id="exportStatus"></div>

    <div class="row" id="saveButtonsBox" style="display:none;margin-top:8px;">
      <button class="green" id="saveIphonePhotosBtn">📱 Lưu Video Gộp Vào Ảnh iPhone</button>
      <button id="downloadMp4Btn">⬇️ Tải Video Gộp (.MP4)</button>
    </div>
  </div>
</div>

<script>
  let decodedBuffer = null, wavBlob = null, finalMp4Blob = null;
  let rawAudioBlob = null, rawAudioName = '';
  let blobStore = {}, blobUrlMap = {}, stripCache = {}, videoDurationCache = {};
  let plan = [], sharedBlobKeys = [], animId = null, lastPlayingIdx = -1, activeSingleSeg = null;
  let currentStageBlobKey = null, currentBeatDensity = 'balanced';
  let mediabunnyPromise = null;
  let scanQueue = Promise.resolve();

  const sharedStageVideo = document.getElementById('sharedStageVideo');
  const scannerVideo = document.getElementById('scannerVideo');
  const exportVideo = document.getElementById('exportVideo');
  const previewCanvas = document.getElementById('previewCanvas');
  const pCtx = previewCanvas.getContext('2d');
  const audioPlayer = document.getElementById('audioPlayer');
  const statusText = document.getElementById('statusText');
  const tkStatus = document.getElementById('tkStatus');
  const exportStatus = document.getElementById('exportStatus');
  const draftStatus = document.getElementById('draftStatus');
  const templateSelect = document.getElementById('templateSelect');
  const dynamicFields = document.getElementById('dynamicFields');

  // --- LƯU & ĐỌC GEMINI API KEY TỪ LOCALSTORAGE ---
  const geminiKeyInput = document.getElementById('geminiKeyInput');
  const geminiModelSelect = document.getElementById('geminiModelSelect');
  const storyContextInput = document.getElementById('storyContextInput');

  geminiKeyInput.value = localStorage.getItem('catamthanh_gemini_key') || '';
  geminiModelSelect.value = localStorage.getItem('catamthanh_gemini_model') || 'gemini-3.5-flash-lite';
  if (localStorage.getItem('catamthanh_story_ctx')) storyContextInput.value = localStorage.getItem('catamthanh_story_ctx');

  geminiKeyInput.addEventListener('input', () => localStorage.setItem('catamthanh_gemini_key', geminiKeyInput.value.trim()));
  geminiModelSelect.addEventListener('change', () => localStorage.setItem('catamthanh_gemini_model', geminiModelSelect.value));
  storyContextInput.addEventListener('input', () => {
    localStorage.setItem('catamthanh_story_ctx', storyContextInput.value);
    scheduleAutoSave();
  });
  document.getElementById('toggleKeyBtn').addEventListener('click', () => {
    geminiKeyInput.type = geminiKeyInput.type === 'password' ? 'text' : 'password';
  });

  function getBlobUrl(key) {
    if (!key || !blobStore[key]) return null;
    if (!blobUrlMap[key]) blobUrlMap[key] = URL.createObjectURL(blobStore[key]);
    return blobUrlMap[key];
  }

  function getExportFps() { return parseInt(document.getElementById('fpsSelect').value || '30', 10); }

  function getMediabunny() {
    if (!mediabunnyPromise) {
      mediabunnyPromise = (async () => {
        const mb = await import('https://cdn.jsdelivr.net/npm/mediabunny@1.66.4/+esm');
        const { registerAacEncoder } = await import('https://cdn.jsdelivr.net/npm/@mediabunny/aac-encoder@1.66.4/+esm');
        if (!(await mb.canEncodeAudio('aac'))) registerAacEncoder();
        return mb;
      })();
    }
    return mediabunnyPromise;
  }

  // --- INDEXEDDB LƯU NHÁP ---
  function openStudioDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('CatAmThanhStudioDB', 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('drafts')) db.createObjectStore('drafts');
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  let saveTimer = null;
  function scheduleAutoSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveDraftNow, 500); }

  async function saveDraftNow() {
    if (!rawAudioBlob) return;
    try {
      const db = await openStudioDB();
      const usedKeys = new Set(sharedBlobKeys);
      plan.forEach(s => { if (s.blobKey) usedKeys.add(s.blobKey); });
      const savedBlobs = {};
      usedKeys.forEach(k => { if (blobStore[k]) savedBlobs[k] = blobStore[k]; });

      const payload = {
        savedAt: Date.now(), rawAudioBlob, rawAudioName, videoBlobs: savedBlobs, sharedBlobKeys,
        templateId: templateSelect.value, hookData: getHookData(),
        beatCount: document.getElementById('beatCount').value,
        quality: document.getElementById('qualitySelect').value,
        fps: document.getElementById('fpsSelect').value,
        deviceMeta: document.getElementById('deviceMetaSelect').value,
        topic: document.getElementById('topicInput').value,
        storyContext: storyContextInput.value,
        beatDensity: currentBeatDensity,
        planMeta: plan.map(s => ({
          idx: s.idx, numStr: s.numStr, start: s.start, end: s.end, dur: s.dur,
          energy: s.energy || 0.5, isHook: s.isHook, fileName: s.fileName,
          trimStart: s.trimStart, customVideo: !!s.customVideo, blobKey: s.blobKey || null,
          beatNote: s.beatNote || '', aiReason: s.aiReason || ''
        }))
      };
      await new Promise((res, rej) => {
        const tx = db.transaction('drafts', 'readwrite');
        tx.objectStore('drafts').put(payload, 'current');
        tx.oncomplete = res; tx.onerror = () => rej(tx.error);
      });
      const hm = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
      draftStatus.textContent = `💾 Đã tự động lưu nháp lúc ${hm}`;
    } catch (e) { console.warn('AutoSave skip:', e); }
  }

  async function restoreDraftOnLoad() {
    try {
      const db = await openStudioDB();
      const draft = await new Promise((res) => {
        const tx = db.transaction('drafts', 'readonly');
        const r = tx.objectStore('drafts').get('current');
        r.onsuccess = () => res(r.result); r.onerror = () => res(null);
      });
      if (!draft || !draft.rawAudioBlob) return;

      draftStatus.textContent = '⏳ Đang khôi phục dự án...';
      rawAudioBlob = draft.rawAudioBlob; rawAudioName = draft.rawAudioName || 'Nhạc đã lưu';
      blobStore = draft.videoBlobs || {}; sharedBlobKeys = draft.sharedBlobKeys || [];
      currentBeatDensity = draft.beatDensity || 'balanced';

      if (draft.templateId) templateSelect.value = draft.templateId;
      renderTemplateFields();
      if (draft.hookData) {
        document.querySelectorAll('.tpl-field').forEach(el => {
          if (draft.hookData[el.dataset.key] !== undefined) el.value = draft.hookData[el.dataset.key];
        });
      }
      if (draft.beatCount) document.getElementById('beatCount').value = draft.beatCount;
      if (draft.quality) document.getElementById('qualitySelect').value = draft.quality;
      if (draft.fps) document.getElementById('fpsSelect').value = draft.fps;
      if (draft.deviceMeta) document.getElementById('deviceMetaSelect').value = draft.deviceMeta;
      if (draft.topic) document.getElementById('topicInput').value = draft.topic;
      if (draft.storyContext) storyContextInput.value = draft.storyContext;

      await loadAudioFromBlob(rawAudioBlob, rawAudioName, false);

      if (draft.planMeta && draft.planMeta.length) {
        wavBlob = encodeWAV(decodedBuffer);
        audioPlayer.src = URL.createObjectURL(wavBlob);
        plan = draft.planMeta.map(m => ({ ...m, thumbCanvas: null, mp4Blob: null }));
        renderBeatsUI();
        document.getElementById('editorCard').style.display = 'block';
        document.getElementById('exportCard').style.display = 'block';
        await document.fonts.ready;
        if (plan[0].blobKey) await loadStageVideoKey(plan[0].blobKey, plan[0].trimStart);
        drawMainPreview(0);
      }
      const hm = new Date(draft.savedAt).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
      draftStatus.textContent = `📂 Đã khôi phục bản nháp lúc ${hm}`;
    } catch (e) { console.warn('Restore skip:', e); }
  }

  document.getElementById('clearDraftBtn').addEventListener('click', async () => {
    if (!confirm('Xóa toàn bộ bản nháp hiện tại để làm video mới?')) return;
    const db = await openStudioDB();
    await new Promise(res => {
      const tx = db.transaction('drafts', 'readwrite');
      tx.objectStore('drafts').delete('current'); tx.oncomplete = res;
    });
    location.reload();
  });

  // --- MẪU CHỮ HOOK ---
  function initTemplates() {
    const list = window.HOOK_TEMPLATES || [];
    templateSelect.innerHTML = list.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
    renderTemplateFields();
  }
  function getCurrentTemplate() {
    return (window.HOOK_TEMPLATES || []).find(t => t.id === templateSelect.value) || window.HOOK_TEMPLATES[0];
  }
  function renderTemplateFields() {
    const tpl = getCurrentTemplate(); if (!tpl) return;
    dynamicFields.innerHTML = tpl.fields.map(f => `
      <div><label>${f.label}</label><input type="text" class="tpl-field" data-key="${f.key}" value="${f.default}" /></div>
    `).join('');
    document.querySelectorAll('.tpl-field').forEach(el => el.addEventListener('input', () => {
      if (plan.length) drawMainPreview(audioPlayer.currentTime || 0);
      scheduleAutoSave();
    }));

  // --- PHÂN TÍCH NHẠC ---
  async function analyzeAudioMetrics(buffer) {
    const sr = buffer.sampleRate;
    const off = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, buffer.length, sr);
    const src = off.createBufferSource(); src.buffer = buffer;
    const f = off.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 160;
    src.connect(f); f.connect(off.destination); src.start(0);
    const out = await off.startRendering();
    const d = out.getChannelData(0), hop = Math.floor(sr * 0.02), e = [];
    for (let i = 0; i < d.length; i += hop) {
      let s = 0, end = Math.min(i + hop, d.length);
      for (let j = i; j < end; j++) s += d[j] * d[j];
      e.push(Math.sqrt(s / (end - i)));
    }
    const onset = e.map((v, i) => i === 0 ? 0 : Math.max(0, v - e[i - 1]));
    let bestLag = 25, bestCorr = -1;
    for (let lag = 20; lag <= 46; lag++) {
      let corr = 0;
      for (let i = lag; i < onset.length; i++) corr += onset[i] * onset[i - lag];
      const w = (lag >= 21 && lag <= 32) ? 1.15 : 1.0;
      if (corr * w > bestCorr) { bestCorr = corr * w; bestLag = lag; }
    }
    const bpm = Math.round(3000 / bestLag);
    return { e, bpm, meanE: e.reduce((a, b) => a + b, 0) / (e.length || 1) };
  }

  async function buildBeatPlan(buffer, totalSegs, tpl, density) {
    const { e, meanE } = await analyzeAudioMetrics(buffer);
    const hookEnd = Math.min(tpl.hookDuration || 2.8, buffer.duration * 0.35);
    const hookPts = tpl.bwFirst3s ? [hookEnd * 0.33, hookEnd * 0.66, hookEnd] : [hookEnd * 0.5, hookEnd];

    const bodyNeeded = Math.max(2, totalSegs - hookPts.length - 1);
    const cands = [];
    for (let i = Math.floor(hookEnd / 0.02) + 8; i < e.length - 12; i++) {
      let loc = 0, s = Math.max(0, i - 18), end = Math.min(e.length, i + 18);
      for (let k = s; k < end; k++) loc += e[k];
      loc /= (end - s);
      if (e[i] > e[i - 1] && e[i] > e[i + 1] && e[i] > loc * 1.2) cands.push({ time: i * 0.02, score: e[i] / (loc + 1e-6), energy: e[i] });
    }
    cands.sort((a, b) => b.score - a.score);
    const bodyCuts = [];
    for (const c of cands) {
      if (bodyCuts.length >= bodyNeeded) break;
      const baseGap = density === 'fast' ? 0.42 : (density === 'chill' ? 1.5 : 0.8);
      const minGap = c.energy > meanE * 1.15 ? Math.max(0.4, baseGap * 0.65) : baseGap;
      if (Math.abs(c.time - hookEnd) >= 0.42 && !bodyCuts.some(t => Math.abs(t - c.time) < minGap)) bodyCuts.push(c.time);
    }
    bodyCuts.sort((a, b) => a - b);
    let pts = [0, ...hookPts, ...bodyCuts, buffer.duration];
    while (pts.length - 1 < totalSegs) {
      let maxG = 0, idx = 0;
      for (let i = hookPts.length; i < pts.length - 1; i++) if (pts[i + 1] - pts[i] > maxG) { maxG = pts[i + 1] - pts[i]; idx = i; }
      pts.splice(idx + 1, 0, (pts[idx] + pts[idx + 1]) / 2);
    }

    const res = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const start = Number(pts[i].toFixed(3)), end = Number(pts[i + 1].toFixed(3));
      const dur = Math.max(0.2, end - start), numStr = String(i + 1).padStart(2, '0'), isHook = i < hookPts.length;
      const i0 = Math.floor(start / 0.02), i1 = Math.max(i0 + 1, Math.floor(end / 0.02));
      let segSum = 0; for (let k = i0; k < Math.min(i1, e.length); k++) segSum += e[k];
      res.push({
        idx: i + 1, numStr, start, end, dur, energy: (segSum / Math.max(1, i1 - i0)) / (meanE || 1), isHook,
        fileName: `${numStr}_PHACH_${isHook ? 'HOOK' : 'NHIP'}_${dur.toFixed(2)}s.mp4`,
        blobKey: null, trimStart: 0, customVideo: false, beatNote: '', aiReason: '', thumbCanvas: null, mp4Blob: null
      });
    }
    return res;
  }

  // --- QUẢN LÝ 1 VIDEO DUY NHẤT ĐỂ TRÁNH TRÀN RAM ---
  function unlockVideoImmediate(v) {
    if (!v || v._unlocked) return Promise.resolve();
    v.muted = true; v.playsInline = true;
    try {
      const p = v.play();
      if (p && p.then) return p.then(() => { v.pause(); v._unlocked = true; }).catch(() => {});
    } catch {}
    return Promise.resolve();
  }

  async function ensureVideoReady(video) {
    if (!video || !video.src) return;
    if (video.readyState >= 2 && video.videoWidth > 0) return;
    await new Promise((resolve) => {
      let done = false;
      const fin = () => { if (!done) { done = true; video.removeEventListener('canplay', fin); video.removeEventListener('loadeddata', fin); resolve(); } };
      video.addEventListener('canplay', fin); video.addEventListener('loadeddata', fin);
      try { video.load(); } catch {}
      setTimeout(fin, 1500);
    });
  }

  async function seekVideo(video, targetTime) {
    if (!video || !video.src) return;
    await ensureVideoReady(video);
    if (!video.duration || !isFinite(video.duration)) return;
    const clamped = Math.max(0, Math.min(targetTime, Math.max(0, video.duration - 0.04)));
    if (Math.abs(video.currentTime - clamped) >= 0.008) {
      await new Promise((resolve) => {
        let done = false;
        const fin = () => { if (!done) { done = true; video.removeEventListener('seeked', fin); resolve(); } };
        video.addEventListener('seeked', fin);
        video.currentTime = clamped;
        setTimeout(fin, 700);
      });
    }
    await new Promise(r => requestAnimationFrame(r));
  }

  async function loadStageVideoKey(blobKey, targetTime = 0) {
    if (!blobKey || !blobStore[blobKey]) {
      currentStageBlobKey = null;
      return false;
    }
    if (currentStageBlobKey !== blobKey) {
      currentStageBlobKey = blobKey;
      sharedStageVideo.src = getBlobUrl(blobKey);
      await ensureVideoReady(sharedStageVideo);
    }
    await seekVideo(sharedStageVideo, targetTime);
    return true;
  }

  // Trích xuất dải 6 ảnh JPEG siêu nhẹ (<40KB) bằng 1 thẻ #scannerVideo tuần tự, xong giải phóng RAM ngay!
  function enqueueScanStrip(blobKey) {
    scanQueue = scanQueue.then(async () => {
      if (!blobKey || !blobStore[blobKey]) return [];
      if (stripCache[blobKey]) return stripCache[blobKey];

      scannerVideo.src = getBlobUrl(blobKey);
      await ensureVideoReady(scannerVideo);
      const dur = scannerVideo.duration || 1;
      videoDurationCache[blobKey] = dur;

      const count = 6, W = 108, H = 192;
      const sc = document.createElement('canvas'); sc.width = W; sc.height = H;
      const sctx = sc.getContext('2d', { willReadFrequently: true });
      const items = [];

      for (let i = 0; i < count; i++) {
        const t = Number(((i / Math.max(1, count - 1)) * Math.max(0.1, dur - 0.35)).toFixed(2));
        await seekVideo(scannerVideo, t);
        drawCover(sctx, scannerVideo, W, H);

        // Chấm điểm nét & sáng 0đ cực nhẹ
        const img = sctx.getImageData(0, 0, W, H).data;
        let lumSum = 0, edgeSum = 0;
        for (let y = 0; y < H; y += 3) {
          for (let x = 0; x < W; x += 3) {
            const p = (y * W + x) * 4;
            const lum = 0.299 * img[p] + 0.587 * img[p + 1] + 0.114 * img[p + 2];
            lumSum += lum;
            if (x + 3 < W) {
              const pr = p + 12;
              edgeSum += Math.abs(lum - (0.299 * img[pr] + 0.587 * img[pr + 1] + 0.114 * img[pr + 2]));
            }
          }
        }
        const px = (W / 3) * (H / 3), avgLum = (lumSum / px) / 255;
        const sharp = Math.min(1, (edgeSum / px) / 28);
        const lightOk = (avgLum < 0.15 || avgLum > 0.92) ? 0.2 : 1.0;

        items.push({ t, dataUrl: sc.toDataURL('image/jpeg', 0.65), score0d: sharp * 0.7 + lightOk * 0.3 });
      }
      // Giải phóng RAM video quét ngay lập tức!
      scannerVideo.pause();
      scannerVideo.removeAttribute('src');
      scannerVideo.load();
      stripCache[blobKey] = items;
      return items;
    }).catch(() => []);
    return scanQueue;
  }

  // Chụp 6-8 ảnh <=384px gửi Gemini Vision (chỉ tốn ~1.548 - 2.064 tokens!)
  async function extractFramesForGemini(blobKey, maxStart) {
    return await (scanQueue = scanQueue.then(async () => {
      scannerVideo.src = getBlobUrl(blobKey);
      await ensureVideoReady(scannerVideo);
      const count = maxStart >= 12 ? 8 : 6;
      const W = 216, H = 384; // Cạnh lớn nhất = 384px -> Tối ưu 258 tokens/ảnh!
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      const cctx = c.getContext('2d');
      const frames = [];

      for (let i = 0; i < count; i++) {
        const t = Number(((i / Math.max(1, count - 1)) * maxStart).toFixed(2));
        await seekVideo(scannerVideo, t);
        drawCover(cctx, scannerVideo, W, H);
        const b64 = c.toDataURL('image/jpeg', 0.72).split(',')[1];
        frames.push({ index: i, t, b64 });
      }
      scannerVideo.pause();
      scannerVideo.removeAttribute('src');
      scannerVideo.load();
      return frames;
    }));
  }

  async function askGeminiPickClip(seg) {
    const apiKey = geminiKeyInput.value.trim();
    if (!apiKey) throw new Error('Bạn chưa dán Gemini API Key ở mục đầu trang! (Hoặc bấm nút ⚡ Gợi ý 0đ kế bên)');
    if (!seg.blobKey || !blobStore[seg.blobKey]) throw new Error('Phách này chưa có video.');

    const dur = videoDurationCache[seg.blobKey] || 10;
    const maxStart = Math.max(0.1, dur - seg.dur);
    const frames = await extractFramesForGemini(seg.blobKey, maxStart);

    const model = geminiModelSelect.value;
    const story = storyContextInput.value.trim();
    const note = seg.beatNote ? seg.beatNote.trim() : '';

    const timeMapStr = frames.map(f => `Ảnh ${f.index}: giây ${f.t}s`).join(', ');
    const prompt = `Bạn là đạo diễn dựng video TikTok/Reels.
Cốt truyện chung của video: "${story || 'Video giới thiệu sản phẩm/quán'}".
Hiện tại đang chọn cảnh cho PHÁCH ${seg.numStr}/${plan.length} (độ dài ${seg.dur.toFixed(2)}s, vai trò: ${seg.isHook ? 'Mở đầu Hook 3s giữ chân người xem' : 'Thân bài chuyển cảnh theo nhịp'}).
${note ? `Yêu cầu riêng của phách này: "${note}".` : ''}
Dưới đây là ${frames.length} ảnh chụp theo thứ tự thời gian (${timeMapStr}).
Hãy nhìn kỹ từng ảnh, chọn ra ĐÚNG 1 ảnh đẹp nhất, rõ nét, không bị mờ/tối và phù hợp nhất với bối cảnh phách này.
Trả về JSON đúng mẫu: {"bestIndex": 0, "reason": "Giải thích cực ngắn dưới 15 chữ bằng tiếng Việt"}`;

    const parts = frames.map(f => ({ inline_data: { mime_type: 'image/jpeg', data: f.b64 } }));
    parts.push({ text: prompt });

    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts }],
        generationConfig: { temperature: 0.2, responseMimeType: 'application/json' }
      })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || 'Lỗi kết nối Gemini API.');

    const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
    const parsed = JSON.parse(rawText);
    const idx = Math.max(0, Math.min(frames.length - 1, parseInt(parsed.bestIndex, 10) || 0));
    return { t: frames[idx].t, reason: parsed.reason || 'Đã chọn cảnh hợp bối cảnh nhất.' };
  }

  function drawBlackPlaceholder(c, seg, fLocal, totalFrames, W, H) {
    const sc = W / 720;
    c.fillStyle = '#000000'; c.fillRect(0, 0, W, H);
    c.strokeStyle = seg.isHook ? '#ef4444' : '#38bdf8';

    c.fillText(`PHÁCH ${seg.numStr}`, W / 2, H * 0.48);

    c.font = `800 ${Math.round(42 * sc)}px "Be Vietnam Pro", sans-serif`;
    c.fillText(`${seg.dur.toFixed(2)} giây`, W / 2, H * 0.57);
    c.fillStyle = '#1e293b'; c.fillRect(80 * sc, H * 0.80, W - 160 * sc, 18 * sc);
    c.fillStyle = seg.isHook ? '#ef4444' : '#10b981';
    c.fillRect(80 * sc, H * 0.80, (W - 160 * sc) * Math.min(1, (fLocal + 1) / Math.max(1, totalFrames)), 18 * sc);
  }

  function drawCover(ctx, video, W, H) {
    const sc = Math.max(W / video.videoWidth, H / video.videoHeight);
    ctx.drawImage(video, (W - video.videoWidth * sc) / 2, (H - video.videoHeight * sc) / 2, video.videoWidth * sc, video.videoHeight * sc);
  }

  function drawThumbFromStripOrBlack(seg) {
    if (!seg.thumbCanvas) return;
    const tc = seg.thumbCanvas.getContext('2d');
    const strip = seg.blobKey ? stripCache[seg.blobKey] : null;
    if (strip && strip.length) {
      let nearest = strip[0];
      strip.forEach(it => { if (Math.abs(it.t - seg.trimStart) < Math.abs(nearest.t - seg.trimStart)) nearest = it; });
      const im = new Image();
      im.onload = () => tc.drawImage(im, 0, 0, 156, 276);
      im.src = nearest.dataUrl;
    } else {
      drawBlackPlaceholder(tc, seg, 0, 30, 156, 276);
    }
  }

      btnGroup.append(pickBtn, clearBtn, playOneBtn, exportOneBtn);

      const rangeLabel = document.createElement('label');

      slider.type = 'range'; slider.min = 0; slider.step = 0.05;
      const durKnown = seg.blobKey && videoDurationCache[seg.blobKey] ? videoDurationCache[seg.blobKey] : 10;
      slider.max = Math.max(0, durKnown - seg.dur).toFixed(2);
      slider.value = seg.trimStart;
      rangeLabel.textContent = seg.blobKey
        ? `Cắt từ ${seg.trimStart.toFixed(2)}s ➔ ${(seg.trimStart + seg.dur).toFixed(2)}s`

      // Dải 6 ảnh chạm 0đ + Ô ghi bối cảnh & nút AI Gemini ngay tại phách!

      const aiRow = document.createElement('div'); aiRow.className = 'ai-note-row';
      const noteInput = document.createElement('input');
      noteInput.type = 'text'; noteInput.placeholder = 'Bối cảnh phách này (VD: rót trà sữa)...';
      noteInput.value = seg.beatNote || '';
      noteInput.oninput = () => { seg.beatNote = noteInput.value; scheduleAutoSave(); };

      const aiBtnGroup = document.createElement('div');
      aiBtnGroup.style.cssText = 'display:flex;gap:5px;';
      const zeroAiBtn = document.createElement('button');
      zeroAiBtn.className = 'small-btn dark'; zeroAiBtn.textContent = '⚡ 0đ';
      zeroAiBtn.title = 'Chọn nhanh khúc sáng nét nhất (0 đồng)';
      const geminiBtn = document.createElement('button');
      geminiBtn.className = 'small-btn gold'; geminiBtn.textContent = '🧠 AI Gemini';
      aiBtnGroup.append(zeroAiBtn, geminiBtn);

      const reasonBox = document.createElement('div'); reasonBox.className = 'ai-reason';

      const oneStatus = document.createElement('div');
      oneStatus.style.cssText = 'font-size:12px;color:#34d399;margin-top:4px;';
      const saveBar = document.createElement('div'); saveBar.className = 'beat-save-bar';

      async function populateStrip() {
        stripWrap.innerHTML = '';
        if (!seg.blobKey || !blobStore[seg.blobKey]) {
          drawThumbFromStripOrBlack(seg);

        const items = await enqueueScanStrip(seg.blobKey);
        const maxStart = Math.max(0, (videoDurationCache[seg.blobKey] || 10) - seg.dur);

        stripWrap.innerHTML = '';
        items.forEach(it => {
          const itemT = Math.min(maxStart, it.t);
          const div = document.createElement('div');
          div.className = 'strip-item' + (Math.abs(seg.trimStart - itemT) < 0.8 ? ' active' : '');
          div.innerHTML = `<img src="${it.dataUrl}" /><span class="strip-time">${itemT.toFixed(1)}s</span>`;
          div.onclick = async () => {
            seg.trimStart = Number(itemT.toFixed(2));
            slider.value = seg.trimStart;
            rangeLabel.textContent = `Cắt từ ${seg.trimStart.toFixed(2)}s ➔ ${(seg.trimStart + seg.dur).toFixed(2)}s`;
            stripWrap.querySelectorAll('.strip-item').forEach(x => x.classList.remove('active'));
            div.classList.add('active');
            await loadStageVideoKey(seg.blobKey, seg.trimStart);
            drawThumbFromStripOrBlack(seg);
            renderCompositeFrame(pCtx, seg.start, 720, 1280, seg, 0, 30, true, sharedStageVideo);
            scheduleAutoSave();
          };
          stripWrap.appendChild(div);
        });
        drawThumbFromStripOrBlack(seg);
      }

      pickInput.onchange = async (e) => {
        const f = e.target.files[0]; if (!f) return;
        const k = `custom_${seg.idx}_${Date.now()}`;
        blobStore[k] = f; seg.blobKey = k; seg.customVideo = true; seg.trimStart = 0;
        await populateStrip();
        await loadStageVideoKey(seg.blobKey, 0);
        renderCompositeFrame(pCtx, seg.start, 720, 1280, seg, 0, 30, true, sharedStageVideo);
        scheduleAutoSave();
      };

      clearBtn.onclick = () => {
        seg.blobKey = null; seg.customVideo = true; seg.trimStart = 0; seg.aiReason = '';

        stripWrap.innerHTML = '';

      zeroAiBtn.onclick = async () => {

        await loadStageVideoKey(seg.blobKey, seg.trimStart);
        drawThumbFromStripOrBlack(seg);
        renderCompositeFrame(pCtx, seg.start, 720, 1280, seg, 0, 30, true, sharedStageVideo);

      };

      geminiBtn.onclick = async () => {

        reasonBox.textContent = '🧠 Đang gửi 6–8 ảnh nhỏ lên Gemini xem bối cảnh...';

          const ans = await askGeminiPickClip(seg);
          seg.trimStart = ans.t;
          seg.aiReason = `🤖 Gemini (${ans.t.toFixed(1)}s): ${ans.reason}`;
          reasonBox.textContent = seg.aiReason;
          slider.value = seg.trimStart;
          rangeLabel.textContent = `Cắt từ ${seg.trimStart.toFixed(2)}s ➔ ${(seg.trimStart + seg.dur).toFixed(2)}s`;
          await loadStageVideoKey(seg.blobKey, seg.trimStart);
          drawThumbFromStripOrBlack(seg);
          renderCompositeFrame(pCtx, seg.start, 720, 1280, seg, 0, 30, true, sharedStageVideo);

          reasonBox.textContent = '❌ ' + err.message;

      let isSliding = false;
      slider.oninput = async () => {
        seg.trimStart = parseFloat(slider.value);

        scheduleAutoSave();
        if (!seg.blobKey || isSliding) return;
        isSliding = true;
        await loadStageVideoKey(seg.blobKey, seg.trimStart);
        const tc = thumb.getContext('2d');
        if (sharedStageVideo.videoWidth > 0) drawCover(tc, sharedStageVideo, 156, 276);

        exportOneBtn.disabled = true;

          if (seg.blobKey) await unlockVideoImmediate(exportVideo);
          const fps = getExportFps(), totalF = Math.max(2, Math.round(seg.dur * fps));
          const blob = await exportViaMediabunny(totalF, seg.start, seg.end, (f) => ({
            seg, fLocal: f, totalLocal: totalF, singleOverride: true, includeHook: document.getElementById('chkHookOnSingle').checked
          }), (pct) => { oneStatus.textContent = `⏳ Đang xuất Phách ${seg.numStr}: ${pct}%`; });
          seg.mp4Blob = blob; saveBar.innerHTML = ''; saveBar.style.display = 'flex';

      };

      right.append(btnGroup, pickInput, rangeLabel, slider);
      top.append(thumb, right);
      card.append(top, stripWrap, aiRow, reasonBox, oneStatus, saveBar);
      box.appendChild(card);

      populateStrip();
    });

  function renderCompositeFrame(ctx, t, W, H, singleSegOverride, fLocal, totalLocal, includeHookText, videoSourceEl) {
    const tpl = getCurrentTemplate();
    let seg = singleSegOverride || plan[0];
    if (!singleSegOverride) for (const s of plan) if (t >= s.start && t < s.end) { seg = s; break; }

    if (!seg.blobKey || !videoSourceEl || !videoSourceEl.videoWidth) {
      drawBlackPlaceholder(ctx, seg, fLocal, totalLocal, W, H);
      return;
    }

    const dt = Math.max(0, t - seg.start), pulse = dt < 0.22 ? (1 - dt / 0.22) : 0;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.save();
    if (tpl.bwFirst3s && seg.isHook) ctx.filter = `grayscale(100%) brightness(${0.7 + pulse * 0.6})`;
    else ctx.filter = `brightness(${1 + pulse * 0.14})`;
    const zoom = 1 + pulse * 0.06;
    ctx.translate(W / 2, H / 2); ctx.scale(zoom, zoom); ctx.translate(-W / 2, -H / 2);
    drawCover(ctx, videoSourceEl, W, H);
    ctx.restore();

    if (includeHookText) {
      const hookTotal = plan.filter(s => s.isHook).reduce((a, b) => a + b.dur, 0);
      tpl.render(ctx, t, W, H, getHookData(), hookTotal);
    }
  }

  function drawMainPreview(t) {
    renderCompositeFrame(pCtx, t, 720, 1280, null, 0, 30, true, currentStageBlobKey ? sharedStageVideo : null);
  }

  async function playSingleBeat(seg) {
    activeSingleSeg = seg; lastPlayingIdx = seg.idx;
    if (seg.blobKey) {
      await loadStageVideoKey(seg.blobKey, seg.trimStart);
      sharedStageVideo.play().catch(() => {});
    } else sharedStageVideo.pause();
    audioPlayer.currentTime = seg.start; audioPlayer.play().catch(() => {});
    previewCanvas.scrollIntoView({ behavior: 'smooth', block: 'center' });
    cancelAnimationFrame(animId); previewLoop();
  }

  document.getElementById('playAllBtn').addEventListener('click', async () => {
    activeSingleSeg = null; lastPlayingIdx = -1;
    if (plan[0]?.blobKey) {
      await loadStageVideoKey(plan[0].blobKey, plan[0].trimStart);
      sharedStageVideo.play().catch(() => {});
    }
    audioPlayer.currentTime = 0; audioPlayer.play().catch(() => {});
    cancelAnimationFrame(animId); previewLoop();
  });
  audioPlayer.addEventListener('play', () => { cancelAnimationFrame(animId); previewLoop(); });

  let switchingStage = false;
  function previewLoop() {
    if (!audioPlayer.paused && plan.length) {
      const t = audioPlayer.currentTime;
      if (activeSingleSeg) {
        if (!audioPlayer.seeking && t >= activeSingleSeg.end) {
          audioPlayer.pause(); sharedStageVideo.pause();
          activeSingleSeg = null; return;
        }
        if (activeSingleSeg.blobKey && sharedStageVideo.paused) sharedStageVideo.play().catch(() => {});
        renderCompositeFrame(pCtx, Math.max(activeSingleSeg.start, t), 720, 1280, activeSingleSeg, Math.round((t - activeSingleSeg.start) * 30), Math.round(activeSingleSeg.dur * 30), true, activeSingleSeg.blobKey ? sharedStageVideo : null);
      } else {
        let seg = plan[0]; for (const s of plan) if (t >= s.start && t < s.end) { seg = s; break; }
        if (seg.idx !== lastPlayingIdx && !switchingStage) {
          lastPlayingIdx = seg.idx;
          if (seg.blobKey) {
            if (currentStageBlobKey === seg.blobKey) {
              sharedStageVideo.currentTime = seg.trimStart + Math.max(0, t - seg.start);
              if (sharedStageVideo.paused) sharedStageVideo.play().catch(() => {});
            } else {
              switchingStage = true;
              loadStageVideoKey(seg.blobKey, seg.trimStart + Math.max(0, t - seg.start)).then(() => {
                sharedStageVideo.play().catch(() => {});
                switchingStage = false;
              });
            }
          } else sharedStageVideo.pause();
        }
        drawMainPreview(t);
      }
    }
    animId = requestAnimationFrame(previewLoop);
  }

  async function make48kStereoSlice(buffer, startSec, endSec) {
    const sr = buffer.sampleRate;
    const s0 = Math.max(0, Math.floor(startSec * sr)), s1 = Math.min(buffer.length, Math.ceil(endSec * sr));
    const len = Math.max(1, s1 - s0), ch = Math.min(2, buffer.numberOfChannels);
    const slice = new AudioBuffer({ length: len, numberOfChannels: ch, sampleRate: sr });
    for (let c = 0; c < ch; c++) slice.copyToChannel(buffer.getChannelData(c).subarray(s0, s0 + len), c);
    if (sr === 48000 && ch === 2) return slice;
    const off = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(2, Math.max(1, Math.ceil(slice.duration * 48000)), 48000);
    const src = off.createBufferSource(); src.buffer = slice;
    src.connect(off.destination); src.start(0);
    return await off.startRendering();
  }

  // BỘ XUẤT MP4 DÙNG DUY NHẤT 1 THẺ #exportVideo -> SIÊU NHẸ RAM IPHONE!
  async function exportViaMediabunny(totalFrames, startSec, endSec, frameInfoFn, onProgress) {
    await document.fonts.ready;
    const MB = await getMediabunny();
    const { W, H, bitrate, fps } = getQualitySpec();

    const expCanvas = document.createElement('canvas'); expCanvas.width = W; expCanvas.height = H;
    const eCtx = expCanvas.getContext('2d');

    const output = new MB.Output({
      format: new MB.Mp4OutputFormat({ metadataFormat: 'mdta' }),
      target: new MB.BufferTarget(),
    });

    const metaOpt = document.getElementById('deviceMetaSelect').value;
    if (metaOpt !== 'none') {
      const [make, model, sw] = metaOpt.split('|'), now = new Date();
      try {
        output.setMetadataTags({
          date: now, creationTime: now,
          raw: {
            'com.apple.quicktime.make': make, 'com.apple.quicktime.model': model,
            'com.apple.quicktime.software': sw, 'com.apple.quicktime.creationdate': now.toISOString(),
          }
        });
      } catch {}
    }

    const videoSource = new MB.CanvasSource(expCanvas, { codec: 'avc', bitrate });
    output.addVideoTrack(videoSource, { frameRate: fps });

    const audioSlice = await make48kStereoSlice(decodedBuffer, startSec, endSec);
    const audioSource = new MB.AudioBufferSource({ codec: 'aac', bitrate: 128_000 });
    output.addAudioTrack(audioSource);

    await output.start();
    sharedStageVideo.pause();
    let activeExportBlobKey = null;

    try {
      for (let f = 0; f < totalFrames; f++) {
        const info = frameInfoFn(f), seg = info.seg;
        if (seg.blobKey && blobStore[seg.blobKey]) {
          if (activeExportBlobKey !== seg.blobKey) {
            activeExportBlobKey = seg.blobKey;
            exportVideo.src = getBlobUrl(seg.blobKey);
            await ensureVideoReady(exportVideo);
          }
          await seekVideo(exportVideo, seg.trimStart + (info.fLocal / fps));
        }
        renderCompositeFrame(eCtx, startSec + (f / fps), W, H, info.singleOverride ? seg : null, info.fLocal, info.totalLocal, info.includeHook, seg.blobKey ? exportVideo : null);
        await videoSource.add(f / fps, 1 / fps);

        if (onProgress && f % 6 === 0) {
          onProgress(Math.round(((f + 1) / totalFrames) * 100));
          await new Promise(r => setTimeout(r, 0));
        }
      }

      await audioSource.add(audioSlice);
      await output.finalize();
      return new Blob([output.target.buffer], { type: 'video/mp4' });
    } finally {
      // Dọn sạch RAM ngay sau khi xuất xong!
      exportVideo.pause();
      exportVideo.removeAttribute('src');
      exportVideo.load();
    }
  }

  document.getElementById('exportAllZipBtn').addEventListener('click', async () => {
    if (!plan.length || typeof JSZip === 'undefined') return;
    const btn = document.getElementById('exportAllZipBtn'); btn.disabled = true;
    try {

        const totalF = Math.max(2, Math.round(seg.dur * fps));
        const blob = await exportViaMediabunny(totalF, seg.start, seg.end, (f) => ({
          seg, fLocal: f, totalLocal: totalF, singleOverride: true, includeHook: incHook
        }));
        seg.mp4Blob = blob; zip.file(seg.fileName, blob);
      }
      exportStatus.textContent = '🗜️ Đang nén thành file ZIP...';
      triggerDownload(await zip.generateAsync({ type: 'blob' }), 'BO_PHACH_CO_NHAC_CAPCUT.zip');
      exportStatus.textContent = '🎉 Đã tải xong file BO_PHACH_CO_NHAC_CAPCUT.zip!';
    } catch (err) { exportStatus.textContent = '❌ ' + err.message; }
    finally { btn.disabled = false; }
  });

  document.getElementById('exportFinalBtn').addEventListener('click', async () => {
    if (!plan.length || !decodedBuffer) return;
    const btn = document.getElementById('exportFinalBtn'); btn.disabled = true;
    document.getElementById('saveButtonsBox').style.display = 'none';
    try {
      await unlockVideoImmediate(exportVideo);
      const fps = getExportFps(), beatRanges = []; let cumF = 0;
      plan.forEach(s => {
        const fCount = Math.max(2, Math.round(s.dur * fps));
        beatRanges.push({ seg: s, startF: cumF, endF: cumF + fCount, count: fCount });
        cumF += fCount;
      });
      const totalFrames = cumF;
      exportStatus.textContent = `🚀 Đang ghép hình ${fps}fps + âm thanh AAC + Metadata...`;

      finalMp4Blob = await exportViaMediabunny(totalFrames, 0, totalFrames / fps, (f) => {
        let br = beatRanges[0]; for (const r of beatRanges) if (f >= r.startF && f < r.endF) { br = r; break; }
        return { seg: br.seg, fLocal: f - br.startF, totalLocal: br.count, singleOverride: false, includeHook: true };
      }, (pct) => { exportStatus.textContent = `🚀 Đang xuất Video Gộp (${fps}fps + Có Nhạc): ${pct}%`; });

      document.getElementById('saveButtonsBox').style.display = 'grid';
      exportStatus.textContent = '🎉 Đã xuất xong Video Hoàn Chỉnh CÓ ÂM THANH + THẺ IPHONE!';
    } catch (err) { exportStatus.textContent = '❌ Lỗi xuất video: ' + err.message; }
    finally { btn.disabled = false; }
  });

  async function shareToIphonePhotos(blob, fileName) {
    const file = new File([blob], fileName, { type: 'video/mp4' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: fileName }); } catch {}
    } else alert('Hãy bấm nút Tải file rồi mở Tệp -> Chia sẻ -> Lưu video để vào Ảnh iPhone!');
  }
  function triggerDownload(blob, fileName) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileName; a.click();
  }

  document.getElementById('saveIphonePhotosBtn').addEventListener('click', () => {
    if (finalMp4Blob) shareToIphonePhotos(finalMp4Blob, 'IMG_EDIT_HD.mp4');
  });
  document.getElementById('downloadMp4Btn').addEventListener('click', () => {
    if (finalMp4Blob) triggerDownload(finalMp4Blob, 'IMG_EDIT_HD.mp4');
  });

  function encodeWAV(buf) {
    const numCh = Math.min(buf.numberOfChannels, 2), sr = buf.sampleRate, len = buf.length;
    const dataBytes = len * numCh * 2, ab = new ArrayBuffer(44 + dataBytes), v = new DataView(ab);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + dataBytes, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, numCh, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * numCh * 2, true);
    v.setUint16(32, numCh * 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, dataBytes, true);
    const chs = Array.from({ length: numCh }, (_, c) => buf.getChannelData(c));
    let off = 44;
    for (let i = 0; i < len; i++) for (let c = 0; c < numCh; c++) {
      const s = Math.max(-1, Math.min(1, chs[c][i]));
      v.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true); off += 2;
    }
    return new Blob([ab], { type: 'audio/wav' });
  }

  window.addEventListener('DOMContentLoaded', restoreDraftOnLoad);
