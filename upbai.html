<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Creator Studio</title>
  <style>
    :root {
      --bg: #000000;
      --surface: #161823;
      --text: #ffffff;
      --muted: #8a8b91;
      --pink: #fe2c55;
      --cyan: #25f4ee;
      --nav-h: 60px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }

    #env-warn {
      display: none; background: #fe2c55; color: #fff; padding: 12px 14px;
      font-size: 13px; line-height: 1.4; text-align: center; z-index: 100;
    }

    #tab-stage { flex: 1; position: relative; overflow: hidden; }
    .tab-pane { position: absolute; inset: 0; overflow-y: auto; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); display: none; }
    .tab-pane.active { display: block; }

    #bottom-nav {
      height: calc(var(--nav-h) + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background: #000; border-top: 1px solid #222;
      display: flex; align-items: center; justify-content: space-around; z-index: 10;
    }
    .nav-btn { background: none; border: none; color: var(--muted); font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 6px 12px; }
    .nav-btn.active { color: var(--text); font-weight: 600; }

    .btn-plus {
      width: 46px; height: 30px; border-radius: 8px; border: none; cursor: pointer;
      background: #fff; color: #000; font-size: 22px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      box-shadow: -3px 0 0 var(--cyan), 3px 0 0 var(--pink);
    }

    #sheet-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65);
      opacity: 0; pointer-events: none; transition: opacity 0.25s ease; z-index: 50;
    }
    #sheet-backdrop.open { opacity: 1; pointer-events: auto; }

    #tiktok-sheet {
      position: fixed; left: 0; right: 0; bottom: 0;
      max-height: 90vh; max-height: 90dvh; min-height: 40vh;
      background: var(--surface); border-radius: 16px 16px 0 0;
      transform: translateY(100%); transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 60; display: flex; flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom);
    }
    #tiktok-sheet.open { transform: translateY(0); }

    .sheet-header {
      padding: 8px 16px 12px; border-bottom: 1px solid #2a2c38;
      display: flex; align-items: center; justify-content: space-between;
    }
    .sheet-handle { width: 38px; height: 4px; background: #4a4c58; border-radius: 4px; margin: 0 auto 8px; }
    .sheet-close { background: #2a2c38; color: #fff; border: none; width: 28px; height: 28px; border-radius: 50%; font-size: 15px; cursor: pointer; }
    #sheet-body { flex: 1; overflow-y: auto; padding: 16px; position: relative; }
    .modal-pane { display: none; }
    .modal-pane.active { display: block; }
  </style>
</head>
<body>

  <div id="env-warn"></div>
  <main id="tab-stage"></main>

  <nav id="bottom-nav">
    <button class="nav-btn active" data-tab="home"><span>🏠</span><span>Trang chủ</span></button>
    <button class="nav-btn" data-tab="auto-reply"><span>💬</span><span>Auto FB</span></button>
    <button class="btn-plus" id="btn-open-menu">+</button>
    <button class="nav-btn" data-modal="publish-post"><span>🚀</span><span>Đăng bài</span></button>
    <button class="nav-btn" data-tab="settings"><span>⚙️</span><span>Cài đặt</span></button>
  </nav>

  <div id="sheet-backdrop"></div>
  <section id="tiktok-sheet">
    <div style="padding-top: 8px;"><div class="sheet-handle"></div></div>
    <div class="sheet-header">
      <strong id="sheet-title">Công cụ</strong>
      <button class="sheet-close" id="btn-close-sheet">✕</button>
    </div>
    <div id="sheet-body"></div>
  </section>

  <!-- Script thường: Chạy kiểm tra ngay cả khi mở nhầm bằng file:// trên Documents -->
  <script>
    if (window.location.protocol === 'file:') {
      var w = document.getElementById('env-warn');
      w.style.display = 'block';
      w.innerHTML = '⚠️ <b>Bạn đang mở file trực tiếp từ Documents (file://)!</b><br>Trình duyệt chặn nút bấm và không cho tải các file con khi mở kiểu này. Hãy mở bằng <b>Live Server (VS Code)</b> hoặc up lên <b>GitHub Pages</b>!';
    }
  </script>

  <script type="module">
    async function boot() {
      // Nạp app-bus.js an toàn; nếu thiếu file vẫn tự tạo dự phòng để nút bấm không bị chết
      let AppBus;
      try {
        const mod = await import('./core/app-bus.js');
        AppBus = mod.AppBus;
      } catch (err) {
        AppBus = {
          state: {
            media: null,
            gasUrl: localStorage.getItem('gas_url') || '',
            geminiKey: localStorage.getItem('gemini_key') || ''
          },
          listeners: {},
          on(e, fn) { (this.listeners[e] ||= []).push(fn); },
          emit(e, d) { (this.listeners[e] || []).forEach(fn => fn(d)); },
          setMedia(m) { this.state.media = m; this.emit('media:changed', m); },
          setGasUrl(u) { this.state.gasUrl = u.trim(); localStorage.setItem('gas_url', this.state.gasUrl); },
          setGeminiKey(k) { this.state.geminiKey = k.trim(); localStorage.setItem('gemini_key', this.state.geminiKey); }
        };
        window.AppBus = AppBus;
      }

      const loadedCache = new Set();
      const tabStage = document.getElementById('tab-stage');
      const sheetBody = document.getElementById('sheet-body');
      const sheet = document.getElementById('tiktok-sheet');
      const backdrop = document.getElementById('sheet-backdrop');
      const sheetTitle = document.getElementById('sheet-title');

      async function loadHtmlOnce(url, container) {
        if (loadedCache.has(url)) return;
        container.innerHTML = '<p style="color:#8a8b91;text-align:center;padding:30px;">Đang tải module...</p>';
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const html = await res.text();
          container.innerHTML = '';
          const frag = document.createRange().createContextualFragment(html);
          container.appendChild(frag);
          loadedCache.add(url);
        } catch (err) {
          container.innerHTML = `<div style="background:#2a151b;border:1px solid #fe2c55;padding:14px;border-radius:10px;font-size:13px;line-height:1.5;">
            ❌ <b>Không tải được file:</b> <code>${url}</code><br>
            Lý do: ${err.message}<br>
            <span style="color:#ccc;">(Kiểm tra xem bạn đã tạo đúng tên thư mục/tên file này chưa, và có đang mở qua http/https không).</span>
          </div>`;
        }
      }

      async function openTab(name) {
        document.querySelectorAll('.nav-btn[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));

        let pane = document.getElementById(`tab-pane-${name}`);
        if (!pane) {
          pane = document.createElement('div');
          pane.id = `tab-pane-${name}`;
          pane.className = 'tab-pane';
          tabStage.appendChild(pane);
        }
        pane.classList.add('active');
        await loadHtmlOnce(`./tabs/${name}.html`, pane);
      }

      async function openModal(name, title = 'Công cụ') {
        sheetTitle.textContent = title;
        document.querySelectorAll('.modal-pane').forEach(p => p.classList.remove('active'));

        let pane = document.getElementById(`modal-pane-${name}`);
        if (!pane) {
          pane = document.createElement('div');
          pane.id = `modal-pane-${name}`;
          pane.className = 'modal-pane';
          sheetBody.appendChild(pane);
        }
        pane.classList.add('active');
        backdrop.classList.add('open');
        sheet.classList.add('open');
        await loadHtmlOnce(`./modals/${name}.html`, pane);
      }

      function closeModal() {
        backdrop.classList.remove('open');
        sheet.classList.remove('open');
      }

      AppBus.openTab = openTab;
      AppBus.openModal = openModal;
      AppBus.closeModal = closeModal;

      document.querySelectorAll('.nav-btn[data-tab]').forEach(btn => {
        btn.addEventListener('click', () => openTab(btn.dataset.tab));
      });
      document.querySelectorAll('.nav-btn[data-modal]').forEach(btn => {
        btn.addEventListener('click', () => openModal(btn.dataset.modal, 'Đăng bài đa kênh'));
      });
      document.getElementById('btn-open-menu').addEventListener('click', () => openModal('action-menu', 'Chọn công cụ'));
      document.getElementById('btn-close-sheet').addEventListener('click', closeModal);
      backdrop.addEventListener('click', closeModal);

      openTab('home');
    }

    boot();
  </script>
</body>
</html>
