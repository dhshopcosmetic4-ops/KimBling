<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kim Bling Coffee & Tea - Tra Cứu Đơn Hàng</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding-bottom: 50px; }
        header { background: #2196F3; color: white; padding: 16px 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        header h1 { font-size: 18px; margin-bottom: 4px; }
        header p { font-size: 12px; opacity: 0.95; }
        
        .container { padding: 16px; max-width: 500px; margin: 0 auto; }
        
        .search-card { background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 16px; }
        .search-card label { font-size: 13px; font-weight: bold; display: block; margin-bottom: 6px; color: #444; }
        .search-card input { width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; margin-bottom: 10px; }
        .search-card input:focus { border-color: #2196F3; box-shadow: 0 0 5px rgba(33,150,243,0.3); }
        
        .btn-search { width: 100%; background: #2196F3; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(33,150,243,0.3); }
        .btn-search:active { transform: scale(0.98); }

        .back-menu { display: block; text-align: center; margin-top: 15px; color: #1976D2; text-decoration: none; font-size: 13px; font-weight: bold; }

        .result-container { margin-top: 15px; }
        .order-item-card { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); border-left: 4px solid #2196F3; }
        .order-time { font-size: 12px; color: #666; margin-bottom: 4px; }
        .order-details { font-size: 13px; color: #333; margin-bottom: 8px; line-height: 1.4; }
        .order-total { font-weight: bold; color: #d32f2f; font-size: 14px; margin-bottom: 8px; }
        
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .status-1 { background: #ffebee; color: #c62828; } /* Đang chuẩn bị */
        .status-2 { background: #fff3e0; color: #e65100; } /* Chờ shipper */
        .status-3 { background: #e3f2fd; color: #1565c0; } /* Đang giao */
        .status-4 { background: #e8f5e9; color: #2e7d32; } /* Hoàn thành */

        .loading, .error-msg, .info-msg { text-align: center; color: #666; font-size: 14px; padding: 20px; }
    </style>
</head>
<body>

    <header>
        <h1>Kim Bling Coffee & Tea</h1>
        <p>📦 Hệ Thống Tra Cứu Trạng Thái Đơn Hàng</p>
    </header>

    <div class="container">
        <div class="search-card">
            <label for="phoneInput">Nhập số điện thoại đặt hàng của bạn:</label>
            <input type="tel" id="phoneInput" placeholder="Ví dụ: 0938573973" maxlength="11">
            <button class="btn-search" onclick="checkOrderStatus()">🔍 TRA CỨU NGAY</button>
        </div>

        <a href="menu.html" class="back-menu">⬅ Quay lại trang đặt món (Menu)</a>

        <div class="result-container" id="resultContainer">
            <!-- Kết quả tra cứu sẽ hiển thị ở đây -->
        </div>
    </div>

    <script>
        // URL Google Apps Script Web App của bạn
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxPxsg3oxHjUsx8KHyOSIYmjXZw9rY9GFQYf0cHNK3JmBsfdYMJ21PQdhg43HP787GIDQ/exec";

        // Tự động điền số điện thoại nếu khách đã từng đặt hàng lưu trên máy
        window.addEventListener('DOMContentLoaded', () => {
            const savedPhone = localStorage.getItem('kimbling_cust_phone');
            if (savedPhone) {
                document.getElementById('phoneInput').value = savedPhone;
                // Có thể tự động tra cứu luôn nếu muốn:
                // checkOrderStatus();
            }
        });

        async function checkOrderStatus() {
            const phone = document.getElementById('phoneInput').value.trim();
            const container = document.getElementById('resultContainer');

            if (!phone || phone.length < 9) {
                alert("Vui lòng nhập số điện thoại hợp lệ để tra cứu!");
                return;
            }

            container.innerHTML = `<div class="loading">⏳ Đang tìm kiếm đơn hàng...</div>`;

            try {
                // Gọi tới endpoint checkStatus trong file Code.gs của bạn
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?type=checkStatus&phone=${encodeURIComponent(phone)}`);
                const data = await response.json();

                if (data.success && data.orders && data.orders.length > 0) {
                    container.innerHTML = `<h3 style="font-size:14px; margin-bottom:10px; color:#555;">Kết quả tìm thấy cho SĐT: <b>${phone}</b></h3>`;
                    
                    data.orders.forEach(order => {
                        let statusCode = String(order.status || '1').trim();
                        let statusText = "1. Đang chuẩn bị món 👩‍🍳";
                        let statusClass = "status-1";

                        if (statusCode === '2') {
                            statusText = "2. Chờ shipper giao 🛵";
                            statusClass = "status-2";
                        } else if (statusCode === '3') {
                            statusText = "3. Đang giao hàng 🚀";
                            statusClass = "status-3";
                        } else if (statusCode === '4') {
                            statusText = "Đã hoàn thành ✅";
                            statusClass = "status-4";
                        }

                        container.innerHTML += `
                            <div class="order-item-card">
                                <div class="order-time">🕒 Thời gian: ${order.time}</div>
                                <div class="order-details"><b>Món:</b> ${order.items}</div>
                                <div class="order-total">💰 Tổng tiền: ${order.total}</div>
                                <div>
                                    <span class="status-badge ${statusClass}">${statusText}</span>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = `<div class="error-msg">❌ Không tìm thấy đơn hàng nào với số điện thoại này.</div>`;
                }
            } catch (err) {
                console.error("Lỗi tra cứu:", err);
                container.innerHTML = `<div class="error-msg">⚠️ Lỗi kết nối đến máy chủ. Vui lòng thử lại sau.</div>`;
            }
        }
    </script>
</body>
</html>
