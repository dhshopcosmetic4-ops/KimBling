<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sổ Tay Điều Hành - Kim Bling</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #16a34a;
      --success-hover: #15803d;
      --bg: #0f172a;
      --panel-bg: #1e293b;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding: 8px; height: 100vh; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }

    /* MÀN HÌNH CHÍNH TEXTBOX */
    .monitor-screen {
      flex: 1.5;
      background: var(--panel-bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      gap: 4px;
    }

    .monitor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
    }

    .monitor-title { font-size: 0.8rem; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 4px; }
    
    /* PHẦN TỔNG GIÁ TIỀN TO RÕ HƠN */
    .total-badge { 
      background: #0369a1; 
      color: #e0f2fe; 
      padding: 4px 10px; 
      border-radius: 6px; 
      font-size: 0.95rem; 
      font-weight: 800; 
      letter-spacing: 0.5px;
      display: none; 
      border: 1px solid #38bdf8;
    }

    .btn-action-text { background: #475569; color: #f1f5f9; border: none; padding: 3px 6px; border-radius: 6px; font-size: 0.7rem; cursor: pointer; }
    .btn-action-text:hover { background: #64748b; }

    /* TEXTBOX LỚN */
    textarea.monitor-display-box {
      flex: 1.4;
      width: 100%;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      font-size: 18px !important;
      font-weight: 600;
      line-height: 1.5;
      color: #f8fafc;
      outline: none;
      resize: none;
    }
    textarea.monitor-display-box:focus { border-color: #38bdf8; }

    /* TEXTBOX NHỎ */
    textarea.log-time-box {
      flex: 0.3;
      min-height: 26px;
      max-height: 32px;
      width: 100%;
      background: #05080e;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px !important;
      color: #38bdf8;
      outline: none;
      resize: none;
      overflow: hidden;
    }

    /* KHU VỰC ĐIỀU KHIỂN THAO TÁC Ở DƯỚI */
    .control-panel {
      flex: 1;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
    }

    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    .tab-btn { flex: 1; padding: 6px; background: #334155; border: none; font-weight: 600; cursor: pointer; color: var(--text-sub); border-radius: 6px; font-size: 0.8rem; text-align: center; }
    .tab-btn.active { background: var(--primary); color: white; }

    .sub-tabs { display: flex; gap: 4px; margin-bottom: 2px; }
    .sub-tab-btn { flex: 1; padding: 4px; background: #1e293b; border: 1px solid var(--border); font-weight: 600; cursor: pointer; color: var(--text-sub); border-radius: 4px; font-size: 0.75rem; text-align: center; }
    .sub-tab-btn.active { background: #0284c7; color: white; border-color: #38bdf8; }

    .action-row { display: grid; grid-template-columns: 1fr; gap: 4px; }
    .form-group { display: flex; flex-direction: column; gap: 2px; }
    label { font-size: 0.7rem; font-weight: 600; color: var(--text-sub); }

    input, select {
      width: 100%;
      padding: 6px 8px;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 16px !important;
      color: white;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--primary); }

    .search-container { position: relative; display: flex; align-items: center; }
    .search-clear-btn { position: absolute; right: 8px; background: none; border: none; color: #94a3b8; font-size: 14px; cursor: pointer; display: none; }

    .btn { background: var(--primary); color: white; border: none; padding: 8px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; transition: 0.2s; text-align: center; }
    .btn:hover { background: var(--primary-hover); }
    .btn-success { background: var(--success); }
    .btn-success:hover { background: var(--success-hover); }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: var(--danger-hover); }

    .quick-list-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .quick-item { 
      background: #334155; 
      padding: 5px 8px; 
      border-radius: 6px; 
      font-size: 0.75rem; 
      cursor: pointer; 
      white-space: nowrap; 
      color: #f1f5f9; 
      border: 1px solid transparent; 
      display: flex; 
      align-items: center; 
      gap: 6px; 
    }
    .quick-item:hover { border-color: var(--primary); background: #475569; }
    .quick-item.active-item { border-color: #38bdf8; background: #0284c7; }
    
    .delete-item-inline {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: none;
      padding: 2px 4px;
      border-radius: 4px;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .delete-item-inline:hover { background: var(--danger); color: white; }

    .sync-status { font-size: 0.7rem; color: var(--text-sub); }
  </style>
</head>
<body>

  <!-- MÀN HÌNH CHÍNH TEXTBOX & LOG TIME BOX -->
  <div class="monitor-screen">
    <div class="monitor-header">
      <div style="display: flex; align-items: center; gap: 6px;">
        <button class="btn-action-text" onclick="copyMonitorText()" title="Copy toàn bộ nội dung textbox">📋 Copy Tất Cả</button>
        <div class="monitor-title" id="monitorTitle">📝 Sổ Tay Điều Hành</div>
      </div>
      <div style="display: flex; gap: 6px; align-items: center;">
        <button class="btn-action-text" onclick="clearMonitorText()">❌ Xóa Nhanh</button>
        <span class="total-badge" id="autoSumBadge">Tổng: 0đ</span>
        <div class="sync-status" id="syncStatus">Sẵn sàng</div>
      </div>
    </div>
    <!-- TEXTBOX LỚN -->
    <textarea class="monitor-display-box" id="monitorDisplay" placeholder="Gõ sản phẩm và giá tiền... VD: Sọt thái 18k" oninput="calculateAutoSum()"></textarea>
    
    <!-- TEXTBOX NHỎ -->
    <textarea class="log-time-box" id="logTimeDisplay" readonly placeholder="Lần lưu gần nhất..."></textarea>
  </div>

  <!-- BẢNG ĐIỀU KHIỂN THAO TÁC Ở DƯỚI -->
  <div class="control-panel">
    <!-- TABS CHÍNH -->
    <div class="tabs">
      <button class="tab-btn active" id="tabNguyenLieuBtn" onclick="switchMainTab('Nguyên liệu')">📦 Nguyên Liệu</button>
      <button class="tab-btn" id="tabCongThucBtn" onclick="switchMainTab('Công thức')">📖 Công Thức</button>
    </div>

    <!-- SUB TABS NGUYÊN LIỆU -->
    <div class="sub-tabs" id="subTabsNguyenLieu">
      <button class="sub-tab-btn active" id="subCanMuaBtn" onclick="switchSubTab('Cần mua')">🛒 Cần Mua</button>
      <button class="sub-tab-btn" id="subChiTieuBtn" onclick="switchSubTab('Chi tiêu trong ngày')">💸 Chi Tiêu Trong Ngày</button>
    </div>

    <!-- SUB TABS CÔNG THỨC -->
    <div class="sub-tabs" id="subTabsCongThuc" style="display: none;">
      <button class="sub-tab-btn active" id="subLamNLBtn" onclick="switchSubTab('Làm nguyên liệu')">🧪 Làm Nguyên Liệu</button>
      <button class="sub-tab-btn" id="subPhaMonBtn" onclick="switchSubTab('Công thức pha món')">☕ Công Thức Pha Món</button>
    </div>

    <!-- HÀNG TÊN MỤC (CHỈ HIỆN Ở TAB CÔNG THỨC) -->
    <div class="action-row" id="titleInputRow" style="display: none;">
      <div class="form-group">
        <label for="newTen">Tên món / công thức</label>
        <input type="text" id="newTen" placeholder="Nhập tên tiêu đề mục...">
      </div>
    </div>

    <!-- TÌM KIẾM SIÊU THÔNG MINH (CHỈ HIỆN Ở TAB CÔNG THỨC) -->
    <div class="action-row" id="searchRow" style="display: none;">
      <div class="form-group">
        <label for="searchQuery">⚡ Tìm kiếm công thức siêu thông minh</label>
        <div class="search-container">
          <input type="text" id="searchQuery" placeholder="Gõ tên món/nguyên liệu (không dấu)..." oninput="handleSearchInput()">
          <button class="search-clear-btn" id="searchClearBtn" onclick="clearSearchInput()">✖</button>
        </div>
      </div>
    </div>

    <!-- DANH SÁCH MỤC CHỌN KÈM NÚT XÓA RIÊNG -->
    <div class="quick-list-bar" id="quickListBar">
      <div style="color: var(--text-sub); font-size: 0.8rem;">Đang tải dữ liệu...</div>
    </div>

    <!-- NÚT LƯU VÀ XÓA MỤC PIN -->
    <div style="display: flex; gap: 6px; margin-top: auto; border-top: 1px solid var(--border); padding-top: 4px;">
      <button class="btn btn-success" onclick="saveData()" style="flex: 2;">💾 Lưu & Đồng Bộ Google Sheet</button>
      <button class="btn btn-danger" id="deleteItemBtn" onclick="deleteSelectedItemWithPin()" style="flex: 1; display: none;">🗑️ Xóa Mục Này</button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxPxsg3oxHjUsx8KHyOSIYmjXZw9rY9GFQYf0cHNK3JmBsfdYMJ21PQdhg43HP787GIDQ/exec";
    const LOCAL_STORAGE_KEY = "KIMBLING_STORE_DATA";

    let rawData = [];
    let currentMainTab = "Nguyên liệu";
    let currentSubTab = "Cần mua";
    let selectedItemId = null;
    let searchDebounceTimer = null;

    window.onload = function() {
      fetchDataOnceFromGoogleSheet();
    };

    function saveToLocalStorage() {
      localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(rawData));
    }

    function loadFromLocalStorage() {
      const stored = localStorage.getItem(LOCAL_STORAGE_KEY);
      if (stored) {
        try {
          rawData = JSON.parse(stored);
        } catch(e) {
          rawData = [];
        }
      }
    }

    function fetchDataOnceFromGoogleSheet() {
      document.getElementById('syncStatus').innerText = "Tải dữ liệu lần đầu...";
      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          rawData = Array.isArray(data) ? data : [];
          saveToLocalStorage();
          filterQuickList();
          document.getElementById('syncStatus').innerText = "Đã đồng bộ ✓";
        })
        .catch(err => {
          document.getElementById('syncStatus').innerText = "Dùng dữ liệu máy!";
          loadFromLocalStorage();
          filterQuickList();
        });
    }

    function clearMonitorText() {
      document.getElementById('monitorDisplay').value = '';
      document.getElementById('logTimeDisplay').value = '';
      if (currentMainTab === 'Công thức') {
        document.getElementById('newTen').value = '';
      }
      calculateAutoSum();
    }

    function copyMonitorText() {
      const monitorBox = document.getElementById('monitorDisplay');
      monitorBox.select();
      monitorBox.setSelectionRange(0, 99999); // Dành cho thiết bị di động
      
      try {
        navigator.clipboard.writeText(monitorBox.value).then(() => {
          document.getElementById('syncStatus').innerText = "Đã copy nội dung!";
          setTimeout(() => { document.getElementById('syncStatus').innerText = "Đã đồng bộ ✓"; }, 2000);
        }).catch(err => {
          document.execCommand('copy');
          document.getElementById('syncStatus').innerText = "Đã copy nội dung!";
        });
      } catch (e) {
        document.getElementById('syncStatus').innerText = "Lỗi copy!";
      }
    }

    function removeAccents(str) {
      if (!str) return '';
      return str.normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/đ/g, 'd').replace(/Đ/g, 'D')
                .toLowerCase();
    }

    function getCurrentDateTimeStr() {
      const now = new Date();
      const time = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
      const date = now.toLocaleDateString('vi-VN');
      return `${time} ${date}`;
    }

    function calculateAutoSum() {
      const autoSumBadge = document.getElementById('autoSumBadge');
      if (currentMainTab !== "Nguyên liệu") {
        autoSumBadge.style.display = "none";
        return;
      }

      autoSumBadge.style.display = "inline-block";
      const text = document.getElementById('monitorDisplay').value;
      const lines = text.split('\n');
      let total = 0;

      lines.forEach(line => {
        const regexPrice = /(\d[\d\.,]*)\s*(k|đ|ngàn|nghin)/gi;
        let match;
        while ((match = regexPrice.exec(line)) !== null) {
          let numStr = match[1].replace(/\./g, '').replace(/,/g, '');
          let val = parseFloat(numStr);
          if (!isNaN(val)) {
            const unit = match[2].toLowerCase();
            if (unit === 'k') {
              val = val * 1000;
            }
            total += val;
          }
        }
      });

      autoSumBadge.innerText = `Tổng: ${total.toLocaleString('vi-VN')}đ`;
    }

    function switchMainTab(mainTab) {
      currentMainTab = mainTab;
      document.getElementById('tabNguyenLieuBtn').classList.toggle('active', mainTab === 'Nguyên liệu');
      document.getElementById('tabCongThucBtn').classList.toggle('active', mainTab === 'Công thức');

      const titleInputRow = document.getElementById('titleInputRow');
      const searchRow = document.getElementById('searchRow');
      const deleteItemBtn = document.getElementById('deleteItemBtn');
      const logTimeBox = document.getElementById('logTimeDisplay');

      if (mainTab === 'Nguyên liệu') {
        document.getElementById('subTabsNguyenLieu').style.display = 'flex';
        document.getElementById('subTabsCongThuc').style.display = 'none';
        titleInputRow.style.display = 'none';
        searchRow.style.display = 'none';
        deleteItemBtn.style.display = 'none';
        logTimeBox.style.display = 'block';
        currentSubTab = 'Cần mua';
        document.getElementById('subCanMuaBtn').classList.add('active');
        document.getElementById('subChiTieuBtn').classList.remove('active');
      } else {
        document.getElementById('subTabsNguyenLieu').style.display = 'none';
        document.getElementById('subTabsCongThuc').style.display = 'flex';
        titleInputRow.style.display = 'grid';
        searchRow.style.display = 'grid';
        deleteItemBtn.style.display = 'inline-block';
        logTimeBox.style.display = 'none';
        currentSubTab = 'Làm nguyên liệu';
        document.getElementById('subLamNLBtn').classList.add('active');
        document.getElementById('subPhaMonBtn').classList.remove('active');
      }

      calculateAutoSum();
      filterQuickList();
    }

    function switchSubTab(subTab) {
      currentSubTab = subTab;
      if (currentMainTab === 'Nguyên liệu') {
        document.getElementById('subCanMuaBtn').classList.toggle('active', subTab === 'Cần mua');
        document.getElementById('subChiTieuBtn').classList.toggle('active', subTab === 'Chi tiêu trong ngày');
      } else {
        document.getElementById('subLamNLBtn').classList.toggle('active', subTab === 'Làm nguyên liệu');
        document.getElementById('subPhaMonBtn').classList.toggle('active', subTab === 'Công thức pha món');
      }
      filterQuickList();
    }

    function handleSearchInput() {
      const val = document.getElementById('searchQuery').value;
      document.getElementById('searchClearBtn').style.display = val ? 'block' : 'none';

      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => {
        filterQuickList();
      }, 300);
    }

    function clearSearchInput() {
      document.getElementById('searchQuery').value = '';
      document.getElementById('searchClearBtn').style.display = 'none';
      filterQuickList();
    }

    function filterQuickList() {
      const searchQuery = removeAccents(document.getElementById('searchQuery').value.trim());

      let filtered = rawData.filter(item => item.loai === currentSubTab);

      if (currentMainTab === "Công thức" && searchQuery) {
        filtered = filtered.filter(item => {
          const nameClean = removeAccents(item.ten);
          const contentClean = removeAccents(item.noidung);
          return nameClean.includes(searchQuery) || contentClean.includes(searchQuery);
        });
      }

      renderQuickBar(filtered);
    }

    function renderQuickBar(list) {
      const bar = document.getElementById('quickListBar');
      if (list.length === 0) {
        bar.innerHTML = `<div style="color: var(--text-sub); font-size: 0.8rem; padding: 4px;">Chưa có dữ liệu. Hãy nhập ở dưới để tạo mới!</div>`;
        if (currentMainTab === 'Công thức') {
          document.getElementById('newTen').value = '';
        }
        document.getElementById('monitorDisplay').value = '';
        document.getElementById('logTimeDisplay').value = '';
        selectedItemId = null;
        calculateAutoSum();
        return;
      }

      let html = '';
      list.forEach((item, index) => {
        let displayName = item.ten ? item.ten : `${item.loai}`;
        html += `
          <div class="quick-item" id="item-${item.id}">
            <span onclick='displayOnMonitor(${JSON.stringify(item)})' style="flex:1; cursor:pointer;">📌 ${displayName}</span>
            <button class="delete-item-inline" onclick="deleteSpecificItem('${item.id}', '${displayName}')" title="Xóa mục này">🗑️</button>
          </div>
        `;
      });
      bar.innerHTML = html;
      
      if (!selectedItemId || !list.some(i => i.id === selectedItemId)) {
        displayOnMonitor(list[0]);
      } else {
        const activeEl = document.getElementById(`item-${selectedItemId}`);
        if (activeEl) activeEl.classList.add('active-item');
      }
    }

    function displayOnMonitor(item) {
      selectedItemId = item.id;
      document.querySelectorAll('.quick-item').forEach(el => el.classList.remove('active-item'));
      const activeEl = document.getElementById(`item-${item.id}`);
      if (activeEl) activeEl.classList.add('active-item');

      let displayName = item.ten ? item.ten : item.loai;
      document.getElementById('monitorTitle').innerHTML = `📝 Đang xem: <span style="color:#fff;">${displayName}</span>`;
      
      if (currentMainTab === 'Công thức') {
        document.getElementById('newTen').value = item.ten || '';
        document.getElementById('monitorDisplay').value = item.noidung || '';
      } else {
        const fullText = item.noidung || '';
        const splitParts = fullText.split('---LỊCH SỬ LƯU---');
        document.getElementById('monitorDisplay').value = (splitParts[0] || '').trim();
        const logs = (splitParts[1] || '').trim().split('\n');
        document.getElementById('logTimeDisplay').value = logs.length > 0 && logs[0] !== "" ? logs[logs.length - 1] : (item.ngay ? `Ngày tạo: ${item.ngay}` : '');
      }

      calculateAutoSum();
    }

    function deleteSpecificItem(itemId, itemName) {
      const pin = prompt(`🔐 Nhập mã PIN chủ quán để xóa mục "${itemName}":`);
      if (!pin) return;

      document.getElementById('syncStatus').innerText = "Đang xóa...";
      rawData = rawData.filter(item => item.id !== itemId);
      saveToLocalStorage();
      filterQuickList();

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "DELETE_SINGLE_NOTE", id: itemId, pin: pin })
      })
      .then(res => res.json())
      .then(res => {
        alert(res.message);
        document.getElementById('syncStatus').innerText = "Đã đồng bộ ✓";
      })
      .catch(err => {
        document.getElementById('syncStatus').innerText = "Lỗi kết nối khi xóa trên Sheet!";
      });
    }

    function deleteSelectedItemWithPin() {
      if (!selectedItemId) return alert("Vui lòng chọn mục cần xóa!");
      deleteSpecificItem(selectedItemId, document.getElementById('newTen').value || currentSubTab);
    }

    function saveData() {
      let ten = "";
      let currentText = document.getElementById('monitorDisplay').value.trim();
      const timeStr = getCurrentDateTimeStr();

      if (currentMainTab === 'Nguyên liệu') {
        ten = currentSubTab;
        const latestLog = `Đã lưu lúc: ${timeStr}`;
        document.getElementById('logTimeDisplay').value = latestLog;
      } else {
        ten = document.getElementById('newTen').value.trim();
        if (!ten) return alert("Vui lòng nhập Tên món / công thức!");
      }

      const existingLogs = document.getElementById('logTimeDisplay').value.trim();
      const combinedNoidung = currentMainTab === 'Nguyên liệu' 
        ? `${currentText}\n\n---LỊCH SỬ LƯU---\n${existingLogs}` 
        : currentText;

      const payload = {
        action: "ADD",
        loai: currentSubTab,
        danhmuc: currentMainTab,
        ten: ten,
        noidung: combinedNoidung,
        ngay: new Date().toISOString().split('T')[0]
      };

      document.getElementById('syncStatus').innerText = "Đang tính toán lưu. Vui lòng đợi, đừng tắt ngang App...";

      let existingIndex = -1;
      if (currentMainTab === 'Nguyên liệu') {
        existingIndex = rawData.findIndex(item => item.loai === currentSubTab);
      } else {
        existingIndex = rawData.findIndex(item => item.loai === currentSubTab && removeAccents(item.ten) === removeAccents(ten));
      }

      if (existingIndex !== -1) {
        payload.id = rawData[existingIndex].id;
        rawData[existingIndex] = { ...rawData[existingIndex], ...payload };
      } else {
        payload.id = 'LOCAL_' + Date.now();
        rawData.unshift(payload);
      }

      saveToLocalStorage();
      filterQuickList();

      fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) })
      .then(res => res.json())
      .then(res => {
        document.getElementById('syncStatus').innerText = "Đã đồng bộ ✓";
      })
      .catch(err => {
        document.getElementById('syncStatus').innerText = "Lưu máy OK (Sheet lỗi kết nối)!";
      });
    }
  </script>
</body>
</html>
