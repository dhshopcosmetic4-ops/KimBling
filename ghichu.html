<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sổ Tay Điều Hành - Kim Bling</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #16a34a;
      --success-hover: #15803d;
      --bg: #0f172a;
      --panel-bg: #1e293b;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding: 8px; height: 100vh; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }

    /* MÀN HÌNH CHÍNH TÍCH HỢP Ô NHẬP LIỆU TO & TỰ TÍNH TỔNG */
    .monitor-screen {
      flex: 1.3;
      background: var(--panel-bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .monitor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
      margin-bottom: 6px;
    }

    .monitor-title { font-size: 0.85rem; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
    
    /* HIỂN THỊ TỔNG SỐ TỰ ĐỘNG BÊN GÓC PHẢI TIÊU ĐỀ */
    .total-badge { background: #0369a1; color: #bae6fd; padding: 2px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; }

    /* KHUNG SOẠN THẢO - BẮT BUỘC FONT 16PX TRÁNH ZOOM IPHONE */
    textarea.monitor-display-box {
      flex: 1;
      width: 100%;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 16px !important;
      line-height: 1.5;
      color: #e2e8f0;
      outline: none;
      resize: none;
    }
    textarea.monitor-display-box:focus { border-color: #38bdf8; }

    /* KHU VỰC ĐIỀU KHIỂN THAO TÁC Ở DƯỚI */
    .control-panel {
      flex: 1;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
    }

    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    .tab-btn { flex: 1; padding: 6px; background: #334155; border: none; font-weight: 600; cursor: pointer; color: var(--text-sub); border-radius: 6px; font-size: 0.8rem; text-align: center; }
    .tab-btn.active { background: var(--primary); color: white; }

    .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .form-group { display: flex; flex-direction: column; gap: 2px; }
    label { font-size: 0.7rem; font-weight: 600; color: var(--text-sub); }

    input, select {
      width: 100%;
      padding: 8px 10px;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 16px !important;
      color: white;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--primary); }

    .btn { background: var(--primary); color: white; border: none; padding: 8px 10px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; transition: 0.2s; text-align: center; }
    .btn:hover { background: var(--primary-hover); }
    .btn-success { background: var(--success); }
    .btn-success:hover { background: var(--success-hover); }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: var(--danger-hover); }

    .quick-list-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .quick-item { background: #334155; padding: 6px 10px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; white-space: nowrap; color: #f1f5f9; border: 1px solid transparent; }
    .quick-item:hover { border-color: var(--primary); background: #475569; }
    .quick-item.active-item { border-color: #38bdf8; background: #0284c7; }
    
    .sync-status { font-size: 0.7rem; color: var(--text-sub); }
  </style>
</head>
<body>

  <!-- MÀN HÌNH CHÍNH VỪA NHẬP VỪA TỰ TÍNH TỔNG SỐ -->
  <div class="monitor-screen">
    <div class="monitor-header">
      <div class="monitor-title" id="monitorTitle">📝 Soạn Thảo & Kho</div>
      <div style="display: flex; gap: 6px; align-items: center;">
        <span class="total-badge" id="autoSumBadge">Tổng: 0</span>
        <div class="sync-status" id="syncStatus">Sẵn sàng</div>
      </div>
    </div>
    <!-- KHUNG TEXTAREA KÈM SỰ KIỆN TỰ TÍNH TỔNG KHI GÕ -->
    <textarea class="monitor-display-box" id="monitorDisplay" placeholder="Nhập theo dòng: Tên [Số lượng]&#10;VD:&#10;Tra den 60&#10;Tac 20" oninput="calculateAutoSum()"></textarea>
  </div>

  <!-- BẢNG ĐIỀU KHIỂN THAO TÁC Ở DƯỚI -->
  <div class="control-panel">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('Nguyên liệu gần hết')">⚠️ Nguyên Liệu Gần Hết</button>
      <button class="tab-btn" onclick="switchTab('Công thức làm nguyên liệu')">📖 Công Thức Pha Chế</button>
    </div>

    <div class="action-row">
      <div class="form-group">
        <label for="newTen">Tên nguyên liệu / món chung</label>
        <input type="text" id="newTen" placeholder="Tên tiêu đề mục...">
      </div>
      <div class="form-group">
        <label for="newLoai">Loại mục</label>
        <select id="newLoai" onchange="toggleNewCategory()">
          <option value="Nguyên liệu gần hết">Gần hết</option>
          <option value="Công thức làm nguyên liệu">Công thức</option>
        </select>
      </div>
    </div>

    <div class="action-row" id="recipeExtraRow" style="display: none;">
      <div class="form-group">
        <label for="newDanhMuc">Danh mục</label>
        <input type="text" id="newDanhMuc" placeholder="Nhập danh mục...">
      </div>
      <div class="form-group">
        <label for="searchCategory">Lọc theo danh mục</label>
        <select id="searchCategory" onchange="filterQuickList()">
          <option value="">-- Tất cả --</option>
        </select>
      </div>
    </div>

    <div class="action-row">
      <div class="form-group">
        <label for="searchQuery">🔍 Tìm nhanh</label>
        <input type="text" id="searchQuery" placeholder="Nhập tên cần tìm..." oninput="filterQuickList()">
      </div>
      <div class="form-group">
        <label for="filterDate">Lọc ngày</label>
        <input type="date" id="filterDate" onchange="filterQuickList()">
      </div>
    </div>

    <div class="quick-list-bar" id="quickListBar">
      <div style="color: var(--text-sub); font-size: 0.8rem;">Đang tải dữ liệu...</div>
    </div>

    <div style="display: flex; gap: 6px; margin-top: auto; border-top: 1px solid var(--border); padding-top: 6px;">
      <button class="btn btn-success" onclick="saveData()" style="flex: 1.5;">💾 Lưu Mục Này</button>
      <button class="btn btn-danger" onclick="deleteByDate()" style="flex: 1;">🗑️ Xóa Ngày</button>
      <input type="date" id="deleteDate" style="flex: 1;">
    </div>
  </div>

  <script>
    // BẮT BUỘC: Giữ nguyên URL Apps Script của bạn
    const SCRIPT_URL = "URL_APPS_SCRIPT_CUA_BAN_O_BUOC_2";

    let rawData = [];
    let currentTab = "Nguyên liệu gần hết";
    let selectedItemId = null;

    window.onload = function() {
      document.getElementById('deleteDate').valueAsDate = new Date();
      fetchData();
    };

    function toggleNewCategory() {
      const loai = document.getElementById('newLoai').value;
      const isRecipe = (loai === "Công thức làm nguyên liệu");
      document.getElementById('recipeExtraRow').style.display = isRecipe ? "grid" : "none";
    }

    // HÀM TỰ ĐỘNG QUÉT VÀ CỘNG DỒN SỐ TỪ CÁC DÒNG TEXTAREA
    function calculateAutoSum() {
      const text = document.getElementById('monitorDisplay').value;
      const lines = text.split('\n');
      let total = 0;

      lines.forEach(line => {
        // Lọc ra các con số nằm ở cuối hoặc trong dòng
        const matches = line.match(/-?\d+(\.\d+)?/g);
        if (matches) {
          // Lấy con số cuối cùng của dòng làm số lượng (ví dụ "Tra den 60" -> lấy 60)
          const lastNum = parseFloat(matches[matches.length - 1]);
          if (!isNaN(lastNum)) {
            total += lastNum;
          }
        }
      });

      document.getElementById('autoSumBadge').innerText = `Tổng: ${total}`;
    }

    function fetchData() {
      document.getElementById('syncStatus').innerText = "Đang đồng bộ...";
      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          rawData = data;
          updateCategoryDropdown();
          filterQuickList();
          document.getElementById('syncStatus').innerText = "Đã đồng bộ ✓";
        })
        .catch(err => {
          document.getElementById('syncStatus').innerText = "Lỗi kết nối!";
        });
    }

    function switchTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.includes(tabName === 'Nguyên liệu gần hết' ? 'Gần Hết' : 'Phao Chế'));
      });
      document.getElementById('newLoai').value = tabName;
      toggleNewCategory();
      filterQuickList();
    }

    function updateCategoryDropdown() {
      const categories = [...new Set(rawData
        .filter(item => item.loai === "Công thức làm nguyên liệu" && item.danhmuc)
        .map(item => item.danhmuc))];

      const select = document.getElementById('searchCategory');
      select.innerHTML = '<option value="">-- Tất cả --</option>';
      categories.forEach(cat => {
        select.innerHTML += `<option value="${cat}">${cat}</option>`;
      });
    }

    function filterQuickList() {
      const filterDate = document.getElementById('filterDate').value;
      const searchCategory = document.getElementById('searchCategory').value;
      const searchQuery = document.getElementById('searchQuery').value.toLowerCase().trim();

      let filtered = rawData.filter(item => item.loai === currentTab);

      if (filterDate) filtered = filtered.filter(item => item.ngay === filterDate);
      if (currentTab === "Công thức làm nguyên liệu" && searchCategory) {
        filtered = filtered.filter(item => item.danhmuc === searchCategory);
      }
      if (searchQuery) {
        filtered = filtered.filter(item => 
          (item.ten && item.ten.toLowerCase().includes(searchQuery)) ||
          (item.noidung && item.noidung.toLowerCase().includes(searchQuery))
        );
      }

      renderQuickBar(filtered);
    }

    function renderQuickBar(list) {
      const bar = document.getElementById('quickListBar');
      if (list.length === 0) {
        bar.innerHTML = `<div style="color: var(--text-sub); font-size: 0.8rem; padding: 4px;">Chưa có dữ liệu. Hãy nhập ở dưới để tạo mới!</div>`;
        document.getElementById('newTen').value = '';
        document.getElementById('monitorDisplay').value = '';
        calculateAutoSum();
        return;
      }

      let html = '';
      list.forEach((item) => {
        html += `<div class="quick-item" id="item-${item.id}" onclick='displayOnMonitor(${JSON.stringify(item)})'>📌 ${item.ten}</div>`;
      });
      bar.innerHTML = html;
      
      displayOnMonitor(list[0]);
    }

    function displayOnMonitor(item) {
      selectedItemId = item.id;
      document.querySelectorAll('.quick-item').forEach(el => el.classList.remove('active-item'));
      const activeEl = document.getElementById(`item-${item.id}`);
      if (activeEl) activeEl.classList.add('active-item');

      document.getElementById('monitorTitle').innerHTML = `📝 Đang xem: <span style="color:#fff;">${item.ten}</span> (${item.ngay})`;
      document.getElementById('newTen').value = item.ten || '';
      document.getElementById('newDanhMuc').value = item.danhmuc || '';
      document.getElementById('monitorDisplay').value = item.noidung || '';
      
      // Tính lại tổng tự động ngay khi load dữ liệu lên màn hình
      calculateAutoSum();
    }

    function saveData() {
      const ten = document.getElementById('newTen').value.trim();
      const noidung = document.getElementById('monitorDisplay').value.trim();
      
      if (!ten) return alert("Vui lòng nhập Tên mục ở bảng điều khiển bên dưới!");

      const payload = {
        action: "ADD",
        loai: document.getElementById('newLoai').value,
        danhmuc: document.getElementById('newDanhMuc').value.trim(),
        ten: ten,
        noidung: noidung,
        ngay: new Date().toISOString().split('T')[0]
      };

      document.getElementById('syncStatus').innerText = "Đang lưu...";
      fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) })
      .then(res => res.json())
      .then(res => {
        fetchData();
      });
    }

    function deleteByDate() {
      const targetDate = document.getElementById('deleteDate').value;
      if (!targetDate) return alert("Chọn ngày cần xóa!");
      if (!confirm(`Xóa toàn bộ dữ liệu ngày ${targetDate} trên Google Sheet?`)) return;

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "DELETE_BY_DATE", ngay: targetDate })
      })
      .then(res => res.json())
      .then(res => {
        alert(res.message);
        fetchData();
      });
    }
  </script>
</body>
</html>
