<style>
  .set-group { display: flex; flex-direction: column; gap: 12px; background: #161823; padding: 16px; border-radius: 14px; margin-bottom: 14px; }
  .set-label { font-size: 13px; color: #ccc; margin-bottom: -6px; }
  .set-row { display: flex; gap: 8px; }
  .set-input { flex: 1; width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #0d0e15; color: #fff; font-size: 14px; }
  .set-eye { padding: 0 12px; border-radius: 8px; border: 1px solid #333; background: #222533; color: #fff; cursor: pointer; }
  .set-btn { padding: 13px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; background: #fe2c55; color: #fff; font-size: 15px; }
  .set-btn:disabled { opacity: 0.6; }
  .set-msg { font-size: 13px; color: #25f4ee; min-height: 20px; line-height: 1.5; }
</style>

<h2 style="margin-bottom: 14px;">Cài đặt kết nối</h2>
<div class="set-group">
  <div class="set-label">1. Link Web App Google Apps Script (/exec):</div>
  <input class="set-input" id="set-gas-url" type="url" placeholder="https://script.google.com/macros/s/.../exec" />

  <div class="set-label">2. Gemini API Key:</div>
  <div class="set-row">
    <input class="set-input" id="set-gemini-key" type="password" autocomplete="off" placeholder="AIzaSy..." />
    <button class="set-eye" id="set-toggle-key" type="button">👁️</button>
  </div>

  <div class="set-label">3. Facebook Page ID (Fanpage):</div>
  <input class="set-input" id="set-fb-id" type="text" placeholder="VD: 1449848791548930" />

  <div class="set-label">4. Facebook Page Token (hoặc User Token để tự đổi):</div>
  <div class="set-row">
    <input class="set-input" id="set-fb-token" type="password" autocomplete="off" placeholder="EAA..." />
    <button class="set-eye" id="set-toggle-fb" type="button">👁️</button>
  </div>

  <button class="set-btn" id="set-save-btn" type="button">Lưu tất cả & Kiểm tra kết nối</button>
  <div class="set-msg" id="set-msg"></div>
</div>

<script type="module">
  const urlInput = document.getElementById('set-gas-url');
  const keyInput = document.getElementById('set-gemini-key');
  const fbIdInput = document.getElementById('set-fb-id');
  const fbTokenInput = document.getElementById('set-fb-token');
  const saveBtn = document.getElementById('set-save-btn');
  const msg = document.getElementById('set-msg');

  urlInput.value = AppBus.state.gasUrl || localStorage.getItem('gas_url') || '';
  keyInput.value = AppBus.state.geminiKey || localStorage.getItem('gemini_key') || '';
  fbIdInput.value = AppBus.state.fbPageId || localStorage.getItem('fb_page_id') || '';
  fbTokenInput.value = AppBus.state.fbPageToken || localStorage.getItem('fb_page_token') || '';

  document.getElementById('set-toggle-key').onclick = () => {
    keyInput.type = keyInput.type === 'password' ? 'text' : 'password';
  };
  document.getElementById('set-toggle-fb').onclick = () => {
    fbTokenInput.type = fbTokenInput.type === 'password' ? 'text' : 'password';
  };

  function saveFbToLocal(id, token) {
    if (typeof AppBus.setFacebookConfig === 'function') {
      AppBus.setFacebookConfig(id, token);
    } else {
      AppBus.state.fbPageId = id;
      AppBus.state.fbPageToken = token;
      localStorage.setItem('fb_page_id', id);
      localStorage.setItem('fb_page_token', token);
    }
  }

  saveBtn.onclick = async () => {
    try {
      const url = urlInput.value.trim();
      const key = keyInput.value.trim();
      const fbId = fbIdInput.value.trim();
      const fbToken = fbTokenInput.value.trim();

      if (!url.startsWith('https://script.google.com/')) {
        msg.textContent = '❌ Link GAS phải bắt đầu bằng https://script.google.com/...';
        return;
      }

      AppBus.setGasUrl(url);
      AppBus.setGeminiKey(key);
      saveFbToLocal(fbId, fbToken);

      saveBtn.disabled = true;
      msg.textContent = '⏳ Đã lưu trên iPhone. Đang kiểm tra GAS & Facebook Page...';

      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'ping',
          fbPageId: fbId,
          fbPageToken: fbToken
        })
      });
      const json = await res.json();
      if (json.ok) {
        if (json.upgradedPageToken) {
          fbTokenInput.value = json.upgradedPageToken;
          saveFbToLocal(fbId, json.upgradedPageToken);
        }
        let html = `✅ ${json.msg}<br>${key ? '🔑 Đã lưu Gemini Key.' : '⚠️ Chưa có Gemini Key!'}`;
        if (json.fbCheck) html += `<br>${json.fbCheck}`;
        msg.innerHTML = html;
      } else {
        msg.textContent = '⚠️ GAS báo lỗi: ' + (json.error || 'Không rõ');
      }
    } catch (err) {
      msg.textContent = '❌ Lỗi kiểm tra: ' + err.message;
    } finally {
      saveBtn.disabled = false;
    }
  };
</script>
