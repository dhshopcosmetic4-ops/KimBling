<style>
  .home-card { background: #161823; border: 1px solid #262938; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .home-btn { width: 100%; padding: 13px; border: none; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 10px; }
</style>

<h2 style="margin-bottom: 14px;">Creator Studio</h2>

<div class="home-card">
  <h3 style="margin-bottom: 6px;">1. Nén Video trên iPhone</h3>
  <p style="font-size: 13px; color: #9a9ca8;">Giảm video 55MB (1080p) xuống ~25MB bằng chip iPhone trước khi đẩy lên AI.</p>
  <button class="home-btn" style="background:#fe2c55; color:#fff;" id="home-go-vid">🎬 Mở máy nén Video</button>
</div>

<div class="home-card">
  <h3 style="margin-bottom: 6px;">2. Nén Ảnh (Chuẩn Squoosh)</h3>
  <p style="font-size: 13px; color: #9a9ca8;">Giảm 60–80% dung lượng ảnh sản phẩm mà vẫn giữ độ nét.</p>
  <button class="home-btn" style="background:#25f4ee; color:#000;" id="home-go-img">🖼️ Mở máy nén Ảnh</button>
</div>

<div class="home-card">
  <h3 style="margin-bottom: 6px;">Trạng thái hệ thống</h3>
  <p id="home-gas-status" style="font-size: 13px; color: #9a9ca8;"></p>
</div>

<script type="module">
  document.getElementById('home-go-vid').onclick = () => AppBus.openModal('compress-vid', 'Nén Video iPhone');
  document.getElementById('home-go-img').onclick = () => AppBus.openModal('compress-img', 'Nén Ảnh Squoosh');

  const st = document.getElementById('home-gas-status');
  st.textContent = AppBus.state.gasUrl
    ? '✅ Đã kết nối link Google Apps Script.'
    : '⚠️ Chưa cài link Google Apps Script (Vào tab Cài đặt ⚙️ để nhập).';
</script>
