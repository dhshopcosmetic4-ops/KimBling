<style>
  .home-card { background: #161823; border: 1px solid #262938; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .home-btn { width: 100%; padding: 13px; border: none; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 10px; }
  .home-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .home-log-item { background: #10121a; border: 1px solid #262938; border-radius: 10px; padding: 10px; margin-top: 8px; font-size: 12px; line-height: 1.5; }
  .home-log-item a { color: #25f4ee; text-decoration: none; font-weight: 600; }
</style>

<h2 style="margin-bottom: 14px;">Creator Studio</h2>

<div class="home-card">
  <h3 style="margin-bottom: 6px;">1. Công cụ Nén trên iPhone</h3>
  <div class="home-row" style="margin-top:0;">
    <button class="home-btn" style="background:#fe2c55; color:#fff; font-size:14px;" id="home-go-vid">🎬 Nén Video</button>
    <button class="home-btn" style="background:#25f4ee; color:#000; font-size:14px;" id="home-go-img">🖼️ Nén Ảnh</button>
  </div>
</div>

<div class="home-card">
  <h3 style="margin-bottom: 6px;">📦 Bộ nhớ tạm trên máy</h3>
  <p id="home-temp-info" style="font-size: 13px; color: #9a9ca8; line-height: 1.5;"></p>
  <div class="home-row">
    <button class="home-btn" style="margin-top:0; background:#2a2e40; color:#fff; font-size:13px;" id="home-go-pub">🚀 Mở bài đang làm</button>
    <button class="home-btn" style="margin-top:0; background:#3c2330; color:#ff7b93; font-size:13px;" id="home-clear-temp">🧹 Quét dọn tạm</button>
  </div>
</div>

<div class="home-card">
  <h3 style="margin-bottom: 6px;">📋 Nhật ký đăng (Google Sheets)</h3>
  <p style="font-size:12px; color:#8a8b91;">Dùng để kiểm tra lại kết quả nếu iPhone bị rớt mạng lúc vừa gửi.</p>
  <button class="home-btn" style="background:#2a2e40; color:#25f4ee; font-size:13px;" id="home-load-logs">🔍 Tải nhật ký mới nhất</button>
  <div id="home-logs-list"></div>
</div>

<script type="module">
  document.getElementById('home-go-vid').onclick = () => AppBus.openModal('compress-vid', 'Nén Video iPhone');
  document.getElementById('home-go-img').onclick = () => AppBus.openModal('compress-img', 'Nén Ảnh Squoosh');
  document.getElementById('home-go-pub').onclick = () => AppBus.openModal('publish-post', 'Đăng bài đa kênh');

  const tempEl = document.getElementById('home-temp-info');
  const logsEl = document.getElementById('home-logs-list');

  function refreshTempInfo() {
    const m = AppBus.state.media;
    const d = AppBus.getDraftText();
    const mediaTxt = m
      ? `File: <b style="color:#25f4ee;">${m.name}</b> (${(m.size / 1048576).toFixed(2)} MB)`
      : 'File: <i>Trống</i>';
    const prodName = d && d['pub-product'] ? d['pub-product'].trim() : '';
    const draftTxt = prodName
      ? `Nháp nội dung: <b style="color:#25f4ee;">${prodName}</b>`
      : 'Nháp nội dung: <i>Trống</i>';
    tempEl.innerHTML = `${mediaTxt}<br>${draftTxt}`;
  }

  document.getElementById('home-clear-temp').onclick = async () => {
    await AppBus.clearTempAll();
    refreshTempInfo();
    tempEl.innerHTML = '🧹 <b>Đã quét dọn sạch sẽ bộ nhớ tạm!</b>';
  };

  document.getElementById('home-load-logs').onclick = async () => {
    const gasUrl = AppBus.state.gasUrl || localStorage.getItem('gas_url') || '';
    if (!gasUrl) {
      logsEl.innerHTML = '<div class="home-log-item">⚠️ Chưa nhập Link GAS ở Tab Cài đặt ⚙️</div>';
      return;
    }
    logsEl.innerHTML = '<div class="home-log-item">⏳ Đang đọc Google Sheets...</div>';
    try {
      const res = await fetch(gasUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'get_logs' })
      });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error);
      if (!json.logs.length) {
        logsEl.innerHTML = '<div class="home-log-item">Chưa có bài đăng nào được ghi nhận.</div>';
        return;
      }
      logsEl.innerHTML = json.logs.map(row => `
        <div class="home-log-item">
          <div><b>${row.product || row.fileName}</b> <span style="color:#8a8b91;">(${row.time})</span></div>
          <div>▶️ YouTube: ${row.ytStatus} ${row.ytLink ? `— <a href="${row.ytLink}" target="_blank">Mở link</a>` : ''}</div>
          <div>📘 Facebook: ${row.fbStatus} ${row.fbLink ? `— <a href="${row.fbLink}" target="_blank">Mở link</a>` : ''}</div>
          <div>🎵 TikTok: ${row.ttStatus || '—'}</div>
        </div>
      `).join('');
    } catch (err) {
      logsEl.innerHTML = `<div class="home-log-item">❌ Lỗi tải nhật ký: ${err.message}</div>`;
    }
  };

  AppBus.on('media:changed', refreshTempInfo);
  AppBus.on('media:cleared', refreshTempInfo);
  AppBus.on('draft:changed', refreshTempInfo);
  AppBus.on('draft:cleared', refreshTempInfo);
  refreshTempInfo();
</script>
