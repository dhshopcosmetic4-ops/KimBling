<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI V5 - Xuất Video Phách Mẫu MP4 cho CapCut</title>
  <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #070b14; color: #f8fafc; padding: 14px; }
    .wrap { max-width: 780px; margin: 0 auto; }
    h1 { font-size: 18px; text-align: center; color: #38bdf8; margin: 4px 0 14px; }
    .card { background: #11192b; border-radius: 14px; padding: 15px; margin-bottom: 14px; border: 1px solid #243352; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 5px; font-weight: 600; }
    input, textarea, select, button {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #334155;
      background: #070b14; color: #fff; font-size: 14px; margin-bottom: 10px;
    }
    textarea { min-height: 76px; resize: vertical; line-height: 1.45; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button { background: linear-gradient(135deg, #0284c7, #2563eb); border: none; font-weight: 700; cursor: pointer; }
    button.orange { background: linear-gradient(135deg, #ea580c, #dc2626); }
    button.green { background: linear-gradient(135deg, #059669, #10b981); }
    button.purple { background: linear-gradient(135deg, #7c3aed, #db2777); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .ai-badge {
      display: none; padding: 10px; border-radius: 10px; background: rgba(56,189,248,0.12);
      border: 1px solid #0284c7; color: #7dd3fc; font-size: 13px; margin-bottom: 12px; text-align: center;
    }
    .stage-wrap { display: flex; justify-content: center; margin-bottom: 12px; }
    .stage {
      position: relative; width: 250px; height: 390px; background: #000; border-radius: 16px;
      overflow: hidden; border: 2px solid #334155;
    }
    .video-inner {
      position: absolute; inset: -14px; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1d4ed8, #7e22ce, #be123c); will-change: transform, filter;
    }
    .video-inner video { width: 100%; height: 100%; object-fit: cover; display: none; }
    .flash-bg { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 3; }
    .hud-top {
      position: absolute; top: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between;
      font-size: 10px; z-index: 5; pointer-events: none;
    }
    .pill { background: rgba(0,0,0,0.65); padding: 3px 8px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.2); }
    #titleLayer {
      position: absolute; left: 10px; right: 10px; top: 38%; text-align: center;
      font-size: 18px; font-weight: 900; text-transform: uppercase; color: #fde047;
      text-shadow: 0 3px 14px #000; z-index: 4; line-height: 1.25;
    }
    #contentLayer {
      position: absolute; left: 12px; right: 12px; bottom: 42px; text-align: center;
      font-size: 15px; font-weight: 800; color: #fff; padding: 7px 9px; border-radius: 8px;
      background: rgba(0,0,0,0.58); z-index: 4; opacity: 0;
    }
    audio { width: 100%; margin: 6px 0 10px; }
    .status { font-size: 13px; color: #34d399; text-align: center; min-height: 20px; margin-bottom: 6px; }
    .clip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 8px; margin-top: 10px; }
    .clip-btn {
      background: #1e293b; border: 1px solid #38bdf8; color: #e0f2fe; padding: 8px;
      border-radius: 9px; font-size: 12px; text-align: center; cursor: pointer; text-decoration: none; display: block;
    }
    .clip-btn b { display: block; color: #fde047; margin-bottom: 2px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { border-bottom: 1px solid #243352; padding: 7px 5px; text-align: left; vertical-align: top; }
    th { color: #38bdf8; }
    .tag { display: inline-block; padding: 2px 6px; border-radius: 5px; font-size: 11px; font-weight: 700; }
    .tag-hook { background: #dc2626; color: #fff; }
    .tag-dance { background: #7c3aed; color: #fff; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>🎬 AI V5: Xuất Bộ Video Phách Mẫu MP4 + Lớp Phủ Chữ vào CapCut</h1>

  <div class="card">
    <div class="row">
      <div>
        <label>1. File Nhạc (Video TikTok / Quay iPhone / MP3)</label>
        <input type="file" id="audioFile" accept="video/*,audio/*" />
      </div>
      <div>
        <label>2. Video thật để xem thử trước (Tùy chọn)</label>
        <input type="file" id="videoFiles" accept="video/*" multiple />
      </div>
    </div>

    <div class="row">
      <div>
        <label>3. Ý chính video (3-5 chữ)</label>
        <input type="text" id="topicInput" value="ba anh em nhảy phố" />
      </div>
      <div>
        <label>Tông viết tiêu đề AI</label>
        <select id="toneSelect">
          <option value="shock">Gây sốc / Tò mò cực mạnh</option>
          <option value="hype">Bắt trend / Sôi động</option>
          <option value="emotion">Cảm xúc / Kỷ niệm</option>
        </select>
      </div>
    </div>

    <button class="orange" id="genCopyBtn">✍️ AI Tự Soạn Tiêu Đề Sốc & Nội Dung (0đ)</button>

    <div class="row">
      <div>
        <label>Tiêu đề chính (3s đầu gây tò mò)</label>
        <input type="text" id="titleInput" value="ĐÚNG GIÂY THỨ 3 SẼ THẤY CẢNH BẤT NGỜ!" />
      </div>
      <div>
        <label>Số phách video mẫu muốn xuất</label>
        <input type="number" id="beatCount" value="10" min="5" max="20" />
      </div>
    </div>

    <label>Nội dung truyền tải theo phách</label>
    <textarea id="contentInput">3 giây đầu nhìn cứ tưởng bình thường
Đúng lúc nhạc nổ: ba anh em bung lụa
Nhịp trống đập tới đâu cuốn tới đó
Khoảnh khắc chất chơi không thể quên
Xem tới cuối mới thấy cái kết cực cháy</textarea>

    <button id="analyzeBtn" disabled>🤖 Bước 1: Phân Tích Nhạc & Lên Kịch Bản</button>
    <div class="status" id="statusText"></div>
  </div>

  <div class="card" id="previewCard" style="display:none;">
    <div class="ai-badge" id="aiBadge"></div>
    <div class="stage-wrap">
      <div class="stage">
        <div class="hud-top">
          <span class="pill" id="hudBeat">Phách 1</span>
          <span class="pill" id="hudDance">Điệu: ...</span>
        </div>
        <div class="video-inner" id="videoStageInner">
          <div style="text-align:center;color:#e2e8f0;font-size:12px;padding:16px;" id="noVideoHint">
            (Khung xem trước 3s đầu Đen Trắng chớp ➔ Giây 3 Bùng Màu)
          </div>
        </div>
        <div class="flash-bg" id="flashBg"></div>
        <div id="titleLayer"></div>
        <div id="contentLayer"></div>
      </div>
    </div>

    <button id="playAllBtn">▶️ Phát Xem Thử Thành Phẩm</button>
    <audio id="audioPlayer" controls></audio>

    <button class="purple" id="exportAllBtn">🎬 Bước 2: Xuất 10 Video Phách Mẫu (.MP4) + Nhạc + Lớp Phủ Chữ</button>
    <div class="status" id="exportStatus"></div>

    <div id="downloadArea" style="display:none;">
      <div class="row">
        <button class="green" id="downloadZipBtn">📦 Tải Trọn Bộ (.ZIP) — Khuyên Dùng</button>
        <button id="downloadWavBtn">🎵 Tải Riêng Nhạc Gốc (.WAV)</button>
      </div>
      <div id="overlayDownloadBox" style="margin-bottom:8px;"></div>
      <label>Hoặc bấm tải lẻ từng Video Phách Mẫu bên dưới (bỏ vào CapCut theo thứ tự 01 ➔ hết):</label>
      <div class="clip-grid" id="clipGrid"></div>
    </div>
  </div>

  <div class="card" id="tableCard" style="display:none;">
    <label>Bảng Hướng Dẫn Chỉnh Hiệu Ứng Từng Phách Trong CapCut</label>
    <table>
      <thead>
        <tr><th>Phách</th><th>Độ dài</th><th>Cách chỉnh hiệu ứng trong CapCut</th><th>Chữ hiển thị</th></tr>
      </thead>
      <tbody id="scriptTableBody"></tbody>
    </table>
  </div>
</div>

<script>
  let decodedBuffer = null, wavBlob = null, plan = [], videoPool = [], animId = null, lastSegIdx = -1, copySeed = 0;
  let exportedFiles = []; // { name, blob }
  const FPS = 30;

  const audioFile = document.getElementById('audioFile');
  const videoFiles = document.getElementById('videoFiles');
  const analyzeBtn = document.getElementById('analyzeBtn');
  const statusText = document.getElementById('statusText');
  const exportStatus = document.getElementById('exportStatus');
  const audioPlayer = document.getElementById('audioPlayer');
  const videoStageInner = document.getElementById('videoStageInner');
  const titleLayer = document.getElementById('titleLayer');
  const contentLayer = document.getElementById('contentLayer');
  const flashBg = document.getElementById('flashBg');

  document.getElementById('genCopyBtn').addEventListener('click', () => {
    const topic = (document.getElementById('topicInput').value || 'khoảnh khắc này').trim();
    const T = topic.toUpperCase();
    const tone = document.getElementById('toneSelect').value;
    copySeed++;
    const bank = {
      shock: [
        { title: `ĐỪNG LƯỚT QUA NẾU CHƯA XEM "${T}" ĐÚNG GIÂY THỨ 3!`, lines: [`3 giây đầu nhìn cứ tưởng bình thường`, `Đúng lúc nhạc nổ: ${topic} biến hình`, `Không ngờ màn kết hợp lại cháy cỡ này`, `99% người xem đều coi lại lần 2`, `Quá đỉnh cho pha ${topic} hôm nay`] },
        { title: `ĐỪNG CHỚP MẮT! 3 GIÂY NỮA "${T}" SẼ LẬT KÈO CỰC CĂNG`, lines: [`Nhìn kỹ 3 giây đếm ngược này nhé`, `Vào nhịp cái là ${topic} bùng nổ`, `Ai xem tới đây cũng gật gù theo nhạc`, `Đoạn cao trào đúng nghĩa nổi da gà`, `Chốt hạ cực gắt cùng ${topic}`] }
      ],
      hype: [
        { title: `NHẠC LÊN LÀ QUẨY! XEM PHA "${T}" ĐỈNH NÓC KỊCH TRẦN`, lines: [`Đếm ngược 3... 2... 1... Bắt đầu!`, `${topic} chính thức nhập cuộc cực cháy`, `Từng động tác khớp từng mili-giây`, `Năng lượng bùng nổ cả khung hình`, `Hết mình hết sức với ${topic}`] }
      ],
      emotion: [
        { title: `THANH XUÂN ĐẸP NHẤT LÀ KHI CÓ "${T}" Ở BÊN...`, lines: [`Có những khoảnh khắc trôi qua rất nhanh`, `Nhưng ${topic} sẽ luôn là ký ức đẹp`, `Cười hết mình chẳng cần nghĩ ngợi`, `Sau này nhìn lại vẫn thấy tim rộn ràng`, `Cảm ơn vì đã có ${topic} hôm nay`] }
      ]
    };
    const list = bank[tone] || bank.shock;
    const picked = list[copySeed % list.length];
    document.getElementById('titleInput').value = picked.title;
    document.getElementById('contentInput').value = picked.lines.join('\n');
  });

  videoFiles.addEventListener('change', (e) => {
    videoPool.forEach(v => v.remove()); videoPool = [];
    const files = Array.from(e.target.files || []).slice(0, 12);
    document.getElementById('noVideoHint').style.display = files.length ? 'none' : 'block';
    files.forEach(f => {
      const v = document.createElement('video');
      v.src = URL.createObjectURL(f); v.muted = true; v.playsInline = true; v.loop = true;
      videoStageInner.appendChild(v); videoPool.push(v);
    });
  });

  audioFile.addEventListener('change', async (e) => {
    const file = e.target.files[0]; if (!file) return;
    statusText.textContent = '⏳ Đang giải mã âm thanh...'; analyzeBtn.disabled = true;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      decodedBuffer = await ctx.decodeAudioData(await file.arrayBuffer());
      await ctx.close();
      statusText.textContent = `✅ Đã nạp nhạc (${decodedBuffer.duration.toFixed(1)}s). Bấm Bước 1!`;
      analyzeBtn.disabled = false;
    } catch { statusText.textContent = '❌ Không đọc được âm thanh.'; }
  });

  analyzeBtn.addEventListener('click', async () => {
    if (!decodedBuffer) return;
    statusText.textContent = '🎛️ Đang phân tích nhịp & khóa khung hình 30fps...';
    wavBlob = encodeWAV(decodedBuffer);
    audioPlayer.src = URL.createObjectURL(wavBlob);

    const totalSegs = Math.max(5, parseInt(document.getElementById('beatCount').value || 10, 10));
    const titleText = document.getElementById('titleInput').value.trim();
    const contentText = document.getElementById('contentInput').value.trim();

    const analysis = await analyzeMusic(decodedBuffer, totalSegs);
    plan = buildChoreography(analysis, titleText, contentText);

    document.getElementById('aiBadge').style.display = 'block';
    document.getElementById('aiBadge').innerHTML = `🤖 <b>Thể loại:</b> ${analysis.label} (~${analysis.bpm} BPM) • <b>Tổng:</b> ${plan.length} phách`;

    renderScriptTable(plan);
    document.getElementById('previewCard').style.display = 'block';
    document.getElementById('tableCard').style.display = 'block';
    document.getElementById('downloadArea').style.display = 'none';
    statusText.textContent = '✅ Đã lên kịch bản! Bấm Phát Xem Thử hoặc bấm Bước 2 để xuất file MP4.';
  });

  async function getBandEnergy(buffer, type, freq) {
    const sr = buffer.sampleRate;
    const off = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, buffer.length, sr);
    const src = off.createBufferSource(); src.buffer = buffer;
    const f = off.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    src.connect(f); f.connect(off.destination); src.start(0);
    const out = await off.startRendering();
    const d = out.getChannelData(0), hop = Math.floor(sr * 0.02), e = [];
    for (let i = 0; i < d.length; i += hop) {
      let s = 0, end = Math.min(i + hop, d.length);
      for (let j = i; j < end; j++) s += d[j] * d[j];
      e.push(Math.sqrt(s / (end - i)));
    }
    return e;
  }

  async function analyzeMusic(buffer, totalSegments) {
    const bass = await getBandEnergy(buffer, 'lowpass', 145);
    const midHigh = await getBandEnergy(buffer, 'bandpass', 2200);
    const onset = bass.map((v, i) => i === 0 ? 0 : Math.max(0, v - bass[i - 1]));
    const meanBass = bass.reduce((a, b) => a + b, 0) / (bass.length || 1);
    const meanMid = midHigh.reduce((a, b) => a + b, 0) / (midHigh.length || 1);
    const bassPunch = Math.max(...onset) / ((onset.reduce((a, b) => a + b, 0) / (onset.length || 1)) + 1e-6);

    let bestLag = 25, bestCorr = -1;
    for (let lag = 20; lag <= 46; lag++) {
      let corr = 0;
      for (let i = lag; i < onset.length; i++) corr += onset[i] * onset[i - lag];
      const w = (lag >= 21 && lag <= 32) ? 1.15 : 1.0;
      if (corr * w > bestCorr) { bestCorr = corr * w; bestLag = lag; }
    }
    const bpm = Math.round(3000 / bestLag);
    let style = 'chacha', label = 'Cha-cha-cha / Khiêu vũ';
    if (bpm >= 124 && (bassPunch > 4.2 || meanBass / (meanMid + 1e-6) > 1.05)) { style = 'remix'; label = 'Remix / Vinahouse'; }
    else if (bpm < 98 && bassPunch < 4.5) { style = 'chill'; label = 'Nhạc Chill / Bolero'; }

    const hookEnd = Math.min(3.1, buffer.duration * 0.38);
    const comb = bass.map((v, i) => v * 0.55 + midHigh[i] * 0.45);
    const hc = [];
    for (let i = 2; i < Math.floor(hookEnd / 0.02) - 2; i++) {
      const t = i * 0.02;
      if (t >= 0.45 && t <= hookEnd - 0.35 && comb[i] > comb[i - 1] && comb[i] > comb[i + 1]) hc.push({ time: t, score: comb[i] });
    }
    hc.sort((a, b) => b.score - a.score);
    const hookCuts = [];
    for (const c of hc) { if (hookCuts.length >= 2) break; if (!hookCuts.some(t => Math.abs(t - c.time) < 0.55)) hookCuts.push(c.time); }
    while (hookCuts.length < 2) hookCuts.push(hookCuts.length === 0 ? hookEnd * 0.34 : hookEnd * 0.67);
    hookCuts.sort((a, b) => a - b);

    const bodyNeeded = Math.max(1, totalSegments - 4);
    const bc = [];
    for (let i = Math.floor(hookEnd / 0.02) + 5; i < bass.length - 15; i++) {
      let loc = 0, s = Math.max(0, i - 20), e = Math.min(bass.length, i + 20);
      for (let k = s; k < e; k++) loc += bass[k];
      loc /= (e - s);
      if (bass[i] > bass[i - 1] && bass[i] > bass[i + 1] && bass[i] > loc * 1.25) bc.push({ time: i * 0.02, score: bass[i] / (loc + 1e-6), energy: bass[i] });
    }
    bc.sort((a, b) => b.score - a.score);
    const bodyCuts = [];
    for (const c of bc) {
      if (bodyCuts.length >= bodyNeeded) break;
      const isDrop = c.energy > meanBass * 1.15;
      const gap = style === 'remix' ? (isDrop ? 0.45 : 1.2) : (style === 'chacha' ? 1.15 : 1.8);
      if (Math.abs(c.time - hookEnd) >= 0.5 && !bodyCuts.some(t => Math.abs(t - c.time) < gap)) bodyCuts.push(c.time);
    }
    bodyCuts.sort((a, b) => a - b);
    let pts = [0, ...hookCuts, hookEnd, ...bodyCuts, buffer.duration];
    while (pts.length - 1 < totalSegments) {
      let maxG = 0, idx = 0;
      for (let i = 3; i < pts.length - 1; i++) if (pts[i + 1] - pts[i] > maxG) { maxG = pts[i + 1] - pts[i]; idx = i; }
      pts.splice(idx + 1, 0, (pts[idx] + pts[idx + 1]) / 2);
    }
    return { pts, bpm, style, label };
  }

  function buildChoreography(analysis, titleText, contentText) {
    const { pts, style } = analysis;
    const phrases = contentText.split(/\n+/).map(s => s.trim()).filter(Boolean);
    const dances = style === 'remix'
      ? [{ c: 'zoom-blur', n: 'Zoom Mờ + Phóng To 1 (0.2s)', capcut: 'Hiệu ứng động -> Vào: Phóng to 1 (0.2s) + Làm mờ chuyển động' },
         { c: 'shake', n: 'Rung Lắc + Chớp Trắng', capcut: 'Hiệu ứng video: Rung (0.25s) ở đầu phách' },
         { c: 'tilt-l', n: 'Nghiêng Giật Trái', capcut: 'Hiệu ứng động -> Kết hợp: Con lắc 1' },
         { c: 'tilt-r', n: 'Nghiêng Giật Phải', capcut: 'Hiệu ứng động -> Kết hợp: Con lắc 2' }]
      : style === 'chacha'
      ? [{ c: 'tilt-l', n: 'Cha-cha Nhún Trái', capcut: 'Hiệu ứng động -> Kết hợp: Con lắc 1' },
         { c: 'tilt-r', n: 'Cha-cha Nhún Phải', capcut: 'Hiệu ứng động -> Kết hợp: Con lắc 2' },
         { c: 'zoom-blur', n: 'Cha-cha Đẩy Tới', capcut: 'Hiệu ứng động -> Vào: Phóng to 1 (0.3s)' },
         { c: 'double-bounce', n: 'Cha-cha Lắc Đôi', capcut: 'Hiệu ứng video: Lắc nhẹ (Rebound Swing)' }]
      : [{ c: 'slow-zoom', n: 'Phóng Chậm Êm', capcut: 'Keyframe đầu 100% -> cuối 112%' },
         { c: 'tilt-l', n: 'Trôi Mượt Nhẹ', capcut: 'Hiệu ứng động -> Vào: Hiện dần (0.4s)' }];

    const res = [];
    let pIdx = 0, cumFrame = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const isHook = i < 3;
      const startF = cumFrame;
      const endF = Math.max(startF + 4, Math.round(pts[i + 1] * FPS));
      const frames = endF - startF;
      cumFrame = endF;
      const dur = frames / FPS;

      const d = isHook
        ? { c: 'hook-bw', n: `3s Đầu Đen Trắng + Chớp`, capcut: i === 2 ? 'Thanh Bộ lọc Đen Trắng + Đèn nháy | Chuyển cảnh sang Phách 4: Chớp trắng (0.2s)' : 'Thanh Bộ lọc Đen Trắng + Hiệu ứng Đèn Nháy (Strobe)' }
        : dances[(i - 3) % dances.length];

      let txt = isHook ? titleText : (phrases[pIdx] || '');
      if (!isHook && phrases.length) {
        if (i > 3 && res[i - 1].dur < 0.85 && (pts.length - 1 - i) > (phrases.length - pIdx)) txt = res[i - 1].text;
        else { txt = phrases[Math.min(pIdx, phrases.length - 1)]; pIdx++; }
      }
      res.push({
        idx: i + 1, start: startF / FPS, end: endF / FPS, dur, frames, startF, endF,
        isHook, danceCode: d.c, danceName: d.n, capcutGuide: d.capcut, text: txt, isDropEntry: i === 3
      });
    }
    return res;
  }

  // --- XUẤT MP4 BẰNG WEBCODECS + MP4-MUXER ---
  async function pickAvcCodec(W, H) {
    const list = ['avc1.420028', 'avc1.42001f', 'avc1.4d001f', 'avc1.64001f'];
    for (const codec of list) {
      try {
        const res = await VideoEncoder.isConfigSupported({ codec, width: W, height: H, bitrate: 1_200_000, framerate: FPS });
        if (res.supported) return codec;
      } catch {}
    }
    return null;
  }

  async function encodeCanvasToMp4(frameCount, drawFn) {
    const W = 540, H = 960;
    const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    const codec = await pickAvcCodec(W, H);
    if (!codec || typeof Mp4Muxer === 'undefined') {
      throw new Error('Trình duyệt hiện tại không hỗ trợ WebCodecs H.264. Hãy mở bằng Chrome/Edge/Safari mới nhất.');
    }
    const muxer = new Mp4Muxer.Muxer({
      target: new Mp4Muxer.ArrayBufferTarget(),
      video: { codec: 'avc', width: W, height: H },
      fastStart: 'in-memory'
    });
    const encoder = new VideoEncoder({
      output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
      error: (e) => console.error(e)
    });
    encoder.configure({ codec, width: W, height: H, bitrate: 1_200_000, framerate: FPS });

    for (let f = 0; f < frameCount; f++) {
      drawFn(ctx, f, frameCount, W, H);
      const vf = new VideoFrame(canvas, { timestamp: Math.round((f * 1_000_000) / FPS), duration: Math.round(1_000_000 / FPS) });
      encoder.encode(vf, { keyFrame: f % 30 === 0 });
      vf.close();
      if (f % 20 === 0) await new Promise(r => setTimeout(r, 0));
    }
    await encoder.flush();
    encoder.close();
    muxer.finalize();
    return new Blob([muxer.target.buffer], { type: 'video/mp4' });
  }

  function wrapLines(ctx, text, maxW) {
    const words = (text || '').split(/\s+/);
    const lines = []; let cur = '';
    for (const w of words) {
      const test = cur ? cur + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; }
      else cur = test;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  document.getElementById('exportAllBtn').addEventListener('click', async () => {
    if (!plan.length) return;
    const btn = document.getElementById('exportAllBtn');
    btn.disabled = true; exportedFiles = [];
    const clipGrid = document.getElementById('clipGrid');
    const overlayBox = document.getElementById('overlayDownloadBox');
    clipGrid.innerHTML = ''; overlayBox.innerHTML = '';

    try {
      // 1. Xuất từng Video Phách Mẫu
      for (let i = 0; i < plan.length; i++) {
        const s = plan[i];
        exportStatus.textContent = `⏳ Đang tạo Video Phách Mẫu ${i + 1}/${plan.length}...`;
        const blob = await encodeCanvasToMp4(s.frames, (ctx, f, total, W, H) => {
          ctx.fillStyle = s.isHook ? '#18181b' : '#0f172a';
          ctx.fillRect(0, 0, W, H);

          // Khung viền màu phân biệt Hook vs Thân bài
          ctx.strokeStyle = s.isHook ? '#ef4444' : '#38bdf8';
          ctx.lineWidth = 10; ctx.strokeRect(18, 18, W - 36, H - 36);

          ctx.textAlign = 'center';
          ctx.fillStyle = s.isHook ? '#fca5a5' : '#7dd3fc';
          ctx.font = 'bold 28px system-ui';
          ctx.fillText(s.isHook ? '⚫ 3 GIÂY ĐẦU (HOOK)' : '🌈 ĐOẠN THÂN BÀI', W / 2, 160);

          ctx.fillStyle = '#fde047';
          ctx.font = '900 76px system-ui';
          ctx.fillText(`PHÁCH ${String(s.idx).padStart(2, '0')}`, W / 2, 300);

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 34px system-ui';
          ctx.fillText(`${s.dur.toFixed(2)} giây (${s.frames}f)`, W / 2, 370);

          // In gợi ý hiệu ứng CapCut ngay trên khuôn
          ctx.fillStyle = '#cbd5e1';
          ctx.font = 'bold 24px system-ui';
          const guideLines = wrapLines(ctx, `CapCut: ${s.capcutGuide}`, W - 90);
          guideLines.forEach((ln, k) => ctx.fillText(ln, W / 2, 480 + k * 34));

          // Thanh tiến trình chạy dưới đáy
          ctx.fillStyle = '#334155'; ctx.fillRect(60, H - 140, W - 120, 18);
          ctx.fillStyle = s.isHook ? '#ef4444' : '#10b981';
          ctx.fillRect(60, H - 140, (W - 120) * ((f + 1) / total), 18);
        });

        const fname = `${String(s.idx).padStart(2, '0')}_${s.isHook ? 'HOOK' : 'NHIP'}_${s.dur.toFixed(2)}s.mp4`;
        exportedFiles.push({ name: fname, blob });

        const a = document.createElement('a');
        a.className = 'clip-btn'; a.href = URL.createObjectURL(blob); a.download = fname;
        a.innerHTML = `<b>⬇️ ${fname}</b><span>${s.danceName}</span>`;
        clipGrid.appendChild(a);
      }

      // 2. Xuất Video Lớp Phủ Chữ Chớp Nền Đen (đưa qua CapCut -> Blend -> Filter/Screen)
      exportStatus.textContent = '✨ Đang tạo Video Lớp Phủ Chữ Chớp Nền Đen...';
      const totalFrames = plan[plan.length - 1].endF;
      const overlayBlob = await encodeCanvasToMp4(totalFrames, (ctx, f, total, W, H) => {
        ctx.fillStyle = '#000000'; // Nền đen tuyệt đối để Blend trong CapCut
        ctx.fillRect(0, 0, W, H);

        let seg = plan[0];
        for (const s of plan) if (f >= s.startF && f < s.endF) { seg = s; break; }
        const dt = (f - seg.startF) / FPS;
        const pulse = dt < 0.24 ? (1 - dt / 0.24) : 0;

        // Chớp ánh sáng nhẹ trên nền đen khi vào phách
        if (pulse > 0.15) {
          ctx.fillStyle = `rgba(255,255,255,${(pulse * (seg.isDropEntry ? 0.55 : 0.18)).toFixed(2)})`;
          ctx.fillRect(0, 0, W, H);
        }

        ctx.textAlign = 'center';
        if (seg.isHook) {
          const scale = 1 + pulse * 0.2;
          ctx.save();
          ctx.translate(W / 2, H * 0.44);
          ctx.scale(scale, scale);
          ctx.font = '900 34px system-ui';
          ctx.fillStyle = pulse > 0.35 ? '#ffffff' : '#fde047';
          ctx.shadowColor = '#facc15'; ctx.shadowBlur = 18;
          const lines = wrapLines(ctx, seg.text, W - 70);
          lines.forEach((ln, k) => ctx.fillText(ln, 0, (k - (lines.length - 1) / 2) * 44));
          ctx.restore();
        } else {
          // Tiêu đề nhỏ thu gọn trên đầu
          ctx.font = 'bold 20px system-ui';
          ctx.fillStyle = '#7dd3fc';
          ctx.fillText(plan[0].text.slice(0, 38), W / 2, 110);

          // Chữ nội dung chớp nảy ở dưới
          if (seg.text) {
            ctx.save();
            ctx.translate(W / 2, H * 0.78 + pulse * 14);
            const sc = 1 + pulse * 0.14; ctx.scale(sc, sc);
            ctx.font = '900 30px system-ui';
            ctx.fillStyle = pulse > 0.3 ? '#fde047' : '#ffffff';
            ctx.shadowColor = '#000'; ctx.shadowBlur = 12;
            const lines = wrapLines(ctx, seg.text, W - 80);
            lines.forEach((ln, k) => ctx.fillText(ln, 0, k * 38));
            ctx.restore();
          }
        }
      });

      const ovName = '00_LOP_PHU_CHU_CHOP_NEN_DEN.mp4';
      exportedFiles.push({ name: ovName, blob: overlayBlob });
      const ovLink = document.createElement('a');
      ovLink.className = 'clip-btn'; ovLink.style.borderColor = '#db2777';
      ovLink.href = URL.createObjectURL(overlayBlob); ovLink.download = ovName;
      ovLink.innerHTML = `<b>⬇️ Tải Lớp Phủ Chữ Chớp Nền Đen (${ovName})</b><span>Vào CapCut ➔ Lớp phủ ➔ Hòa trộn ➔ Bộ lọc (Filter/Screen)</span>`;
      overlayBox.appendChild(ovLink);

      document.getElementById('downloadArea').style.display = 'block';
      exportStatus.textContent = `🎉 Đã xuất xong ${plan.length} Video Phách Mẫu MP4 + Lớp Phủ Chữ!`;
    } catch (err) {
      exportStatus.textContent = '❌ Lỗi xuất MP4: ' + err.message;
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById('downloadZipBtn').addEventListener('click', async () => {
    if (!exportedFiles.length || typeof JSZip === 'undefined') return;
    exportStatus.textContent = '📦 Đang nén toàn bộ vào 1 file ZIP...';
    const zip = new JSZip();
    if (wavBlob) zip.file('00_NHAC_GOC_CHUAN.wav', wavBlob);
    exportedFiles.forEach(f => zip.file(f.name, f.blob));
    const guideTxt = plan.map(s => `Phách ${s.idx} [${s.dur.toFixed(2)}s]: ${s.capcutGuide} | Chữ: "${s.text}"`).join('\n');
    zip.file('HUONG_DAN_CAPCUT.txt', guideTxt);
    const zBlob = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(zBlob);
    a.download = 'TRON_BO_PHACH_CAPCUT.zip'; a.click();
    exportStatus.textContent = '✅ Đã tải xong file TRON_BO_PHACH_CAPCUT.zip!';
  });

  document.getElementById('downloadWavBtn').addEventListener('click', () => {
    if (!wavBlob) return;
    const a = document.createElement('a'); a.href = URL.createObjectURL(wavBlob);
    a.download = '00_NHAC_GOC_CHUAN.wav'; a.click();
  });

  // Xem trước trực tiếp
  document.getElementById('playAllBtn').addEventListener('click', () => {
    lastSegIdx = -1; audioPlayer.currentTime = 0; audioPlayer.play();
    videoPool.forEach(v => v.play().catch(() => {}));
    cancelAnimationFrame(animId); renderLoop();
  });
  audioPlayer.addEventListener('play', () => { cancelAnimationFrame(animId); renderLoop(); });

  function renderLoop() {
    if (!audioPlayer.paused && plan.length > 0) {
      const t = audioPlayer.currentTime;
      let seg = plan[0];
      for (const s of plan) if (t >= s.start && t < s.end) { seg = s; break; }
      const dt = t - seg.start, pulse = dt < 0.24 ? (1 - dt / 0.24) : 0;

      if (seg.idx !== lastSegIdx) {
        lastSegIdx = seg.idx;
        document.getElementById('hudBeat').textContent = seg.isHook ? `⚫ 3s ĐẦU • Phách ${seg.idx}` : `🌈 Phách ${seg.idx}/${plan.length}`;
        document.getElementById('hudDance').textContent = seg.danceName;
        if (videoPool.length === 1) {
          videoPool[0].style.display = 'block';
          if (videoPool[0].duration && isFinite(videoPool[0].duration)) videoPool[0].currentTime = ((seg.idx - 1) / plan.length) * Math.max(0.5, videoPool[0].duration - seg.dur);
        } else if (videoPool.length > 1) {
          const a = (seg.idx - 1) % videoPool.length;
          videoPool.forEach((v, k) => v.style.display = k === a ? 'block' : 'none');
        }
      }

      if (seg.isHook) {
        videoStageInner.style.filter = `grayscale(100%) contrast(1.25) brightness(${(0.65 + pulse * 0.75).toFixed(2)})`;
        videoStageInner.style.transform = `scale(${(1.02 + pulse * 0.1).toFixed(3)})`;
        flashBg.style.opacity = (pulse * 0.42).toFixed(2);
      } else {
        flashBg.style.opacity = (pulse * (seg.isDropEntry ? 0.75 : 0.25)).toFixed(2);
        videoStageInner.style.filter = `grayscale(0%) saturate(1.25) brightness(${(1 + pulse * 0.25).toFixed(2)}) blur(${(pulse * 1.8).toFixed(1)}px)`;
        videoStageInner.style.transform = `scale(${(1.05 + pulse * 0.14).toFixed(3)})`;
      }

      if (seg.isHook) {
        titleLayer.textContent = seg.text; titleLayer.style.top = '38%'; titleLayer.style.fontSize = '18px';
        titleLayer.style.color = pulse > 0.35 ? '#ffffff' : '#fde047';
        titleLayer.style.transform = `scale(${(1 + pulse * 0.2).toFixed(3)})`;
        contentLayer.style.opacity = '0';
      } else {
        titleLayer.style.top = '38px'; titleLayer.style.fontSize = '11px'; titleLayer.style.color = '#7dd3fc';
        titleLayer.style.transform = `scale(1)`;
        if (seg.text) {
          contentLayer.textContent = seg.text; contentLayer.style.opacity = '1';
          contentLayer.style.color = pulse > 0.3 ? '#fde047' : '#ffffff';
          contentLayer.style.transform = `translateY(${(pulse * 12).toFixed(1)}px) scale(${(1 + pulse * 0.12).toFixed(3)})`;
        } else contentLayer.style.opacity = '0';
      }
    }
    animId = requestAnimationFrame(renderLoop);
  }

  function renderScriptTable(list) {
    const tbody = document.getElementById('scriptTableBody');
    tbody.innerHTML = '';
    list.forEach(s => {
      tbody.innerHTML += `<tr>
        <td><b>Phách ${String(s.idx).padStart(2, '0')}</b> ${s.isHook ? '<span class="tag tag-hook">3s ĐẦU</span>' : ''}</td>
        <td><b>${s.dur.toFixed(2)}s</b><br><span style="color:#94a3b8">${s.frames}f</span></td>
        <td><span class="tag tag-dance">${s.capcutGuide}</span></td>
        <td>${s.text || '-'}</td>
      </tr>`;
    });
  }

  function encodeWAV(buf) {
    const numCh = Math.min(buf.numberOfChannels, 2), sr = buf.sampleRate, len = buf.length;
    const dataBytes = len * numCh * 2, ab = new ArrayBuffer(44 + dataBytes), v = new DataView(ab);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + dataBytes, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, numCh, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * numCh * 2, true);
    v.setUint16(32, numCh * 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, dataBytes, true);
    const chs = Array.from({ length: numCh }, (_, c) => buf.getChannelData(c));
    let off = 44;
    for (let i = 0; i < len; i++) for (let c = 0; c < numCh; c++) {
      const s = Math.max(-1, Math.min(1, chs[c][i]));
      v.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true); off += 2;
    }
    return new Blob([ab], { type: 'audio/wav' });
  }
</script>
