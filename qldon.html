<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quản Lý Đơn Hàng — Kim Bling</title>
  <style>
    :root { --primary:#c29b38; --bg:#0f172a; --card-bg:#1e293b; --text:#f8fafc; --subtext:#94a3b8; --border:#334155; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    body { background-color:var(--bg); color:var(--text); padding:12px; font-size:15px; }
    #adminHeader { display:flex; justify-content:space-between; align-items:center; padding-bottom:12px; margin-bottom:12px; border-bottom:1px solid var(--border); }
    .header-btns { display:flex; gap:8px; }
    .action-btn { background:var(--primary); color:#000; border:none; padding:8px 12px; border-radius:8px; font-weight:bold; cursor:pointer; font-size:13px; }
    .clear-btn { background:#ef4444; color:#fff; }
    .order-card { background:var(--card-bg); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:14px; box-shadow:0 4px 6px -1px rgba(0,0,0,.3); position:relative; }
    .order-header { display:flex; justify-content:space-between; border-bottom:1px dashed var(--border); padding-bottom:8px; margin-bottom:10px; align-items:center; gap:8px; }
    .order-id { font-weight:bold; color:var(--primary); font-size:16px; }
    .order-time { font-size:13px; color:var(--subtext); }
    .btn-delete-single { background:rgba(239,68,68,.15); color:#f87171; border:1px solid #ef4444; padding:3px 8px; border-radius:6px; font-size:11px; font-weight:bold; cursor:pointer; }
    .btn-push-pos { background:linear-gradient(135deg,#3b82f6,#1d4ed8); color:#fff; border:none; padding:6px 12px; border-radius:6px; font-size:12px; font-weight:bold; cursor:pointer; display:inline-flex; align-items:center; gap:4px; }
    .btn-push-pos.pushed { background:#10b981!important; cursor:default; }
    .customer-info { margin-bottom:8px; line-height:1.6; font-size:14px; overflow-wrap:anywhere; }
    .customer-info a { color:#38bdf8; text-decoration:none; font-weight:bold; }
    .note-box { background:#451a03; color:#fdba74; padding:8px 10px; border-radius:6px; font-size:13px; margin-bottom:8px; border:1px dashed #c2410c; }
    .items-box { background:#0f172a; padding:10px 12px; border-radius:8px; margin:8px 0; font-size:14px; border-left:4px solid var(--primary); }
    .pos-item-row { margin-bottom:10px; border-bottom:1px dashed rgba(255,255,255,.1); padding-bottom:8px; cursor:pointer; }
    .pos-item-header { display:flex; justify-content:space-between; align-items:center; font-weight:bold; font-size:15px; color:#f8fafc; }
    .pos-item-price { color:#facc15; font-size:15px; font-weight:bold; }
    .pos-item-options { font-size:13px; color:#94a3b8; margin-top:2px; line-height:1.4; padding-left:4px; }
    .pos-item-row.completed-item { opacity:.45; text-decoration:line-through; }
    .order-footer { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin:10px 0 12px; font-size:14px; }
    .payment-tag { padding:5px 10px; border-radius:6px; font-size:13px; font-weight:bold; }
    .pay-cash { background:#334155; color:#cbd5e1; }
    .pay-transfer { background:#065f46; color:#34d399; border:1px solid #059669; cursor:pointer; }
    .total-price { font-weight:bold; color:#4ade80; font-size:17px; white-space:nowrap; }
    .status-group { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
    .status-btn { padding:10px 4px; border-radius:8px; border:1px solid var(--border); background:#0f172a; color:var(--subtext); font-size:13px; font-weight:bold; cursor:pointer; text-align:center; }
    .status-btn.active-1 { background:#eab308; color:#000; border-color:#eab308; }
    .status-btn.active-2 { background:#3b82f6; color:#fff; border-color:#3b82f6; }
    .status-btn.active-3 { background:#a855f7; color:#fff; border-color:#a855f7; }
    .status-btn.active-4 { background:#22c55e; color:#fff; border-color:#22c55e; }
    .empty-state { text-align:center; color:var(--subtext); padding:40px 0; }
    .order-card.status-bg-1 { border-color:#eab308; } .order-card.status-bg-2 { border-color:#3b82f6; } .order-card.status-bg-3 { border-color:#a855f7; } .order-card.status-bg-4 { border-color:#22c55e; opacity:.85; }
    .btn-map-route { display:inline-flex; align-items:center; gap:4px; background:#0284c7; color:#fff!important; text-decoration:none; padding:4px 8px; border-radius:6px; font-size:12px; font-weight:bold; margin-top:4px; }
    .btn-edit-addr { background:#0284c7; color:#fff; border:none; padding:2px 6px; border-radius:4px; font-size:11px; cursor:pointer; margin-left:6px; font-weight:bold; }
  </style>
</head>
<body>
  <div id="adminApp">
    <div id="adminHeader">
      <div>
        <h3 style="color:var(--primary);">QUẢN LÝ ĐƠN HÀNG</h3>
        <span id="orderCount" style="font-size:13px;color:var(--subtext);">Chỉ hiển thị đơn trong ngày</span>
      </div>
      <div class="header-btns">
        <button class="action-btn clear-btn" onclick="requestClearOrders()">🗑️ Dọn dẹp</button>
        <button class="action-btn" onclick="fetchOrders()">🔄 Tải lại</button>
      </div>
    </div>
    <div id="ordersContainer"><div class="empty-state">Đang tải dữ liệu đơn hàng...</div></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxPxsg3oxHjUsx8KHyOSIYmjXZw9rY9GFQYf0cHNK3JmBsfdYMJ21PQdhg43HP787GIDQ/exec";
    let isFetchingOrders = false;

    window.onload = function() {
      fetchOrders();
      setInterval(fetchOrders, 15000);
    };

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    function fetchOrders() {
      if (isFetchingOrders) return;
      isFetchingOrders = true;
      fetch(`${SCRIPT_URL}?type=checkStatus&phone=ALL&t=${Date.now()}`, {cache:'no-store'})
        .then(res => res.json())
        .then(data => {
          const container = document.getElementById('ordersContainer');
          if (!data.success || !Array.isArray(data.orders) || data.orders.length === 0) {
            container.innerHTML = '<div class="empty-state">Chưa có đơn hàng nào trong ngày.</div>';
            document.getElementById('orderCount').textContent = 'Chỉ hiển thị đơn trong ngày · 0 đơn';
            return;
          }
          let html = '';
          data.orders.forEach(order => {
            const orderId = String(order.orderId || '');
            const currentStatus = String(order.status || '1');
            const cleanPhone = String(order.phone || '').replace(/'/g, '').trim();
            const cardStatusClass = `status-bg-${currentStatus}`;
            const noteHtml = order.note ? `<div class="note-box"><b>📝 Ghi chú:</b> ${escapeHtml(order.note)}</div>` : '';
            const formattedItems = parseAdminItemsToList(order.items);
            const paymentText = String(order.payment || 'Tiền mặt');
            const isTransfer = paymentText.toLowerCase().includes('chuyển');
            const paymentClass = isTransfer ? 'pay-transfer' : 'pay-cash';
            let qrTagHtml = isTransfer 
              ? `<span class="payment-tag ${paymentClass}" onclick="window.open('https://img.vietqr.io/image/TCB-19076231479012-compact2.png?amount=${Number(order.total || 0)}&addInfo=${encodeURIComponent('THANHTOAN_' + (cleanPhone || orderId))}', '_blank')">💳 ${escapeHtml(paymentText)} (🔍 Xem QR)</span>`
              : `<span class="payment-tag ${paymentClass}">💳 ${escapeHtml(paymentText)}</span>`;

            const rawAddress = String(order.address || '🏠 Tại quán');
            let mapButtonHtml = '';
            if (!rawAddress.includes('Tại quán')) {
              const cleanDestAddress = rawAddress.replace(/^🛵\s*Giao tận nơi:\s*/i, '').trim();
              const fullQueryAddr = cleanDestAddress.toLowerCase().includes('hồ chí minh') ? cleanDestAddress : (cleanDestAddress + ', Hồ Chí Minh');
              const googleMapsUrl = `https://www.google.com/maps/dir/?api=1&origin=10.74955,106.63099&destination=${encodeURIComponent(fullQueryAddr)}&travelmode=driving`;
              mapButtonHtml = `<br><a href="${googleMapsUrl}" target="_blank" rel="noopener" class="btn-map-route">🗺️ Bấm mở bản đồ đường đi (Shipper)</a>`;
            }

            const zaloDeepLink = `https://zalo.me/${encodeURIComponent(cleanPhone)}`;
            const isPushed = localStorage.getItem(`kimbling_pushed_pos_${orderId}`) === 'true';
            const pushBtnText = isPushed ? '✅ Đã đẩy đơn' : '🚀 Đẩy qua POS';
            const pushBtnClass = isPushed ? 'btn-push-pos pushed' : 'btn-push-pos';
            const pushDisabled = isPushed ? 'disabled' : '';
            const orderJson = escapeHtml(JSON.stringify(order));
            const pureAddressForEdit = rawAddress.replace(/^🛵\s*Giao tận nơi:\s*/i, '').trim();

            html += `
              <div class="order-card ${cardStatusClass}">
                <div class="order-header">
                  <div><span class="order-id">#${escapeHtml(orderId)}</span><span class="order-time" style="margin-left:6px;">${escapeHtml(order.time || '')}</span></div>
                  <div style="display:flex;gap:6px;align-items:center;">
                    <button class="${pushBtnClass}" ${pushDisabled} data-order="${orderJson}" onclick="pushOrderButton(this)">${pushBtnText}</button>
                    <button class="btn-delete-single" onclick="requestDeleteSingleOrder('${escapeHtml(orderId)}')">🗑️ Xóa</button>
                  </div>
                </div>
                <div class="customer-info">
                  👤 <b>Khách:</b> ${escapeHtml(order.name || 'Khách lẻ')}<br>
                  📞 <b>SĐT:</b> <a href="tel:${escapeHtml(cleanPhone)}">${escapeHtml(cleanPhone)}</a> (<a href="${zaloDeepLink}" target="_blank" rel="noopener" style="color:#60a5fa;">💬 Zalo</a>)<br>
                  📍 <b>Đ/c:</b> <span id="addr_text_${escapeHtml(orderId)}">${escapeHtml(rawAddress)}</span> <button class="btn-edit-addr" onclick="requestUpdateAddress('${escapeHtml(orderId)}', '${escapeHtml(pureAddressForEdit)}')">✏️ Sửa Đ/c</button> ${mapButtonHtml}
                </div>
                ${noteHtml}
                <div class="items-box">${formattedItems}</div>
                <div class="order-footer">${qrTagHtml}<span class="total-price">${Number(order.total || 0).toLocaleString('vi-VN')}đ</span></div>
                <div class="status-group">
                  <button class="status-btn ${currentStatus === '1' ? 'active-1' : ''}" onclick="updateStatus(this, '${escapeHtml(cleanPhone)}', '${escapeHtml(orderId)}', '1')">1. Đang làm</button>
                  <button class="status-btn ${currentStatus === '2' ? 'active-2' : ''}" onclick="updateStatus(this, '${escapeHtml(cleanPhone)}', '${escapeHtml(orderId)}', '2')">2. Chờ Shipper</button>
                  <button class="status-btn ${currentStatus === '3' ? 'active-3' : ''}" onclick="updateStatus(this, '${escapeHtml(cleanPhone)}', '${escapeHtml(orderId)}', '3')">3. Đang giao</button>
                  <button class="status-btn ${currentStatus === '4' ? 'active-4' : ''}" onclick="updateStatus(this, '${escapeHtml(cleanPhone)}', '${escapeHtml(orderId)}', '4')">4. Hoàn thành</button>
                </div>
              </div>`;
          });
          container.innerHTML = html;
          document.getElementById('orderCount').textContent = `Chỉ hiển thị đơn trong ngày · ${data.orders.length} đơn`;
        })
        .catch(err => {
          console.error('Lỗi tải đơn hàng:', err);
          document.getElementById('ordersContainer').innerHTML = '<div class="empty-state" style="color:#ef4444;">⚠️ Lỗi kết nối dữ liệu đơn hàng. Vui lòng kiểm tra lại link Script!</div>';
        })
        .finally(() => { isFetchingOrders = false; });
    }

    function requestUpdateAddress(orderId, oldAddress) {
      const pin = prompt(`🔐 Nhập mã PIN chủ quán để sửa địa chỉ cho đơn [#${orderId}]:`);
      if (!pin) return;
      const newAddrInput = prompt("Nhập địa chỉ giao hàng mới cho khách:", oldAddress);
      if (!newAddrInput || newAddrInput.trim() === '') return;

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ type: 'updateOrderAddress', orderId: orderId, newAddress: '🛵 Giao tận nơi: ' + newAddrInput.trim(), pin: pin })
      })
      .then(res => res.json())
      .then(res => {
        alert(res.message);
        if (res.success) fetchOrders();
      })
      .catch(err => alert('⚠️ Lỗi kết nối máy chủ!'));
    }

    function parseAdminItemsToList(rawItemsStr) {
      if (!rawItemsStr) return '<div class="pos-item-row">☕ Không có thông tin món</div>';
      return `<div class="pos-item-row"><div>${escapeHtml(rawItemsStr)}</div></div>`;
    }

    function pushOrderButton(button) {
      let orderObj = JSON.parse(button.getAttribute('data-order') || '{}');
      pushOrderToPOS(String(orderObj.orderId || ''), orderObj, button);
    }

    async function pushOrderToPOS(orderId, orderObj, button) {
      const pin = prompt(`🔐 Nhập mã PIN chủ quán để đẩy đơn #${orderId} sang POS:`);
      if (!pin) return;

      if (button) { button.disabled = true; button.textContent = '⏳ Đang đồng bộ...'; }
      try {
        await fetch(SCRIPT_URL, {
          method: 'POST', mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            type: 'pushOnlineOrder',
            sourceOrderId: String(orderId),
            orderId: String(orderId),
            total: Number(orderObj.total || 0),
            name: String(orderObj.name || 'Khách lẻ'),
            phone: String(orderObj.phone || '').replace(/'/g, '').trim(),
            address: String(orderObj.address || ''),
            payment: String(orderObj.payment || 'Tiền mặt'),
            note: String(orderObj.note || '')
          })
        });
        localStorage.setItem(`kimbling_pushed_pos_${orderId}`, 'true');
        alert(`✅ Đã đẩy đơn #${orderId} thành công!`);
        fetchOrders();
      } catch (err) {
        alert(`⚠️ Lỗi: ${err.message || 'Lỗi kết nối'}`);
      } finally {
        if (button) { button.disabled = false; button.textContent = '✅ Đã đẩy đơn'; button.classList.add('pushed'); }
      }
    }

    function updateStatus(btnElement, phone, orderId, status) {
      fetch(SCRIPT_URL, {
        method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({type:'updateStatus', phone:phone, orderId:orderId, status:status})
      }).catch(err => console.error(err));
      fetchOrders();
    }

    function requestDeleteSingleOrder(orderId) {
      const pin = prompt(`🔐 Nhập mã PIN chủ quán để xóa đơn [#${orderId}]:`);
      if (!pin) return;
      fetch(SCRIPT_URL, {method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:'deleteSingleOrder',orderId:orderId,pin:pin})})
        .then(res => res.json()).then(res => { alert(res.message); if(res.success) fetchOrders(); });
    }

    function requestClearOrders() {
      const pin = prompt('🔐 Nhập mã PIN chủ quán để dọn dẹp đơn cũ:');
      if (!pin) return;
      fetch(SCRIPT_URL, {method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:'clearOrders',pin:pin})})
        .then(res => res.json()).then(res => { alert(res.message); if(res.success) fetchOrders(); });
    }
  </script>
</body>
</html>
