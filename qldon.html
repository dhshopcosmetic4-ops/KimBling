<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quản Lý Đơn Hàng — KimBling</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="QLĐ KimBling">
  <link rel="apple-touch-icon" href="logo.jpg">

  <style>
    :root { 
      --primary: #f59e0b; 
      --bg: #121824; 
      --card-bg: #1e293b; 
      --text: #f8fafc; 
      --subtext: #cbd5e1; 
      --border: #334155; 
    }
    * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    body { background-color:var(--bg); color:var(--text); padding:12px; font-size:17px; }
    
    #adminHeader { display:flex; justify-content:space-between; align-items:center; padding-bottom:14px; margin-bottom:14px; border-bottom:2px solid var(--border); }
    .header-btns { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .action-btn { background:var(--primary); color:#000; border:none; padding:10px 14px; border-radius:10px; font-weight:bold; cursor:pointer; font-size:15px; }
    .sound-btn { background:#059669; color:#fff; display:inline-flex; align-items:center; gap:6px; }
    .sound-btn.active { background:#10b981; }
    .refresh-toggle-btn { background:#475569; color:#fff; transition: background 0.2s ease; }
    
    .order-card { background:var(--card-bg); border:2px solid var(--border); border-radius:14px; padding:16px; padding-top:48px; margin-bottom:16px; box-shadow:0 6px 12px rgba(0,0,0,.4); position:relative; }
    .order-header { display:flex; justify-content:space-between; border-bottom:1px dashed var(--border); padding-bottom:10px; margin-bottom:12px; align-items:center; gap:10px; }
    .order-id { font-weight:bold; color:var(--primary); font-size:20px; }
    .order-time { font-size:15px; color:var(--subtext); }
    
    .btn-delete-single { 
      position: absolute; top: 12px; left: 14px; 
      background: rgba(239,68,68,.2); color: #f87171; 
      border: 1px solid #ef4444; padding: 6px 12px; 
      border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; 
    }
    .btn-delete-single:hover { background:#ef4444; color:#fff; }

    .btn-push-pos { background:linear-gradient(135deg,#3b82f6,#1d4ed8); color:#fff; border:none; padding:8px 14px; border-radius:8px; font-size:14px; font-weight:bold; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:all .2s; }
    .btn-push-pos:hover { background:linear-gradient(135deg,#2563eb,#1e40af); transform:scale(1.02); }
    .btn-push-pos.pushed { background:#10b981!important; cursor:default; }
    .btn-push-pos:disabled { opacity:.75; cursor:wait; }
    
    .customer-info { margin-bottom:12px; line-height:1.7; font-size:16px; overflow-wrap:anywhere; }
    .customer-info a { color:#38bdf8; text-decoration:none; font-weight:bold; }
    .note-box { background:#451a03; color:#fdba74; padding:10px 12px; border-radius:8px; font-size:15px; margin-bottom:12px; border:1px dashed #c2410c; line-height:1.5; }
    
    .items-box { background:#0f172a; padding:12px 14px; border-radius:10px; margin:12px 0; font-size:16px; border-left:5px solid var(--primary); }
    
    .pos-item-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; border-bottom:1px dashed rgba(255,255,255,.15); padding-bottom:10px; gap:8px; }
    .pos-item-row:last-child { border-bottom:none; margin-bottom:0; padding-bottom:0; }
    .pos-item-content { flex: 1; cursor: pointer; }
    .pos-item-header { display:flex; justify-content:space-between; align-items:center; font-weight:bold; font-size:17px; color:#f8fafc; }
    .pos-item-price { color:#facc15; font-size:17px; font-weight:bold; }
    .pos-item-options { font-size:14px; color:#94a3b8; margin-top:4px; line-height:1.4; }
    .pos-item-row.completed-item .pos-item-content { opacity:.45; text-decoration:line-through; }
    
    .btn-del-item {
      background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #f87171;
      padding: 4px 8px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer;
      margin-left: 8px; flex-shrink: 0;
    }
    .btn-del-item:hover { background: #ef4444; color: #fff; }

    .order-footer { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin:14px 0; font-size:16px; }
    .payment-tag { padding:6px 12px; border-radius:8px; font-size:15px; font-weight:bold; }
    .pay-cash { background:#334155; color:#f8fafc; }
    .pay-transfer { background:#065f46; color:#34d399; border:1px solid #059669; cursor:pointer; transition:all .2s; }
    .pay-transfer:hover { background:#047857; transform:scale(1.05); }
    .pay-diamond { background:rgba(0, 188, 212, 0.15); color:#00bcd4; font-weight: bold; }
    
    .total-price { font-weight:bold; color:#4ade80; font-size:20px; white-space:nowrap; }
    .total-price.diamond-price { color:#00bcd4; }

    .status-group { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
    .status-btn { padding:12px 6px; border-radius:10px; border:1px solid var(--border); background:#0f172a; color:var(--subtext); font-size:15px; font-weight:bold; cursor:pointer; text-align:center; transition:background .15s,color .15s,border-color .15s; }
    .status-btn.active-1 { background:#eab308; color:#000; border-color:#eab308; }
    .status-btn.active-2 { background:#3b82f6; color:#fff; border-color:#3b82f6; }
    .status-btn.active-3 { background:#a855f7; color:#fff; border-color:#a855f7; }
    .status-btn.active-4 { background:#22c55e; color:#fff; border-color:#22c55e; }
    
    .empty-state { text-align:center; color:var(--subtext); padding:50px 0; font-size:18px; }
    @keyframes orderBuzz { 0%{transform:translate(0,0) rotate(0)} 20%{transform:translate(-2px,2px) rotate(-.5deg)} 40%{transform:translate(2px,-2px) rotate(.5deg)} 60%{transform:translate(-1px,1px) rotate(0)} 80%{transform:translate(1px,-1px) rotate(0)} 100%{transform:translate(0,0) rotate(0)} }
    .order-card.new-buzz { animation:orderBuzz .5s ease-in-out infinite; border:2px solid #eab308!important; box-shadow:0 0 20px rgba(234,179,8,.5); }
    .order-card.status-bg-1 { border-color:#eab308; } .order-card.status-bg-2 { border-color:#3b82f6; } .order-card.status-bg-3 { border-color:#a855f7; } .order-card.status-bg-4 { border-color:#22c55e; opacity:.85; }
    
    .btn-map-route { display:inline-flex; align-items:center; gap:6px; background:#0284c7; color:#fff!important; text-decoration:none; padding:6px 10px; border-radius:8px; font-size:14px; font-weight:bold; margin-top:6px; transition:background .2s; }
    .btn-map-route:hover { background:#0369a1; }
    .btn-edit-addr { background:#0284c7; color:#fff; border:none; padding:4px 8px; border-radius:6px; font-size:13px; cursor:pointer; margin-left:6px; font-weight:bold; }

    .qr-popup-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(5px);
      z-index: 9999; display: flex; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden; transition: all 0.3s ease; padding: 12px;
    }
    .qr-popup-overlay.active { opacity: 1; visibility: visible; }
    .qr-popup-container {
      background: #0f172a; border: 2px solid #c29b38; width: 100%; max-width: 440px;
      max-height: 90vh; border-radius: 16px; display: flex; flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); overflow: hidden;
    }
    .qr-popup-header {
      padding: 14px 18px; background: #1e293b; border-bottom: 1px solid #334155;
      display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    }
    .qr-popup-title { color: #c29b38; font-size: 17px; font-weight: bold; }
    .qr-close-btn {
      background: #334155; color: #f8fafc; border: none; width: 36px; height: 36px;
      border-radius: 50%; font-size: 18px; font-weight: bold; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .qr-popup-body { flex: 1; width: 100%; overflow-y: auto; background: #0f172a; }
    .qr-popup-body iframe { width: 100%; height: 500px; border: none; }

    .qr-popup-overlay.tiktok-popup-overlay {
      padding: 0 !important;
      background: #0f172a !important;
      backdrop-filter: none !important;
    }
    .tiktok-popup-container {
      width: 100% !important; height: 100% !important;
      max-width: 100% !important; max-height: 100% !important;
      border: none !important; border-radius: 0 !important;
      display: flex; flex-direction: column;
    }
    .tiktok-popup-header {
      background: #0f172a !important; border-bottom: 1px solid #334155 !important;
      padding: 16px 20px !important; display: flex; justify-content: space-between; align-items: center;
    }
    .tiktok-popup-header .qr-popup-title { font-size: 19px !important; font-weight: bold; color: #38bdf8; }
    .tiktok-close-btn {
      background: #334155 !important; color: #fff !important; border: none !important;
      width: 44px !important; height: 44px !important; border-radius: 50% !important;
      font-size: 22px !important; font-weight: bold !important; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: background 0.2s;
    }
    .tiktok-close-btn:hover { background: #ef4444 !important; }

    #loadingOverlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.88); z-index: 99999;
      flex-direction: column; align-items: center; justify-content: center; color: #f8fafc;
    }
    .spinner {
      width: 48px; height: 48px; border: 5px solid #334155; border-top: 5px solid #f59e0b;
      border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 14px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #loadingText { font-size: 16px; font-weight: bold; color: #ffd700; text-align: center; padding: 0 20px; }
  </style>
</head>
<body>
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div id="loadingText">Đang kết nối KimBling... Vui lòng chờ xíu nhé!</div>
  </div>

  <audio id="silentBackgroundAudio" loop preload="auto">
    <source src="data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU2LjQwLjEwMQAAAAAAAAAAAAAA//OEAAAAAAAAAAAAAAAAAAAAAAAASW5mbwAAAA8AAAAEAAABhQCFgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA/////////////////////////////////////////////////////////////////w==" type="audio/mpeg">
  </audio>

  <div id="adminApp">
    <div id="adminHeader">
      <div>
        <h2 style="color:var(--primary); font-size: 22px;">QUẢN LÝ ĐƠN HÀNG</h2>
        <span id="orderCount" style="font-size:14px;color:var(--subtext);">Chỉ hiển thị đơn trong ngày</span>
      </div>
      <div class="header-btns">
        <button class="action-btn refresh-toggle-btn" id="btnAutoRefresh" onclick="toggleAutoRefresh()">⏱️ Tự làm mới: TẮT</button>
        <button class="action-btn" style="background:#0284c7; color:#fff;" onclick="toggleGhiChuPopup(true)">📖 Sổ Tay & Kho</button>
        <button class="action-btn" style="background:#eab308; color:#000;" onclick="toggleQrPopup(true)">📱 Mã Tích Điểm</button>
        <button class="action-btn" style="background:#ff9800; color:#000;" onclick="toggleHatKimPopup(true)">💎 Túi Thần Tài 💎</button>
        <button class="action-btn" style="background:#e11d48; color:#fff;" onclick="toggleEventPopup(true)">🎉 Event Lễ</button>
        <button class="action-btn" id="btnEventStatusIndicator" style="background:#475569; color:#fff;" onclick="checkEventStatusAlert()">⚪ Trạng thái Event</button>
        <button class="action-btn sound-btn" id="btnEnableSound" onclick="enableAudioAndNotification()">🔔 Chuông Nền</button>
        <button class="action-btn" onclick="lastRenderedDataSignature = ''; fetchOrders(true);">🔄 Tải lại</button>
      </div>
    </div>
    <div id="ordersContainer"><div class="empty-state">Đang kết nối KimBling tải dữ liệu đơn hàng...</div></div>
  </div>

  <div id="qrPopupModal" class="qr-popup-overlay">
    <div class="qr-popup-container">
      <div class="qr-popup-header">
        <span class="qr-popup-title">📱 Tạo Mã QR Tích Điểm Nhanh</span>
        <button class="qr-close-btn" onclick="toggleQrPopup(false)">✕</button>
      </div>
      <div class="qr-popup-body">
        <iframe id="qrIframe" src=""></iframe>
      </div>
    </div>
  </div>

  <div id="hatKimPopupModal" class="qr-popup-overlay">
    <div class="qr-popup-container" style="border-color: #ff9800;">
      <div class="qr-popup-header" style="background: #2c1810; border-bottom: 1px solid #ff9800;">
        <span class="qr-popup-title" style="color: #ff9800;">💎 Quản Lý Túi Thần Tài & Mã PIN</span>
        <button class="qr-close-btn" onclick="toggleHatKimPopup(false)">✕</button>
      </div>
      <div class="qr-popup-body">
        <iframe id="hatKimIframe" src=""></iframe>
      </div>
    </div>
  </div>

  <div id="eventPopupModal" class="qr-popup-overlay">
    <div class="qr-popup-container" style="border-color: #e11d48;">
      <div class="qr-popup-header" style="background: #270515; border-bottom: 1px solid #e11d48;">
        <span class="qr-popup-title" style="color: #fb7185;">🎉 Quản Lý Event Lễ Lộc</span>
        <button class="qr-close-btn" onclick="toggleEventPopup(false)">✕</button>
      </div>
      <div class="qr-popup-body">
        <iframe id="eventIframe" src=""></iframe>
      </div>
    </div>
  </div>

  <div id="ghiChuPopupModal" class="qr-popup-overlay tiktok-popup-overlay">
    <div class="qr-popup-container tiktok-popup-container">
      <div class="qr-popup-header tiktok-popup-header">
        <span class="qr-popup-title">📖 Sổ Tay Điều Hành & Kho</span>
        <button class="tiktok-close-btn" onclick="toggleGhiChuPopup(false)">✕</button>
      </div>
      <div class="qr-popup-body" style="padding: 0; flex: 1;">
        <iframe id="ghiChuIframe" src="" style="width: 100%; height: 100%; border: none;"></iframe>
      </div>
    </div>
  </div>

  <script>
    const KIMBLING_API_URL = "https://script.google.com/macros/s/AKfycbxPxsg3oxHjUsx8KHyOSIYmjXZw9rY9GFQYf0cHNK3JmBsfdYMJ21PQdhg43HP787GIDQ/exec";
    
    const STORE_LAT = 10.749122; 
    const STORE_LNG = 106.631035;

    let isFetchingOrders = false;
    let lastRenderedDataSignature = ""; 

    let audioContext = null;
    let knownOrderIds = new Set();
    let isFirstLoad = true;
    let continuousAlarmTimer = null;
    
    let autoRefreshTimer = null;
    let isAutoRefreshOn = false;

    function toggleAutoRefresh() {
      const btn = document.getElementById('btnAutoRefresh');
      isAutoRefreshOn = !isAutoRefreshOn;

      if (isAutoRefreshOn) {
        btn.style.background = '#10b981';
        btn.style.color = '#fff';
        btn.innerHTML = '⏱️ Tự làm mới: BẬT (30s)';
        
        autoRefreshTimer = setInterval(() => {
          fetchOrders(false);
        }, 30000);
        
        alert("✅ Đã BẬT chế độ tự động làm mới đơn hàng mỗi 30 giây.");
      } else {
        btn.style.background = '#475569';
        btn.style.color = '#fff';
        btn.innerHTML = '⏱️ Tự làm mới: TẮT';
        
        if (autoRefreshTimer) {
          clearInterval(autoRefreshTimer);
          autoRefreshTimer = null;
        }
        
        alert("⏸️ Đã TẮT tự động làm mới.");
      }
    }

    function showLoading(text = "Đang kết nối KimBling... Vui lòng chờ xíu nhé!") {
      document.getElementById('loadingText').innerText = text;
      document.getElementById('loadingOverlay').style.display = 'flex';
    }

    function hideLoading() {
      document.getElementById('loadingOverlay').style.display = 'none';
    }

    function formatMoneyK(amount) {
      const num = Number(amount || 0);
      if (num === 0) return '0đ';
      return Math.round(num / 1000) + 'k';
    }

    function toggleQrPopup(isOpen) {
      const popup = document.getElementById('qrPopupModal');
      const iframe = document.getElementById('qrIframe');
      if (isOpen) {
        if (!iframe.src || iframe.src === window.location.href || iframe.src === "") {
          iframe.src = 'qrtichdiem.html?v=' + Date.now();
        }
        popup.classList.add('active');
      } else {
        popup.classList.remove('active');
      }
    }

    function toggleHatKimPopup(isOpen) {
      const popup = document.getElementById('hatKimPopupModal');
      const iframe = document.getElementById('hatKimIframe');
      if (isOpen) {
        if (!iframe.src || iframe.src === window.location.href || iframe.src === "") {
          iframe.src = 'tuikimcuong.html?v=' + Date.now();
        }
        popup.classList.add('active');
      } else {
        popup.classList.remove('active');
      }
    }

    function toggleEventPopup(isOpen) {
      const popup = document.getElementById('eventPopupModal');
      const iframe = document.getElementById('eventIframe');
      if (isOpen) {
        if (!iframe.src || iframe.src === window.location.href || iframe.src === "") {
          iframe.src = 'event.html?v=' + Date.now();
        }
        popup.classList.add('active');
      } else {
        popup.classList.remove('active');
        updateEventStatusIndicator();
      }
    }

    function toggleGhiChuPopup(isOpen) {
      const popup = document.getElementById('ghiChuPopupModal');
      const iframe = document.getElementById('ghiChuIframe');
      if (isOpen) {
        if (!iframe.src || iframe.src === window.location.href || iframe.src === "") {
          iframe.src = 'ghichu.html?v=' + Date.now();
        }
        popup.classList.add('active');
      } else {
        popup.classList.remove('active');
      }
    }

    async function checkActiveEventFromSheets() {
      try {
        const res = await fetch(`${KIMBLING_API_URL}?type=getEventConfig&rand=${Math.random()}&t=${Date.now()}`);
        const data = await res.json();
        if (data.success && data.config) {
          const config = data.config;
          if (config.emergencyStop) return { active: false, reason: "Đã tắt khẩn cấp trên Google Sheets" };

          if (config.useSchedule) {
            if (!config.timeStart || !config.timeEnd) return { active: false, reason: "Chưa cài đặt đủ thời gian hẹn giờ" };
            const now = new Date().getTime();
            const startTime = new Date(config.timeStart).getTime();
            const endTime = new Date(config.timeEnd).getTime();

            if (now >= startTime && now <= endTime) return { active: true, config: config };
            return { active: false, reason: "Ngoài khung giờ hẹn lịch" };
          }
          return { active: true, config: config };
        }
      } catch (e) { console.log("Lỗi kết nối kiểm tra Event:", e); }
      return { active: false, reason: "Không kết nối được Google Sheets" };
    }

    async function updateEventStatusIndicator() {
      const btn = document.getElementById('btnEventStatusIndicator');
      if (!btn) return;
      btn.innerHTML = `⏳ Đang quét Event...`;
      const status = await checkActiveEventFromSheets();
      
      if (status.active) {
        btn.style.background = '#22c55e';
        btn.style.color = '#fff';
        let extraText = [];
        if (status.config.doubleDiamond) extraText.push("x2 💎");
        if (status.config.bonusTurns) extraText.push(`+${status.config.bonusTurnsValue || 5} lượt`);
        btn.innerHTML = `🟢 Event: Đang Chạy (${extraText.join(', ') || 'Bật'})`;
      } else {
        btn.style.background = '#64748b';
        btn.style.color = '#f8fafc';
        btn.innerHTML = `⚪ Event: Đang Tắt`;
      }
    }

    async function checkEventStatusAlert() {
      showLoading("Đang kiểm tra trạng thái Event từ Google Sheets...");
      const status = await checkActiveEventFromSheets();
      hideLoading();

      if (status.active) {
        let msg = "🟢 EVENT LỄ LỘC ĐANG HOẠT ĐỘNG (Đồng bộ Sheets):\n";
        if (status.config.doubleDiamond) msg += "💎 Đang áp dụng Nhân đôi Kim Cương.\n";
        if (status.config.bonusTurns) msg += `🎁 Đang tặng thêm ${status.config.bonusTurnsValue || 5} lượt mở hộp khi đặt hàng.\n`;
        alert(msg);
      } else {
        alert(`🔴 EVENT ĐANG TẮT HOẶC CHƯA DIỄN RA.\nLý do: ${status.reason}`);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateEventStatusIndicator();
    });

    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'EVENT_CONFIG_UPDATED') {
        updateEventStatusIndicator();
      }
    });

    function enableAudioAndNotification() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === 'suspended') { audioContext.resume(); }

      const silentAudio = document.getElementById('silentBackgroundAudio');
      if (silentAudio) {
        silentAudio.volume = 0.01;
        silentAudio.play().catch(e => console.log("Silent audio blocked"));
      }

      if ("Notification" in window) {
        Notification.requestPermission().then(permission => {
          const btn = document.getElementById('btnEnableSound');
          if (permission === 'granted') {
            btn.innerHTML = '✅ Đã Bật Chuông';
            btn.classList.add('active');
            playChimeSound();
          } else {
            alert("Vui lòng cấp quyền Notification trong Cài đặt trình duyệt.");
          }
        });
      } else {
        playChimeSound();
        document.getElementById('btnEnableSound').innerHTML = '🔊 Đã Bật Nền';
      }
    }

    function playChimeSound() {
      try {
        if (!audioContext) { audioContext = new (window.AudioContext || window.webkitAudioContext)(); }
        if (audioContext.state === 'suspended') { audioContext.resume(); }

        const now = audioContext.currentTime;
        const osc1 = audioContext.createOscillator();
        const gain1 = audioContext.createGain();
        osc1.type = 'sine'; osc1.frequency.setValueAtTime(880, now);
        gain1.gain.setValueAtTime(0.5, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        osc1.connect(gain1); gain1.connect(audioContext.destination);
        osc1.start(now); osc1.stop(now + 0.5);

        const osc2 = audioContext.createOscillator();
        const gain2 = audioContext.createGain();
        osc2.type = 'sine'; osc2.frequency.setValueAtTime(1174.66, now + 0.2);
        gain2.gain.setValueAtTime(0.6, now + 0.2);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
        osc2.connect(gain2); gain2.connect(audioContext.destination);
        osc2.start(now + 0.2); osc2.stop(now + 0.8);

        if ("vibrate" in navigator) { navigator.vibrate([200, 100, 200, 100, 400]); }
      } catch (e) { console.log("Lỗi âm thanh:", e); }
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    function calculateShippingFee(distanceKm) {
      if (distanceKm <= 1.0) return 0;
      else if (distanceKm <= 2.0) return 10000;
      else if (distanceKm <= 3.0) return 15000;
      else {
        let extraKm = Math.ceil(distanceKm - 3.0);
        return 15000 + (extraKm * 5000);
      }
    }

    function calculateHaversineKm(lat1, lon1, lat2, lon2) {
      function toRad(x) { return x * Math.PI / 180; }
      let R = 6371;
      let dLat = toRad(lat2 - lat1);
      let dLon = toRad(lon2 - lon1);
      let a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function parseOrderItemsForPOS(orderObj, orderId) {
      const rawItems = orderObj.items;
      if (Array.isArray(rawItems) && rawItems.length > 0) {
        return rawItems.map((item, idx) => ({
          cartId: Number(item.cartId || (Date.now() + idx)),
          id: Number(item.id || (idx + 1)),
          name: String(item.name || item.title || 'Món nước').replace(/\([^)]*\)/g, '').trim(),
          basePrice: Number(item.basePrice ?? item.price ?? 26000),
          optionsText: String(item.optionsText || item.options || 'Size: Bình thường'),
          quantity: Math.max(1, Number(item.quantity || item.qty || 1)),
          rawToppings: Array.isArray(item.rawToppings) ? item.rawToppings : []
        }));
      }

      const rawItemsStr = String(rawItems || '').trim();
      if (!rawItemsStr) {
        return [{ cartId: Date.now(), id: 1, name: `Đơn hàng #${orderId}`, basePrice: Number(orderObj.total || 56000), optionsText: "Size: Bình thường", quantity: 1, rawToppings: [] }];
      }

      const itemBlocks = rawItemsStr.split(/(?<=\d\s*(?:đ|k))\s*\|\s*(?=[A-Za-zÀ-ỹ])/i).map(s => s.trim()).filter(Boolean);
      let parsedItems = [];

      itemBlocks.forEach((block, idx) => {
        let itemPrice = 26000;
        const priceMatch = block.match(/(\d{1,3}(?:\.\d{3})*|\d+)\s*(?:đ|k)/i);
        if (priceMatch) {
          let pVal = parseInt(priceMatch[1].replace(/[^\d]/g, ''), 10);
          if (pVal > 0) {
            if (priceMatch[0].toLowerCase().includes('k') && pVal < 1000) pVal *= 1000;
            itemPrice = pVal;
          }
        }

        let cleanBlock = block;
        if (priceMatch) cleanBlock = cleanBlock.replace(priceMatch[0], '').replace(/=\s*$/, '').trim();

        let optionContent = "";
        const parenMatch = cleanBlock.match(/\(([^)]+)\)/);
        if (parenMatch) {
          optionContent = parenMatch[1].trim();
          cleanBlock = cleanBlock.replace(parenMatch[0], '').trim();
        }

        let qty = 1;
        const qtyMatch = cleanBlock.match(/(?:x|×)\s*(\d+)\s*$/i);
        if (qtyMatch) {
          qty = parseInt(qtyMatch[1], 10) || 1;
          cleanBlock = cleanBlock.replace(qtyMatch[0], '').trim();
        }

        let dishName = cleanBlock.replace(/^[-–—|]\s*/, '').replace(/[-–—|]\s*$/, '').trim();
        if (!dishName) dishName = 'Món nước';

        let finalOptionsText = optionContent ? `Size: ${optionContent}` : "Size: Bình thường";
        let toppingsArr = [];
        if (optionContent.includes('+')) {
          const parts = optionContent.split('+');
          if (parts[1]) toppingsArr = parts[1].split(',').map(t => t.trim()).filter(Boolean);
        }

        parsedItems.push({
          cartId: Date.now() + idx + Math.random(),
          id: idx + 1,
          name: dishName,
          basePrice: itemPrice,
          optionsText: finalOptionsText,
          quantity: qty,
          rawToppings: toppingsArr
        });
      });

      return parsedItems.length ? parsedItems : [{ cartId: Date.now(), id: 1, name: `Đơn hàng #${orderId}`, basePrice: Number(orderObj.total || 56000), optionsText: "Size: Bình thường", quantity: 1, rawToppings: [] }];
    }

    function parseAdminItemsToList(rawItemsStr, orderId) {
      const itemsArr = parseOrderItemsForPOS({ items: rawItemsStr }, orderId);
      if (!itemsArr || itemsArr.length === 0) return '<div class="pos-item-row">☕ Không có thông tin món</div>';

      return itemsArr.map((item, idx) => {
        const uniqueId = `item_row_${orderId}_${idx}`;
        const formattedPrice = formatMoneyK(item.basePrice);

        return `

    async function requestDeleteItemFromOrder(orderId, itemIndex) {
      const pin = prompt(`🔐 Nhập mã PIN chủ quán để XÓA MÓN khỏi đơn [#${orderId}]:`);
      if (!pin) return;

      const savedAdminPin = localStorage.getItem('kimbling_admin_pin') || '0';
      if (pin !== savedAdminPin && pin !== '1234' && pin !== '0') {
        alert('❌ Mã PIN chủ quán không chính xác!');
        return;
      }

      showLoading(`Đang kết nối KimBling xóa món khỏi đơn #${orderId}...`);
      isFetchingOrders = true;

      try {
        const response = await fetch(`${KIMBLING_API_URL}?type=checkStatus&phone=ALL&rand=${Math.random()}&t=${Date.now()}`, {cache:'no-store'});
        const data = await response.json();
        const ordersArr = data.orders || data;
        if (!data.success && !Array.isArray(ordersArr)) throw new Error("Không lấy được dữ liệu đơn.");

        const targetOrder = ordersArr.find(o => String(o.orderId) === String(orderId));
        if (!targetOrder) throw new Error("Không tìm thấy đơn hàng.");

        let parsedItems = parseOrderItemsForPOS(targetOrder, orderId);
        if (itemIndex < 0 || itemIndex >= parsedItems.length) throw new Error("Vị trí món không hợp lệ.");

        parsedItems.splice(itemIndex, 1);

        if (parsedItems.length === 0) {
          if (confirm("Món bị xóa là món cuối cùng. Hệ thống sẽ hủy toàn bộ đơn hàng này?")) {
            await fetch(KIMBLING_API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ type: 'deleteSingleOrder', orderId: orderId, pin: pin })
            });
            alert(`✅ Đã xóa đơn hàng #${orderId}`);
          }
        } else {
          let newTotal = 0;
          let newItemsTextArr = [];

          parsedItems.forEach(item => {
            const itemPriceTotal = item.basePrice * item.quantity;
            newTotal += itemPriceTotal;
            newItemsTextArr.push(`${item.name} (${item.optionsText}) x${item.quantity} = ${formatMoneyK(item.basePrice)}`);
          });

          const newItemsString = newItemsTextArr.join(" | ");

          const updateRes = await fetch(KIMBLING_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              type: 'updateOrderItemsAndTotal',
              orderId: orderId,
              items: newItemsString,
              total: newTotal,
              pin: pin
            })
          });
          const updateData = await updateRes.json();
          alert(updateData.message || '✅ Đã xóa món và tính lại tổng tiền thành công!');
        }

        lastRenderedDataSignature = ""; 
        fetchOrders(true);
      } catch (err) {
        alert(`⚠️ Lỗi: ${err.message || 'Lỗi kết nối KimBling!'}`);
      } finally {
        hideLoading();
        setTimeout(() => { isFetchingOrders = false; }, 3000);
      }
    }

    async function requestUpdateAddressAndCalculateFee(orderId, oldAddress) {
      const pin = prompt(`🔐 Nhập mã PIN chủ quán để sửa địa chỉ giao hàng cho đơn [#${orderId}]:`);
      if (!pin) return;
      const savedAdminPin = localStorage.getItem('kimbling_admin_pin') || '0';
      if (pin !== savedAdminPin && pin !== '1234' && pin !== '0') {
        alert('❌ Mã PIN chủ quán không chính xác!');
        return;
      }

      const newAddrInput = prompt("Nhập địa chỉ giao hàng mới cho khách:", oldAddress);
      if (!newAddrInput || newAddrInput.trim() === '') return;

      let fullAddress = newAddrInput.trim();
      if (!fullAddress.toLowerCase().includes("hồ chí minh") && !fullAddress.toLowerCase().includes("tp.hcm")) {
        fullAddress += ", Hồ Chí Minh";
      }

      showLoading("Đang quét tọa độ và tính phí ship tự động...");

      let distanceKm = 0;
      try {
        let res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(fullAddress)}&limit=1`);
        let data = await res.json();
        if (data && data.features && data.features.length > 0) {
          let coords = data.features[0].geometry.coordinates;
          let destLng = coords[0], destLat = coords[1];

          let osrmRes = await fetch(`https://router.project-osrm.org/route/v1/foot/${STORE_LNG},${STORE_LAT};${destLng},${destLat}?overview=false`);
          let osrmData = await osrmRes.json();
          if (osrmData.code === "Ok" && osrmData.routes && osrmData.routes[0]) {
            distanceKm = osrmData.routes[0].distance / 1000;
          } else {
            distanceKm = calculateHaversineKm(STORE_LAT, STORE_LNG, destLat, destLng);
          }
        } else { distanceKm = 1.0; }
      } catch (e) { distanceKm = 1.0; }

      let newShippingFee = calculateShippingFee(distanceKm);
      let formattedNewAddress = '🛵 Giao tận nơi: ' + newAddrInput.trim();

      isFetchingOrders = true;
      fetch(KIMBLING_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          type: 'updateOrderAddressAndFee',
          orderId: orderId,
          newAddress: formattedNewAddress,
          shippingFee: newShippingFee,
          pin: pin
        })
      })
      .then(res => res.json())
      .then(res => {
        alert(res.message || 'Đã cập nhật thành công.');
        if (res.success) {
          lastRenderedDataSignature = ""; 
          fetchOrders(true);
        }
      })
      .catch(err => alert('⚠️ Lỗi kết nối KimBling!'))
      .finally(() => { 
        hideLoading();
        setTimeout(() => { isFetchingOrders = false; }, 3000); 
      });
    }

    function pushOrderButton(button) {
      let orderObj;
      try { orderObj = JSON.parse(button.getAttribute('data-order') || '{}'); }
      catch (e) { alert('Không đọc được dữ liệu đơn hàng.'); return; }
      pushOrderToPOS(String(orderObj.orderId || ''), orderObj, button);
    }

    async function pushOrderToPOS(orderId, orderObj, button) {
      if (!orderId) { alert('Không xác định được mã đơn hàng.'); return; }
      if (button && button.disabled) return;

      const pin = prompt(`🔐 Nhập mã PIN chủ quán để đẩy đơn #${orderId} sang POS:`);
      if (!pin) return;
      const savedAdminPin = localStorage.getItem('kimbling_admin_pin') || '0';
      if (pin !== savedAdminPin && pin !== '1234') { alert('❌ Mã PIN chủ quán không chính xác!'); return; }

      if (button) {
        button.classList.add('pushed');
        button.disabled = true;
        button.textContent = '✅ Đã đẩy POS';
      }
      localStorage.setItem(`kimbling_pushed_pos_${orderId}`, 'true');

      const checkboxEl = document.getElementById(`tichdiem_check_${orderId}`);
      const isTichDiemChecked = checkboxEl ? checkboxEl.checked : false;

      const parsedCartItems = parseOrderItemsForPOS(orderObj, orderId);
      
      let totalItemsCount = 0;
      parsedCartItems.forEach(item => { totalItemsCount += Number(item.quantity || 1); });

      const totalAmount = Number(orderObj.total || 0);
      const paymentType = String(orderObj.payment || '').toLowerCase();
      
      let diamondsValue = 0;
      const isDiamondPayment = paymentType.includes('túi') || paymentType.includes('kim cương') || paymentType.includes('trừ túi');

      if (isDiamondPayment) {
          diamondsValue = -Math.abs(Math.round((totalAmount / 1000) * 20)); 
      } else {
          diamondsValue = Math.round(totalAmount / 1000); 
      }

      const customerPhone = String(orderObj.phone || '').replace(/'/g, '').trim();

      const payloadPOS = {
        type: 'pushOnlineOrder', action: 'pushOnlineOrder',
        sourceOrderId: String(orderId), orderId: String(orderId),
        total: totalAmount, diamonds: diamondsValue, 
        items: parsedCartItems, name: String(orderObj.name || 'Khách lẻ'),
        phone: customerPhone, address: String(orderObj.address || ''),
        payment: String(orderObj.payment || 'Tiền mặt'), note: String(orderObj.note || '')
      };

      const dataString = JSON.stringify(payloadPOS);
      if (navigator.sendBeacon) {
        navigator.sendBeacon(KIMBLING_API_URL, new Blob([dataString], {type: 'text/plain;charset=utf-8'}));
      } else {
        fetch(KIMBLING_API_URL, {
          method: 'POST', mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: dataString
        }).catch(e => {});
      }

      if (isTichDiemChecked && customerPhone.length >= 9) {
        const pointPayload = JSON.stringify({
          action: 'add_points', sdt: customerPhone,
          ly: totalItemsCount, txid: `ONLINE_${orderId}`
        });
        if (navigator.sendBeacon) {
          navigator.sendBeacon(KIMBLING_API_URL, new Blob([pointPayload], {type: 'text/plain;charset=utf-8'}));
        } else {
          fetch(KIMBLING_API_URL, {
            method: 'POST', mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: pointPayload
          }).catch(e => {});
        }
      }

      checkActiveEventFromSheets().then(eventCheck => {
        if (eventCheck.active && eventCheck.config) {
          const eventConfig = eventCheck.config;
          if (eventConfig.bonusTurns && customerPhone.length >= 9) {
            const bonusAmount = eventConfig.bonusTurnsValue || 5;
            const eventPayload = JSON.stringify({
              action: 'add_hatkim', type: 'add_hatkim',
              phone: customerPhone, amount: 0, turnsPlayed: -bonusAmount
            });
            if (navigator.sendBeacon) {
              navigator.sendBeacon(KIMBLING_API_URL, new Blob([eventPayload], {type: 'text/plain;charset=utf-8'}));
            } else {
              fetch(KIMBLING_API_URL, {
                method: 'POST', mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: eventPayload
              }).catch(e => {});
            }
          }
        }
      }).catch(e => {});
    }

    function updateStatus(btnElement, phone, orderId, status) {
      const card = btnElement.closest('.order-card');
      if (card) {
        card.className = card.className.replace(/status-bg-\d/, `status-bg-${status}`).replace('new-buzz', '').trim();
        card.querySelectorAll('.status-btn').forEach((btn, idx) => { btn.className = `status-btn ${(idx + 1) == status ? 'active-' + status : ''}`; });
      }

      stopContinuousAlarm();
      
      const statusPayload = JSON.stringify({action:'updateStatus',type:'updateStatus',phone:phone,orderId:orderId,status:status});
      if (navigator.sendBeacon) {
        navigator.sendBeacon(KIMBLING_API_URL, new Blob([statusPayload], {type: 'text/plain;charset=utf-8'}));
      } else {
        fetch(KIMBLING_API_URL, {
          method:'POST', mode:'no-cors',
          headers:{'Content-Type':'text/plain;charset=utf-8'},
          body: statusPayload
        }).catch(err => console.error(err));
      }
    }

    function requestDeleteSingleOrder(orderId) {
      const pin = prompt(`🔐 Nhập mã PIN chủ quán để xóa đơn [#${orderId}]:`);
      if (!pin) return;

      showLoading(`Đang kết nối KimBling xóa đơn #${orderId}...`);
      isFetchingOrders = true; 
      fetch(KIMBLING_API_URL, {method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:'deleteSingleOrder',orderId:orderId,pin:pin})})
        .then(res => res.json())
        .then(res => { 
          alert(res.message); 
          if (res.success) {
            stopContinuousAlarm();
            lastRenderedDataSignature = ""; 
            fetchOrders(true);
          } 
        })
        .catch(err => alert('⚠️ Lỗi kết nối KimBling!'))
        .finally(() => {
          hideLoading();
          setTimeout(() => { isFetchingOrders = false; }, 3000);
        });
    }
  </script>
</body>
