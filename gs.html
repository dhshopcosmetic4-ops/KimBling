

<!DOCTYPE html>

<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#f4f7f6">

    <title>Gia Sư Toán Lớp 6 - v1.4</title>

    <style>

        * { box-sizing: border-box; }

        body {

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            max-width: 700px;

            margin: 20px auto;

            padding: 15px;

            background-color: #f4f7f6;

        }

        h2 {

            color: #2c3e50;

            text-align: center;

            margin-bottom: 2px;

        }

        p.version {

            text-align: center;

            color: #8e44ad;

            font-size: 0.85em;

            font-weight: bold;

            margin-top: 0;

            margin-bottom: 5px;

        }

        p.subtitle {

            text-align: center;

            color: #7f8c8d;

            margin-top: 0;

            font-size: 0.95em;

        }

        .chat-box {

            background: white;

            border-radius: 12px;

            padding: 20px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.05);

        }

        .api-box {

            background: #fff8e1;

            border: 1px dashed #f39c12;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 15px;

            font-size: 14px;

        }

        .api-box input {

            width: 100%;

            padding: 8px;

            margin-top: 5px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 14px;

        }

        .api-btn-group {

            display: flex;

            gap: 8px;

            margin-top: 8px;

        }

        textarea {

            width: 100%;

            height: 90px;

            padding: 12px;

            border: 2px solid #e0e0e0;

            border-radius: 8px;

            font-size: 16px;

            resize: vertical;

            outline: none;

            margin-top: 10px;

        }

        textarea:focus {

            border-color: #3498db;

        }

        .file-upload {

            margin: 10px 0;

            font-size: 14px;

            color: #555;

        }

        .action-container {

            display: flex;

            gap: 10px;

            margin-top: 10px;

        }

        #micBtn {

            flex: 1;

            padding: 12px;

            background: #e74c3c;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

            user-select: none;

            -webkit-user-select: none;

            touch-action: none;

        }

        #micBtn.recording {

            background: #c0392b;

            animation: pulse 1.5s infinite;

        }

        #sendBtn {

            flex: 1;

            padding: 12px;

            background: #2ecc71;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

        }

        #sendBtn:hover {

            background: #27ae60;

        }

        #sendBtn:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }

        #result {

            margin-top: 20px;

            white-space: pre-wrap;

            overflow-wrap: anywhere;

            background: #eef9f1;

            padding: 18px;

            border-radius: 8px;

            border-left: 5px solid #2ecc71;

            line-height: 1.6;

            font-size: 15px;

            color: #2c3e50;

            min-height: 60px;

        }

        @keyframes pulse {

            0% {

                transform: scale(1);

                box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.4);

            }

            70% {

                transform: scale(1.02);

                box-shadow: 0 0 0 10px rgba(231, 76, 60, 0);

            }

            100% {

                transform: scale(1);

                box-shadow: 0 0 0 0 rgba(231, 76, 60, 0);

            }

        }

        @media (max-width: 480px) {

            body {

                margin: 8px auto;

                padding: 10px;

            }

            .chat-box {

                padding: 15px;

            }

            .action-container {

                gap: 8px;

            }

            #micBtn, #sendBtn {

                font-size: 14px;

                padding: 12px 5px;

            }

        }

    </style>

</head>

<body>

    <h2>📐 Gia Sư Toán Lớp 6</h2>

    <p class="version">

        Phiên bản: v1.4 (Sửa lỗi kết nối Gemini)

    </p>

    <p class="subtitle">

        Chụp ảnh đề bài hoặc giữ nút micro để nói chuyện với Thầy/Cô nhé!

    </p>

    <div class="chat-box">

        <div class="api-box">

            <label for="apiKeyInput">

                🔑 <b>Google Gemini API Key của bạn:</b>

            </label>

            <input

                type="password"

                id="apiKeyInput"

                placeholder="Dán API Key vào đây..."

                autocomplete="off"

            >

            <div class="api-btn-group">

                <button

                    onclick="saveApiKey()"

                    style="flex:1;padding:8px;background:#f39c12;color:white;border:none;border-radius:5px;cursor:pointer;font-weight:bold;"

                >

                    Lưu lại Key

                </button>

                <button

                    onclick="clearApiKey()"

                    style="flex:1;padding:8px;background:#e74c3c;color:white;border:none;border-radius:5px;cursor:pointer;font-weight:bold;"

                >

                    Xóa nhanh Key

                </button>

            </div>

        </div>

        <div class="file-upload">

            <label for="imageInput">

                📷 <b>Chọn hoặc chụp ảnh đề bài (nếu có):</b>

            </label>

            <br>

            <input

                type="file"

                id="imageInput"

                accept="image/*"

                capture="environment"

                style="margin-top:5px;"

            >

        </div>

        <textarea

            id="userInput"

            placeholder="Bấm giữ nút '🎙️ Giữ để nói' bên dưới hoặc gõ câu hỏi vào đây..."

        ></textarea>

        <div class="action-container">

            <button id="micBtn">

                🎙️ Giữ để nói

            </button>

            <button id="sendBtn" onclick="askGiaSu()">

                Gửi cho Thầy/Cô

            </button>

        </div>

        <div id="result" aria-live="polite">

            Hãy nhập API Key ở trên, sau đó tải ảnh lên hoặc nói/gõ câu hỏi để bắt đầu nhé!

        </div>

    </div>

    <script>

        // =========================================

        // 1. CẤU HÌNH ỨNG DỤNG

        // =========================================

        const MODEL_NAME = "gemini-3.8-flash";

        const API_URL =

            `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent`;

        const REQUEST_TIMEOUT = 30000;

        const systemInstructionText = `

Bạn là một giáo viên dạy Toán lớp 6 cực kỳ tâm lý,

vui vẻ, kiên nhẫn và tận tụy.

Nhiệm vụ của bạn là giải đáp các bài toán hoặc khái niệm

Toán lớp 6 cho một học sinh tự học ở nhà.

NGUYÊN TẮC GIẢNG DẠY:

1. Ngôn ngữ:

Thân thiện, xưng Thầy/Cô và gọi học sinh là con hoặc em.

2. Từng bước một:

Không đưa ngay đáp án cuối cùng một cách khô khan.

Hãy chia bài toán thành từng bước nhỏ.

Giải thích rõ TẠI SAO lại làm như vậy.

3. Dễ hiểu:

Sử dụng ví dụ đời sống như chia kẹo, mua sắm,

chia bánh hoặc các tình huống quen thuộc.

4. Khen ngợi và động viên:

Luôn có lời động viên để bé có hứng thú học tập.

5. Độ chính xác:

Kiểm tra lại phép tính trước khi trả lời.

Không tự ý bỏ qua bước biến đổi.

Nếu đề bài trong ảnh không rõ, hãy hỏi lại học sinh.

6. Cách trình bày:

- Ghi rõ đề bài.

- Tóm tắt dữ kiện.

- Hướng dẫn từng bước.

- Giải thích tại sao sử dụng phép tính đó.

- Ghi đáp số cuối cùng.

7. Nếu học sinh chưa hiểu:

Hãy giải thích lại bằng cách đơn giản hơn,

không trách mắng hoặc làm học sinh mất tự tin.

`;

        const apiKeyInput =

            document.getElementById("apiKeyInput");

        const userInput =

            document.getElementById("userInput");

        const imageInput =

            document.getElementById("imageInput");

        const resultDiv =

            document.getElementById("result");

        const sendBtn =

            document.getElementById("sendBtn");

        const micBtn =

            document.getElementById("micBtn");

        // =========================================

        // 2. KHÔI PHỤC API KEY

        // =========================================

        try {

            const savedKey =

                localStorage.getItem("gemini_math_apikey");

            if (savedKey) {

                apiKeyInput.value = savedKey;

            }

        } catch (error) {

            console.warn("Không thể đọc API Key:", error);

        }

        // =========================================

        // 3. LƯU API KEY

        // =========================================

        window.saveApiKey = function() {

            const key = apiKeyInput.value.trim();

            if (!key) {

                alert("Vui lòng nhập API Key hợp lệ!");

                return;

            }

            try {

                localStorage.setItem(

                    "gemini_math_apikey",

                    key

                );

                alert("Đã lưu API Key thành công!");

            } catch (error) {

                alert("Không thể lưu API Key trên thiết bị này.");

            }

        };

        // =========================================

        // 4. XÓA API KEY

        // =========================================

        window.clearApiKey = function() {

            try {

                localStorage.removeItem("gemini_math_apikey");

            } catch (error) {

                console.warn(error);

            }

            apiKeyInput.value = "";

            alert("Đã xóa API Key khỏi thiết bị!");

        };

        // =========================================

        // 5. NÉN VÀ CHUYỂN ẢNH SANG BASE64

        // =========================================

        async function getBase64Image(file) {

            if (!file || !file.type.startsWith("image/")) {

                throw new Error("Tệp tải lên không phải hình ảnh.");

            }

            return new Promise((resolve, reject) => {

                const reader = new FileReader();

                reader.onerror = () => {

                    reject(new Error("Không đọc được ảnh."));

                };

                reader.onload = (event) => {

                    const img = new Image();

                    img.onerror = () => {

                        reject(new Error("Ảnh bị lỗi hoặc không thể mở."));

                    };

                    img.onload = () => {

                        try {

                            const canvas =

                                document.createElement("canvas");

                            let width = img.width;

                            let height = img.height;

                            const MAX_WIDTH = 1600;

                            const MAX_HEIGHT = 1600;

                            const scale = Math.min(

                                1,

                                MAX_WIDTH / width,

                                MAX_HEIGHT / height

                            );

                            width = Math.round(width * scale);

                            height = Math.round(height * scale);

                            canvas.width = width;

                            canvas.height = height;

                            const ctx = canvas.getContext("2d");

                            if (!ctx) {

                                throw new Error("Không thể xử lý ảnh.");

                            }

                            ctx.drawImage(

                                img,

                                0,

                                0,

                                width,

                                height

                            );

                            const dataUrl =

                                canvas.toDataURL("image/jpeg", 0.85);

                            const base64 =

                                dataUrl.split(",")[1];

                            if (!base64) {

                                throw new Error("Không thể chuyển ảnh.");

                            }

                            resolve(base64);

                        } catch (error) {

                            reject(error);

                        }

                    };

                    img.src = event.target.result;

                };

                reader.readAsDataURL(file);

            });

        }

        // =========================================

        // 6. NHẬN DIỆN GIỌNG NÓI TIẾNG VIỆT

        // =========================================

        let recognition = null;

        let isRecording = false;

        const SpeechRecognition =

            window.SpeechRecognition ||

            window.webkitSpeechRecognition;

        function resetMicButton() {

            isRecording = false;

            micBtn.innerText = "🎙️ Giữ để nói";

            micBtn.classList.remove("recording");

        }

        if (SpeechRecognition) {

            recognition = new SpeechRecognition();

            recognition.lang = "vi-VN";

            recognition.continuous = true;

            recognition.interimResults = true;

            recognition.onresult = (event) => {

                let transcript = "";

                for (

                    let i = 0;

                    i < event.results.length;

                    i++

                ) {

                    transcript +=

                        event.results[i][0].transcript;

                }

                userInput.value = transcript;

            };

            recognition.onerror = (event) => {

                console.error(

                    "Lỗi nhận diện giọng nói:",

                    event.error

                );

                resetMicButton();

                if (event.error === "not-allowed") {

                    resultDiv.innerText =

                        "❌ Trình duyệt chưa được cấp quyền sử dụng micro. Hãy cho phép Safari truy cập micro trong phần Cài đặt.";

                } else if (event.error === "network") {

                    resultDiv.innerText =

                        "❌ Lỗi mạng khi nhận diện giọng nói. Hãy kiểm tra kết nối Internet.";

                }

            };

            recognition.onend = () => {

                resetMicButton();

            };

            function startRecording() {

                if (isRecording) return;

                isRecording = true;

                micBtn.innerText = "🔴 Đang nghe con nói...";

                micBtn.classList.add("recording");

                try {

                    recognition.start();

                } catch (error) {

                    resetMicButton();

                    console.warn(error);

                }

            }

            function stopRecording() {

                if (!isRecording) return;

                try {

                    recognition.stop();

                } catch (error) {

                    console.warn(error);

                }

                resetMicButton();

            }

            // Hỗ trợ thao tác giữ nút trên điện thoại và máy tính.

            micBtn.addEventListener("pointerdown", (event) => {

                event.preventDefault();

                if (event.pointerType === "mouse" &&

                    event.button !== 0) return;

                try {

                    micBtn.setPointerCapture(event.pointerId);

                } catch (error) {}

                startRecording();

            });

            micBtn.addEventListener("pointerup", (event) => {

                event.preventDefault();

                stopRecording();

            });

            micBtn.addEventListener("pointercancel", stopRecording);

            micBtn.addEventListener("lostpointercapture", stopRecording);

        } else {

            micBtn.addEventListener("click", () => {

                alert(

                    "Trình duyệt này không hỗ trợ nhận diện giọng nói. Hãy sử dụng Safari hoặc Chrome phiên bản mới."

                );

            });

        }

        // =========================================

        // 7. GỬI CÂU HỎI ĐẾN GEMINI

        // =========================================

        window.askGiaSu = async function() {

            const currentKey =

                apiKeyInput.value.trim();

            const promptText =

                userInput.value.trim();

            const selectedFile =

                imageInput.files[0];

            // Kiểm tra API Key

            if (!currentKey) {

                alert(

                    "Vui lòng nhập API Key trước nhé!"

                );

                apiKeyInput.focus();

                return;

            }

            // Kiểm tra nội dung

            if (!promptText && !selectedFile) {

                alert(

                    "Con chưa nhập câu hỏi hoặc chọn ảnh đề bài!"

                );

                return;

            }

            // Chống gửi nhiều lần

            if (sendBtn.disabled) return;

            sendBtn.disabled = true;

            sendBtn.innerText = "⏳ Đang gửi...";

            resultDiv.innerText =

                "⏳ Thầy/Cô đang xem đề bài và suy nghĩ cách giảng cho con...";

            const controller = new AbortController();

            const timeoutId = setTimeout(() => {

                controller.abort();

            }, REQUEST_TIMEOUT);

            try {

                // Chuẩn bị dữ liệu

                const parts = [];

                // Xử lý ảnh nếu có

                if (selectedFile) {

                    resultDiv.innerText =

                        "📷 Thầy/Cô đang xử lý ảnh đề bài...";

                    const base64Data =

                        await getBase64Image(selectedFile);

                    parts.push({

                        inlineData: {

                            mimeType: "image/jpeg",

                            data: base64Data

                        }

                    });

                }

                // Chuẩn bị câu hỏi

                let finalPrompt = promptText;

                if (!finalPrompt && selectedFile) {

                    finalPrompt =

                        "Thầy/Cô hãy đọc đề trong hình và hướng dẫn con giải bài toán này thật chi tiết, dễ hiểu từng bước một nhé.";

                }

                parts.push({

                    text: finalPrompt

                });

                // Gọi Gemini API

                resultDiv.innerText =

                    "⏳ Đang kết nối với Thầy/Cô Gemini...";

                const response = await fetch(API_URL, {

                    method: "POST",

                    headers: {

                        "Content-Type": "application/json",

                        "x-goog-api-key": currentKey

                    },

                    signal: controller.signal,

                    body: JSON.stringify({

                        systemInstruction: {

                            parts: [

                                {

                                    text: systemInstructionText

                                }

                            ]

                        },

                        contents: [

                            {

                                role: "user",

                                parts: parts

                            }

                        ],

                        generationConfig: {

                            maxOutputTokens: 8192

                        }

                    })

                });

                // Đọc phản hồi

                let data;

                try {

                    data = await response.json();

                } catch (error) {

                    throw new Error(

                        "Gemini trả về dữ liệu không hợp lệ."

                    );

                }

                // Xử lý lỗi HTTP

                if (!response.ok) {

                    const apiMessage =

                        data.error?.message ||

                        "Không xác định";

                    const status = response.status;

                    if (status === 400) {

                        throw new Error(

                            "Yêu cầu không hợp lệ: " + apiMessage

                        );

                    } else if (status === 401 || status === 403) {

                        throw new Error(

                            "API Key không hợp lệ hoặc chưa được cấp quyền: " +

                            apiMessage

                        );

                    } else if (status === 404) {

                        throw new Error(

                            "Không tìm thấy model Gemini: " +

                            apiMessage

                        );

                    } else if (status === 429) {

                        throw new Error(

                            "Bạn đã vượt giới hạn sử dụng API. Hãy thử lại sau."

                        );

                    } else if (status >= 500) {

                        throw new Error(

                            "Máy chủ Gemini đang gặp sự cố. Hãy thử lại sau."

                        );

                    } else {

                        throw new Error(

                            `Lỗi HTTP ${status}: ${apiMessage}`

                        );

                    }

                }

                // Kiểm tra nội dung trả về

                if (!data.candidates ||

                    data.candidates.length === 0) {

                    const reason =

                        data.promptFeedback?.blockReason;

                    throw new Error(

                        reason

                            ? "Yêu cầu bị chặn: " + reason

                            : "Gemini chưa tạo được câu trả lời."

                    );

                }

                const candidate = data.candidates[0];

                const aiResponseText =

                    candidate.content?.parts

                        ?.map(part => part.text || "")

                        .join("")

                        .trim();

                if (!aiResponseText) {

                    if (candidate.finishReason === "MAX_TOKENS") {

                        throw new Error(

                            "Câu trả lời quá dài và bị giới hạn. Hãy yêu cầu Thầy/Cô chia nhỏ bài giải."

                        );

                    }

                    throw new Error(

                        "Gemini không trả về nội dung. Mã kết thúc: " +

                        (candidate.finishReason || "Không rõ")

                    );

                }

                // Hiển thị kết quả an toàn

                resultDiv.innerText = aiResponseText;

                // Xóa dữ liệu sau khi thành công

                userInput.value = "";

                imageInput.value = "";

            } catch (error) {

                console.error("Gemini Error:", error);

                if (error.name === "AbortError") {

                    resultDiv.innerText =

                        "⏰ KẾT NỐI QUÁ THỜI GIAN\n\n" +

                        "Gemini không phản hồi trong 30 giây.\n" +

                        "Con hãy kiểm tra Internet hoặc thử lại nhé.";

                } else {

                    resultDiv.innerText =

                        "❌ KHÔNG THỂ KẾT NỐI GEMINI\n\n" +

                        error.message +

                        "\n\nHãy kiểm tra API Key, kết nối Internet và thử lại.";

                }

            } finally {

                clearTimeout(timeoutId);

                sendBtn.disabled = false;

                sendBtn.innerText = "Gửi cho Thầy/Cô";

            }

        };

        // =========================================

        // 8. NHẤN ENTER ĐỂ GỬI

        // =========================================

        userInput.addEventListener("keydown", (event) => {

            if (

                event.key === "Enter" &&

                !event.shiftKey &&

                !event.isComposing

            ) {

                event.preventDefault();

                askGiaSu();

            }

        });

    </script>

</body>

</html>
