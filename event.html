<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cấu Hình Event Lễ Lộc — KimBling</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 12px; font-size: 14px; }
    .card { background: #1e293b; border: 2px solid #ff9800; border-radius: 14px; padding: 14px; max-width: 420px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { color: #ff9800; font-size: 17px; text-align: center; margin-bottom: 10px; }
    .status-badge { display: block; text-align: center; padding: 8px; border-radius: 8px; font-weight: bold; margin-bottom: 12px; font-size: 13px; }
    .status-on { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
    .status-off { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
    .option-group { background: #0f172a; border: 1px solid #334155; padding: 10px; border-radius: 10px; margin-bottom: 10px; }
    .option-group label { display: flex; align-items: flex-start; gap: 8px; font-weight: bold; cursor: pointer; color: #cbd5e1; font-size: 13px; line-height: 1.4; }
    .option-group input[type="checkbox"] { width: 18px; height: 18px; accent-color: #ff9800; margin-top: 1px; flex-shrink: 0; }
    .input-val { width: 100%; padding: 8px; margin-top: 6px; background: #1e293b; border: 1px solid #ff9800; color: #fff; border-radius: 6px; text-align: center; font-weight: bold; font-size: 13px; outline: none; }
    .row-time { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .col-time { width: 100%; }
    .col-time label { font-size: 12px; color: #94a3b8; font-weight: normal; margin-bottom: 2px; display: block; }
    .btn-save { width: 100%; background: linear-gradient(135deg, #ff9800, #f57c00); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 6px; box-shadow: 0 4px 10px rgba(255, 152, 0, 0.3); }
    .btn-save:disabled { opacity: 0.6; cursor: wait; }
    .emergency-box { border-color: #ef4444; background: rgba(239, 68, 68, 0.05); }
  </style>
</head>
<body>

<div class="card">
  <h2>🎉 CẤU HÌNH EVENT LỄ LỘC</h2>
  <div id="eventStatusBadge" class="status-badge status-off">⏳ ĐANG TẢI DỮ LIỆU TỪ SHEETS...</div>

  <!-- NÚT ĐÓNG MỞ KHẨN CẤP (Cột G) -->
  <div class="option-group emergency-box">
    <label style="color: #f87171;">
      <input type="checkbox" id="chkEmergencyStop" onchange="updateUI()" style="accent-color: #ef4444;">
      <span>🛑 TẮT KHẨN CẤP (Ngưng event đột xuất)</span>
    </label>
  </div>

  <!-- HẸN GIỜ TỰ ĐỘNG CHẠY (Cột H) -->
  <div class="option-group">
    <label>
      <input type="checkbox" id="chkUseSchedule" onchange="updateUI()">
      <span>⏰ Hẹn giờ tự động chạy theo lịch</span>
    </label>
    <div class="row-time">
      <div class="col-time">
        <label>Bắt đầu:</label>
        <input type="datetime-local" id="timeStart" class="input-val" onchange="updateUI()">
      </div>
      <div class="col-time">
        <label>Kết thúc:</label>
        <input type="datetime-local" id="timeEnd" class="input-val" onchange="updateUI()">
      </div>
    </div>
  </div>

  <!-- NHÂN ĐÔI KIM CƯƠNG (Cột I) -->
  <div class="option-group">
    <label>
      <input type="checkbox" id="chkDoubleDiamond">
      <span>💎 Nhân đôi Kim Cương (x2 khi nạp/thưởng)</span>
    </label>
  </div>

  <!-- X2 ĐIỂM MÓN (Cột I) -->
  <div class="option-group">
    <label>
      <input type="checkbox" id="chkDoublePoints">
      <span>⭐ x2 Điểm Món (Nhân đôi số điểm tích lũy khi mua món)</span>
    </label>
  </div>

  <!-- TẶNG THÊM LƯỢT MỞ HỘP (Cột I) -->
  <div class="option-group">
    <label>
      <input type="checkbox" id="chkBonusTurns">
      <span>🎁 Tặng thêm lượt mở Hộp Quà khi đặt hàng</span>
    </label>
    <div style="font-size: 11px; color: #94a3b8; margin-top: 6px; padding-left: 26px;">
      💡 Số lượt cộng thêm cho khách (Trừ vào giới hạn lượt chơi):
    </div>
    <div style="padding-left: 26px; margin-top: 4px;">
      <input type="number" id="numBonusTurnsValue" class="input-val" value="5" min="1" max="20" placeholder="Số lượt">
    </div>
  </div>

  <button class="btn-save" id="btnSave" onclick="saveEventConfig()">💾 LƯU CẤU HÌNH LÊN GOOGLE SHEETS</button>
</div>

<script>
  const KIMBLING_API_URL = "https://script.google.com/macros/s/AKfycbxPxsg3oxHjUsx8KHyOSIYmjXZw9rY9GFQYf0cHNK3JmBsfdYMJ21PQdhg43HP787GIDQ/exec";

  async function loadEventConfig() {
    try {
      const res = await fetch(`${KIMBLING_API_URL}?type=getEventConfig&t=${Date.now()}`);
      const data = await res.json();
      if (data.success && data.config) {
        const cfg = data.config;
        document.getElementById('chkEmergencyStop').checked = !!cfg.emergencyStop;
        document.getElementById('chkUseSchedule').checked = !!cfg.useSchedule;
        document.getElementById('timeStart').value = cfg.timeStart || '';
        document.getElementById('timeEnd').value = cfg.timeEnd || '';
        document.getElementById('chkDoubleDiamond').checked = !!cfg.doubleDiamond;
        document.getElementById('chkDoublePoints').checked = !!cfg.doublePoints;
        document.getElementById('chkBonusTurns').checked = !!cfg.bonusTurns;
        document.getElementById('numBonusTurnsValue').value = cfg.bonusTurnsValue || 5;
      }
    } catch (e) {
      console.log("Lỗi tải từ Sheets:", e);
    } finally {
      updateUI();
    }
  }

  function updateUI() {
    const emergency = document.getElementById('chkEmergencyStop').checked;
    const useSchedule = document.getElementById('chkUseSchedule').checked;
    const badge = document.getElementById('eventStatusBadge');

    if (emergency) {
      badge.className = "status-badge status-off";
      badge.innerText = "🔴 ĐÃ TẮT KHẨN CẤP (Dừng Event)";
      return;
    }

    if (useSchedule) {
      const start = document.getElementById('timeStart').value;
      const end = document.getElementById('timeEnd').value;
      const now = new Date().getTime();

      let isActiveByTime = false;
      if (start && end) {
        if (now >= new Date(start).getTime() && now <= new Date(end).getTime()) {
          isActiveByTime = true;
        }
      }

      if (isActiveByTime) {
        badge.className = "status-badge status-on";
        badge.innerText = "🟢 HẸN GIỜ: EVENT ĐANG DIỄN RA";
      } else {
        badge.className = "status-badge status-off";
        badge.innerText = "⏳ HẸN GIỜ: CHƯA ĐẾN HOẶC ĐÃ HẾT HẠN";
      }
    } else {
      badge.className = "status-badge status-on";
      badge.innerText = "🟢 ĐANG BẬT THỦ CÔNG";
    }
  }

  async function saveEventConfig() {
    const btn = document.getElementById('btnSave');
    btn.disabled = true;
    btn.innerText = "⏳ ĐANG LƯU VÀO GOOGLE SHEETS...";

    const config = {
      emergencyStop: document.getElementById('chkEmergencyStop').checked,
      useSchedule: document.getElementById('chkUseSchedule').checked,
      timeStart: document.getElementById('timeStart').value,
      timeEnd: document.getElementById('timeEnd').value,
      doubleDiamond: document.getElementById('chkDoubleDiamond').checked,
      doublePoints: document.getElementById('chkDoublePoints').checked,
      bonusTurns: document.getElementById('chkBonusTurns').checked,
      bonusTurnsValue: parseInt(document.getElementById('numBonusTurnsValue').value, 10) || 5
    };

    try {
      const res = await fetch(KIMBLING_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ type: 'saveEventConfig', config: config })
      });
      const data = await res.json();
      alert(data.message || "✅ Đã lưu thành công lên Google Sheets!");
      if (window.parent) {
        window.parent.postMessage({ type: 'EVENT_CONFIG_UPDATED' }, '*');
      }
    } catch (e) {
      alert("⚠️ Lỗi kết nối khi lưu!");
    } finally {
      btn.disabled = false;
      btn.innerText = "💾 LƯU CẤU HÌNH LÊN GOOGLE SHEETS";
      updateUI();
    }
  }

  loadEventConfig();
</script>
</body>
</html>
