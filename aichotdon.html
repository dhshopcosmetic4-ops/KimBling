<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tổng Đài Kim Bling - Chuyên Gia Chốt Đơn</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0;
            background: #f0f2f5;
            display: flex; flex-direction: column;
            height: 100vh; height: 100dvh;
        }
        header {
            background: #d32f2f;
            color: white;
            padding: 1rem;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #fafafa;
        }
        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 16px;
            word-wrap: break-word;
        }
        .user { background: #d32f2f; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .assistant { background: #e3f2fd; color: #0d47a1; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #bbdefb; }
        
        #control-area {
            background: #ffffff;
            border-top: 1px solid #eee;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .top-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        #status-text {
            font-size: 13px;
            color: #2e7d32;
            font-weight: bold;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .test-btn {
            height: 40px;
            padding: 0 12px;
            border-radius: 20px;
            background: #1976d2;
            color: white;
            border: none;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .mic-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #d32f2f;
            color: white;
            border: none;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .mic-dictate {
            background: #2e7d32;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(46, 125, 50, 0.6); }
            70% { box-shadow: 0 0 0 12px rgba(46, 125, 50, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 125, 50, 0); }
        }
        .input-row {
            display: flex;
            gap: 8px;
        }
        .input-row input {
            flex: 1;
            padding: 10px 16px;
            font-size: 16px;
            border: 1px solid #d1d5db;
            border-radius: 20px;
            outline: none;
            background: #fff;
        }
        .input-row button {
            padding: 0 18px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    🤖 Tổng Đài Kim Bling - Chuyên Gia Chốt Đơn
</header>

<div id="chat-box">
    <div class="msg assistant">Dạ chào anh chị. Tôi là tổng đài viên của Kim Bling Coffee & Tea (M9 Cư xá Phú Lâm A). Anh chị cần tra cứu thực đơn hoặc đặt món nào, xin vui lòng cho biết chi tiết.</div>
</div>

<div id="control-area">
    <div class="top-control">
        <span id="status-text">Hệ thống chuyên môn sẵn sàng.</span>
        <div class="btn-group">
            <button class="test-btn" onclick="testSpeaker()">🔊 Nghe Thử</button>
            <button id="micBtn" class="mic-btn" onclick="toggleListening()">🎤</button>
        </div>
    </div>
    <div class="input-row">
        <input type="text" id="userInput" placeholder="Nhập tên món hoặc yêu cầu đặt hàng..." onkeyup="if(event.key==='Enter') sendText()">
        <button onclick="sendText()">Gửi</button>
    </div>
</div>

<audio id="audioPlayer" style="display:none;"></audio>

<script>
const API_KEY = "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";
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby1yOLdWbamA0qmS_UkURyrHGBKO9JmYELP6FmMs-BfVgPdWhNr12nJjEVC3_Y_zgsgfA/exec";

let activeModel = null;
let isRecording = false;
let recognition = null;
let globalMenuArray = []; 
let fullMenuText = "";

async function initMenuSync() {
    try {
        let res = await fetch(GOOGLE_SCRIPT_URL + "?type=getMenu");
        let data = await res.json();
        if (data) {
            let menuArray = data.menu || data;
            if (typeof menuArray === 'string') {
                try { menuArray = JSON.parse(menuArray); } catch(e){}
            }
            if (Array.isArray(menuArray) && menuArray.length > 0) {
                globalMenuArray = menuArray;
                fullMenuText = menuArray.map(item => `- ${item.name}: ${item.price ? item.price.toLocaleString('vi-VN') + 'đ' : 'Liên hệ'} (${item.category || 'Món'})`).join("\n");
                document.getElementById('status-text').innerText = "Đã đồng bộ dữ liệu POS_Data thành công.";
            }
        }
    } catch (e) {
        console.error("Lỗi đồng bộ menu:", e);
    }
}

function speakText(text) {
    document.getElementById('status-text').innerText = "Đang phát giọng đọc...";
    const cleanText = text.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '');
    const encodedText = encodeURIComponent(cleanText);
    const audioPlayer = document.getElementById('audioPlayer');
    
    audioPlayer.src = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodedText}&tl=vi&client=tw-ob`;
    audioPlayer.playbackRate = 1.35;
    
    audioPlayer.play().then(() => {
        document.getElementById('status-text').innerText = "Sẵn sàng...";
    }).catch(e => {
        document.getElementById('status-text').innerText = "Sẵn sàng...";
    });

    audioPlayer.onended = () => {
        document.getElementById('status-text').innerText = "Sẵn sàng...";
    };
}

function testSpeaker() {
    speakText("Hệ thống tổng đài Kim Bling đã sẵn sàng tiếp nhận đơn hàng.");
}

async function getAvailableModel() {
    if (activeModel) return activeModel;
    try {
        const res = await fetch("https://api.groq.com/openai/v1/models", {
            headers: { "Authorization": `Bearer ${API_KEY}` }
        });
        const data = await res.json();
        if (data && data.data) {
            const chatModels = data.data.map(m => m.id).filter(id => !id.includes("whisper") && !id.includes("guard"));
            activeModel = chatModels.find(id => id.includes("llama-3.1-8b-instant")) || chatModels[0];
        }
        if (!activeModel) activeModel = "llama-3.1-8b-instant";
        return activeModel;
    } catch (e) {
        return "llama-3.1-8b-instant";
    }
}

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'vi-VN';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
        isRecording = true;
        document.getElementById('micBtn').classList.add('mic-dictate');
        document.getElementById('status-text').innerText = "Đang nghe...";
    };

    recognition.onresult = async (event) => {
        const speechText = event.results[0][0].transcript;
        stopListening();
        await processMessage(speechText, true);
    };

    recognition.onerror = () => {
        stopListening();
        document.getElementById('status-text').innerText = "Thử lại hoặc gõ chữ!";
    };

    recognition.onend = () => {
        stopListening();
    };
}

function toggleListening() {
    if (!recognition) {
        alert("Trình duyệt không hỗ trợ micro!");
        return;
    }
    if (isRecording) {
        recognition.stop();
    } else {
        recognition.start();
    }
}

function stopListening() {
    isRecording = false;
    document.getElementById('micBtn').classList.remove('mic-dictate');
    document.getElementById('status-text').innerText = "Sẵn sàng...";
}

async function sendText() {
    const inputField = document.getElementById('userInput');
    const text = inputField.value.trim();
    if (!text) return;
    inputField.value = '';
    await processMessage(text, true);
}

let chatHistory = [];

async function processMessage(text, shouldSpeak) {
    addMessage(text, 'user');
    document.getElementById('status-text').innerText = "Đang xử lý dữ liệu đơn hàng...";

    try {
        const modelToUse = await getAvailableModel();
        
        let professionalSystemPrompt = `Bạn là nhân viên tổng đài chuyên nghiệp của hệ thống F&B 'Kim Bling Coffee & Tea' tại M9 Cư xá Phú Lâm A, TP.HCM.

THỰC ĐƠN ĐỒ UỐNG VÀ ĐỒ ĂN VẶT TỪ HỆ THỐNG GOOGLE SHEETS:
` + (fullMenuText || "Đang cập nhật thực đơn...") + `

QUY TẮC NGHIỆP VỤ BẮT BUỘC:
1. XƯNG HÔ & TÁC phong: Xưng 'em', gọi khách là 'anh chị'. Tác phong lịch sự, chuẩn mực, ngắn gọn, đi thẳng vào trọng tâm chuyên môn. Tuyệt đối không dùng từ lóng, không dùng từ 'hihi', không cười cợt hoặc đùa giỡn.
2. TRA CỨU & BÁO GIÁ CHÍNH XÁC: Khi khách hỏi bất kỳ món nào (có dấu hoặc không dấu), phải đối chiếu trực tiếp với thực đơn phía trên để cung cấp chính xác tên món và mức giá niêm yết.
3. QUY TRÌNH CHỐT ĐƠN: Khi khách xác nhận mua món, yêu cầu cung cấp ngay số lượng, số điện thoại và địa chỉ nhận hàng để lên đơn.
4. TÍNH CHÍNH XÁC CAO: Không tự bịa đặt món hoặc giá tiền không có trong hệ thống. Trả lời súc tích từ 1 đến 2 câu.`;

        let messagesToSend = [
            { role: "system", content: professionalSystemPrompt },
            ...chatHistory,
            { role: "user", content: text }
        ];

        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${API_KEY}`
            },
            body: JSON.stringify({
                model: modelToUse,
                messages: messagesToSend,
                max_tokens: 200,
                temperature: 0.1
            })
        });

        const data = await response.json();
        let reply = "Dạ, anh chị vui lòng cho em biết tên món cần đặt để em kiểm tra kho và báo giá ạ.";
        if (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) {
            reply = data.choices[0].message.content.trim();
        }
        
        chatHistory.push({ role: "user", content: text });
        chatHistory.push({ role: "assistant", content: reply });
        
        if (chatHistory.length > 10) {
            chatHistory = chatHistory.slice(chatHistory.length - 10);
        }

        addMessage(reply, 'assistant');
        
        if (shouldSpeak) {
            speakText(reply);
        } else {
            document.getElementById('status-text').innerText = "Sẵn sàng...";
        }

    } catch (e) {
        console.error(e);
        const errReply = "Dạ hệ thống đang gián đoạn kết nối, anh chị vui lòng nhắn lại giúp em ạ.";
        addMessage(errReply, 'assistant');
        speakText(errReply);
    }
}

function addMessage(text, type) {
    const chatBox = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

window.addEventListener('DOMContentLoaded', initMenuSync);
</script>

</body>
</html>
