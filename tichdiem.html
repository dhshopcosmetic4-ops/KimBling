<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tích Điểm Thành Viên — Kim Bling Coffee & Tea</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <style>
    :root {
      --primary: #c29b38;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; font-size: 15px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }

    .container { width: 100%; max-width: 400px; background: var(--card-bg); border: 2px solid var(--primary); border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); text-align: center; }

    h2 { color: var(--primary); font-size: 20px; margin-bottom: 6px; }
    p { color: var(--subtext); font-size: 13px; line-height: 1.4; margin-bottom: 16px; }

    /* Hộp chú thích áp dụng tại quán */
    .store-rule-box {
      background: rgba(194, 155, 56, 0.1);
      border: 1px dashed var(--primary);
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      color: #ffd700;
      margin-bottom: 16px;
      text-align: left;
    }

    .input-group { margin-bottom: 14px; text-align: left; }
    label { font-size: 12px; font-weight: bold; color: var(--subtext); display: block; margin-bottom: 4px; }
    
    .input-field {
      width: 100%; background: #0f172a; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 8px; font-size: 16px; outline: none; text-align: center; font-weight: bold; letter-spacing: 1px;
    }
    .input-field:focus { border-color: var(--primary); }

    .btn-submit {
      width: 100%; background: linear-gradient(135deg, #34c759, #28a745); color: #fff; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(52,199,89,0.3); transition: opacity 0.2s;
    }
    .btn-submit:active { opacity: 0.8; }

    /* Khu vực nút điều hướng phụ */
    .nav-links-box {
      display: flex; gap: 8px; margin-top: 14px; border-top: 1px solid var(--border); padding-top: 14px;
    }
    .btn-nav {
      flex: 1; background: #334155; color: #fff; border: none; padding: 10px 6px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 4px; transition: background 0.2s;
    }
    .btn-nav:hover { background: #475569; }

    .result-box { margin-top: 15px; font-size: 14px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h2>KIM BLING COFFEE & TEA</h2>
    <p>Quét mã xác nhận tích điểm thành viên</p>

    <!-- Lưu ý chỉ áp dụng mua trực tiếp tại quán -->
    <div class="store-rule-box">
      📍 <b>Quy định tích điểm:</b> Chương trình chỉ áp dụng khi khách mua trực tiếp tại địa chỉ quán: <b>M9 Cư xá Phú Lâm A, Phường Phú Lâm, HCM</b>.
    </div>

    <div class="input-group">
      <label>Số lượng món được cộng (Cả đồ ăn & thức uống):</label>
      <input type="text" id="displayLy" class="input-field" readonly style="color: #34c759; background: #111827;">
    </div>

    <div class="input-group">
      <label>Nhập số điện thoại của bạn để tích điểm (*):</label>
      <input type="tel" id="inputSdt" class="input-field" placeholder="Ví dụ: 0912345678" maxlength="11">
    </div>

    <button class="btn-submit" id="btnSubmit" onclick="submitPoints()">✨ XÁC NHẬN TÍCH ĐIỂM NGAY</button>

    <div id="resultMsg" class="result-box"></div>

    <!-- Các nút điều hướng qua lại giữa Menu và Tra cứu đơn hàng/điểm -->
    <div class="nav-links-box">
      <a href="menu.html" class="btn-nav">📋 Xem Menu</a>
      <a href="ktdon.html" class="btn-nav">⭐ Tra Cứu Điểm</a>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxPxsg3oxHjUsx8KHyOSIYmjXZw9rY9GFQYf0cHNK3JmBsfdYMJ21PQdhg43HP787GIDQ/exec";

    const urlParams = new URLSearchParams(window.location.search);
    const txid = urlParams.get('txid') || ('TX' + Date.now());
    const ly = urlParams.get('ly') || '1';
    const preSdt = urlParams.get('sdt') || '';

    window.onload = function() {
      document.getElementById('displayLy').value = `+${ly} Món tích điểm`;
      
      if (preSdt) {
        document.getElementById('inputSdt').value = preSdt;
        setTimeout(() => { submitPoints(); }, 500);
      } else {
        const savedPhone = localStorage.getItem('kb_customer_phone');
        if (savedPhone) {
          document.getElementById('inputSdt').value = savedPhone;
        }
      }
    };

    function submitPoints() {
      const sdt = document.getElementById('inputSdt').value.trim();
      const msgEl = document.getElementById('resultMsg');
      const btn = document.getElementById('btnSubmit');

      if (!sdt || sdt.length < 9) {
        alert("Vui lòng nhập số điện thoại hợp lệ của bạn!");
        return;
      }

      localStorage.setItem('kb_customer_phone', sdt);
      btn.innerText = "Đang xử lý...";
      btn.disabled = true;

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'add_points',
          sdt: sdt,
          ly: parseInt(ly) || 1,
          txid: txid
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') {
          msgEl.innerHTML = `<span style="color: #34c759;">🎉 Tích điểm thành công +${ly} món!<br>Cảm ơn bạn đã ghé quán ủng hộ tại M9 Cư xá Phú Lâm A! ❤️</span>`;
          btn.style.display = 'none';
        } else {
          msgEl.innerHTML = `<span style="color: #ef4444;">❌ ${data.message}</span>`;
          btn.innerText = "XÁC NHẬN TÍCH ĐIỂM NGAY";
          btn.disabled = false;
        }
      })
      .catch(err => {
        console.error(err);
        msgEl.innerHTML = `<span style="color: #ef4444;">Lỗi kết nối máy chủ. Vui lòng thử lại!</span>`;
        btn.innerText = "XÁC NHẬN TÍCH ĐIỂM NGAY";
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
