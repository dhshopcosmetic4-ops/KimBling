<style>
  .act-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .act-card { background: #222533; border: 1px solid #303446; border-radius: 14px; padding: 18px 12px; color: #fff; text-align: center; cursor: pointer; font-size: 14px; }
  .act-card span { display: block; font-size: 28px; margin-bottom: 8px; }
</style>

<div class="act-grid">
  <button class="act-card" id="act-img"><span>🖼️</span>Nén Ảnh (Squoosh)</button>
  <button class="act-card" id="act-vid"><span>🎬</span>Nén Video (1080p)</button>
  <button class="act-card" id="act-post" style="grid-column: span 2; background: #fe2c55; border: none; font-weight: 600;">
    <span>🚀</span>Tạo bài & Đăng 3 kênh (Gemini AI)
  </button>
</div>

<script type="module">
  document.getElementById('act-img').onclick = () => AppBus.openModal('compress-img', 'Nén Ảnh chuẩn Squoosh');
  document.getElementById('act-vid').onclick = () => AppBus.openModal('compress-vid', 'Nén Video iPhone');
  document.getElementById('act-post').onclick = () => AppBus.openModal('publish-post', 'Đăng bài đa kênh');
</script>
