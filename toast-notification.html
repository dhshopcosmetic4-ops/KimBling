<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <!-- FLOATING TOP-LEFT WINNER TOAST SNIPPET -->
  <div id="customWinnerToast" style="position: fixed; top: 20px; left: 20px; z-index: 9999; max-width: 380px; width: calc(100% - 40px); font-family: sans-serif; pointer-events: none;">
    <div id="toastInnerCard" style="pointer-events: auto; background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(12px); border-radius: 16px; padding: 14px; border: 1px solid rgba(34, 197, 94, 0.4); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); display: flex; align-items: flex-start; gap: 12px; transition: all 0.4s ease; opacity: 1; transform: translateX(0);">
      <div style="flex-shrink: 0; width: 46px; height: 46px; border-radius: 12px; background: linear-gradient(135deg, #fbbf24, #f97316); display: flex; align-items: center; justify-content: center; font-size: 22px;">
        <span id="toastIconEl">🎁</span>
      </div>
      <div style="flex: 1; min-width: 0; color: #f8fafc; font-size: 13px; line-height: 1.4;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
          <span style="font-size: 10px; font-weight: bold; text-transform: uppercase; background: rgba(34,197,94,0.2); color: #4ade80; padding: 2px 6px; border-radius: 10px; border: 1px solid rgba(34,197,94,0.3);">Live Winner</span>
          <span style="font-size: 11px; color: #94a3b8;">Vừa xong</span>
        </div>
        <div>Chúc mừng <strong id="toastPhoneEl" style="color: #fde047;">SĐT 090*******</strong> đã mở hộp quà <span id="toastItemIconEl">🎁</span> may mắn trúng <strong id="toastRewardEl" style="color: #4ade80;">100 💎</strong></div>
        <div style="font-size: 10px; color: #64748b; margin-top: 4px;">thời gian: <strong id="toastTimeEl" style="color: #cbd5e1;">--:--:--</strong></div>
      </div>
      <button onclick="document.getElementById('customWinnerToast').style.display='none'" style="background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 16px; padding: 0 4px;">&times;</button>
    </div>
  </div>

  <script>
  (function() {
    const diamondPool = [100, 50, 30, 20, 19, 18, 17, 16, 15, 14, 13, 12, 11, 10, 9, 8, 7, 6, 5, 4, 3];
    const phonePrefixes = ['090', '091', '098', '097', '039', '077', '088', '079'];

    function getNowStr() {
      var d = new Date();
      var pad = function(n){ return n < 10 ? '0' + n : n; };
      return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + ' ' + pad(d.getDate()) + '/' + pad(d.getMonth()+1) + '/' + d.getFullYear();
    }

    function getRandomPhone() {
      var prefix = phonePrefixes[Math.floor(Math.random() * phonePrefixes.length)];
      var suffix = Math.floor(100 + Math.random() * 900);
      return prefix + '****' + suffix;
    }

    function getRandomReward() {
      return diamondPool[Math.floor(Math.random() * diamondPool.length)];
    }

    function updateToast() {
      document.getElementById('toastPhoneEl').innerText = 'SĐT ' + getRandomPhone();
      document.getElementById('toastRewardEl').innerText = getRandomReward() + ' 💎';
      document.getElementById('toastTimeEl').innerText = getNowStr();
      
      var card = document.getElementById('toastInnerCard');
      card.style.transform = 'scale(1.03)';
      setTimeout(function(){ card.style.transform = 'scale(1)'; }, 200);
    }

    updateToast();
    setInterval(updateToast, 8 * 1000);
  })();
  </script>
</body>
</html>
